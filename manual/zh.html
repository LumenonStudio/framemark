为 |\n|---|---|\n| **Ask** | 显示 \"Re-import it? The changes come in as a revision to review.\"（重新导入吗？更改会作为待审阅的修订导入。），并带有 “不再询问” 勾选框。 |\n| **重新导入** | 立即重新导入。 |\n| **忽略** | 什么都不做。**重新导入** 按钮仍会显示。 |\n\n### 写回 ink\n\n保存时，Framemark 会把编辑过、新增和删除的行写入 `.ink` 文件，并把旧文件保留为 `.bak`。\n\n- 选项、跳转、标题和场景行**不会**被写入。消息中会这样说明。\n- 如果文件在导入之后已更改、版本控制把它锁定或已过期，或它是只读的，写回会被拒绝。\n- 当新行跟在带 glue 的行之后时，会出现 glue（`<>`）提示。\n\n### 写回 articy\n\nFramemark 会在 `.articyue` 旁边写入 `<export>.framemark-changes.json`。你应用之后，该文件会被重命名为 `.framemark-changes.applied.json`。\n\n- 如果导出文件在导入之后已更改，或 articy 中已有最新的更改，写回会被拒绝。\n- 更改列表涵盖文本、说话人、新增的行和删除的行。\n\n#### 在 articy:draft 中应用更改\n\n**Framemark Bridge** 插件（Framemark.ArticyBridge 1.0.0，需要 articy:draft 4.2.2 或更高版本）会在 articy:draft 中添加一个 **Framemark** 菜单。\n\n1. 在 articy:draft 中选择 **Framemark > Apply Changes**。\n2. 选择 `*.framemark-changes.json` 文件。插件会检查它。\n3. 确认。插件写入更改，保存 `.undo.json` 和 `.applied.json`，并删除原文件。\n4. 再次为 Unreal 导出，并在 Framemark 中重新导入。\n\n要撤销一次应用，选择 **Framemark > Undo Last Apply**。\n\n> **警告：** articy:draft 中的 **Ctrl+Z** 不会撤销 Apply。请使用 **Undo Last Apply**。\n\n## Story Map\n\n**故事地图** 把分支剧本（ink 或 articy）绘制成流程图。从 **Panels > Story Map** 显示它。\n\n- 每个场景一个方框，从左到右排列。\n- 方框之间的连线标有选项文字、**GO TO** 和 next。\n- 标尺显示每一列的场景编号。\n- 方框下方的圆点以 Cast 角色颜色显示说话人。\n- 备注显示在方框上方（“备注：{0}”）。点击 **保存备注**（Save Notes）保留编辑。\n- 向后的连线是暗色的虚线点线。\n- 没有目标的 GO TO 会指向一个虚线的 **出口**（Exits）方框。\n- 页眉的 **按场景**（By Scene） / **按序列**（By Sequence）开关改变方框所代表的内容。它按剧本分别保存。\n\n| 操作 | 结果 |\n|---|---|\n| 点击方框 | 选中该场景并跳转到它。 |\n| 双击方框 | 打开序列。 |\n\n> **注意：** Story Map 对故事内容是只读的。请在 Screenplay、ink 或 articy 中修改故事。\n\n### 上下文菜单\n\n| 位置 | 命令 |\n|---|---|\n| 场景方框 | **打开舞台**、**打开序列**、**生成**、**更改舞台**、**更改序列**、**在剧本中显示**（Show in Screenplay）、**编辑备注**（Edit Notes）、**打开源文件**（Open Source，“在 articy 中打开”，或 ink 文件）、**复制场景名称**（Copy Scene Name） |\n| 空白处 | **框选全部**（Frame All）、**框选所选内容**（Frame Selection）、**显示已省略的场景**（Show Omitted Scenes）、**显示评论气泡**（Show Comment Bubbles）、**折叠所有分组**（Collapse All Groups）、**展开所有分组**（Expand All Groups）、**新建分组**（New Group） |\n| 连线 | **转到目标场景**（Go To Target Scene）、**在剧本中显示选项行**（Show Choice Line in Screenplay） |\n\n### 分组\n\n给场景分组，可让大型故事保持易读。\n\n| 命令 | 说明 |\n|---|---|\n| **从所选内容新建分组**（New Group From Selection） | 把选中的方框分为一组。 |\n| **添加到分组**（Add To Group）、**从分组中移除**（Remove From Group） | 更改组的成员。 |\n| **重命名**、**编辑评论**（Edit Comment） | 给组加标签。 |\n| **展开**（Expand） / **折叠**（Collapse） | 显示或隐藏成员。 |\n| **进入分组**（Drill In） | 以完整大小打开该组。面包屑导航可带你返回。 |\n| **取消分组**（Ungroup） | 移除组，保留场景。 |\n\n组的组就是一幕。只有一层。分组随剧本一起保存。\n\n## 已知限制\n\n- 没有实时文件监视，也没有 Inkpot 链接：点回窗口时会提示重新导入，写回在保存时进行。\n- articy 中说话人和文本的键名尚未针对每个导出版本核对。\n\n## 另请参阅\n\n- [Planner（规划器）](07_planner.md)\n- [序列与绑定](06_sequences.md)\n- [导入、导出与分享](09_import-export.md)\n- [配套插件](12_integrations.md)\n- [设置与命名参考](11_settings-reference.md)\n"}, {"file": "09_import-export.md", "slug": "import-export", "title": "导入、导出与分享", "md": "# 导入、导出与分享\n\nFramemark 模式的 **Share**（分享）页面负责在 Unreal 内外移动你的工作。你可以把整个舞台保存为文件，导入镜头清单、剧本或 Shot Designer 场景，导出平面图纸，并把舞台以 USD 或 FBX 格式发送到 Maya、Houdini 或 Blender。当其他工具修改了文件后，你可以重新导入，并在应用任何内容之前审阅这些更改。\n\n## 前提条件\n\n- 已启用 Framemark 插件。\n- USD：需要可选的 **Framemark USD Bridge** 插件（类别 **Cinematics**，默认关闭，需要 USDCore）。在 **Edit > Plugins** 中启用它，然后重启编辑器。\n- FBX：无需额外内容。\n\n## Share 页面\n\n![Framemark 面板的 Share 页面](media/ui_page_share.png)\n\n| 按钮 | 说明 |\n|---|---|\n| **导出舞台**（Export Stage） | “将整个舞台保存到文件：标记、备注、布局组、边界、摄像机和灯光。” |\n| **导入**（Import） | “导入 Framemark 文件、镜头列表或剧本。” |\n| **导出平面图**（Export Plan） | 把自上而下的平面图保存为图片、矢量图或文档。见 [Planner（规划器）](07_planner.md#export-plan)。 |\n| **导出 USD**（Export USD） | 把舞台写出为 USD。需要 Framemark USD Bridge。 |\n| **导出 FBX**（Export FBX） | 把舞台写出为 FBX。 |\n\n## Export Stage 与导入 Framemark 文件\n\n1. 选择舞台。\n2. 在 **Share** 页面点击 **导出舞台**。\n3. 选择名称。文件保存为 `<label>.framemark.json`（过滤器 \"Framemark (*.framemark.json)\"）。\n4. 你会看到 “已导出“{0}”。”。\n\n要把它导回来，使用 **导入** 并选择 **Framemark 文件**（Framemark File）磁贴。它会作为一个新舞台导入。由更新版本保存的文件会提示 “该文件由更新版本的 Framemark 保存。”\n\n导入舞台时，会弹出提示 \"Where should '{0}' go?\"（{0} 应该放在哪里？），选项为 **原始位置**（Original Location）、**在视口中**（At Viewport）或 **取消**（Cancel）。Actor 引用按标签完全匹配来重新连接：“已重新连接 {0} 个 Actor 引用。”\n\n## Import 面板\n\n点击 **导入** 打开 Import 面板。在 **来源**（Source）中选择一个磁贴。\n\n| 磁贴 | 副标题 | 说明 |\n|---|---|---|\n| **Framemark 文件** | `.framemark.json` | “用“导出舞台”保存的舞台。它会作为新舞台导入。” |\n| **镜头列表**（Shot List） | CSV、StudioBinder | 见[镜头清单](#shot-lists)。 |\n| **剧本**（Screenplay） | Fountain、Final Draft、文本、ink、articy | 见[剧本与故事地图](08_screenplay-and-story-map.md)。 |\n| **Shot Designer** | 场景 `.hcw` 或 CSV 导出 | 见 [Shot Designer](#shot-designer)。 |\n| **USD** | Houdini、Maya、流程管线 | 需要 Framemark USD Bridge。 |\n| **FBX** | Maya、Blender、MotionBuilder | |\n\n该面板包含这些区域：**来源**、**文件**（File，**浏览**，或 “粘贴路径或点击“浏览””，粘贴路径或按 Browse）、**列映射**（Column Mapping）、**映射**（Mapping）、**剧本选项**（Screenplay Options）、**预览**（Preview），以及 **导入** 和 **取消** 按钮。只显示适合所选来源的区域。\n\n每次导入都是一个撤销步骤。\n\n## 镜头清单\n\nCSV 格式的镜头清单会变成舞台上的摄像机。\n\n1. 在 **Share** 页面点击 **导入**，选择 **镜头列表**。\n2. 点击 **浏览**（Browse）并选择 CSV。\n3. 用 **舞台**（Stage）选择器选择摄像机放在哪里。\n4. 在 **列映射** 中，把每一列设为一个字段（或接受自动检测）。\n5. 查看 **预览**。\n6. 点击 **导入**。\n\n解析器接受逗号、分号或制表符分隔符、引号和字节顺序标记。最多读取 50000 行。\n\n### 映射字段\n\n| 字段 | 说明 |\n|---|---|\n| **镜头编号**（Shot Number） | 匹配已有摄像机，或创建新摄像机。 |\n| **剧本 / 分镜参考**（Script / Board Ref） | 页码或分镜参考。 |\n| **场景**（Scene） | 场景名称。 |\n| **描述**（Description） | 镜头中发生的事。 |\n| **景别**（Shot Size） | 景别术语决定镜头比例和焦距。 |\n| **摄像机角度**（Camera Angle） | 像 High Angle 这样的术语决定摄像机高度和倾斜。 |\n| **摄像机运动**（Camera Move） | 运动方式。 |\n| **音频**（Audio） | 音频备注。 |\n| **主体**（Subject） | 主体。 |\n| **内景 / 外景**（Interior / Exterior） | 场地类型。 |\n| **焦距**（Focal Length） | 覆盖镜头焦距。 |\n| **自定义字段**（Custom Field） | 自由列。 |\n| **跳过**（Skip） | 忽略该列。 |\n\n**Auto-detect** 会把第一个匹配的列映射到每个字段。如果没有列被设为 **镜头编号**，你会看到 “没有列被设为镜头编号，因此各行按顺序编号为 1、2、3。”\n\n### 预设\n\n内置预设：\"StudioBinder\" 和 \"Shot Designer\"。用 **另存为**（Save As）、**保存**（Save）和 **删除预设**（Delete Preset）创建你自己的预设。用户预设按用户保存，在每个项目中都可用。\n\n### 预览与结果\n\n镜头编号匹配时，会更新对应摄像机（SH0010 是第 1 个镜头，步长为 10）。新编号会添加一台摄像机。预览把每一行标为 **添加**（Add）、**更新**（Update）、**跳过** 或 **无更改**（No Change），并汇总：“新增 {0}，更新 {1}，未变 {2}{3}”\n\n完成时：“已导入镜头列表：新增 {0} 个摄像机，更新 {1} 个。”\n\n## Shot Designer\n\n导入 Shot Designer 场景（`.hcw`）或其 CSV 导出。\n\n1. 选择 **Shot Designer** 磁贴并选取文件。\n2. 选择 **创建新舞台**（Create New Stage）或 **选择舞台**（Select Stage）。\n3. 设置 **缩放**（Scale），单位为每个 Shot Designer 单位对应的 cm。\n4. 在 **映射** 中设置每个 Shot Designer 对象如何变为标记或道具。\n5. 选择 **跟踪布局组**（Tracked Setups）或 **固定布局组**（Locked-Off Setups）。\n6. 查看预览（缩放，**适应**（Fit））。\n7. 点击 **导入**。\n\n| 选项 | 说明 |\n|---|---|\n| **映射** 行 | 每个对象采用 **默认**（Default）、**请选择**（Pick One）、**新建：{0}**（New: {0}）或 **无**（None）。角色名称：**玩家**（Player）、**NPC**、**同伴**（Companion）、**群众演员**（Extra）、**道具**（Prop）、**敌人**（Enemy）、**载具**（Transport）。 |\n| **跟踪布局组** | 摄像机从轨道起点开始骑在 Camera Rig Rail 上。 |\n| **固定布局组** | 摄像机保持固定。 |\n\n标记命名为 `mrk_{subject}_010`。完成时：“已导入 Shot Designer 场景：{0} 个标记、{1} 个道具、{2} 个摄像机、{3} 个移动、{4} 张图片。”\n\nShot Designer 的 CSV 会通过镜头清单映射器，并使用它自己的预设。\n\n> **注意：** **跟踪布局组** 会把摄像机放在轨道上，但不会为它沿轨道的位置打关键帧。\n\n## USD 和 FBX 导出\n\n导出会把舞台发送到其他工具。选择舞台，然后点击 **导出 USD** 或 **导出 FBX**。\n\n### 文件存放位置\n\n| 设置（Editor Preferences，Pipeline） | 说明 |\n|---|---|\n| **Export Folder**（`PipelineFolder`） | 默认 `<Project>/Pipeline`。 |\n| **Export File Name**（`PipelineFileName`） | 默认 `{stage}`。标记：`{show}`、`{seq}`、`{stage}`。 |\n| **When The File Exists**（`PipelineVersioning`） | **New Version**：`<name>_v001`，最高到 `_v999`。**Overwrite**：`<name>`，旧文件保留为 `.bak`。 |\n| **Write Back On Save**（`bPipelineWriteBackOnSave`） | 默认开启。保存舞台时会把你的编辑写回。 |\n\n### 写出的内容\n\n| 导出 | 文件 |\n|---|---|\n| USD | `<name>[_vNNN].usda`（打开这个），`<name>[_vNNN].framemark.usda`（每次导出都会重写），`<name>_edits.usda`（没有版本后缀；Framemark 从不写入它） |\n| FBX | `<name>[_vNNN].fbx` |\n| 两者 | `<file>.framemark-sync.json`，即同步文件 |\n\n成功时你会看到 “已导出 {0}。请在 {1} 中编辑，Framemark 从不写入它。”。请把你的更改放进 `_edits.usda`，而不是其他文件。\n\n> **注意：** 在默认的 **New Version** 设置下，USD 文件是 `<name>_v001.usda`。只有用 **Overwrite** 才会得到不带版本号的 `<name>.usda`。\n\n### 导出问题\n\n| 消息 | 解决办法 |\n|---|---|\n| “{0} 已被 {1} 签出。” | 请对方签入。 |\n| “{0} 已过期。请先获取最新版本。” | 从版本控制同步。 |\n| “{0} 为只读。” | 设为可写，或签出。 |\n| “自上次同步以来，{0} 在 Unreal 之外发生了更改，因此未写入。请先重新导入。” | 先重新导入，再导出。 |\n\n## 从文件重新导入\n\n当导出的文件在 Unreal 之外被修改后，点回 Framemark。**制作流程文件已更改**（Pipeline File Changed）提示为 \"Re-import it? You see the changes before anything is applied.\"（重新导入吗？在应用任何内容之前你可以先看到这些更改。）它使用与 Screenplay 相同的 **源文件已更改**（Source File Changed）设置，带有 **重新导入**（Re-import）、**忽略**（Ignore）和 “不再询问”。\n\n**从文件重新导入**（Re-import From File）窗口会列出每一项更改。\n\n1. 阅读每一行。类型为 **已更改**（Changed）、**冲突**（Conflict）、**已添加**（Added）或 **已删除**（Removed）。\n2. 取消勾选你不想要的行（“应用此更改”）。\n3. 对于 **冲突**，选择 **采用文件**（Take File，“采用文件中的更改，并替换 Unreal 中的内容。”，使用文件中的更改并替换 Unreal 中的内容）或 **保留 Unreal**（Keep Unreal）。该行显示 “文件中：” 和 “Unreal 中：”。\n4. 点击 **应用**（Apply，“将勾选的更改应用到舞台。”，把勾选的更改应用到舞台）或 **取消**。\n\n结果显示为 “{0}：已将 {1} 项更改应用到 {2}。”\n\n关于 DCC 工具在 USD 内应该和不应该修改什么，见插件文件夹中的 `PIPELINE.md`。\n\n## 示例\n\n插件会把示例文件安装在 `Plugins/Framemark/Docs/Samples/` 下（在源码仓库中为：`Samples/`）：\n\n- `Doorway_Standoff.usda`\n- `Doorway_Standoff.framemark.usda`\n- `Doorway_Standoff_edits.usda`\n- `Doorway_Standoff.fbx`\n\n在 Maya、Houdini 或 Blender 中打开 `Doorway_Standoff.usda` 即可查看布局。\n\n## 已知限制\n\n- Maya 和 Houdini 的往返流程尚未做端到端检查。\n- 只测试过一个 Shot Designer 场景。\n\n## 另请参阅\n\n- [Planner（规划器）](07_planner.md)\n- [剧本与故事地图](08_screenplay-and-story-map.md)\n- [渲染与发布](10_render-and-publish.md)\n- [配套插件](12_integrations.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "10_render-and-publish.md", "slug": "render-and-publish", "title": "渲染与发布", "md": "# 渲染与发布\n\nFramemark 附带一个脚本，可构建六个 **Movie Render Graph** 模板，对应预演镜头的常见输出：每日样片、静帧、最终母版、路径追踪母版、VFX 交付和英国广播文件。另一个脚本是渲染钩子，它在渲染完成时运行，写出一份已生成内容的清单，并且可以把视频上传到审片平台。\n\n## 前提条件\n\n- 已启用 Movie Render Graph 和 Python Editor Script Plugin。\n- 有一个可渲染的关卡序列（参见[序列与绑定](06_sequences.md)）。\n- 如需上传：需要装有你所用审片平台客户端库的 Python 3（参见[审片上传器](#review-uploader)）。\n\n## 渲染模板\n\n脚本 `Samples/Render/framemark_render_templates.py` 负责构建这些图。\n\n1. 选择 **Tools > Execute Python Script**。\n2. 选取 `framemark_render_templates.py`。\n3. 在内容浏览器中打开 `/Game/Cinematics/Render/Templates`。\n\n脚本只会删除并重建名称以 `CS_` 开头的图，你自己的图不受影响。完成后，日志会显示“RESULT n of 6 templates evaluate”。\n\n六个图共用以下输出设置：\n\n- 输出目录：`{project_dir}/Saved/MovieRenders/{sequence_name}/{date}`\n- **Overwrite existing output**（覆盖现有输出）：关闭\n- 帧编号补零到 4 位\n\n### 六个模板\n\n| 模板 | 尺寸与帧率 | 输出 | 质量 |\n|---|---|---|---|\n| **CS_Dailies** | 1080p (FHD)，24 fps | 带音频的 MP4，编码器上启用烧录信息 | Temporal samples 1 |\n| **CS_Stills** | FHD | PNG 序列 | Spatial samples 8，抗锯齿 None，预热 32 |\n| **CS_Final_Master** | 4K UHD | ProRes 4444 XQ（无音频视频）加一个 Audio Output 节点（WAV） | Temporal samples 16，预热 120，模拟运动模糊，抗锯齿 None，最终 CVars |\n| **CS_Final_PathTraced** | 4K | EXR (ZIP) 加 WAV | 带降噪器和参考运动模糊的 Path Tracer，temporal samples 64，预热 120 |\n| **CS_VFX_Turnover** | 4K | 多层 EXR (ZIP)，外加带音频的 ProRes 422 HQ 参考文件 | Temporal samples 16，关闭色调曲线 |\n| **CS_UK_Broadcast** | FHD，25 fps | 带音频的 ProRes 422 HQ，加 WAV | Temporal samples 16，预热 120 |\n\n### 最终 CVars\n\n最终质量的图会设置：\n\n- `r.MotionBlurQuality 4`\n- `r.MotionBlurSeparable 1`\n- `r.DepthOfFieldQuality 4`\n- `r.BloomQuality 5`\n- `r.Tonemapper.Quality 5`\n\n它们还会设置 Global Game Overrides：禁用 LOD、禁用纹理流送，并刷新草地流送。\n\n### 使用模板\n\n1. 打开 **Window > Cinematics > Movie Render Queue**。\n2. 在新任务上点击 **Render (Local)** 或 **Render (Remote)**，然后选择关卡序列。\n3. 从 `/Game/Cinematics/Render/Templates` 中选择图。\n4. 点击 **Render**。\n\n要更改分辨率或帧率，请复制一个模板并编辑副本。模板不会把它们作为图变量公开。\n\n> **注意：** **CS_UK_Broadcast** 只提供画面和声音格式。英国广播交付还需要 -23 LUFS 的响度、MXF 封装、从 10:00:00:00 开始的时间码和时钟，这些虚幻引擎都不会生成。请在你的后期工具中完成。\n\n> **注意：** 没有任何模板以某个工作室命名。已查证的工作室都没有公布交付规范。\n\n## 渲染钩子\n\n渲染钩子会在渲染完成时发布一份清单。\n\n1. 打开 **Edit > Project Settings > Plugins > Python**。\n2. 把 `framemark_render_hooks.py` 添加到 **Startup Scripts**（启动脚本）。\n3. 重启虚幻引擎。\n4. 打开你的 Movie Render Graph。\n5. 添加一个 **Execute Script** 节点。\n6. 把 **Editor-Only Script** 设为 `FramemarkPublish`。\n\n`FramemarkPublish` 是 `MovieGraphScriptBase` 的子类。它的 `on_job_finished` 方法会在第一个输出文件旁边写出 `framemark_publish_<YYYYMMDD_HHMMSS>.json`。清单记录任务、序列、图、是否成功、创建时间和层。\n\n渲染失败时不会发布。钩子内部的失败绝不会导致渲染失败。\n\n### 渲染后上传\n\n如果存在 `~/.framemark/publish.json`，钩子会启动一个独立的 Python 进程来运行上传器。它使用该文件中的 `python` 键，否则使用引擎自带的 Python 3。日志写入 `<manifest>.log`。\n\n## 审片上传器\n\n`framemark_publish.py` 把渲染好的视频发送到审片平台。\n\n```\npython framemark_publish.py <manifest.json> [--dry-run]\npython framemark_publish.py --self-test\n```\n\n- `--dry-run` 只记录会发送的内容，不实际发送。\n- `--self-test` 在不联网的情况下检查脚本。\n- 只会上传 `.mov` 和 `.mp4` 文件。\n- 每次上传有 3 次尝试，间隔分别等待 5 秒和 10 秒。一个平台失败不会影响其他平台。\n- 日志会为每一步标记 **确定**（OK）、**RETRY**、**FAILED** 或 **WOULD**，并以“RESULT n published, m failed”结尾。\n- 任何配置值都可以写成 `\"env:NAME\"`，以读取环境变量。\n\n### publish.json 目标\n\n| 目标 | 键 | 需要 |\n|---|---|---|\n| `frameio` | `account_id`、`folder_id`、`token`，或用于 Adobe server-to-server 的 `client_id` 和 `client_secret` | |\n| `syncsketch` | `user`、`api_key`、`review_id`，可选 `host` | |\n| `shotgrid` | `site`、`script_name`、`api_key`、`project_id`、`entity_type`、`entity_id` | `shotgun_api3` |\n| `ftrack` | `server`、`api_user`、`api_key`、`task_id`、`asset_type` | `ftrack-python-api` |\n| `kitsu` | `host`、`email`、`password`、`task_id`、`task_status_id` | `gazu` |\n\nFrame.io 接受旧版 `token`，或 Adobe server-to-server 的一对凭据。\n\n> **警告：** 只有 Kitsu 做过实际上传测试（11 月 8 日）。Frame.io、SyncSketch、ShotGrid 和 ftrack 仅通过了试运行和自检。\n\n## 已知限制\n\n- 未构建 Wwise 音频和 ffmpeg 步骤（混流、响度、MXF、时间码）。\n- Deadline 不属于 Framemark：请使用 AWS Deadline Cloud Unreal 提交器。\n- **CS_Dailies** 的烧录信息只在编码器上设置。脚本不会添加 Burn-In 节点，因此依赖它之前请先检查输出。\n\n## 另请参阅\n\n- [序列与绑定](06_sequences.md)\n- [导入、导出与分享](09_import-export.md)\n- [设置与命名参考](11_settings-reference.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "11_settings-reference.md", "slug": "settings-reference", "title": "设置与命名参考", "md": "# 设置与命名参考\n\nFramemark 把项目级选项保存在 **Editor Preferences**（编辑器偏好设置）中，把每个项目的默认值保存在 **Profile** 数据资产中，把 Generate 对话框的默认值保存在 Generate 设置对象中。本页列出每个属性、它的默认值和作用。当你需要更改 Framemark 如何命名、存放到哪里，或者工作时的行为时，请查阅本页。\n\n## 设置存放位置\n\n| 位置 | 菜单路径 | 存储于 |\n|---|---|---|\n| General、Naming、Lights、Cameras、Sequence、Generate | **Edit > Editor Preferences > Framemark** | 你的每项目用户设置（`EditorPerProjectUserSettings`），因此不会通过源码管理共享 |\n| Marks | **Edit > Editor Preferences > Plugins > Framemark Marks** | 同一份每项目用户设置 |\n| Profile | 内容浏览器中的 **Framemark Profile** 数据资产 | 资产本身，因此可以共享 |\n\n> **注意：** Marks 页面位于 **Plugins** 下，而不在 **Framemark** 下。其余六个页面共用一个分区。\n\n> **提示：** 使用编辑器偏好设置顶部的搜索框。输入下表中的属性名，即可直接跳转到它。\n\n## 前提条件\n\n- 已启用 Framemark 插件（**Edit > Plugins**）并已重启编辑器。\n- 使用 Profile 时，需要存在一个 **Framemark Profile** 类型的资产。在内容浏览器中用 **Add > Miscellaneous > Data Asset** 创建，并选择 **Framemark Profile**，然后在 **Active Profile** 中指定它（见下文）。\n\n---\n\n## General 页面\n\nGeneral 页面包含行为选项。下面的每个标题都是该页面内的一个分类。\n\n### Viewport\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Show Labels**（显示标签） | 开 | 在关卡视口中绘制每个标记、摄像机和灯光的名称。 |\n| **Label Draw Distance**（标签绘制距离） | 6000 cm | 距离视口摄像机多远时仍绘制标签。最小值 500。仅在 **Show Labels** 开启时可编辑。 |\n\n### Scene Boundary\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Warn When Editing Inside Boundary** | 开 | 当你编辑位于某个舞台边界内的内容时，显示警告提示。 |\n| **Auto Fit Boundary** | 开 | 在你添加或移动内容时，调整边界大小以包住舞台内容。 |\n\n### Placement\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Add Default Marks On Place** | 开 | 新放置的舞台自带其默认标记。 |\n| **Snap To Ground On Place** | 开 | 把放置的项目落到其下方的地面上。 |\n| **Stage Anchor Location** | Centre | 新舞台的哪个点位于你点击的位置。选项：**Centre**、**Front Centre**、**Back Centre**、**Front Left**、**Front Right**。 |\n\n### Sequence\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Auto Sync Marks To Sequence** | 开 | 当舞台的标记变化时，让它的关卡序列保持同步。 |\n| **Key To Mark Interpolation** | Stepped | Key To Mark 所创建关键帧的插值方式。选项：**Stepped**、**Linear**、**Cubic**。 |\n| **Key Sequence Start On First Key** | 开 | 让序列的播放范围从你打的第一个关键帧开始。 |\n| **Key When Assigning Sequenced Actor** | 开 | 指定 Actor 时，立即把它按标记打关键帧。 |\n| **Keys Follow Marks** | 开 | 当你移动某个标记时，同时移动为它创建的关键帧。 |\n| **Keys Out Of Date On Open** | Ask | 打开关键帧与标记不再匹配的舞台时的处理方式。选项：**Ask**、**Update**、**Leave**。仅在 **Keys Follow Marks** 开启时可编辑。 |\n\n### Marks\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Drop To Mark Assigns** | 开 | 把 Actor 放到标记上时，会把它指定给该标记。 |\n| **Drop To Mark Radius** | 60 cm | 放下的 Actor 离标记多近才算数。最小值 10，滑块最大到 200。 |\n\n### Moves\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Walk Speed** | 140 cm/s | 标记之间走动移动所用的速度。最小值 10。 |\n| **Run Speed** | 400 cm/s | 标记之间跑动移动所用的速度。最小值 10。 |\n\n### Screenplay\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Source File Changed** | Ask | 已导入的 Screenplay 文件在磁盘上发生变化时，Framemark 的处理方式。选项：**Ask**、**Re-import**、**Ignore**。 |\n\n### Pipeline\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Export Folder** | 空 | USD 和 FBX 导出的存放位置。为空时使用项目的 `Pipeline` 文件夹。 |\n| **Export File Name** | `{stage}` | 文件名模式。标记：`{show}`、`{seq}`、`{stage}`。 |\n| **When The File Exists** | New Version | **New Version** 写入下一个版本号。**Overwrite** 替换该文件，并把旧文件保留为 `.bak`。 |\n| **Write Back On Save** | 开 | 保存舞台时，重写其链接的 USD 层或 FBX。如果文件在虚幻引擎之外被更改，或在源码管理中被锁定，则拒绝写入。 |\n\n### Planner\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Planner Grid Size** | 50 cm | Planner 对齐所用的网格间距。最小值 5，滑块最大到 500。 |\n\n### Profile\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Active Profile** | 空 | 要使用的 Framemark Profile 资产。为空表示使用内置默认值。 |\n| **Default Project Type** | Third Person Game | 未设置 Profile 时使用的项目类型。选项：**Third Person Game**、**First Person Game**、**Offline CG**、**Branching Dialogue**。 |\n\n### Overhead\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Plan Layer Colours** | 八个内置行 | 供 Layers 面板使用的图层名称和颜色配对列表。默认值见下表。 |\n\n| 图层 | 默认颜色 |\n|---|---|\n| Background | `#8a8a8a` |\n| Boundary | `#f5c518` |\n| Set | `#a08a6a` |\n| Images | `#d09a5a` |\n| Marks | `#e05064` |\n| Cameras | `#6ec1ff` |\n| Lights | `#ffd36b` |\n| Sketch | `#b48cf0` |\n\n---\n\n## Naming 页面\n\nFramemark 用**模式**来构建每一个名称：模式是含有 `{tokens}` 的文本。先选一个 **Preset**（预设）作为起点，再调整任意规则。\n\n### Naming\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Preset** | Custom | 加载一整套规则。参见[预设](#presets)。编辑任何规则都会把它切回 **Custom**。 |\n| **Master Scope** | Project | 一个主序列涵盖的范围。选项：**Project**、**Level**、**Sequence**。 |\n| **Shot Sub Sequence Pattern** | `{type}_{shot}-01` | 为某个镜头创建的子序列的名称。 |\n| **Sequence Sub Sequence Pattern** | `{type}_{seq}-01` | 为某个序列创建的子序列的名称。 |\n\n### Rules\n\n共有 11 条规则。每条规则都有相同的六个字段。\n\n| 字段 | 说明 |\n|---|---|\n| **Pattern** | 名称模板。 |\n| **Separator** | 连接各部分。**As Written**、**Underscore**、**Hyphen**、**Dot**、**None**。 |\n| **Case** | **As Typed**、**Lower**、**Upper**。 |\n| **Padding** | 计数器的位数。0 到 8。 |\n| **Step** | 计数器每次增加多少。最小值 1。 |\n| **Preview** | 只读。根据当前模式显示一个示例名称。 |\n\n**Framemark** 预设的默认值：\n\n| 规则 | 模式 | Padding | Step | Case |\n|---|---|---|---|---|\n| Stage | `STG_{location}_{variant}_v{v}` | 0 | 1 | As typed |\n| Mark | `mrk_{subject}_{n}` | 3 | 10 | Lower |\n| Camera | `{seq}_{shot}_{subject}_{type}` | 4 | 10 | As typed |\n| Light | `lgt_{type}_{subject}_{role}_{n}` | 2 | 1 | Lower |\n| Prop | `prp_{name}_{n}` | 2 | 1 | Lower |\n| Level Sequence | `LS_{seq}` | 0 | 10 | As typed |\n| Shot | `LS_{seq}_{shot}_v{v}` | 4 | 10 | As typed |\n| Master (Project) | `LS_{project}_Master` | 0 | 1 | As typed |\n| Master (Level) | `LS_{level}_Master` | 0 | 1 | As typed |\n| Master (Sequence) | `LS_{seq}_Master` | 0 | 1 | As typed |\n| Other Stage Element | `{type}_{desc}_{n}` | 2 | 1 | Lower |\n\n### Tokens\n\n| 标记 | 含义 |\n|---|---|\n| `{show}` `{ep}` `{seq}` | 来自 **Codes** 分类的剧集、集数和序列代码 |\n| `{shot}` | 镜头编号 |\n| `{mark}` | Mark Order 编号 |\n| `{role}` | 标记或灯光的角色，例如 Key |\n| `{from}` `{at}` | 一次移动的起点和终点 |\n| `{scale}` | 镜头景别，例如 MS |\n| `{type}` | 项目类型，例如 camera 或 spot |\n| `{lens}` | 焦距 |\n| `{v}` | 版本号 |\n| `{stage}` | 舞台名称 |\n| `{n}` | 连续计数器，按规则补零并设定步长 |\n| `{name}` | 项目自身的名称 |\n| `{subject}` | 位于该项目处的 Actor 或角色。始终为小写。 |\n| `{desc}` | 简短描述 |\n| `{location}` `{variant}` | 舞台的地点和变体 |\n| `{project}` `{level}` | 项目和关卡名称 |\n| `{cine_dir}` | Cinematics 文件夹 |\n\n- **宽度：** 在标记后加冒号和数字即可补零，例如 `{shot:4}`。\n- **空标记：** 没有值的标记会被丢弃，连同它前面的分隔符一起。\n- **允许的字符：** 完成的名称只保留 `a-z A-Z 0-9 . _ -`。其他字符都会变成 `_`。\n\n### Presets\n\n| 预设 | 风格 |\n|---|---|\n| **Custom** | 你自己的编辑。 |\n| **Framemark** | 上面的默认值。 |\n| **Unreal (linear content)** | Epic 的线性内容风格：`Stage_{n}`、`Mark_{name}_{n}`、`{seq}_SH{n}`、`Light_{n}`、`Prop_{name}_{n}`、`LS_{stage}_{seq:3}_{shot:4}`。Padding 4，step 10。 |\n| **VFX (SEQ_SHOT_task_v001)** | 小写。Level Sequence 为 `{seq:3}_{shot:4}_{stage}_previs_v{v}`，shot 为 `{seq}_sh{shot}_previs_v{v}`，masters 为 `{project}_master_v{v}`。 |\n| **Netflix plate** | `SHOW_EP_SEQ_SHOT` 风格：camera 为 `{show}_{ep}_{seq}_{n}`，shot 为 `{show}_{ep}_{seq}_{shot}`，Level Sequence 为 `{show}_{ep}_{seq}_{stage}_v{v}`。大小写按输入。 |\n| **Blender Studio** | 小写。项目之间用连字符，内部用下划线：`set-{stage}`、`{seq}-sh{n}`、`{seq:3}_{shot:4}-{stage}-previs-v{v}`。 |\n\n### Schema Buttons\n\n| 按钮 | 作用 |\n|---|---|\n| **Export Schema** | 把整套命名设置（包括文件夹）保存为 `.framemarknaming` 文件。 |\n| **Import Schema** | 加载 `.framemarknaming` 文件。 |\n| **Reset To Defaults** | 恢复 Framemark 预设和默认文件夹。 |\n\n> **提示：** 与团队共享一个 `.framemarknaming` 文件，这样每个人的命名方式都一致。\n\n### Folders\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Cinematics Folder** | `/Game/Cinematics` | 根文件夹。可用作 `{cine_dir}`。 |\n\n每种文件夹类型有一个模板。文件夹标记：`{cine_dir}`、`{project}`、`{level}`、`{seq}`、`{shot}`、`{stage}`、`{location}`、`{variant}`。\n\n| 文件夹 | 默认模板 |\n|---|---|\n| Master | `{cine_dir}/{project}/Master` |\n| Scripts | `{cine_dir}/{project}/Scripts` |\n| Stages | `{cine_dir}/{project}/Stages/{stage}` |\n| Sequences | `{cine_dir}/{project}/Sequences/{seq}` |\n| Shots | `{cine_dir}/{project}/Sequences/{seq}/Shots/{seq}_{shot}` |\n| Edits | `{cine_dir}/{project}/Sequences/{seq}/Edits` |\n| Image Refs | `{cine_dir}/{project}/Refs` |\n| Sketches | `{cine_dir}/{project}/Sketches` |\n\n### Codes\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Show Code** | 空 | 填充 `{show}`。 |\n| **Episode Code** | 空 | 填充 `{ep}`。 |\n| **Sequence Code** | 空 | 在没有其他来源设置时，填充 `{seq}`。 |\n\n> **注意：** 早期版本的旧默认模式在加载时会升级为当前默认值。你修改过的模式保持不变。\n\n---\n\n## Lights 页面\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Presets** | 三个内置预设 | Place Light 提供的灯光预设列表。 |\n| **Default Preset** | Spot Rim | 未选择时使用的预设。 |\n| **Reset To Built-In Presets** | 按钮 | 恢复下面的三个预设。你自己的预设会被移除。 |\n\n每个预设都有这些字段。显示的默认值针对新建的一行。\n\n| 字段 | 默认值 | 说明 |\n|---|---|---|\n| **Name** | | 工具中显示的标签。 |\n| **Light Class** | 空 | 要生成的灯光 Actor。为空时使用工具自带的聚光源。 |\n| **Intensity** | 50 | 单位为坎德拉。 |\n| **Colour** | White | 灯光颜色。 |\n| **Attenuation Radius** | 1000 cm | 灯光的照射范围。 |\n| **Outer Cone Angle** | 38 degrees | 仅限聚光源。 |\n\n内置预设：\n\n| 预设 | 类 | 强度 | 颜色 (R, G, B) | 半径 | 锥角 |\n|---|---|---|---|---|---|\n| Spot Rim | 工具的聚光源 | 150 | 1, 0.9, 0.75 | 1500 | 38 |\n| Point Fill | 点光源 | 20 | 0.7, 0.82, 1 | 1000 | 不适用 |\n| Rect Key | 矩形光源 | 25 | 1, 0.96, 0.9 | 800 | 不适用 |\n\n---\n\n## Cameras 页面\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **User Formats** | 空列表 | 你自己的胶片格式，添加到内置列表中。 |\n| **User Lenses** | 空列表 | 你自己的镜头，添加到内置列表中。 |\n\n用户格式的字段：\n\n| 字段 | 默认值 | 说明 |\n|---|---|---|\n| **Format Name** | | 菜单中显示的标签。 |\n| **Sensor Width** | 24.89 mm | 片门宽度。 |\n| **Sensor Height** | 18.66 mm | 片门高度。 |\n| **Squeeze** | 1 | 变形挤压比，1 到 2。 |\n| **Crop Aspect** | 0 | 把片门裁切到该宽高比。0 表示保留整个片门。 |\n\n用户镜头的字段：\n\n| 字段 | 默认值 | 说明 |\n|---|---|---|\n| **Lens Name** | | 菜单中显示的标签。 |\n| **Focal Length** | 35 mm | 镜头的焦距。 |\n\n---\n\n## Sequence 页面\n\n四个选项决定新建关卡序列的初始状态。每个选项都有一个复选框和一个值。只有勾选了复选框，该值才生效。四个复选框默认都是关闭的，因此使用虚幻引擎自己的默认值。\n\n| 选项 | 默认值 | 说明 |\n|---|---|---|\n| **Frame Rate** | 24 fps | 显示帧率。 |\n| **Clock Rate** | 24000 | 刻度分辨率。 |\n| **Length** | 10 s | 播放长度。最小值 0.1，滑块最大到 600。 |\n| **Name** | `LS_{stage}` | 新序列的名称。 |\n\n---\n\n## Generate 页面\n\n这些是 **Generate** 和 **Build Sequence** 对话框的默认值。\n\n### Sequence\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Name** | 空 | 序列的名称。 |\n| **Suffix** | 空 | 添加到名称末尾。 |\n| **Base Path** | 空 | 存放结果的内容文件夹。 |\n| **Seq Code** | 空 | 序列代码，如 `{seq}` 中所用。 |\n| **Abbreviation** | 空 | 镜头名称中使用的简写。 |\n| **Number Of Shots** | 1 | 要创建多少个镜头。0 到 100。 |\n| **Sequence To Duplicate** | None | 复制该序列，而不是创建空白序列。不会保存。 |\n| **Sub Sequence Names** | 空 | 要创建的子序列的名称。 |\n| **Instance Sub Sequences** | 关 | 复用子序列，而不是复制它们。 |\n\n### Timeline\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Start Time** | 0 s | 第一个镜头的开始位置。 |\n| **Duration** | 5 s | 每个镜头的长度。 |\n\n### Shots\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Shot Directory** | 空 | 镜头资产的内容文件夹。 |\n| **Shot Prefix** | 空 | 添加到每个镜头名称前。 |\n| **First Shot Number** | 10 | 第一个镜头的编号。 |\n| **Shot Increment** | 10 | 镜头编号之间的间隔。 |\n| **Shot Digits** | 4 | 镜头编号的位数。 |\n| **Take (Version) Digits** | 3 | 拍摄次序（take）编号的位数。 |\n\n### Track Settings\n\n要添加的轨道列表，每条轨道都有一个 **Create** 复选框。所有复选框默认都是关闭的。\n\n| 列表 | 默认条目 |\n|---|---|\n| **Per Shot** | ANM, FX, LGT, EDL |\n| **Per Sequence** | FX, LGT |\n\n### Populate\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Characters** | 开 | 把舞台的角色作为绑定添加。 |\n| **Props** | 开 | 把舞台的道具作为绑定添加。 |\n\n### Screenplay\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Stages** | One Per Location | 每个地点创建一个舞台，或者 **One Per Scene**。 |\n| **Seq Code Start** | 10 | 第一个序列代码。 |\n| **Seq Code Increment** | 10 | 序列代码之间的间隔。 |\n| **Abbreviation From Slugline** | 开 | 从场景标题中取得序列简写。 |\n\n### Dialogs\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Don't Ask Again: Build Sequence** | 开 | 跳过 Build Sequence 对话框并使用这些值。按住 Shift 点击 **Build Sequence** 仍可打开它。 |\n| **Don't Ask Again: Generate From Screenplay** | 开 | 跳过 Generate 对话框。 |\n\n两个隐藏标志 `bBuildSequenceDialogSeen` 和 `bGenerateDialogSeen` 记录你是否已看过每个对话框一次。你无法编辑它们。\n\n---\n\n## Marks 页面\n\n打开 **Edit > Editor Preferences > Plugins > Framemark Marks**。\n\n> **注意：** **Size**、**Opacity**、**Height Pin**、**Colour** 和 **Custom Mark** 只是新舞台 **Look > Marks** 的初始值。之后，每个舞台都有自己的值。**Pin Thickness**、**Handle Colour** 和 **Conform To Ground** 对所有舞台生效。\n\n### Look\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Ring Radius** | 35 cm | 标记圆环的大小。15 到 80。 |\n| **Pin Thickness** | 1.5 | 高度针线条的粗细。0.5 到 6。 |\n| **Handle Colour** | Blue (0, 112, 224) | 所选手柄的颜色。 |\n| **Mark Opacity** | 1 | 0.1 到 1。 |\n| **Height Pin** | Always | 高度针何时显示：**Always**、**Selected**、**Off**。 |\n| **Colour** | By Role | **By Role** 使用 Role Colours。**One** 使用单一颜色。 |\n| **One Colour** | Orange (0.913, 0.479, 0.014) | **Colour** 为 **One** 时使用的颜色。 |\n| **Conform To Ground** | 开 | 让标记的圆环弯曲，贴合不平整的地面。 |\n| **Planner Mark Look** | Ring | 标记在 Planner 中的绘制方式：**Ring**、**Shoulders**、**Custom**。 |\n\n### Custom Look\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Custom Mark** | 空 | 用作标记的网格体或材质。 |\n| **Preview Character** | 空 | 站在未指定标记上显示的角色。 |\n| **Show Preview Character When Unassigned** | 开 | 在没有 Actor 的标记上显示预览角色。 |\n\n### Role Colours\n\n| 角色 | 颜色 (R, G, B) |\n|---|---|\n| Player | 1, 0.08, 0.06 |\n| Companion | 0.2, 0.75, 0.35 |\n| NPC | 1, 0.82, 0 |\n| Enemy | 1, 0.42, 0 |\n| Prop | 0.55, 0.3, 1 |\n| Transport | 1, 0.3, 0.65 |\n| Extra | 0.35, 0.37, 0.4 |\n\n---\n\n## Framemark Profile 资产\n\n**Framemark Profile** 是一个数据资产，承载某个项目的默认值。在 **General > Profile > Active Profile** 中指定它。它没有 `.ini` 文件，因此会随项目一起流转。\n\n### Project\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Project Type** | Third Person Game | **Third Person Game**、**First Person Game**、**Offline CG**、**Branching Dialogue**。决定哪些工具适合该项目。 |\n\n### Defaults\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **View Mode** | Framed | 新舞台如何显示其摄像机视图。 |\n| **Layout** | I Frame | 起始标记布局。 |\n| **Film Format** | Film 35mm 4 Perf | 起始胶片格式。 |\n| **Film Scale** | 1.0 | 片门的缩放。0.25 到 5。 |\n| **Height Off Floor** | 85 cm | 默认摄像机高度。 |\n| **Default Mark Count** | 2 | 新舞台上的标记数量。 |\n\n### Classes\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Camera Class** | 空 | 要生成的摄像机 Actor 类。 |\n| **Light Class** | 空 | 要生成的灯光 Actor 类。 |\n\n### Naming\n\n| 属性 | 默认值 | 说明 |\n|---|---|---|\n| **Show Code** | 空 | 剧集代码。 |\n| **Sequence Name Template** | `LS_{stage}` | 新序列的名称。 |\n| **Camera Name Template** | `{seq}_SH{n}` | 新摄像机的名称。 |\n| **Shot Name Template** | `{seq}_SH{shot}` | 镜头的名称。 |\n| **Shot Number Step** | 10 | 镜头编号之间的间隔。 |\n| **Version Padding** | 3 | 版本号的位数。 |\n\n> **注意：** 保持默认值的模板会交由 **Naming** 页面决定。你修改过的模板优先于它。\n\n---\n\n## 另请参阅\n\n- [Framemark 概览](index.md)\n- [Framemark 模式界面](02_interface.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [摄像机与灯光](05_cameras-and-lights.md)\n- [序列与绑定](06_sequences.md)\n- [配套插件](12_integrations.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "12_integrations.md", "slug": "integrations", "title": "配套插件", "md": "# 配套插件\n\nFramemark 可以独立使用。另有七个可选部分为它增添功能：四个连接其他虚幻引擎插件的配套插件（CAT、Odyssey、StylisedLightRig、USD）、一个 articy:draft 插件、ink 支持，以及 Unreal MCP 连接。本页说明每一项增添了什么、如何启用，以及缺少它时 Framemark 会把哪些功能置灰。\n\n## 可选桥接插件的工作方式\n\n每个桥接插件都是一个独立的虚幻引擎插件，同时依赖 Framemark 和它所连接的插件。桥接插件加载时，会向 Framemark 注册自己。缺少它时，对应的功能会被置灰，其工具提示会说明需要启用什么。\n\n| 配套插件 | 需要 | 增添 |\n|---|---|---|\n| **Framemark CAT Bridge** | Cinematic Assembly Tools | Cine Assembly 元数据中的舞台链接 |\n| **Framemark Odyssey Bridge** | Odyssey | 带锁定舞台底图的分层草图 |\n| **FramemarkSLR** | Light rig plugin | Planner 灯光环和 Place Light 的 **Rig** 类型 |\n| **Framemark USD Bridge** | 虚幻引擎的 USD Core | **导出 USD**（Export USD）和 USD Import 图块 |\n| **Framemark Bridge**（articy） | articy:draft 4.2.2 或更高版本 | articy 中的 **Apply Changes** 和 **Undo Last Apply** |\n\n## 前提条件\n\n- 已安装并启用 Framemark。参见[入门](01_getting-started.md)。\n- 已安装每个桥接插件所连接的引擎插件。\n\n> **注意：** 构建脚本会构建 Framemark 以及每个桥接插件。如果某个桥接插件缺少对应的引擎插件，脚本会跳过该桥接插件并记录原因。Framemark 本身仍然可以构建。\n\n## 启用桥接插件\n\n1. 打开 **Edit > Plugins**。\n2. 搜索桥接插件的名称，例如 **Framemark USD Bridge**。\n3. 勾选 **Enabled**。\n4. 出现提示时重启编辑器。\n\n> **提示：** 如果列表中没有某个桥接插件，说明它没有被构建。参见[故障排除](14_troubleshooting.md)。\n\n---\n\n## Framemark CAT Bridge\n\n把舞台链接到 Cinematic Assembly Tools (CAT)。\n\n**需要：** Framemark 和 Cinematic Assembly Tools。\n\n- 桥接插件把舞台名称存放在 Cine Assembly 元数据键 `FramemarkStage` 中。\n- 查找某个 assembly 所指的舞台（**FindStagesUsing**）会读取该键。\n- 建立链接时会写入该键，使 assembly 和舞台保持关联。\n\n> **注意：** 没有桥接插件时，这两个调用不起任何作用。Framemark 不会为 CAT 显示置灰的按钮：只是不会建立链接。\n\n---\n\n## Framemark Odyssey Bridge\n\n把 Planner 草图变成分层的 Odyssey 文档，并带有锁定的舞台平面底图。\n\n**需要：** Framemark 和 Odyssey。\n\n### 你能得到什么\n\n- **Layers > Sketch > New Sketch** 会在 Odyssey 中打开草图。\n- 草图带有锁定的舞台平面底图，因此你是在真实布局上绘制。\n- New Sketch 的纹理命名为 `T_Sketch_<stage>`，并保存在该舞台的 Sketches 文件夹中。\n- 舞台变化后，**刷新底图**（Refresh Underlay）会重绘底图。\n\n### 没有桥接插件时\n\n- **刷新底图** 被置灰。它的工具提示写道：“Needs the Framemark Odyssey Bridge plugin (and Odyssey). Turn it on in Edit > Plugins, then restart.”\n- **新建草图**（New Sketch）改为在虚幻引擎的纹理编辑器中打开草图。\n\n> **注意：** 底图只在草图打开时显示。每次保存时它都是隐藏的，因此你保存的纹理只包含你自己的绘制内容。\n\n---\n\n## FramemarkSLR\n\n把 Framemark 连接到 灯光装置插件，用于基于着色器的角色布光。\n\n**需要：** Framemark 和灯光装置插件。\n\n### Planner 灯光环\n\n每个被打光的角色在 Planner 中都有一个环。\n\n| 元素 | 它是什么 |\n|---|---|\n| **Key**、**Fill**、**Rim** | 围绕角色头部的圆点 |\n| **Broad**、**Short**、**Behind** | 显示布光风格的弧线 |\n\n| 想要做的事 | 操作 |\n|---|---|\n| 移动一盏灯 | 绕着头部拖动它的圆点。它会对齐到摄像机角度。 |\n| 更改灯光高度 | 按住 **Alt** 拖动圆点 |\n| 以半档为单位调整亮度 | 在圆点上滚动鼠标滚轮 |\n| 单独显示某一盏灯 | 按住 **Alt** 点击它的圆点 |\n| 把一个布光效果复制到另一个角色 | 把 rig 标签拖到那个角色上 |\n| 取消拖动 | 按 **Esc** |\n\n桥接插件开启时，工具栏会多出 SLR 快捷控件。\n\n### Place Light 的 Rig 类型\n\n1. 选择 **放置灯光**（Place Light）工具（**L**）。\n2. 选取 **Rig** 类型。\n3. 在某个标记附近点击。\n\nrig 会落在最近的标记上，并跟随角色。如果你重新分配该标记的角色，rig 仍然跟随原来的角色。\n\n![同一角色：无灯光装置（左）与由 灯光装置照亮（右）](media/lt_rig_before_after.jpg)\n\n### 没有桥接插件时\n\n**Rig** 类型被置灰。它的工具提示写道：“Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). Turn it on in Edit > Plugins, then restart.”\n\n---\n\n## Framemark USD Bridge\n\n写入和读取 Universal Scene Description 文件，使舞台可以在 Maya、Blender 或 Houdini 中打开。\n\n**需要：** Framemark 和虚幻引擎的 USD Core。该插件默认关闭。启用它时会自动为你启用 USD Core。\n\n### 你能得到什么\n\n- **Share** 页面上的 **导出 USD**。\n- **导入**（Import）中的 **USD** 图块。\n\n### 它写出的文件\n\n| 文件 | 作用 |\n|---|---|\n| `<base>.usda` | 在你的 DCC 中打开的文件。只写一次。它把编辑层作为子层叠加在 Framemark 层之上。 |\n| `<base>.framemark.usda` | Framemark 自己的层。每次导出都会重写。 |\n| `<name>_edits.usda` | 美术人员的层。创建一次为空，之后不再重写。 |\n\n### 舞台中有什么\n\n- 一个 prim `/<Stage>`，包含 **标记**（Marks）、**摄像机**（Cameras）和 **灯光**（Lights）作用域，外加由 BasisCurves 构成的 **边界**（Boundary）。\n- 每个 prim 都带有 `framemark:id` 和 `framemark:<attribute>` 值。编辑时请保留 `framemark:id`，否则该项目回来时会被当作新项目。\n- 布局以名为 `setup` 的变体集表示，带有 **All** 选项。\n- 单位为厘米，Z 轴向上。\n\n### 没有桥接插件时\n\n**导出 USD** 和 USD Import 图块被置灰。工具提示写道：“Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. Turn it on in Edit > Plugins, then restart.”\n\n> **提示：** FBX 导出不需要这个桥接插件。\n\n---\n\n## articy:draft 插件\n\n一个用于 articy:draft 的 C# MacroPlugin，名为 **Framemark Bridge**，版本 1.0.0。它把 Framemark 写出的更改列表应用回你的 articy 项目。\n\n**需要：** articy:draft 4.2.2 或更高版本。\n\n> **注意：** 把 `.articyue` 导出文件导入 Framemark 不需要任何插件。只有把更改应用回 articy 时才需要 articy 插件。\n\n### 安装\n\n1. 在 Framemark 文件夹中找到 `ArticyPlugin/Framemark.ArticyBridge_1.0.0.mdk`。\n2. 在 articy:draft 中打开 **Package Manager**。\n3. 安装该 `.mdk` 文件。\n\narticy 中会出现一个带两个命令的 **Framemark** 菜单。\n\n### Apply Changes\n\n1. 在 Framemark 中编辑已导入的 Screenplay 并保存。Framemark 会在导出文件旁边写出 `<export>.framemark-changes.json`。\n2. 在 articy 中选择 **Framemark > Apply Changes**，并选取该文件。\n3. articy 会先检查每一项更改。只要有任何对象被锁定或未被认领，就不会做任何更改。\n4. 否则，它会应用编辑、新增和删减。\n5. 该文件被重命名为 `.applied.json`，并写出撤销记录 `.framemark-changes.undo.json`。\n6. 会显示一条消息：“Applied: N edited, N added, N cut.”\n7. 在 articy 中再次导出到 Unreal，然后重新导入 Framemark。\n\n### Undo Last Apply\n\n1. 在 articy 中选择 **Framemark > Undo Last Apply**。\n2. 它会读取 `.framemark-changes.undo.json` 文件。\n3. 被删减的台词会以新的 ID 恢复。\n\n> **警告：** 如果自 Apply 之后这些台词被编辑过，撤销会被拒绝。articy 中的 **Ctrl+Z** 无法撤销一次 Apply。\n\n---\n\n## ink\n\nFramemark 无需额外插件，即可导入 `.ink` 故事并写回其中。\n\n### 导入\n\n1. 选择 **Import > Screenplay**。\n2. 选取一个 `.ink` 文件。\n3. 每个 knot 都会成为一个场景。\n\n### 保存回文件\n\n保存时，会把编辑、新增和删减的台词写回 `.ink` 文件。Framemark 会保留一份 `.bak` 副本。它不会改动你的逻辑、标签、选项和 diverts。\n\n在以下情况下，它会拒绝保存：\n\n- 自你导入之后，文件在磁盘上发生了变化，\n- 文件是只读的，\n- 文件在源码管理中被锁定，或已过期。\n\n> **注意：** `INCLUDE` 文件不会被读取。被 glue 连接的台词会在 Framemark 中附带一条说明。\n\n---\n\n## Unreal MCP\n\nUnreal MCP 服务器让 MCP 客户端（例如 Claude Code）可以驱动编辑器。它是可选的。\n\n### 它如何启动\n\n`Config/DefaultEditorPerProjectUserSettings.ini` 会随编辑器启动 MCP 服务器。服务器监听 `http://127.0.0.1:8000/mcp`。\n\n### 连接 Claude Desktop\n\n1. 安装 Node.js。用 `node -v` 检查。\n2. 在 Claude 中打开 **Settings > Developer > Edit Config**。\n3. 把下面的内容添加到 `mcpServers`：\n\n```json\n\"unreal-mcp\": {\n  \"command\": \"npx\",\n  \"args\": [\"-y\", \"mcp-remote\", \"http://127.0.0.1:8000/mcp\", \"--transport\", \"http-only\"]\n}\n```\n\n4. 完全退出 Claude 并重新打开。\n5. 先在虚幻引擎中打开项目，这样服务器才会运行。\n\n> **注意：** 如果 Claude 报告连接被拒绝的错误，说明编辑器尚未打开，或服务器没有启动。\n\n---\n\n## 缺少各配套插件时会置灰什么\n\n| 缺少 | 置灰内容 | 消息 |\n|---|---|---|\n| Framemark CAT Bridge | 没有可见变化。不会建立舞台链接。 | Needs the Framemark CAT Bridge plugin (and Cinematic Assembly Tools). |\n| Framemark Odyssey Bridge | **刷新底图** | Needs the Framemark Odyssey Bridge plugin (and Odyssey). |\n| FramemarkSLR | Place Light 的 **Rig** 类型和 Planner 灯光环 | Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). |\n| Framemark USD Bridge | **导出 USD**、USD Import 图块 | Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. |\n| articy 插件 | Framemark 中没有变化。articy 中缺少 **Apply Changes**。 | |\n| Unreal MCP | Framemark 中没有变化 | |\n\n每条工具提示都以“Turn it on in Edit > Plugins, then restart.”结尾。\n\n---\n\n## 另请参阅\n\n- [Framemark 概览](index.md)\n- [入门](01_getting-started.md)\n- [Planner（规划器）](07_planner.md)\n- [剧本与故事地图](08_screenplay-and-story-map.md)\n- [导入、导出与分享](09_import-export.md)\n- [设置与命名参考](11_settings-reference.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "13_shortcuts.md", "slug": "shortcuts", "title": "键盘快捷键参考", "md": "# 键盘快捷键参考\n\n本页列出每一个 Framemark 按键和修饰键点击，均已对照代码中的命令绑定核实。快捷键分为三组：关卡视口（Framemark 模式）、Quick Wheel 和 Planner。\n\n## 前提条件\n\n- 视口快捷键需要 **Framemark 模式已开启**。模式关闭时，**Tab**、**M** 和 **K** 不起作用。\n- Planner 快捷键需要 **规划器**（Planner）窗口处于焦点状态。\n\n---\n\n## 关卡视口\n\n这些快捷键在 Framemark 模式激活时有效。\n\n| 按键 | 命令 | 说明 |\n|---|---|---|\n| **M** | Place Mark（放置标记） | 开关式。保持开启，直到你按 **Esc**。 |\n| **P** | Place Prop（放置道具） | 开关式。 |\n| **C** | Place Camera（放置摄像机） | 开关式。 |\n| **L** | Place Light（放置灯光） | 开关式。 |\n| **K** | Key To Mark（按标记打关键帧） | 把所选 Actor 按其标记打关键帧。 |\n| **O** | Overhead View（俯视图） | 把视口切换为自上而下的视图。 |\n| **Ctrl+Shift+P** | Look Through（透过查看） | 透过所选摄像机查看。 |\n| **Tab** | Quick Wheel | 见下文。 |\n| **Esc** | 结束当前工具 | 结束放置工具。取消 Edit Toolbar 模式。其他情况下交给虚幻引擎的 Unselect All。 |\n\n> **注意：** 按住 **T**、**L**、**S** 或 **A** 时的点击会按引擎的常规方式处理，因此虚幻引擎自带的视口快捷键仍然有效。\n\n### Quick Wheel\n\nQuick Wheel 是在光标处打开的环形菜单。\n\n1. 在未选中任何对象时，把光标悬停在关卡视口上。\n2. 按住 **Tab**。\n3. 朝某个扇区轻划。\n4. 松开 **Tab** 执行。\n\n- **轻点**而不是按住：轮盘保持打开，直到你点击。\n- 再按一次 **Tab** 或按 **Esc** 可关闭。\n- 它在 Planner 中同样有效。那里排除了 **Alt+Tab**，因此 Windows 切换窗口仍然可用。\n\n---\n\n## Planner\n\n### 工具\n\n| 按键 | 工具 |\n|---|---|\n| **Q** | Select |\n| **M** | Mark |\n| **C** | Camera |\n| **L** | Light |\n| **P** | Prop |\n| **U** | Measure |\n| **W** | Path（即 Move 工具） |\n\n### 视图\n\n| 按键 | 操作 |\n|---|---|\n| **F** | 框选全部 |\n| **O** | 切换俯视图 |\n| **Space + drag** | 平移 |\n| **Middle or right mouse drag** | 平移 |\n| **Mouse wheel** | 缩放 |\n| **Double-click the compass** | 重置视图 |\n\n### 编辑\n\n| 按键 | 操作 |\n|---|---|\n| **E** | 为下一次拖动预备旋转 |\n| **H** | 隐藏所选内容（虚幻引擎的 Hide） |\n| **K** | 在光标处打开 Key To Mark 选择器 |\n| **F2** | 重命名唯一选中的项目 |\n| **删除**（Delete） or **Backspace** | 删除所选内容。对选中的边界点，则移除该点。 |\n| **Enter** | 结束自由路径 |\n| **Esc** | 放弃草稿、取消拖动，然后逐级清除选择 |\n| **Ctrl+D** | 复制并粘贴（Duplicate） |\n| **Ctrl+A** | 全选平面图上的内容 |\n| **Ctrl+C** | 复制 |\n| **Ctrl+X** | 剪切 |\n| **Ctrl+V** | 粘贴到悬停位置 |\n| **Ctrl+Z** | 撤销 |\n| **Ctrl+Shift+Z** or **Ctrl+Y** | 重做 |\n| **Ctrl+S** | 保存当前显示舞台的 Draft |\n| **Ctrl+Shift+P** | Look Through |\n\n> **注意：** 撤销只在 Planner 是活动窗口时，对全新的按键触发。\n\n### 鼠标与修饰键\n\n| 操作 | 结果 |\n|---|---|\n| **Shift**-click | 添加到选择 |\n| **Ctrl**-click | 在选择中切换 |\n| 放置或拖动时按住 **Alt** | 关闭对齐 |\n| 在边界曲线上双击（Select 工具） | 添加一个边界点 |\n\n---\n\n## 其他面板\n\n| 位置 | 按键 | 操作 |\n|---|---|---|\n| Setups 选项卡 | **F2** | 重命名布局 |\n| Setups 选项卡 | **删除** | 删除布局 |\n| Framemark 面板 | **Shift**-click **构建序列**（Build Sequence） | 即使已开启 Don't Ask Again，也会打开它的对话框 |\n| 关卡视口 | **Shift**-click 叠放的标记 | 回到叠放层的上一级 |\n\n---\n\n## 更改按键\n\n视口命令是虚幻引擎命令。请在 **Edit > Editor Preferences > General > Keyboard Shortcuts** 下重新绑定，然后搜索 **Framemark**。\n\n> **警告：** Planner 按键以及 Quick Wheel 的 **Tab** 由 Framemark 自己处理，无法重新绑定。\n\n---\n\n## 另请参阅\n\n- [Framemark 模式界面](02_interface.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [Planner（规划器）](07_planner.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "14_troubleshooting.md", "slug": "troubleshooting", "title": "故障排除与已知限制", "md": "# 故障排除与已知限制\n\n本页列出你最可能遇到的问题、Framemark 显示的确切消息，以及每种情况的处理方法。末尾是已知限制。请在表格中找到你的症状，或搜索消息文本。\n\n## 快速修复\n\n| 症状 | 原因 | 修复 |\n|---|---|---|\n| **Tab**、**M** 或 **K** 没有反应 | Framemark 模式已关闭 | 在 **Modes**（模式）面板中开启 Framemark 模式。 |\n| 某个功能被置灰，并显示“Needs the ... plugin” | 某个配套插件未启用 | **Edit > Plugins**，启用所提示的桥接插件，然后重启。参见[配套插件](12_integrations.md)。 |\n| 桥接插件不在 Plugins 列表中 | 它没有被构建 | 构建脚本会跳过缺少引擎插件的桥接插件，并记录原因。安装那个引擎插件，然后重新构建。 |\n| 运行时没有任何东西被绑定 | Actor 不在序列中，或缺少绑定 | 打开该舞台的关卡序列并检查绑定。参见[序列与绑定](06_sequences.md)。 |\n| Snap To Ground 找不到地面 | 项目下方没有碰撞 | 添加带碰撞的地面，或把项目移到地面上方。消息为“No floor found underneath.” |\n| 标记无法拖动 | 只有在其舞台被选中时标记才可点击，或者该标记已锁定 | 先选择舞台。检查锁定状态。 |\n| Camera Preset 什么也没生成 | 舞台没有标记，或没有列出任何镜头景别 | 添加标记，并至少勾选一个镜头景别。 |\n| Generate 漏掉了某个 Actor | 该 Actor 已在舞台上，或由其关卡序列承载 | 检查舞台的附着对象和序列。 |\n| 某个摄像机或灯光不见了 | 它被隐藏了 | 隐藏是针对每个舞台的，持续到编辑器关闭。从舞台中取消隐藏。 |\n| Export Plan 已保存但没有打开任何东西 | 文件已保存，但没有查看器打开它 | 从提示中显示的文件夹打开保存的文件。 |\n| 右键点击提示“Select a Cine Stage first.” | 没有选中舞台 | 选择舞台，然后再次右键点击。 |\n| 出现边界警告提示 | 你正在边界内进行编辑 | 在 **Editor Preferences > Framemark > General** 中关闭 **Warn When Editing Inside Boundary**。 |\n| Key To Mark 要求打开 Sequencer | 没有打开任何序列 | 用 **打开序列**（Open Sequence）打开该舞台的序列，然后停放播放头。 |\n\n---\n\n## 编辑器消息\n\n消息按显示它们的任务分组。消息本身是 Framemark 显示的原文，保持英文，方便你搜索。\n\n### Stage and Marks\n\n| 消息 | 处理方法 |\n|---|---|\n| Can't link an actor that is attached to the target. Use Detach From Stage first, or pick a different target. | 分离该 Actor，然后重新链接。 |\n| Select one or more actors first. | 在大纲视图或视口中选择 Actor。 |\n| Select a stage camera first. | 选择属于某个舞台的摄像机。 |\n| Select two or more objects, the target last. | 选择要链接的对象，最后选择目标。 |\n| Nothing linked on the selection. Actors attached to the stage move with it: use Detach From Stage. | 所选内容是附着的，而不是链接的。使用 **从舞台分离**（Detach From Stage）。 |\n| Select marks, cameras or lights on the stage first. | 选择属于该舞台的项目。 |\n| Nothing was attached. The actors may already be on the stage, or they are in its Level Sequence, which carries them with the stage instead. | 无需操作。 |\n| Select a mark that has other marks on the same spot. | 选择堆叠标记中的一个。 |\n| No other mark sits under this one. | 该标记没有被堆叠。 |\n| Nothing was moved. It may be locked, or not directly on the stage. | 解锁它，或在它自己的舞台中移动它。 |\n| Those marks are locked. / That mark is locked. | 解锁该标记。 |\n| Select exactly one actor to put on a mark. | 选择一个 Actor。 |\n| Select the actors to key first. | 选择 Actor，然后打关键帧。 |\n| Select a Cine Stage first. | 选择一个舞台。 |\n| Could not make the Stage Asset. / Could not place that Stage Asset here. | 检查目标文件夹，以及关卡是否可写。 |\n| Could not duplicate those marks. | 检查标记是否未被锁定。 |\n\n### Key To Mark and Sequence Links\n\n| 消息 | 处理方法 |\n|---|---|\n| Open the stage's sequence in Sequencer first (Open Sequence), then move the playhead to where the actor should reach the mark. | 照着做即可。 |\n| That sequence or track is locked, so no key was added. | 解锁该序列或轨道。 |\n| Could not add a key. Check the actor can be bound in this sequence. | 检查绑定。 |\n| The stage's sequence is locked, so nothing was keyed. | 解锁该序列。 |\n| Nothing keyed. None of this stage's marks have a track with a position at the end of {0}. | 添加一条标记轨道，并在该帧上有一个关键帧。 |\n| Open the master sequence in Sequencer and park the playhead inside a shot first. | 适用于 **匹配上一个**（Match Previous）和 **匹配下一个**（Match Next）。 |\n| Open the master sequence in Sequencer first. | 适用于 **检查连续性**（Check Continuity）。 |\n| Nothing matched. None of this shot's marks have a track with a position in {0}. | 该镜头没有可供匹配的标记关键帧。 |\n| No other linked sequence could be loaded to take over, so nothing was removed. | 检查其他序列是否存在并可加载。 |\n| {0} sequences have their marked frames locked. Their dialogue markers were left alone. | 解锁已标记的帧才能更改它们。 |\n\n### Sequence Building\n\n| 消息 | 处理方法 |\n|---|---|\n| Nothing was made. Check the stage has marks and at least one shot scale listed. | 添加标记和镜头景别。 |\n| No active level viewport to copy from. | 先点击进入某个关卡视口。 |\n| Could not create the Level Sequence asset. Check the Sequence Folder on the stage. | 选择一个有效且可写的文件夹。 |\n| No mark transform tracks needed to move. | 无需操作。 |\n\n### Planner\n\n| 消息 | 处理方法 |\n|---|---|\n| A boundary needs at least 3 points. | 添加第三个点。 |\n| A path needs an end: click a mark or a second point. | 完成该路径。 |\n| Select a camera first, then pick the mark it should look at. | 选择一个摄像机，然后选取它应该朝向的标记。 |\n| No stage to show. Place a stage in the level, or pick one from the scene tabs. | 放置一个舞台，或选取一个选项卡。 |\n| That is locked. Unlock it to move it. / Those are locked. Unlock them to delete. | 解锁这些项目。 |\n| No {0} preset. Add one in Editor Preferences > Framemark > Lights. | 在 **灯光**（Lights）页面添加该预设。 |\n| No cameras yet. Press C, then click the plan to place one. Each camera is a shot. | 照着做即可。 |\n| The capture needs the editor to be rendering. Nothing was changed. | 把编辑器窗口带到前台，并让它保持渲染。 |\n| The top-down render needs the editor to be rendering, so the plan has no background picture. | 同上。 |\n| Could not make a render target ... / Could not compress the PNG. | 重试。检查可用内存和磁盘空间。 |\n| Could not import that picture. Check that the file opens in an image viewer. | 使用能正常打开的 PNG 或 JPG。 |\n\n### Import and Export\n\n| 消息 | 处理方法 |\n|---|---|\n| Could not write that file. / Could not read that file. | 检查路径，以及文件是否正在其他地方被打开。 |\n| {0} row(s) need a pick under Mapping. | 在 **映射**（Mapping）中为每一行选取目标。 |\n| Choose a stage under Select Stage, or tick Create New Stage. | 二选一。 |\n| Could not read that Shot Designer scene. | 检查该文件是否为 Shot Designer 导出文件。 |\n| Could not make the folder {0}. | 检查权限。 |\n| Could not write {0}: {1} / Could not read {0}: {1} | 阅读 {1} 中给出的原因。 |\n| Could not check out {0}. {1} | 检查你的源码管理连接。 |\n| {0} is read-only. | 清除只读标志，或把它签出。 |\n| Could not write {0}. / Could not open {0}. (USD) | 检查路径，以及 USD Bridge 是否已开启。 |\n| {0} has no Framemark stage prim. | 该文件不是由 Framemark 生成的，或舞台 prim 已被移除。 |\n\n### Screenplay Import\n\n| 消息 | 处理方法 |\n|---|---|\n| This is not an articy:draft X export. In articy:draft, export for Unreal and pick the .articyue file. | 从 articy 重新导出。 |\n| This articy:draft export has no dialogues. Check the export rule set includes the packages with your dialogues. | 编辑导出规则集。 |\n| Pick a Fountain (.fountain), Final Draft (.fdx) or plain text (.txt) screenplay, an ink story (.ink) or an articy:draft X export (.articyue). | 选取受支持的文件。 |\n| This scene has no stage yet. Select it and press Generate. | 生成舞台。 |\n| No scenes to generate. Pick scenes in the Screenplay view, or tick them in the Generate dialog. | 选取场景。 |\n\n### Write-Back Refusals\n\nFramemark 宁可拒绝写回源文件，也不会覆盖你的工作。\n\n| 消息 | 处理方法 |\n|---|---|\n| This screenplay was imported before lines were linked to the file. Re-import it once. | 重新导入。 |\n| It changed on disk since the last import. Re-import it, then save again. | 重新导入，然后再保存。 |\n| It is checked out or locked by {0} in {1}. | 等待锁定解除。 |\n| There is a newer version in {0}. Get latest, re-import, then save again. | 同步、重新导入、保存。 |\n| The file is read-only. | 清除标志，或签出。 |\n| {0} is not connected, so its lock on the file can't be checked. | 重新连接源码管理。 |\n| {0} was not written back: {1} | 阅读其中给出的原因。 |\n| The export changed since the last import. Re-import it, then save again. (articy) | 重新导入。 |\n| articy already has the last changes from Framemark. Export for Unreal in articy, re-import, then save again. | 应用、导出、重新导入。 |\n| This screenplay was imported before lines were linked to articy. Re-import it once. | 重新导入。 |\n\n### Other\n\n| 消息 | 处理方法 |\n|---|---|\n| Couldn't find {0} in the Framemark plugin folder or the folder above it. | 检查插件安装是否完整。 |\n| Open ... Editor Preferences are not available right now. | 手动打开 **Edit > Editor Preferences**。 |\n| Could not rename setup. Choose a name that is not empty and not already used. | 选择一个唯一的名称。 |\n\n---\n\n## 渲染与发布问题\n\n| 症状 | 原因与修复 |\n|---|---|\n| Blender 导入后没有 Boundary | Blender 的 FBX 导入器不读取曲线，因此 Boundary 会作为空物体出现。在 Blender 中请使用 USD。 |\n| Write Back On Save 被拒绝 | 文件在虚幻引擎之外被更改，或版本控制把它锁定了。重新导入，或释放锁定。 |\n| 渲染没有覆盖任何东西，而且你找不到它 | 渲染从不覆盖。它们会带着新的版本号存放到 `Saved/MovieRenders/<sequence>/<date>`。 |\n| 英国广播文件交付失败 | CS_UK_Broadcast 只涵盖画面。响度、MXF 封装和时间码是虚幻引擎之外的一个步骤。 |\n| 上传到 Frame.io、SyncSketch、ShotGrid、ftrack 或 Kitsu 没有任何反应 | 上传在虚幻引擎之外运行。打开清单旁边的 `.log`：它会按平台标明 `OK` 或 `FAILED`。密钥放在 `publish.json` 的环境变量中，例如 `\"env:FRAMEIO_TOKEN\"`。 |\n| 渲染钩子没有运行 | 在 **Project Settings > Plugins > Python > Startup Scripts** 下添加 `Docs/Samples/Render/framemark_render_hooks.py`，然后重启。 |\n\n参见[渲染与发布](10_render-and-publish.md)。\n\n---\n\n## 已知限制\n\n- **标记**只有在其舞台被选中时才可点击。\n- **Ghosting** 会让项目变暗，但不会让它变透明。\n- **隐藏摄像机和灯光**是针对每个舞台的，持续到编辑器关闭。\n- **Shot Designer 导入**只对一个场景核对过。\n- **跟踪布局组**（Tracked Setups）不会为摄像机的轨道位置打关键帧。\n- **导入的舞台**只按完全相同的标签重新连接 Actor。\n- **摄像机和灯光随时间的移动**、在 DCC 中移动的舞台，以及边界的更改，都不会通过 USD 或 FBX 重新导入带回。\n- **FBX** 在 Blender 中会丢失 Boundary。\n- **ink** 的 `INCLUDE` 文件不会被读取。\n- **英国广播**交付需要在虚幻引擎之外增加响度、MXF 和时间码步骤。\n\n---\n\n## 另请参阅\n\n- [Framemark 概览](index.md)\n- [入门](01_getting-started.md)\n- [配套插件](12_integrations.md)\n- [键盘快捷键参考](13_shortcuts.md)\n- [设置与命名参考](11_settings-reference.md)\n"}, {"file": "15_case-study.md", "slug": "case-study", "title": "案例：灯室", "md": "# 案例：灯室\n\n本章用 Framemark 把一个场景从剧本做到渲染好的预演。你会在 **规划器**（Planner）中规划，搭好舞台，为两个角色走位，拍摄十二个镜头，建立关卡序列，并导出平面图。每一步用到的功能在本手册的其他章节都有介绍，所以每一节都链接到有完整说明的章节。\n\n![The Lamp Room stage, orbiting the set with the ceiling hidden](media/fm_stage_orbit.gif)\n*完成的 `STG_LampRoom` 舞台：灰盒布景、站在标记上的三个角色、九台镜头摄像机和舞台边界。*\n\n场景：一个夜晚，风暴袭击灯塔。**Wick** 是一名被吹离航线的风筝手，他从灯室的窗户爬进来，寻找被撕破的风筝。灯塔看守人的女儿 **Mara** 在铺位上醒来，替他把风筝补好。她的弟弟 **Tam** 被一阵风卷起。父亲的脚步声沿楼梯传来时，三个人骑着风筝从窗户飞走。\n\n## 前提条件\n\n- 已启用 Framemark。参见 [Framemark 入门](01_getting-started.md)。\n- **Manny** 和 **Quinn** 人体模型（每个新的 Third Person 项目都带有），或者你自己的角色。\n- 一套布景。本案例使用 Fab 上的免费资产，列在 [资产](#assets) 中。任何带窗户的房间都可以。\n- 镜头清单文件 `case-study/lamp_room__Interior.csv`（SH0010 到 SH0110）和 `case-study/lamp_room__Gallery.csv`（SH0120）。每个舞台一个文件。\n\n## 资产\n\n| 需求 | Fab 商品页 | 备注 |\n|---|---|---|\n| 灯塔外景 | [Octagonal Timber Lighthouse Tower](https://www.fab.com/listings/0d3fe088-3cb7-4627-af79-b3c0837c5a6c) | 免费。用于外景舞台的塔身。 |\n| 灯塔外景（备选） | [Lighthouse Stylized Low-Poly](https://www.fab.com/listings/a45bc324-53a9-4dbb-b60f-ab0613059bbc) | 免费。更轻量，风格化。 |\n| 室内陈设 | [Interiors FREE - Cozy Cartoon Pack](https://www.fab.com/listings/ef194997-eb8c-4fc0-9d11-dad28d00eaa2) | 免费。铺位、箱子、椅子、架子。 |\n| 室内外壳 | [Medieval Room Kit](https://www.fab.com/listings/52610433-0210-40e5-884b-abc12cf8901e) | 免费。木墙和一扇窗。 |\n| 实景光源 | [Old Candle Holder](https://www.fab.com/listings/ece21955-ffb9-4c32-abfe-0f7e8d6a77a6) | 免费，Quixel Megascans。 |\n\n> **注意：** 把每个商品加入你的库之前，请先在 Fab 上查看它的许可协议。\n\n## 剧本和镜头清单\n\n这个场景有十二个镜头，分布在两个舞台上：`STG_LampRoom`（室内）和 `STG_Gallery`（窗外的天空）。单位是厘米。原点是灯室地板的中心；**+X** 指向窗户。\n\n**180 度线：** 房间的轴线从楼梯（-X）通向窗户（+X）。在双人镜头（SH0050）中，这条线从梯顶（标记 4）连到 Mara 的铺位（标记 3），摄像机在房间一侧。\n\n| 镜头 | 秒 | 景别 | 角度 | 焦距 | 描述 |\n|---|---|---|---|---|---|\n| SH0010 | 10 | 全景 | 低角度 | 24 | 主镜头。雨打在玻璃上。Wick 蹲在窗台上，轻轻推开窗户，溜了进来。摄像机沿右侧墙壁跟着他摇动。 |\n| SH0020 | 8 | 全景 | 高角度 | 18 | 固定的高位全景，在同一构图内跳切：Wick 在铺位下、在油布雨衣后、爬上梯子。 |\n| SH0030 | 10 | 中景 | 高角度 | 35 | 他找到了风筝，帆被撕破了。他瘫坐在地上。摄像机升起：这是第一次从高处拍他。 |\n| SH0040 | 5 | 特写 | 低角度 | 85 | 从他的视线高度看去，Mara 在画面边缘的铺位上坐起来。Mara：\"Who's there?\"（谁在那儿？） |\n| SH0050 | 14 | 中全景 | 平视 | 35 | 双人镜头。Wick 一跃跳上梯顶，那是房间里的最高点，并做了自我介绍。Mara 留在画面右侧。 |\n| SH0060 | 4 | 插入镜头 | 平视 | 85 | Ember 是 Wick 的发条灯笼鸟，它正在灯架上梳理羽毛。 |\n| SH0070 | 12 | 中景 | 低角度 | 35 | Mara 跪在窗边座位上缝补风帆。Wick 把画面稳稳扶住。 |\n| SH0080 | 6 | 中景 | 低角度 | 28 | 风筝补好了。Wick 跳上窗边座位，双手叉腰，大声欢呼。 |\n| SH0090 | 3 | 插入镜头 | 高角度 | 85 | 他伸出手。她把黄铜指南针放进他手里。 |\n| SH0100 | 14 | 中全景 | 高角度 | 18 | 一阵风冲开了窗户。被吵醒的 Tam 倒着翻滚，从灯旁掠过。摄像机逆着旋转方向环绕。 |\n| SH0110 | 6 | 特写 | 平视 | 50 | 楼梯上传来脚步声。Mara 指向门，又看向 Wick。 |\n| SH0120 | 20 | 全景 | 平视 | 24 | `STG_Gallery`。风筝下一串手拉着手：Wick、Mara、Tam。飞过灯塔的光束，从左到右。 |\n\n> **注意：** 本章的渲染图涵盖 `STG_LampRoom` 上有角色的九个镜头。两个插入镜头（SH0060、SH0090）需要道具，SH0120 需要 `STG_Gallery` 舞台，所以没有展示。\n\n### 标记\n\n| Mark Order（标记序号） | 名称 | x, y, z | 备注 |\n|---|---|---|---|\n| 1 | mrk_Window | 370, 0, 70 | 窗边座位。Wick 进入、缝补和离开的位置。 |\n| 2 | mrk_Floor | 120, -40, 0 | 地板中央。Wick 第一次站到地面高度。 |\n| 3 | mrk_Bunk | 250, 250, 55 | Mara 在铺位上坐起来。 |\n| 4 | mrk_LadderTop | 250, 110, 110 | 灯室梯子的顶端：Wick 的落脚处。 |\n| 5 | mrk_Mend | 320, 40, 0 | Mara 跪下缝补风帆。 |\n| 6 | mrk_Door | -320, -260, 0 | 楼梯门。 |\n| 7 | mrk_Float | 200, 60, 170 | Tam 被风卷起。 |\n| 1 | mrk_Out | 700, 0, 300 | 在 `STG_Gallery` 上：就在窗外。每个舞台各自给自己的标记编号。 |\n\n### 姿势\n\n每个节拍让角色保持一个 Control Rig 姿势。在 **标记表**（Marks Table）中为标记设置姿势，参见 [标记与走位](04_marks-and-blocking.md)。\n\n| 节拍 | 角色 | 姿势 |\n|---|---|---|\n| SH0010，在窗台上 | Wick | 蹲伏 |\n| SH0030，被撕破的风筝 | Wick | 坐在地上，膝盖收起，脸埋在前臂里 |\n| SH0040 | Mara | 坐起，重心向后压在一只手上 |\n| SH0050 | Wick | 栖在梯顶，一只手扶着栏杆 |\n| SH0070 | Mara | 跪姿，持针的手举起 |\n| SH0080 | Wick | 双手叉腰，挺胸，头向后仰 |\n| SH0090 | Wick | 手伸出，掌心向上 |\n| SH0100 | Tam | 倒立，双臂张开 |\n| SH0110 | Mara | 手臂笔直指向门，头转向 Wick |\n| SH0120 | Wick、Mara | 飞行链：领头和居中 |\n\n> **注意：** 下面的渲染图让每个角色都保持待机姿势，这样在做任何姿势工作之前就能看清构图。\n\n## 1. 规划房间\n\n![The Planner with the Lamp Room stage](media/fm_planner.png)\n*Planner 中的灯室：边界、标记 1 到 7，以及每台镜头摄像机和它的焦距。*\n\n1. 打开 **Window > Framemark > Framemark Planner**。\n2. 用边界工具画出房间的占地轮廓，并把窗户、梯子和铺位设置为背景形状。参见 [Planner（规划器）](07_planner.md)。\n3. 按上面的表格放置标记 1 到 7。\n4. 从标记 1 到标记 2 沿右侧墙壁拖出一条路径：这是 SH0010 中 Wick 的路线。\n\n## 2. 搭建舞台\n\n1. 用 Fab 的布景布置关卡。\n2. 在 **舞台**（Stage）页面上，在房间上方放置一个舞台，并命名为 `STG_LampRoom`。参见 [舞台和 Stage Asset](03_stages.md)。\n3. 把边界调整到与墙壁一致。\n4. 在窗外再放置第二个舞台 `STG_Gallery`，用于 SH0120。\n\n![The STG_LampRoom stage seen from above the set](media/fm_stage_overview.jpg)\n*关卡视口（Level Viewport）中的 `STG_LampRoom`。黄色人形是标记替身；橙色线是舞台边界。*\n\n![The Details panel with the stage selected](media/fm_stage_details.png)\n*选中舞台后，可以在 **细节**（Details）面板中看到它的 **舞台工具**（Stage Tools）行、它的关卡序列和它的 Stage Asset。*\n\n> **提示：** 把每个舞台保存为 Stage Asset。如果布景移动了，移动舞台和标记，摄像机和序列会跟着一起移动。\n\n## 3. 为角色走位\n\n![The Marks Table for the Lamp Room](media/fm_marks_table.png)\n*在 **标记表** 中，Wick 在标记 1，Mara 在标记 3，Tam 在标记 7。*\n\n1. 在 **Block**（走位）页面上，把 Wick 和 Mara 安排到各自的标记上。Tam 是标记 7 上的第二个预览角色。\n2. 用 **为标记设关键帧**（Key To Mark，**K**）为每个节拍把每个角色键入到标记上。\n3. 为每个节拍保存一个 **布局组**（Setup）：`Entry`、`Mend`、`Gust`、`Exit`。参见 [标记与走位](04_marks-and-blocking.md)。\n\n![The four Lamp Room setups](media/fm_setups.png)\n*四个布局组，每个保存一个节拍的标记、演员和摄像机。*\n\n## 4. 拍摄镜头清单\n\n1. 在 **Share**（分享）页面上，点击 **导入**（Import），选择 **镜头列表**（Shot List），然后选取 `lamp_room__Interior.csv`。\n2. 把 **舞台** 选择器设为 `STG_LampRoom`，并检查 **列映射**（Column Mapping）预览。\n3. 点击 **导入**。Framemark 为每个镜头放置一个过场动画摄像机Actor，并带上它的景别和焦距。在 `STG_Gallery` 上用 `lamp_room__Gallery.csv` 重复一次。\n4. 对每台摄像机，在关卡视口中导航到它来取景，然后在 **Shoot**（拍摄）页面上按 **设为视口视角**（Set To Viewport）。参见 [摄像机与灯光](05_cameras-and-lights.md)。\n5. 放置风暴光：一盏穿过窗户的冷色主光，以及作为暖色实景光源的蜡烛。\n\n![Contact sheet of the nine rendered shots](media/fm_contact_sheet.jpg)\n*九个已取景的镜头，SH0010 到 SH0110，从左到右排列。*\n\n| | |\n|---|---|\n| ![SH0010, low wide master on the window](media/fm_SH0010.jpg) | ![SH0050, medium wide two-shot](media/fm_SH0050.jpg) |\n| **SH0010**，24 mm 低角度全景主镜头。窗户是主光。 | **SH0050**，35 mm 双人镜头。Wick 在画面左侧，Mara 在画面右侧，摄像机在 180 度线的房间一侧。 |\n| ![SH0040, close up on Mara](media/fm_SH0040.jpg) | ![SH0100, high medium wide on Tam](media/fm_SH0100.jpg) |\n| **SH0040**，85 mm 特写，从 Wick 的视线高度拍摄。 | **SH0100**，18 mm 高角度中全景，拍风中的 Tam。 |\n\n## 5. 建立序列\n\n1. 在 **序列**（Sequence）页面上，按 **构建序列**（Build Sequence）。\n2. 在对话框中保留全部十二个镜头，按 **构建序列**。Framemark 会创建关卡序列、镜头轨道和镜头切换轨道，并绑定角色。\n3. 拖动时间轴查看 SH0100，并在 Tam 的标记上调整他的漂浮。参见 [序列与绑定](06_sequences.md)。\n\n![Sequencer with the built Camera Cuts track](media/fm_sequencer.png)\n*建立好的 `LS_STG_LampRoom` 序列。**Camera Cuts**（镜头切换）轨道为每个镜头保存一个分段；每个角色和标记都有自己的绑定。这个序列来自舞台的 **构建 / 更新序列**（Build / Update Sequence）操作，该操作只生成 Camera Cuts 轨道；**构建序列** 对话框还会添加镜头轨道。*\n\n![Scrubbing the built sequence with the viewport locked to Camera Cuts](media/fm_sequencer_playback.gif)\n*在视口锁定到 Camera Cuts 的状态下拖动时间轴，观看镜头切换。*\n\n## 6. 分享与渲染\n\n1. 在 Planner 中，用 **导出平面图**（Export Plan）生成一张包含每个标记、摄像机和路径的平面图。\n2. 用 Movie Render Graph 模板渲染序列。参见 [渲染与发布](10_render-and-publish.md)。\n\n## 另请参阅\n\n- [Framemark 入门](01_getting-started.md)\n- [Planner（规划器）](07_planner.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [导入、导出与分享](09_import-export.md)\n"}];
const byFile = Object.fromEntries(PAGES.map(p => [p.file, p]));
const navEl = document.getElementById('nav'), doc = document.getElementById('doc'), toc = document.getElementById('toc');
const q = document.getElementById('q'), rail = document.getElementById('rail'), menuBtn = document.getElementById('menuBtn');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idOf = t => t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');

PAGES.forEach((p, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${p.slug}"><span class="n">${i === 0 ? '' : String(i).padStart(2,'0')}</span><span>${esc(p.title)}</span></a>`;
  navEl.appendChild(li);
});

function render(slug, anchor){
  const i = Math.max(0, PAGES.findIndex(p => p.slug === slug));
  const p = PAGES[i];
  doc.innerHTML = `<div class="crumb">${i === 0 ? 'Framemark 手册' : '第 ' + String(i).padStart(2,'0') + ' 章'}</div>` + marked.parse(p.md);
  // Cross-page links: 03_stages.md#x -> #stages
  doc.querySelectorAll('a[href]').forEach(a => {
    const m = a.getAttribute('href').match(/^([\w-]+\.md)(#.*)?$/);
    if (m && byFile[m[1]]) a.setAttribute('href', '#' + byFile[m[1]].slug);
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  doc.querySelectorAll('blockquote').forEach(b => {
    const s = (b.textContent || '').trim().toLowerCase();
    if ((s.startsWith('tip') || s.startsWith('提示'))) b.classList.add('tip'); else if ((s.startsWith('warning') || s.startsWith('警告'))) b.classList.add('warn');
  });
  const heads = [...doc.querySelectorAll('h2')];
  heads.forEach(h => h.id = 'sec-' + idOf(h.textContent));
  toc.innerHTML = heads.map(h => `<a href="#${p.slug}" data-sec="${h.id}">${esc(h.textContent)}</a>`).join('');
  const prev = PAGES[i-1], next = PAGES[i+1];
  doc.insertAdjacentHTML('beforeend', `<nav class="pager" aria-label="Chapter navigation">${prev ? `<a href="#${prev.slug}"><small>上一章</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#${next.slug}"><small>下一章</small>${esc(next.title)}</a>` : ''}</nav>`);
  navEl.querySelectorAll('a').forEach((a, k) => k === i ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = (i === 0 ? '' : p.title + ' · ') + 'Framemark 手册';
  window.scrollTo(0, 0);
}
toc.addEventListener('click', e => {
  const a = e.target.closest('a[data-sec]'); if (!a) return;
  e.preventDefault(); document.getElementById(a.dataset.sec)?.scrollIntoView({behavior:'smooth'});
});

function search(term){
  const t = term.trim().toLowerCase();
  if (t.length < 2) { route(); return; }
  const hits = [];
  PAGES.forEach(p => {
    p.md.split('\n').forEach(line => {
      if (hits.length < 60 && line.toLowerCase().includes(t)) {
        const clean = line.replace(/[#*`>|]/g,' ').replace(/\s+/g,' ').trim();
        if (clean) hits.push({p, clean});
      }
    });
  });
  const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  doc.innerHTML = `<div class="crumb">搜索</div><h1>${hits.length ? hits.length + (hits.length === 60 ? '+' : '') + ' 个匹配结果' : '无匹配结果'}：“${esc(term)}”</h1>` +
    (hits.length ? '<ul class="results">' + hits.map(h => `<li><a href="#${h.p.slug}"><strong>${esc(h.p.title)}</strong></a><br>${esc(h.clean).replace(re, m => `<mark>${m}</mark>`)}</li>`).join('') + '</ul>'
                 : '<p>试试菜单标签，例如 <strong>Set To Viewport</strong> 或 <strong>Mark Order</strong>.</p>');
  toc.innerHTML = '';
}
let timer; q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(q.value), 150); });

function route(){ render(location.hash.slice(1) || 'overview'); }
window.addEventListener('hashchange', () => { q.value = ''; rail.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); route(); });
menuBtn.addEventListener('click', () => { const o = rail.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
route();
</script>
