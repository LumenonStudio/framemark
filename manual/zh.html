/* Layout: reference manual. Fixed chapter rail on the left, one chapter per view, an "On this page" list on wide screens. Slate neutrals, Framemark amber as the one accent. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --note:#8fbbe8; --note-bg:#1a2633; --warn:#f0a07c; --warn-bg:#36211a; --tip:#8fd19e; --tip-bg:#1a2c1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1c2026; --fg:#e4e6e9; --muted:#9aa2ac; --line:#2e343b;
  --accent:#f2a33a; --accent-soft:#33260f; --code-bg:#252a31;
  --note:#8fbbe8; --note-bg:#1a2633; --warn:#f0a07c; --warn-bg:#36211a; --tip:#8fd19e; --tip-bg:#1a2c1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--body);margin:0}
a{color:var(--accent)} a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--fg)}

.brand span{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

article blockquote p{margin:4px 0}

<script>
const PAGES = [{"file": "index.md", "slug": "overview", "title": "Framemark 概览", "md": "# Framemark 概览\n\n**Framemark** 是虚幻引擎 5.8 的编辑器插件，把平面图、走位和镜头布局带进关卡编辑器。你在关卡中放置一个**舞台**（stage）Actor。舞台用边界圈出表演区域，保存每个角色站立的**标记**（mark），拥有你放置的摄像机和灯光，并拥有这个场景的**关卡序列**。移动舞台，整个场景随之移动。\n\n俯视图和平面图在实拍、CG 和游戏制作中都是标准做法，但它们通常放在与拍摄镜头不同的工具里。Framemark 把它们放进虚幻引擎，紧挨着 Sequencer，所以平面图和镜头用的是同一份数据。\n\nFramemark 适用于第三人称的取景对话，也适用于第一人称场景。你用舞台的 **View Mode**（视图模式）来选择。\n\n## 前提条件\n\n- 虚幻引擎 **5.8**。\n- 在 **Edit > Plugins > Cinematics** 中启用 **Framemark** 插件。\n- 可选的配套插件，用于额外功能。见[配套插件](12_integrations.md)。\n\n## 核心概念\n\n| 概念 | 说明 |\n|---|---|\n| **舞台**（Stage） | 即 `Cine Stage` Actor。场景的根：边界、标记、摄像机、灯光、道具和关卡序列都是它的成员，所以移动舞台就是移动场景。 |\n| **Stage Asset** | 以资产形式保存在**内容浏览器**中的舞台。放置的舞台指向它的 Stage Asset 并与之保持同步，所以同一个场景可以放进多个关卡。 |\n| **标记**（Mark） | 角色在地面上的位置，带朝向。**标记顺序**（Mark Order）决定谁排第一，标记 1 是主角。 |\n| **布局组**（Setup） | 为某个节拍或镜头保存的一组标记、摄像机和灯光的排布，可以来回切换。 |\n| **规划器**（Planner） | 舞台的 2D 俯视编辑器（**Window > Framemark > Framemark Planner**）。与 **俯视图**（Overhead View）不同，后者是关卡视口的俯视切换开关。 |\n| **剧本**（Screenplay） | 场景的对白和动作，从文件导入或手动输入，并与标记、镜头和序列关联。 |\n| **故事地图**（Story Map） | Screenplay 中各场景和分支的地图，按分组或按序列排布。 |\n\n## Framemark 工作流程\n\nFramemark 面板按顺序带你走完整个场景。每一页都有对应的章节。\n\n1. **平面图**（Plan）：在 [Planner](07_planner.md) 中俯视布置场景，或导入 [Screenplay](08_screenplay-and-story-map.md)。\n2. **舞台**：放置舞台并调整大小。见[舞台和 Stage Asset](03_stages.md)。\n3. **Block**（走位）：放置标记并安排角色。见[标记与走位](04_marks-and-blocking.md)。\n4. **Shoot**（拍摄）：放置摄像机和灯光。见[摄像机与灯光](05_cameras-and-lights.md)。\n5. **序列**（Sequence）：创建并编辑关卡序列。见[序列与绑定](06_sequences.md)。\n6. **Share**（共享）：导出平面图、表格、USD 和 FBX。见[导入、导出与分享](09_import-export.md)。\n\n面板中的每个按钮都是一步撤销。\n\n## 本节内容\n\n| 页面 | 内容 |\n|---|---|\n| [入门](01_getting-started.md) | 安装、启用，以及 60 秒创建你的第一个舞台。 |\n| [Framemark 模式界面](02_interface.md) | 面板、Home、各页面、工作区、工具栏、View 菜单、Quick Wheel 和右键菜单。 |\n| [舞台和 Stage Asset](03_stages.md) | 放置舞台、边界和胶片格式、Stage Asset、Library 以及舞台重新定位。 |\n| [标记与走位](04_marks-and-blocking.md) | 标记、Mark Order、布局方式、Setup、Marks Table、路径和 Key To Mark。 |\n| [摄像机与灯光](05_cameras-and-lights.md) | Shoot 页、Set To Viewport、第一人称和 Hybrid、灯光和灯光组。 |\n| [序列与绑定](06_sequences.md) | Sequence 页、镜头、绑定、多个玩家和连续性工具。 |\n| [Planner（规划器）](07_planner.md) | 2D Planner、它的工具、绘图规则、对齐和导出表格。 |\n| [剧本与故事地图](08_screenplay-and-story-map.md) | 导入和编辑 Screenplay、源更新、回写和 Story Map。 |\n| [导入、导出与分享](09_import-export.md) | Share 页、Shot Designer 导入、USD 和 FBX 往返。 |\n| [渲染与发布](10_render-and-publish.md) | Movie Render Graph 模板、音频、编码和审片上传。 |\n| [设置与命名参考](11_settings-reference.md) | 所有 Framemark 设置、配置文件和命名规则。 |\n| [配套插件](12_integrations.md) | CAT Bridge、Odyssey Bridge、FramemarkSLR、FramemarkUSD、articy 和 ink。 |\n| [键盘快捷键](13_shortcuts.md) | 所有 Framemark 快捷键。 |\n| [故障排除](14_troubleshooting.md) | 常见问题、提示信息和已知限制。 |\n| [案例：灯室](15_case-study.md) | 一个完整场景：规划、舞台、走位、拍摄、序列和渲染。 |\n"}, {"file": "01_getting-started.md", "slug": "getting-started", "title": "Framemark 入门", "md": "# Framemark 入门\n\nFramemark 是用于搭建过场动画的虚幻引擎 5.8 编辑器插件。一个 Actor，即 **Cine Stage**，用胶片条形的边界圈出关卡中的一块区域，保存每个角色站立的**标记**（mark），拥有你放置的摄像机和灯光，并拥有播放这个场景的**关卡序列**。移动舞台，整个场景随之移动。你可以在同一个地方完成场景走位、镜头取景和 Sequencer 时间轴的创建，无需手动连接轨道。\n\nFramemark 适用于第三人称的取景对话，也适用于第一人称。舞台上有一个叫 **View Mode**（视图模式）的属性，取值为 Framed、First Person 或 Hybrid，用来指定使用哪种。\n\n本页介绍如何安装插件、启用插件，以及放置你的第一个舞台、摄像机和序列。\n\n## 前提条件\n\n- 虚幻引擎 5.8，以及一个使用它的项目。\n- Framemark 插件源码文件夹，其中带有两个构建脚本：`Build_Framemark.bat` 和 `Install_To_Project.bat`。\n- 可选：配套插件 **Framemark CAT Bridge**、**Framemark Odyssey Bridge**、**Framemark Light Rig Bridge** 和 FramemarkUSD。没有它们 Framemark 也能工作。需要某个配套插件的功能会显示为灰色，其提示文字会写明要启用哪个插件。见[配套插件](12_integrations.md)。\n\n## 安装\n\n1. 双击 `Build_Framemark.bat`。它需要几分钟，日志写入 `BuildLog.txt`。它会构建 Framemark 及其小型桥接插件。如果引擎中没有安装某个桥接插件所需的引擎插件，该桥接插件会被跳过，日志中会注明。\n2. 关闭虚幻编辑器。\n3. 把你的 `.uproject` 文件拖到 `Install_To_Project.bat` 上。它会把构建出的内容安装到项目的 `Plugins` 文件夹中。\n\n> **注意：** 安装脚本需要编辑器处于关闭状态。如果你同时在多个会话中构建和安装，请把安装排入队列，不要手动运行，这样它会等到没有编辑器打开该项目时再执行。\n\n## 启用插件\n\n1. 打开项目。\n2. 选择 **Edit > Plugins**。\n3. 在 **Cinematics** 下，如果 **Framemark** 尚未勾选，请勾选它。\n4. 如果需要配套插件，同时勾选 **Framemark CAT Bridge**、**Framemark Odyssey Bridge** 或 **Framemark Light Rig Bridge**。\n5. 出现提示时重启编辑器。\n\n## 打开 Framemark 模式\n\nFramemark 是一个编辑器模式（Editor Mode）。在主工具栏上打开 **Mode switcher**（模式切换器），它在 Select、Landscape 和 Modeling 旁边，然后选择 **Framemark**。模式工具包会打开 **Framemark** 面板。要退出该模式，在模式切换器中选择 **选择**（Select）。\n\nFramemark 模式开启时，一条窄工具栏会浮在关卡视口上方，Framemark 的按键也会生效：**Tab** 打开 Quick Wheel，**M**、**C**、**L**、**P** 和 **K** 用于放置工具和 Key To Mark，**O** 用于 Overhead View。模式关闭时，这些按键保持虚幻引擎自身的含义。见[键盘快捷键参考](13_shortcuts.md)。\n\n如果关卡中还没有舞台，面板会显示 **主页**（Home）页。见 [Framemark 模式界面](02_interface.md)。\n\n## 60 秒创建你的第一个舞台\n\n1. 在模式切换器中选择 **Framemark**。\n2. 在 Home 页上，点击 **添加舞台**（Add Stage）。如果关卡中已经有舞台，请打开 **舞台**（Stage）页，在那里点击 **添加舞台**。舞台会出现在关卡视口所看的位置，落到地面上，并带有两个标记：一个 **玩家**（Player）和一个 **NPC**，彼此面对面。\n3. 在工具栏上选择 **放置摄像机**（Place Camera），然后在关卡视口中点击来放置摄像机。放置时摄像机会对准最近标记的视线方向。按 **Esc** 停止放置。\n4. 在关卡视口中飞行到你想要的取景位置。\n5. 选中摄像机，打开 **Shoot** 页，点击 **设为视口视角**（Set To Viewport）。摄像机一步就取得视口的位置、旋转和视野。\n6. 打开 **序列**（Sequence）页，点击 **构建序列**（Build Sequence）。第一次会弹出对话框，询问序列名称、舞台和镜头。在对话框中点击 **构建序列**。Framemark 会创建关卡序列并打开 Sequencer。\n7. 在关卡视口中按 **Tab** 打开 Quick Wheel。这就是这个工具的大部分内容。\n\n![关卡视口中的完整舞台：标记、摄像机和边界](media/fm_stage_overview.jpg)\n\n每个按钮都是一步撤销。\n\n> **提示：** Quick Wheel 是当前工作区工具在光标处围成的一圈。按住 **Tab**，朝某个工具轻划然后松开即可选中。或者轻按 **Tab**，再点击一个工具。\n\n## 不使用该模式\n\n你可以在普通编辑器中手动完成同样的流程：\n\n1. 打开 **Place Actors > Cinematic > Cine Stage**，把舞台拖进关卡。它会落到地面上，并带有一个 Player 标记和一个 NPC 标记。\n2. 在关卡视口中右键，选择 **Framemark > Place Mark Here**。标记出现在你点击的位置，朝向舞台中心。同一个菜单里还有 **在此放置摄像机**（Place Camera Here）和 **在此放置灯光**（Place Light Here）。\n3. 如果想让标记自动排布，选中舞台，在细节面板的 **舞台** 类别中选择一个 **Layout**（布局方式）。\n4. 飞行到某个取景位置，然后使用摄像机的 Stage Camera 组件上的 **Set To Current Viewport**。\n5. 使用舞台细节面板顶部的 **舞台工具**（Stage Tools）图标行：**构建序列** 和 **打开序列**（Open Sequence）在其 Sequence 组中。\n\n## 接下来做什么\n\n| 想做的事 | 阅读 |\n|---|---|\n| 了解面板、页面、工作区和菜单 | [Framemark 模式界面](02_interface.md) |\n| 放置、调整和保存舞台 | [舞台和 Stage Asset](03_stages.md) |\n| 放置和排布标记 | [标记与走位](04_marks-and-blocking.md) |\n| 取景拍摄并布光 | [摄像机与灯光](05_cameras-and-lights.md) |\n| 创建并维护关卡序列 | [序列与绑定](06_sequences.md) |\n| 从上方布置舞台 | [Planner（规划器）](07_planner.md) |\n\n## 已知限制\n\n- 只有在标记所属的舞台或舞台上的某个标记被选中时，该标记才能在关卡视口中被点击。如果某个控制柄没有反应，请先选中舞台。\n\n## 另请参阅\n\n- [Framemark 模式界面](02_interface.md)\n- [舞台和 Stage Asset](03_stages.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [摄像机与灯光](05_cameras-and-lights.md)\n- [序列与绑定](06_sequences.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "02_interface.md", "slug": "interface", "title": "Framemark 模式界面", "md": "# Framemark 模式界面\n\nFramemark 模式为你提供一个面板、一条工具栏和六个页面，页面顺序与工作顺序一致：规划舞台、放置、走位、拍摄、创建序列和共享。本页是这套界面各区域的参考：面板标题栏、Home 页、各页面、工作区、工具栏和 Edit Toolbar、View 菜单、Quick Wheel、右键菜单和细节面板。\n\n## 前提条件\n\n- 已启用 Framemark，并在 **Mode switcher**（模式切换器）中选择了 **Framemark** 模式。见 [Framemark 入门](01_getting-started.md)。\n\n## 面板\n\n![Stage 页上的 Framemark 面板](media/ui_framemark_panel.png)\n*Framemark 面板：标题和工作区、Stage Picker、页面按钮以及 Stage 页的工具。*\n\n1. **Title and workspace menu**（标题和工作区菜单）。面板标题是 **Framemark**。工作区下拉框用于选择工作区。\n2. **Workspace status**（工作区状态）。修改工作区后，会出现一个小圆点，旁边有 **保存**（Save）、**另存为**（Save As）和 **Revert** 图标。\n3. **Eye (View) button**（眼睛按钮）。即 **在视口中显示**（Show In Viewport）菜单。\n4. **Menu button**（菜单按钮）。Home、Framemark Details、Toolbar Location、Settings 和 Manage。\n5. **Stage row**（舞台行）。一个 **舞台**（Stage）标签和一个可搜索的 Stage Asset 选择器。标签显示 Stage Asset 的名称，或 **无舞台**（No stage）。\n6. **Toolbar**（工具栏）。当工作区的 Toolbar Location 包含面板时，显示在面板中。\n7. **Page tabs**（页面选项卡）。**Plan, Stage, Block, Shoot, Sequence, Share**，每个都带图标。面板变窄时，图标会均匀缩小。\n8. **Page area**（页面区域）。当前页面的按钮，然后是你所选对象的细节：舞台、标记、摄像机或灯光。没有选中任何对象时，会显示相应提示。\n\n面板变窄时，工具行会折到第二行。面板很细时会出现垂直滚动条。图标平时是灰色，在悬停、按下，或是当前激活或已勾选的那个时才变亮。\n\n### Stage Picker\n\nStage 行用来选择**活动舞台**：菜单和工具作用的那个舞台。它的提示文字为 “活动舞台：菜单和工具所操作的舞台。请选择此关卡中的舞台，或放置尚未放置的舞台资源。”列表包含以下部分：\n\n| 部分 | 说明 |\n|---|---|\n| **在此关卡中**（In This Level） | 已放置在关卡中的舞台。选择其中一个会使其成为活动舞台并选中它。如果没有，则显示 **此关卡中没有舞台**（No stages in this level）。 |\n| **不在此关卡中的舞台资源**（Stage Assets Not In This Level，不在此关卡中的 Stage Asset） | 项目中尚未放置的 Stage Asset。每个都有一个 **Place {name}** 条目，会把它放在视口摄像机前方并使其成为活动舞台。 |\n| **更多内容见规划器的资源库...**（More in the planner's Library...） | 打开 Library。见[舞台和 Stage Asset](03_stages.md)。 |\n| **所有舞台资源均已放置**（Every Stage Asset is placed） | 没有剩余可放置的 Stage Asset 时显示。 |\n\n你可以按名称搜索、浏览文件夹，或切换为缩略图。选择舞台是一步撤销（**设置活动舞台**（Set Active Stage））。\n\n## 菜单按钮\n\n| 项目 | 说明 |\n|---|---|\n| **主页**（Home） | 打开 Home 页。 |\n| **Framemark 细节**（Framemark Details） | 打开可停靠的 Framemark Details 选项卡。 |\n| **工具栏位置**（Toolbar Location） | **视口**（Viewport）、**面板**（Panel）、**两者**（Both）或 **无**（None），按工作区设置。 |\n| **设置**（Settings） | 在任意 Framemark 页面上打开编辑器偏好设置：**常规**（General）、**命名**（Naming）、**灯光**（Lights）、**摄像机**（Cameras）、**序列**（Sequence）、**生成**（Generate）、**标记**（Marks）。见[设置与命名参考](11_settings-reference.md)。 |\n| **管理**（Manage） | **编辑工具栏**（Edit Toolbar）、**设为启动页**（Set As Startup Page）、**导出工作区**（Export Workspaces）、**导入工作区**（Import Workspaces）。 |\n\n**工具栏位置** 的选项：\n\n- **视口**：关卡视口上方的一条窄条。\n- **面板**：面板顶部的一行。\n- **两者**。\n- **无**：完全没有工具栏。请使用 Quick Wheel。Planner 有同样的四个选项。\n\n**设为启动页** 会让你当前所在的页面成为该工作区的启动页。\n\n## Home 页\n\nHome 是起始页。关卡中没有舞台时会显示它。已经有舞台的关卡会跳过 Home，并按名称选中第一个舞台。要重新打开它，请在菜单按钮中选择 **主页**。它右上角的 **X**（提示文字 “关闭主页并打开 Framemark 面板”，即关闭 Home 并打开 Framemark 面板）会关闭它。\n\n1. **Logo and strapline**（标志和标语）。**Framemark**，“面向 Sequencer 的平面图和舞台”。\n2. **Slate**（场记板）。一块场记板，上面有一个标注为 **Sequence length** 的 LED，显示活动序列的长度，另有 **关卡**（Level）、**舞台**（Stages）、**序列** 和 **最近的舞台**（Last stage）几行。空值显示为 **无关卡**（No level）、**暂无**（None yet）或 **无**。\n3. **Three choices**（三个选项）。\n   - **添加舞台**（Add Stage）：“在视口所对的位置放置舞台。”\n   - **打开规划器**（Open the Planner）。\n   - **导入舞台、镜头列表或剧本**（Import a stage, shot list or screenplay）。\n4. **此项目中的舞台资源**（Stage Assets in this project，本项目中的 Stage Asset）。项目中 Stage Asset 的列表。点击其中一个会把它放进关卡，如果已经放置则跳转到它（\"Place this stage in the level, or go to it if it's already placed.\"）。排序按钮（“对舞台资源列表排序”）提供 **最近**（Recent）、**在此关卡中**（In this level）和 **名称 A 到 Z**（Name A to Z）。\n5. **Documentation links**（文档链接）。从插件文件夹打开手册文件的链接。\n\n## 页面\n\n六个页面包含所有命令。同样的命令也出现在 Edit Toolbar 图库、Quick Wheel 和右键菜单中。页面的提示文字在下文中引用。\n\n### Plan\n\n![Plan 页面](media/ui_page_plan.png)\n\n\"The stage from above. Open the Planner and the Screenplay, switch the viewport to Overhead View.\"（从上方看舞台。打开 Planner 和 Screenplay，把视口切换到 Overhead View。）\n\n| 按钮 | 说明 |\n|---|---|\n| **规划器**（Planner） | 打开 Planner 窗口。见 [Planner（规划器）](07_planner.md)。 |\n| **剧本**（Screenplay） | 打开 Screenplay 窗口。见 [剧本与故事地图](08_screenplay-and-story-map.md)。 |\n| **俯视图**（Overhead View，快捷键 **O**） | 在当前关卡视口的透视视图和以舞台边界为取景范围的俯视正交视图之间切换。再按一次会精确回到你之前所在的位置。 |\n| **捕获**（Capture） | 仅在 Overhead View 开启时可见，且仅在可以捕获时才可用。把舞台下方的关卡捕获为 Planner 背景。见[舞台和 Stage Asset](03_stages.md)。 |\n\n> **注意：** 如果你在两次按下 Overhead View 之间自己改变了视图，下一次按下会重新开始，而不会卡在顶视图（Top view）。同一时间只会记住一个视口的状态。\n\n### Stage\n\n![Stage 页面](media/ui_page_stage.png)\n\n\"Place the stage, set it on the ground, fit its boundary, select it, and add or attach actors so they move with it.\"（放置舞台，把它落到地面上，贴合它的边界，选中它，并添加或附加 Actor 使其随舞台移动。）\n\n| 按钮 | 说明 |\n|---|---|\n| **添加舞台** | “在视口所看向的位置将 3D 舞台添加到关卡中。标记、摄像机和灯光都放在其上。” |\n| **贴合地面**（Snap To Ground） | 把舞台落到其下方的地面上。 |\n| **适配边界**（Fit Boundary） | 让边界包住舞台上的每个标记、摄像机和灯光。 |\n| **选择舞台**（Select Stage） | 选中舞台及所有附加在它上面的对象。 |\n| **添加到舞台**（Add To Stage） | 附加选中的 Actor，并保持其世界变换。 |\n| **附加 Actor**（Attach Actors） | 附加每个已指定的 Actor，使其随舞台一起移动。 |\n| **分离 Actor**（Detach Actors） | 分离它们，让它们留在原地。 |\n\n### Block\n\n![Block 页面](media/ui_page_block.png)\n\n\"Place, arrange and number marks and props.\"（放置、排布标记和道具并为其编号。）\n\n| 按钮 | 说明 |\n|---|---|\n| **重新编号标记**（Renumber Marks） | 重新排列 Mark Order：先是 Player，然后是 NPC、Companion、Extra，最后是道具，每组保持当前顺序。 |\n| **将标记移到 Actor**（Move Mark To Actor） | 把每个选中 Actor 的标记移到该 Actor 当前所站的位置。 |\n| **上移一层**（Bring Forward）、**置于顶层**（Bring To Front）、**下移一层**（Send Backward）、**置于底层**（Send To Back） | 改变多个重叠标记中哪个在最上面并优先响应点击。 |\n| **分散标记**（Spread Marks） | “将位于同一位置的标记移到一个小圆上，并保持其朝向。右键单击标记可选择“成行”和“按朝向”。” |\n| **循环选择叠放的标记**（Cycle Stacked Mark） | “选择叠放在同一位置的下一个标记。再次单击该叠放处效果相同，Shift+单击则往回选。” |\n| **标记表**（Marks Table） | 打开舞台上所有标记的表格。 |\n\n**应用布局**（Apply Layout）作为命令存在，但在页面上被隐藏，因为在舞台上选择 Layout 会立即应用它。**重新应用布局**（Re-apply Layout）在右键菜单中。**放置标记**（Place Mark，快捷键 **M**）、**放置道具**（Place Prop，快捷键 **P**）、**根据 Actor 创建标记**（Mark From Actor）、**分配到标记**（Assign To Mark）、**为标记设关键帧**（Key To Mark，快捷键 **K**）和 **将 Actor 对齐到标记**（Snap Actors To Marks）是核心工具：它们在工具栏和 Quick Wheel 上，也在 Edit Toolbar 图库的 **主要**（Main）下。见[标记与走位](04_marks-and-blocking.md)。\n\n### Shoot\n\n![Shoot 页面](media/ui_page_shoot.png)\n\n\"Cameras and lights, linking and setups.\"（摄像机和灯光、关联和布局。）\n\n| 按钮 | 说明 |\n|---|---|\n| **设为视口视角**（Set To Viewport） | 把关卡视口的位置、旋转和视野复制到选中的摄像机。 |\n| **通过摄像机观看**（Look Through，**Ctrl+Shift+P**） | 让视口导航到选中的舞台摄像机的视角。 |\n| **摄像机预设**（Camera Preset） | 根据标记批量创建摄像机。 |\n| **跟随**（Follow） | 其他选中的 Actor 跟随最后选中的 Actor 的位置和旋转。 |\n| **朝向**（Look At） | 其他选中的 Actor 或摄像机朝向最后选中的 Actor。 |\n| **取消链接**（Unlink） | 移除选中 Actor 上所有的 Framemark 关联。 |\n| **新建布局组**（New Setup） | 把当前选择归入一个新的布局。 |\n| **显示所有布局组**（Show All Setups） | 关闭独显并显示所有布局。 |\n| **布局组选项卡**（Setups Tab） | 打开可停靠的 Setups 面板。 |\n\n**放置摄像机**（Place Camera，快捷键 **C**）和 **放置灯光**（Place Light，快捷键 **L**）是核心工具。见[摄像机与灯光](05_cameras-and-lights.md)。\n\n### Sequence\n\n![Sequence 页面](media/ui_page_sequence.png)\n\n\"Build the Level Sequence and keep it in step with the stage.\"（创建关卡序列并使其与舞台保持同步。）\n\n| 按钮 | 说明 |\n|---|---|\n| **构建序列**（Build Sequence） | 创建或更新舞台的关卡序列。Shift+点击，或点击它旁边的 **...** 按钮，可重新打开对话框。 |\n| **打开序列**（Open Sequence） | 在 Sequencer 中打开舞台的关卡序列。 |\n| **同步到序列**（Sync To Sequence） | 立即让标记轨道与其标记保持一致。 |\n| **匹配上一个**（Match Previous） | 在这个镜头的第一帧，为每个带标记的 Actor 设置关键帧，位置是它在上一个镜头结束时所在的位置。在 Sequencer 中打开了主序列、且播放头位于前面还有镜头的镜头中之前，此按钮为灰色。 |\n| **匹配下一个**（Match Next） | 与之相反：在这个镜头的最后一帧，位置是它在下一个镜头开始时所在的位置。 |\n| **从此开始...**（Start From...） | 选择一个序列，并在舞台序列的第一帧为每个带标记的 Actor 设置关键帧，位置是它在你所选序列中结束时所在的位置。 |\n| **检查连续性**（Check Continuity） | 列出这样的 Actor：其在某个镜头中第一帧的位置，与它在上一个镜头最后一帧的位置相比发生了跳变。在 Sequencer 中打开了包含两个或更多镜头的主序列之前，此按钮为灰色。 |\n| **活动序列**（Active Sequence） | “选择舞台播放和处理其链接序列中的哪一个，也可为舞台添加关卡序列或移除一个。” |\n\n见[序列与绑定](06_sequences.md)。\n\n### Share\n\n![Share 页面](media/ui_page_share.png)\n\n\"Export and import stages, export the plan.\"（导出和导入舞台，导出平面图。）\n\n| 按钮 | 说明 |\n|---|---|\n| **导出舞台**（Export Stage） | 把舞台保存为 `.framemark.json` 文件。 |\n| **导入**（Import） | “导入 Framemark 文件、镜头列表或剧本。” |\n| **导出平面图**（Export Plan） | 打开平面图表格的导出对话框。 |\n| **导出 USD**（Export USD） | 把舞台导出为 USD。 |\n| **导出 FBX**（Export FBX） | 把舞台导出为 FBX。 |\n\n见[导入、导出与分享](09_import-export.md)。\n\n## 工作区\n\n工作区由一条工具栏、你起始所在的页面，以及它打开并停靠的窗口组成。选择工作区会打开它的窗口，但不会关闭你已经打开的窗口。\n\n| 工作区 | 起始页 | 打开 | 工具栏 |\n|---|---|---|---|\n| **Director** | Plan | Planner、Screenplay | Select、Add Stage、Place Mark、Place Camera、Place Light、Place Prop、Build Sequence、Open PIE |\n| **Layout** | Block | Sequencer、Marks Table | Select、Place Mark、Place Prop、Mark From Actor、Move Mark To Actor、Assign To Mark、Key To Mark、Spread Marks、Renumber Marks、Snap Actors To Marks |\n| **摄像机**（Camera） | Shoot | Sequencer | Select、Place Camera、Set To Viewport、Look Through、Camera Preset、Look At、Follow、Unlink、Build Sequence、Open Sequence |\n| **Lighting** | Shoot | 没有额外窗口 | Select、Place Light、Look At、Follow、Unlink、Look Through、Set To Viewport |\n\n你自己的工作区位于同一菜单的 **自定义**（Custom）下。第一次打开该模式时，你会得到一个名为 Custom 的工作区作为起点，它从 Stage 页开始。新建的自定义工作区的工具有 Select、Place Mark、Place Prop、Place Camera、Place Light、Mark From Actor、Snap Actors To Marks 和 Open PIE。\n\n- **内置工作区不能被覆盖。** 修改其中一个后，选择 **另存为** 来保存你的版本。\n- 做任何改动（添加工具、移动工具栏）后，状态圆点就会出现。它的三个图标是 **保存**（\"keep your changes in this workspace\"，把更改保留在此工作区）、**另存为**（\"keep your changes as a new custom workspace\"，把更改保存为新的自定义工作区）和 **Revert**（\"drop your changes and go back to the saved workspace\"，放弃更改并回到已保存的工作区）。圆点的提示文字为 “此工作区有未保存的更改。”**保存** 仅适用于自定义工作区。选择另一个工作区会丢弃尚未保存的更改。\n- 悬停在自定义工作区上，会看到一支铅笔（重命名）和一个垃圾桶（删除）。\n- 工作区还会保存你的设置：Planner 的对齐大小和对齐刻度、参考线、单位、主题、工具栏位置、图层顺序、草图分辨率和面板布局；Capture From Level 选项；隐藏的 Details 分区；Marks Table 和 Screenplay 的列；以及导出和导入选项。更改其中任何一项都算作工作区更改。每个剧本自己的内容，例如场景顺序、已关闭的场景和被忽略的道具，则保存在该剧本中。\n- 内置的网格对齐各不相同：Director 为 10 cm，Layout 为 25 cm，Camera 为 5 cm，Lighting 为 10 cm。\n- **导出工作区** 和 **导入工作区**（在 **管理** 中）读写一个 `.framemarkworkspace` 文件，你可以把它发给团队。\n\n## 工具栏和 Edit Toolbar\n\n工具栏承载你的工作区的工具，开头是 **选择**（Select），末尾有一条分隔线，其后是一个 **...** 按钮。**...** 会打开 Edit Toolbar。**More Tools** 按钮显示 \"the Framemark tools that are not on this toolbar.\"（不在此工具栏上的 Framemark 工具。）\n\n### Edit Toolbar\n\nEdit Toolbar 图库列出所有工具，分组为 **主要**，然后是每个页面一组，最后是 **视图**（View）。\n\n1. 点击工具栏末尾的 **...**，或选择 **Manage > Edit Toolbar**。\n2. 点击一个工具来添加它，或把它拖到工具栏上。提示为 “点击工具即可添加，或将其拖到工具栏上。拖动工具栏按钮可重新排序，或右键点击按钮选择“左移”和“右移”。”\n3. 右键点击工具栏按钮，可使用 **移除**（Remove，“将此工具从工具栏中移除。它仍保留在其页面上。”，把此工具从工具栏上移除，它仍保留在其页面上）、**左移**（Move Left）或 **右移**（Move Right）。图库中的工具有 **添加到工具栏**（Add To Toolbar）。\n4. 点击 **Reset to Workspace**（\"undo the changes you made since you pressed Edit Toolbar\"，撤销你自按下 Edit Toolbar 以来所做的更改）、**取消**（Cancel），或 **Done**（\"finish editing the toolbar\"，完成工具栏编辑）。\n\n编辑时，工具栏行会显示在面板中，方便你拖动。重置、取消和完成按钮位于工具下方单独的一行，所以不会被裁切。**Esc** 会取消并丢弃你的更改。\n\n**编辑工具栏** 和 **舞台设置**（Stage Settings）是隐藏工具：它们有命令，但没有页面按钮。\n\n## Show In Viewport 菜单\n\n眼睛按钮会打开 **在视口中显示**。菜单保持打开，方便你切换多个勾选项，且勾选状态始终反映真实状态。\n\n| 项目 | 说明 |\n|---|---|\n| **标记**、**标签**（Labels）、**备注**（Notes）、**边界**（Boundary）、**道具**（Props） | Framemark 的显示标志，与关卡视口中的 **Show > Custom** 是同一组开关，并会同时应用于所有关卡视口。 |\n| **摄像机**、**灯光** | 仅在编辑器中隐藏或显示舞台的摄像机和灯光。按舞台设置，只在编辑器保持打开期间有效，不会保存到关卡中。你之后放置的摄像机或灯光会遵循该设置。 |\n\n每个提示文字为 \"Same switch as Show > Custom > Framemark {name}\"（与 Show > Custom > Framemark {name} 是同一个开关）。视口的 **Show > Custom** 菜单列出 **Framemark 标记**（Framemark Marks）、**Framemark 道具**（Framemark Props）、**Framemark 边界**（Framemark Boundary）、**Framemark 标签**（Framemark Labels）、**Framemark 备注**（Framemark Notes）和 **Framemark 摄像机**（Framemark Cameras）。\n\n> **提示：** 如果你放置了摄像机或灯光却看不到它，请检查 **摄像机** 或 **灯光** 是否已勾选。在该项关闭时放置，会出现一条消息提醒你。\n\n## Quick Wheel\n\n在鼠标指针位于关卡视口（Framemark 模式开启）或 Planner 上方时按 **Tab**。工作区的工具会在光标处围成一圈打开。按住 **Tab**，朝某个工具轻划并松开，或者轻按 **Tab** 再点击一个工具。它运行的命令与其他位置相同。在视口中，没有选中任何对象时也能使用。在其他地方，**Tab** 保持虚幻引擎自身的含义。\n\n## 右键菜单\n\n在关卡视口中右键，选择 **Framemark**。右键点击标记时，同样的条目会平铺显示。条目与工具栏共用图标，勾选类条目（**朝向标记方向**（Orient To Mark）、**固定到标记**（Pin To Mark））除外。\n\n| 分组 | 条目 |\n|---|---|\n| Place | **在此放置标记**（Place Mark Here）、**在此放置摄像机**（Place Camera Here）、**在此放置灯光**（Place Light Here），位置就是你点击的确切位置。 |\n| Mark | **分配 Actor**（Assign Actor，包含 **Selected:**、**Nearby:** 和 **清除**）、**朝向标记方向**、**固定到标记**。 |\n| Actor | **根据 Actor 创建标记**、**为标记设关键帧**、**将其标记移到此处**（Move Its Mark Here）、**分配到标记**（带搜索框、标记列表和 **Pick In Viewport**）、**添加到舞台**。 |\n| Edit | **复制一份**（Duplicate）、**删除**（Delete）、**锁定**（Lock）和 **解锁**（Unlock）。 |\n| Position | **贴合地面**、**对齐到 Actor**（Snap To Actor），以及 **颜色**（Colour）：角色色块、**恢复角色颜色**（Back To Role Colour）和 **自定义...**（Custom...）。 |\n| Overlapping Marks | **排列**（Arrange，**上移一层**、**置于顶层**、**下移一层**、**置于底层**）、**分散标记**（**排成一行**、**圆形**、**按朝向**）、**选择下方的下一个标记**（Select Next Mark Underneath）。 |\n| Group | **移到舞台**（Move To Stage）、**添加到布局组**（Add To Setup）、**从布局组移除**（Remove From Setup），以及 **链接**（Link，**跟随**、**朝向**、**位置**、**旋转**、**取消链接**）。 |\n| Camera | **设为视口视角**、**通过摄像机观看**。 |\n| Stage | **将边界适配舞台**（Fit Boundary To Stage）、**重新应用布局**、**选择舞台及其附加内容**（Select Stage + Attached）、**重新编号标记**、**标记表**。 |\n\n> **注意：** 如果 Framemark 子菜单显示 \"Select a Cine Stage first.\"（请先选择一个 Cine Stage），请选中舞台、附加在它上面的任何对象，或其 Stage Camera 组件指向该舞台的摄像机，然后再次右键。\n\n## 细节面板\n\nFramemark 在三个位置显示选中的舞台、标记、摄像机或灯光。\n\n- **Framemark 面板的页面区域**，位于页面按钮下方。\n- **Framemark 细节**，一个可停靠的选项卡。它的提示文字为 “Framemark 细节：所选的舞台、标记、摄像机和灯光。可停靠在任意位置，也可浮动显示。”它的空状态显示 “选择舞台、标记、摄像机或灯光，即可在此查看其细节。”它包含 **舞台**、**标记**、**摄像机** 和 **灯光** 分区。选中多个标记时可一起编辑，值不同的地方会显示 **多个值**（Multiple Values）。**分区**（Sections）菜单（\"tick the sections Framemark Details shows\"，勾选 Framemark Details 显示的分区）中有 **全部显示**（Show All）。\n- **普通的细节面板。** 选中标记、道具、摄像机或灯光时，只显示它们自己的属性，不显示 Stage 分区。\n\n### Stage Tools 行\n\n![选中舞台时的细节面板](media/fm_stage_details.png)\n*舞台细节面板顶部的 **舞台工具**（Stage Tools）行。*\n\n舞台的普通细节面板顶部有一行 **舞台工具** 图标。每个图标的提示文字格式为 \"Label: description\"（标签：说明）。\n\n| 分组 | 按钮 |\n|---|---|\n| Add | **添加标记**（Add Mark，“在舞台前方添加一个标记并选中它。”，在舞台前方添加一个标记并选中它）、**添加摄像机**（Add Camera，“在舞台上添加一个摄像机并选中它。”，在舞台上添加一个摄像机并选中它）、**添加灯光**（Add Light，“在舞台上添加一个灯光并选中它。”，在舞台上添加一个灯光并选中它）。 |\n| Marks | **重新编号标记**、**将 Actor 对齐到标记**。 |\n| Place | **贴合地面**、**适配边界**、**摄像机预设**。 |\n| Sequence | **构建序列**、**打开序列**。 |\n| Relocate | **选择舞台**、**附加 Actor**、**分离 Actor**。 |\n\n### 舞台属性顺序\n\n这是细节面板显示的舞台类别顺序。各属性的说明见[舞台和 Stage Asset](03_stages.md)和[序列与绑定](06_sequences.md)。\n\n| 类别 | 属性 |\n|---|---|\n| **舞台** | Stage Asset、Layout、Layout Count、Mark Spacing、Flip Line Of Action |\n| **Look** | Marks、Cameras and Lights |\n| **序列** | Linked Sequences、Shot Length Seconds、Sequence Folder、Hold Marks In Sequence |\n| **布局组**（Setups） | Ghost Opacity、Ghost Hidden Setups |\n| **平面图**（Plan） | Background、Sketch |\n| **Playback** | Sequence Follows Stage、View Mode、Auto Trigger、Play Once、Has Played、Show Guides In Game |\n| **Binding** | Auto Bind Players、Auto Bind Actors By Tag、Snap Bound Actors To Marks、Player End Mark |\n| **Interrupt** | Can Be Interrupted、Interrupt Triggers、Interrupt Sequence |\n| **摄像机预设** | Preset Shot Scales、Include Master、Interior Suffix、Interior |\n\n### 标记属性顺序\n\n标记的行按以下顺序出现：**标记**（Mark，Mark Name、Actor、Role、Prop Footprint）、**备注**（Action、Line）、**Look**（Show Preview Character、Custom Colour、Preview Character）、**Actor** 行（Mark Order、Pin To Mark、Orient To Mark、Height Snapping、Sequence Track、Facing Offset、Facing Offset Degrees、Arrange Order、Pivot Height、Snap To Floor At Runtime），然后是 **摄像机**，再是 **Players**。道具只显示 Mark Name、Actor、Prop Footprint、Role、Notes、Look，然后是 Actor 行，其中 Pin To Mark 排在最前。每个属性的说明见[标记与走位](04_marks-and-blocking.md)。\n\n### 摄像机和灯光行\n\n摄像机显示 Lens Choice、Focal Length、Aperture、Manual Focus Distance、Look At Target 和 Filmback，当摄像机处于 Game 模式时还有游戏模式行。灯光首先显示 Intensity、Intensity Units、Light Colour、Use Temperature 和 Temperature，然后是 Look At Mark 和 Aim Height，最后是锥角和光源行。见[摄像机与灯光](05_cameras-and-lights.md)。\n\n## 已知限制\n\n- 只有在标记所属的舞台或舞台上的某个标记被选中时，标记才能在关卡视口中被点击。\n- 隐藏摄像机和灯光只持续到你关闭编辑器，不会随关卡保存。\n\n## 另请参阅\n\n- [Framemark 入门](01_getting-started.md)\n- [舞台和 Stage Asset](03_stages.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [键盘快捷键参考](13_shortcuts.md)\n- [设置与命名参考](11_settings-reference.md)\n"}, {"file": "03_stages.md", "slug": "stages", "title": "舞台和 Stage Asset", "md": "# 舞台和 Stage Asset\n\n**舞台**（stage）是你为开始一个场景而放置的那一个 Actor。Cine Stage Actor 用胶片条形的**边界**圈出区域，保存标记、摄像机和灯光，并拥有关卡序列。**Stage Asset**（即 Cine Stage Asset，是一种数据资产）把舞台的内容存储在项目中，所以同一个舞台可以放进多个关卡、在 Planner 中编辑，并在各处保持同步。本页介绍放置舞台、边界和胶片格式、Stage Asset 同步、Draft、Save 和 Save As、Library、舞台重新定位、Capture From Level 以及锁定。\n\n## 前提条件\n\n- 已启用 Framemark，并已开启 Framemark 模式。见 [Framemark 入门](01_getting-started.md)。\n\n## 概念\n\n### 舞台包含什么\n\n- **标记**（Stage Mark 组件）：每个角色或道具站立的位置。见[标记与走位](04_marks-and-blocking.md)。\n- **摄像机**（带有 Stage Camera 组件的过场动画摄像机 Actor）和**灯光**。见[摄像机与灯光](05_cameras-and-lights.md)。\n- **边界**（Ropes 组件）：胶片条。\n- **一个关卡序列**，或多个。见[序列与绑定](06_sequences.md)。\n\n舞台是序列的变换原点，摄像机附加在它上面，所以移动或旋转舞台就会移动镜头。边界、标记和标签仅存在于编辑器中。\n\n### Stage Asset\n\nStage Asset 以 JSON 形式存储舞台（标记、摄像机、灯光、布局、边界），另有一个修订号，以及标记、摄像机和灯光的数量，内容浏览器的提示会显示这些数量。当舞台是为某个剧本场景创建时，它还可以带有 Script、Scene ID 和 Scene Number。Actor 的身份以标签形式存储，因此重新加载时会重新连接到同样的对象。\n\n舞台的 **Stage Asset** 属性的说明为：\"The Stage Asset this placement shows. Edit the stage here and the asset, and every other placement of it, follows. Pick a different asset to swap the whole stage. Editor only.\"（此放置所显示的 Stage Asset。在这里编辑舞台，资产及其所有其他放置都会随之更新。选择不同的资产可替换整个舞台。仅限编辑器。）\n\n两次放置同一个资产，会得到两个保持同步的放置，就像蓝图实例一样。\n\n### Draft\n\n在 Planner 中编辑舞台时，修改会进入 **草稿**（Draft），而不是直接进入关卡。Planner 的实时指示器显示 **草稿**，其提示文字为：“草稿：规划器中的编辑仅写入舞台资源。保存（Ctrl+S）后，关卡中的每个放置实例都会更新，与蓝图实例相同。单击可再次与关卡同步。”（Draft：Planner 的编辑只会进入 Stage Asset。保存它（Ctrl+S）后，关卡中的每个放置都会更新，就像蓝图实例一样。点击可再次与关卡同步。）\n\n舞台有未保存的 Draft 时，在关卡中编辑它会被暂时阻止。提示信息为 \"Draft in Planner: '{name}' has Planner changes not saved yet. Save or discard them in the Planner to edit this stage here.\"（Planner 中的 Draft：'{name}' 有尚未保存的 Planner 更改。请在 Planner 中保存或丢弃它们，才能在这里编辑此舞台。）\n\n| 操作 | 说明 |\n|---|---|\n| **保存**（Save，**Ctrl+S**） | “保存舞台资源 (Ctrl+S)。关卡中的所有放置都会更新，作为一步撤销。”（保存 Stage Asset（Ctrl+S）。关卡中的每个放置都会更新为它，作为一步撤销。） |\n| **另存为**（Save As） | \"The draft becomes a new Stage Asset in its own tab. This stage goes back to its saved state.\"（草稿会变成一个新的 Stage Asset，并在它自己的选项卡中打开。此舞台会回到其已保存的状态。）**将舞台资源另存为**（Save Stage Asset As）对话框会要求你填写新资产。 |\n| **放弃草稿**（Discard Draft） | 丢弃 Planner 中的更改。 |\n\n如果你在有未保存更改的情况下关闭 Planner，会出现 **未保存的草稿**（Unsaved draft）对话框，说明该舞台有关卡中尚没有的 Planner 更改，并提供 **保存并同步**（Save and Sync）和 **放弃草稿**。\n\n> **注意：** 如果舞台的资产与某个副本共用，**Make Unique** 会让这个舞台拥有自己的资产。提示信息为 \"This stage now has its own asset, '{name}'.\"（此舞台现在有了自己的资产 '{name}'。）为原本没有资产的舞台创建的 Stage Asset，提示为 \"Made {n} Stage Asset(s). Save them with the level.\"（已创建 {n} 个 Stage Asset。请随关卡一起保存。）\n\n## 放置舞台\n\n1. 打开 **舞台**（Stage）页，或 Home 页。\n2. 点击 **添加舞台**（Add Stage）。舞台会出现在关卡视口所看的位置，吸附到地面上，并带有一个 **玩家**（Player）标记和一个 **NPC** 标记，彼此面对面。\n\n或者，不使用该模式：把 **Place Actors > Cinematic > Cine Stage** 拖进关卡。\n\n你可以在 Editor Preferences 中关闭地面吸附和那两个初始标记。**Stage Anchor Location**（Editor Preferences）指定新舞台上锚点所在的位置，视口中的 Framemark 图标就位于该点。见[设置与命名参考](11_settings-reference.md)。\n\n### Stage 页命令\n\n| 命令 | 说明 |\n|---|---|\n| **添加舞台** | “在视口所看向的位置将 3D 舞台添加到关卡中。标记、摄像机和灯光都放在其上。” |\n| **贴合地面**（Snap To Ground） | 把舞台落到其下方的地面上。如果下面什么都没有，提示信息为 “下方未找到地面。” |\n| **适配边界**（Fit Boundary） | 让边界包住舞台上的每个标记、摄像机和灯光。它自动生成的尺寸会向上取整到整厘米。你自己输入的尺寸则按输入值保留。 |\n| **选择舞台**（Select Stage） | 选中舞台及所有附加在它上面的对象。 |\n| **添加到舞台**（Add To Stage） | 附加选中的 Actor，并保持其世界变换。 |\n| **附加 Actor**（Attach Actors） | 附加每个已指定的 Actor。 |\n| **分离 Actor**（Detach Actors） | 分离它们。 |\n\n> **注意：** **贴合地面** 会在舞台下方的 Visibility 通道上寻找地面，忽略舞台及其自身的附加对象。请先把舞台移到真实碰撞体的上方。\n\n## 边界\n\n边界是一条封闭样条线，画成一条真实胶片的样子，这样团队其他人在搭建之前就能看到这段过场动画的占地范围。它像其他对象一样绘制在天空和关卡之上，从低角度也能看到。它仅存在于编辑器中。\n\n![选中的舞台：边界、带预览角色的标记以及舞台摄像机](media/st_boundary.jpg)\n\n### 边界属性\n\n选中舞台并打开它的 Boundary 组件（Ropes 组件，类别为 **SceneBoundary**）。Framemark Details 面板把相同的属性显示为 Boundary Shape、Boundary Width、Boundary Depth、Corner Radius、Boundary Radius、Film Format、Film Scale 和 Height Off Floor。\n\n| 属性 | 说明 |\n|---|---|\n| **Shape** | **Rounded Rectangle**、**圆形**（Circle）或 **自定义**（Custom）。拖动样条线上的点会把它切换为 Custom。 |\n| **宽度**（Width） | 默认 700 cm。 |\n| **Depth** | 默认 600 cm。 |\n| **Corner Radius** | 默认 150 cm。仅适用于 Rounded Rectangle。 |\n| **Radius** | 默认 300 cm。仅适用于 Circle。 |\n| **Centre Offset** | 高级选项。移动边界的中心。 |\n| **Film Format** | 所绘制的胶片规格。默认 **35mm 4-perf**。 |\n| **Film Scale** | 默认 1，范围 0.25 到 5。\"1 stands 40 cm tall.\"（1 对应 40 cm 高。） |\n| **Height Off Floor** | 默认 85 cm。 |\n| **Frame Color** | 默认橙色。 |\n| **Base Color**、**Perforation Color**、**Ground Color** | 胶片条的其他颜色。选色块使用胶片条自己的颜色：黄色边框、黑色片基和浅色齿孔。 |\n| **Draw Floor Line** | 默认开启。 |\n| **Inside Height Tolerance** | 默认 400 cm。高级选项。边界上方多高仍算在其内部。 |\n\n### 胶片格式\n\n| 标签 | 说明 |\n|---|---|\n| **35mm 4-perf** | 默认值。 |\n| **35mm 3-perf** | |\n| **35mm 8-perf VistaVision** | |\n| **65mm 5-perf** | |\n| **70mm 5-perf print** | |\n| **IMAX 15/70** | |\n\n这些格式采用真实胶片的比例，所以胶片条始终看起来像胶片。另有一份摄像机胶片格式列表，用于摄像机的 Filmback，见[摄像机与灯光](05_cameras-and-lights.md)。\n\n### 边界行为\n\n- **Auto Fit Boundary**（Editor Preferences、Scene Boundary，默认开启）：当你松开舞台元素时，边界会围绕舞台重新贴合，可能变大也可能变小，效果与 Fit Boundary 相同。Custom 轮廓保持你绘制的样子。一次撤销会把两者都还原。\n- 在别人的边界内移动一个不属于任何舞台的 Actor 时，会显示一次警告，每个 Actor 每 30 秒一次。可在 **Editor Preferences > Framemark > General > Scene Boundary > Warn When Editing Inside Boundary** 中关闭。\n\n## 舞台属性\n\n这些是舞台自身的属性，按细节面板显示的顺序排列。Sequence 和 Binding 属性也在[序列与绑定](06_sequences.md)中说明。\n\n![选中舞台时的细节面板](media/fm_stage_details.png)\n\n### Stage\n\n| 属性 | 说明 |\n|---|---|\n| **Stage Asset** | 此放置所显示的 Stage Asset。仅限编辑器。 |\n| **Layout** | 标记的排布方式。选择其中一个会立即应用。默认 **I - two facing**。见[标记与走位](04_marks-and-blocking.md)。 |\n| **Layout Count** | 默认 5。仅在 O 和 U 布局方式下显示。 |\n| **Mark Spacing** | 默认 180 cm，界面范围 40 到 800。标记 1 和标记 2 之间的距离。\"Around 100 reads as intimate, 300 as formal.\"（100 左右显得亲密，300 显得正式。） |\n| **Flip Line Of Action** | 默认关闭。交换动作线（line of action）上允许摆放摄像机的一侧。 |\n\n### Look\n\n| 属性 | 说明 |\n|---|---|\n| **标记**（Marks） | 标记的绘制方式：Style、Asset、Preview Character、Size、Opacity、Height Pin、Colour、One Colour。见[标记与走位](04_marks-and-blocking.md)。 |\n| **Cameras and Lights** | 摄像机和灯光的绘制方式：Display、Size、Always Face The Camera、Show Name Label、Show On Top Of Everything。见[摄像机与灯光](05_cameras-and-lights.md)。 |\n\n新舞台会从 **Framemark 标记**（Framemark Marks）设置页复制它的初始 Look。\n\n### Setups\n\n| 属性 | 说明 |\n|---|---|\n| **重影不透明度**（Ghost Opacity） | 默认 0.25，范围 0 到 1。虚影布局看起来有多实。 |\n| **Ghost Hidden Setups** | 默认开启。隐藏的布局会变暗，而不是消失。 |\n\n### Plan\n\n| 属性 | 说明 |\n|---|---|\n| **背景**（Background） | 平面图后面的图像图层。每个图层有一个 Texture、一个中心、一个 **宽度**、一个旋转、一个 **不透明度**（Opacity）和一个可见性勾选框。 |\n| **草图**（Sketch） | Planner 草图。见 [Planner（规划器）](07_planner.md)。 |\n\n### Playback\n\n| 属性 | 说明 |\n|---|---|\n| **Sequence Follows Stage** | 默认开启。舞台是序列的变换原点。 |\n| **View Mode** | **Framed**（默认）、**First Person** 或 **Hybrid**。 |\n| **Auto Trigger** | **Manual**、**OnBeginPlay** 或 **WhenPlayerEntersBoundary**。 |\n| **Play Once** | 默认关闭。 |\n| **Has Played** | 只读，高级选项。一个存档属性。 |\n| **Show Guides In Game** | 默认关闭。高级选项。 |\n\n舞台还有事件分发器 **On Stage Play**、**On Stage Paused**、**On Stage Stopped**、**On Stage Finished** 和 **On Stage Interrupted**，以及 Play Stage、Stop Stage、Interrupt Stage 和 Reset Has Played 等蓝图函数。\n\n## Save、Save As 和 Library\n\n### 保存 Stage Asset\n\n1. 在 Planner 中编辑舞台。实时指示器显示 **草稿**。\n2. 按 **Ctrl+S** 或点击 Save 按钮。关卡中该资产的每个放置都会更新，作为一步撤销。\n3. 如果想把你的编辑保存为新的资产，请选择 **另存为**，在 **将舞台资源另存为** 中为资产命名并确认。\n\n### Library\n\nLibrary 是一个可停靠的选项卡，名为 **库**（Library）：“Framemark 资产：文件夹、收藏、快速筛选和使用位置。”它按文件夹浏览 Stage Asset 和关卡序列。\n\n| 控件 | 说明 |\n|---|---|\n| **添加**（Add） | “在此文件夹中创建新的舞台资源或关卡序列。” |\n| **导入**（Import） | “将文件导入此文件夹，与内容浏览器的导入相同。” |\n| 搜索框 | 提示文字 “查找舞台、场景或文件夹”。 |\n| **在此关卡中**（In this level） | “仅显示放置在此关卡中的舞台。” |\n| **所有剧本**（All screenplays） | 按剧本筛选：“仅显示为某个剧本创建的舞台。” |\n| 后退和前进 | “返回上一个文件夹。”和 “前进到下一个文件夹。” |\n| **转到**（Go to） | “在关卡中选中它，取景并打开 Framemark。” |\n| **放置**（Place） | “放置在视口摄像机前方。” |\n| **用于**（Used In） | 显示所选资产被用在哪里。 |\n| **在规划器中打开**（Open in Planner） | “打开所选舞台资源的平面规划。” |\n| **在内容浏览器中显示**（Show in Content Browser） | “在内容浏览器中定位所选资源。” |\n\n每一行显示舞台名称和场景，一行数量统计，如 \"{n} marks, {n} cameras, {n} lights\"，以及它是否已放置：\"Placed here x{n}\" 或 “不在此关卡中”。\n\n> **注意：** Library 的布局正在重新设计，将会改变。\n\n## 重新定位舞台\n\n开启 **Sequence Follows Stage** 后，移动或旋转舞台会带着摄像机一起移动，因为它们是附加在舞台上的。序列数据不会改变，改变的只是它播放的位置。\n\nActor 默认不附加到舞台上。标记的 Actor 只是一个普通引用。请使用以下命令：\n\n1. **选择舞台** 选中舞台及所有附加在它上面的对象，可以整体移动或复制。\n2. **添加到舞台** 附加选中的 Actor，并保持其世界变换。\n3. **附加 Actor** 附加每个已指定的 Actor，使其随舞台一起移动。\n4. **分离 Actor** 让 Actor 留在原地。\n5. **将 Actor 对齐到标记**（Snap Actors To Marks）立即把每个已指定的 Actor 放回它的标记上，不改变附加关系。\n\n右键菜单中的 **移到舞台**（Move To Stage）和 **链接**（Link）条目也可以在舞台之间移动标记。如果某个 Actor 已附加到目标上，**链接** 会提示 “无法链接已附加到目标的 Actor。请先使用“从舞台分离”，或选择其他目标。”\n\n## Capture From Level\n\n**从关卡捕获**（Capture From Level）对舞台下方的关卡进行俯视捕获，并按正确的比例把它设为 **背景**。当 Overhead View 开启时，它在 Plan 页上显示为 **捕获**（Capture），也是一个可停靠的 **捕获** 选项卡（“从关卡捕获：舞台下方关卡的俯视捕获图，按正确比例设为背景。”，即对舞台下方的关卡进行俯视捕获，并按正确的比例设为 Background）。\n\n1. 把舞台放进关卡。Capture 需要一个已放置的舞台。否则原因会显示为 “没有可捕获的舞台。请先选择一个舞台。”或 “舞台未放置在关卡中。请将其放入关卡后再捕获。”\n2. 在 Plan 页上开启 **俯视图**（Overhead View），或打开 Capture 选项卡。\n3. 点击 **捕获**（或 **从关卡捕获**）。\n\n捕获是一步撤销。如果无法运行，不会更改任何内容，并且提示信息会说明原因，例如 “捕获需要编辑器正在渲染。未做任何更改。”\n\n## 锁定\n\n**锁定**（Lock）会把所选对象固定在原位，在视口和 Planner 中都是如此。它的提示文字为 “锁定：让选择保持原位，在此处和视口中均如此。锁定的标记保持其颜色，并带有虚线圆环和挂锁。锁定的摄像机和灯光无法移动。”右键菜单中的 **锁定** 条目写着 “已锁定的标记或 Actor 在解锁之前，无法在此处移动或删除。”被锁定的标记不能被拖动、不能指定 Actor，也不能被删除。提示信息为 “这些标记已锁定。” 和 “该标记已锁定。”布局也可以锁定其成员。见[标记与走位](04_marks-and-blocking.md)。\n\n## 已知限制\n\n- 隐藏摄像机和灯光是按舞台设置的，只持续到编辑器关闭，不会保存。\n- 导入的舞台只通过完全匹配的标签来重新连接 Actor。\n\n## 另请参阅\n\n- [Framemark 模式界面](02_interface.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [Planner（规划器）](07_planner.md)\n- [导入、导出与分享](09_import-export.md)\n- [设置与命名参考](11_settings-reference.md)\n"}, {"file": "04_marks-and-blocking.md", "slug": "marks-and-blocking", "title": "标记与走位", "md": "# 标记与走位\n\n**标记**（mark）是舞台上角色或道具站立的位置。标记给每个演员一个位置和朝向，为**关卡序列**（Level Sequence）中的每个标记提供一条轨道，并告诉摄像机它们覆盖哪些角色。走位就是放置、命名、排序和排列标记，直到场景成立的工作。本页介绍放置标记和道具、**标记顺序**（Mark Order）、名称、**Layout**（布局）、朝向、堆叠、**布局组**（Setup）、**标记表**（Marks Table）、**为标记设关键帧**（Key To Mark）、把演员安排到标记上，以及预览角色。\n\n## 前提条件\n\n- 关卡中有一个舞台。参见 [舞台和 Stage Asset](03_stages.md)。\n- 已开启 Framemark 模式。只有在其舞台或舞台上的某个标记被选中时，标记才能在关卡视口（Level Viewport）中被点击。\n\n## 概念\n\n- **标记顺序**是标记的编号（1、2、3……）。它用于给标记排序、命名和查找，摄像机也通过它引用标记。数量没有上限。标记 1 是主角。\n- **角色类型**（Role）说明谁或什么站在标记上：**玩家**（Player）、**NPC**、**同伴**（Companion）、**道具**（Prop）、**群众演员**（Extra）、**敌人**（Enemy）或 **载具**（Transport）。角色类型决定标记的颜色。\n- **Actor** 是关卡中站在标记上的 Actor。标记的 Actor 只是一个普通引用，不是附加关系。\n- 标记显示为贴地的圆环、一个朝向箭头和它的编号。\n\n## 放置标记和道具\n\n**放置标记**（Place Mark，快捷键 **M**）和 **放置道具**（Place Prop，快捷键 **P**）是点击放置工具。点击放置，可连续点击，按 **Esc** 停止。点击之前，会有一个虚影（圆环和朝向箭头）跟随光标。工具运行时，它的设置显示在一个小面板中。标记的设置有 **Face Stage Centre**（朝向舞台中心）、**Snap To Floor**（对齐地面）和 **Auto Number**（自动编号）。\n\n- 空舞台上的第一个标记是 **玩家**，之后的每一个都是 **NPC**。道具始终使用 **道具** 角色类型。\n- Prop 或 Transport 标记显示为带朝向箭头的占地矩形，而不是虚影人体。道具在 Planner 和视口中都是绿色。\n- 在视口中右键点击，选择 **Framemark > Place Mark Here**，可在你点击的准确位置放置。\n- 舞台工具行中舞台的 **添加标记**（Add Mark）按钮会在舞台前方添加一个标记并选中它。\n\n**根据 Actor 创建标记**（Mark From Actor）需要先选中 Actor。它会在每个选中 Actor 的脚下生成一个标记，朝向与 Actor 相同，并分配该 Actor。如果该 Actor 在这个舞台上已有标记，则改为移动那个标记。**将标记移到 Actor**（Move Mark To Actor）会把每个选中 Actor 已有的标记移到该 Actor 当前站立的位置。右键菜单的 **将其标记移到此处**（Move Its Mark Here）作用相同，如果该 Actor 还没有标记，会提示 “此 Actor 在该舞台上还没有标记。”\n\n手动移动标记：选中舞台（或其上的任意标记），点击标记的圆环手柄，然后用移动或旋转 Gizmo 拖动。只有位置和偏航角（yaw）。已锁定的标记没有反应。\n\n## Mark Order 和名称\n\n新标记按 Naming 中的 Mark 模式命名，如 `Mark_0010`、`Mark_0020` 等。你输入的名称会被保留。参见 [设置与命名参考](11_settings-reference.md)。\n\n**重新编号标记**（Renumber Marks）会重新排列 Mark Order：先是 Player，然后是 NPC、Companion 和 Extra，最后是 Prop，各自保持当前顺序。仍在使用默认名称的标记会得到新编号对应的默认名称。你输入的名称保持不变。\n\n## Layout（布局）\n\n在舞台上选择一个 **Layout**，标记会立即排列，间距由 **Mark Spacing**（标记间距）决定。这是一步撤销。缺少的标记会被添加。超出数量的标记留在原处，并会有消息列出它们。\n\n| Layout 标签 | 标记数 | 排列方式 |\n|---|---|---|\n| **Freeform (leave as is)** | 任意 | 不做任何操作。 |\n| **I - two facing** | 2 | 默认。两人面对面。 |\n| **Reverse I - two back to back** | 2 | 背靠背。 |\n| **Split I - two shoulder to shoulder** | 2 | 肩并肩，朝外。 |\n| **A - three turned in** | 3 | 三人互相朝内。 |\n| **L - three in an L** | 3 | 标记 1 为主导，一个在前方，一个在拐角处。 |\n| **T - two talk, one observes** | 3 | 标记 1 和 2 交谈，标记 3 旁观。 |\n| **Split T - two against one** | 3 | 标记 2 和 3 对着标记 1。 |\n| **V - three facing out** | 3 | 全部朝外，隔肩对话。 |\n| **O - ring** | Layout Count | 面向中心的环形。 |\n| **U - arc, open to camera** | Layout Count | 一侧朝向摄像机敞开的弧形。 |\n\n**Layout Count**（默认 5，至少 4）只在 O 和 U 时显示。**Mark Spacing** 是标记 1 和标记 2 之间的距离，单位为厘米。它决定间距，也决定镜头看起来有多紧。\n\n**重新应用布局**（Re-apply Layout，**舞台** 组）会在你把标记拖乱之后，把它们恢复成原来的形状。**应用布局**（Apply Layout）命令仍然存在，但在页面上被隐藏，因为选择 Layout 时就已经应用了。\n\n## 朝向\n\n- **朝向标记方向**（Orient To Mark）让 Actor 采用标记的朝向（只有偏航角）。开启时朝向箭头是实心的，关闭时是带虚线杆的空心箭头。\n- **Facing Offset** 为 **Auto** 或 **Manual**。选择 **Manual** 时，**Facing Offset Degrees** 会让角色相对标记方向转动一个角度。\n- 放置标记设置中的 **Face Stage Centre** 会让新标记指向舞台中心。\n- 舞台上的 **Flip Line Of Action** 会交换允许摄像机所在的那一侧。\n\n## 堆叠：同一位置上的标记\n\n位于同一位置的标记会显示数量，如 **x3**，最上面的一个显示编号。\n\n| 命令 | 描述 |\n|---|---|\n| **上移一层**（Bring Forward） | “将所选标记上移一层。” |\n| **置于顶层**（Bring To Front） | “将所选标记绘制在最上层，点击时优先选中它们。” |\n| **下移一层**（Send Backward） | “将所选标记下移一层。” |\n| **置于底层**（Send To Back） | “将所选标记绘制在其他标记下方。” |\n| **分散标记**（Spread Marks） | \"Move marks that share a spot onto a small circle, keeping their facing.\"（把共用同一位置的标记移到一个小圆圈上，并保持它们的朝向。） |\n| **循环选择叠放的标记**（Cycle Stacked Mark） | “选择叠放在同一位置的下一个标记。再次单击该叠放处效果相同，Shift+单击则往回选。” |\n\n右键点击 **分散标记** 可选 **排成一行**（Row，“沿舞台宽度按编号顺序排列标记。撤销可还原。”，按编号顺序把标记在舞台上排成一行，撤销可还原）、**圆形**（Circle，\"Puts the marks on a small circle round the spot.\"，把标记放到该位置周围的小圆圈上）和 **按朝向**（By Facing，\"Pushes each mark out the way it faces.\"，把每个标记沿其朝向推出去）。排列命令的右键标题是 “标记重叠时”，展开命令的标题是 “拆开堆叠”。**选择下方的下一个标记**（Select Next Mark Underneath）是 Cycle Stacked Mark 的右键形式。\n\n**排列顺序**（Arrange Order）决定哪个标记绘制在最上面。数字越大，绘制越靠上。它不是 Mark Order。\n\n## 标记属性\n\n以下按细节面板（Details panel）中显示的顺序排列。\n\n### Mark\n\n| 属性 | 描述 |\n|---|---|\n| **Mark Name** | 默认为 \"Mark 1\"。 |\n| **Actor** | 站在标记上的 Actor。 |\n| **角色类型** | Player、NPC、Companion、Prop、Extra、Enemy 或 Transport。 |\n| **Prop Footprint** | 默认 60 x 60 厘米。仅用于 Prop 和 Transport。 |\n\n### Notes\n\n| 属性 | 描述 |\n|---|---|\n| **动作**（Action） | 在这个标记上发生什么。 |\n| **台词**（Line） | 在这个标记上说的台词。支持多行。 |\n\n选中标记时，备注显示在面板中；在眼睛菜单中勾选 **备注**（Notes）后，备注也显示在视口中。\n\n### Look\n\n| 属性 | 描述 |\n|---|---|\n| **Show Preview Character** | 默认开启。在标记处显示一个角色，用来判断身高和间距。分配 Actor 后会自动关闭。 |\n| **Custom Colour** | 勾选后覆盖角色类型颜色。 |\n| **颜色**（Colour） | 标记自己的颜色。自定义颜色优先于角色类型颜色。 |\n| **Preview Character** | 高级。这个标记自己的预览角色。优先于舞台的预览角色。 |\n\n![关卡视口中的标记：空标记显示黄色预览角色，已分配的标记显示其 Actor](media/vp_marks_lights.jpg)\n\n### Actor\n\n| 属性 | 描述 |\n|---|---|\n| **标记顺序** | 标记的编号。最小为 1。 |\n| **固定到标记**（Pin To Mark） | 默认开启。“在整个序列中让 Actor 的轨道固定在该标记上。” |\n| **朝向标记方向** | 默认开启。“Actor 会转向标记所指的方向。” |\n| **高度对齐**（Height Snapping） | **Snap To Floor** 会把 Actor 放到标记下方的地面上。**Keep Mark Height** 则保持标记自身的高度，用于抬高的位置。 |\n| **序列轨道**（Sequence Track） | “舞台序列中跟随此标记的轨道。” |\n| **Facing Offset**、**Facing Offset Degrees** | 参见“朝向”。 |\n| **排列顺序** | 高级。 |\n| **Pivot Height** | 高级。 |\n| **Snap To Floor At Runtime** | 高级。 |\n\n### Camera\n\n| 属性 | 描述 |\n|---|---|\n| **允许生成摄像机**（Allow Camera Generation） | 默认开启。第一人称视角标记请取消勾选，它会显示视锥而不是虚影，也不会生成朝向它的摄像机。当项目类型为 First Person Game 时，该项被锁定为开启。 |\n| **Default Camera**、**Close Camera**、**Wide Camera** | 高级。 |\n\n### Players\n\n| 属性 | 描述 |\n|---|---|\n| **Player Index** | 默认 -1。保持为 -1 的 Player 标记按玩家 0 计算。 |\n| **Binding Tag** | 高级。序列轨道绑定所用的标签。如果为空，则使用 Mark Name。 |\n\n道具显示 Mark Name、Actor、Prop Footprint、Role、Notes、Look，然后是 Actor 各行。Players 和 Camera 会被隐藏。\n\n## 角色类型颜色\n\n颜色按角色类型区分，在视口、平面图和导出中一致。默认值沿用剧本分解的颜色：Player 红色，Companion 绿色，NPC 黄色，Enemy 橙色，Prop 紫色，Transport 粉色，Extra 深灰色。可在 **Editor Preferences > Plugins > Framemark Marks > Role Colours** 中修改。标记自己的 **Custom Colour** 优先。\n\n在视口中，悬停会使圆环变亮并显示名称。选中的标记有白色内圈、蓝色手柄和高度标签。锁定的标记保持颜色，圆环变为虚线，并在深色底板上显示挂锁。只有标记离开地面时才显示高度，例如 \"0.25 m above floor\"（高于地面 0.25 米）。\n\n## 标记外观和预览角色\n\n在舞台的 **Look**、**标记**（Marks）下：\n\n| 属性 | 描述 |\n|---|---|\n| **样式**（Style） | **Ring**、**Decal**、**Mesh** 或 **自定义**（Custom）。 |\n| **Asset** | Decal 或 Mesh 资产。 |\n| **Preview Character** | 用于 **自定义**：在每个标记上显示这个角色。标记自己的 Preview Character 优先。 |\n| **尺寸**（Size） | 圆环半径，默认 35 厘米，范围 15 到 80。 |\n| **不透明度**（Opacity） | 默认 1，范围 0.1 到 1。 |\n| **Height Pin** | **Always**、**Selected** 或 **关闭**（Off）。 |\n| **颜色** | **By Role** 或 **One**。 |\n| **One Colour** | Colour 为 **One** 时使用的颜色。 |\n\n在 Planner 中，**Planner Mark Look**（**Ring**、**Shoulders** 或 **自定义**）决定角色标记的绘制方式。参见 [Planner（规划器）](07_planner.md)。\n\n## 把演员安排到标记上\n\n| 命令 | 描述 |\n|---|---|\n| **分配到标记**（Assign To Mark） | 打开带搜索框（“搜索标记”）的标记列表。选择一个标记，把选中的 Actor 放到上面。**Pick In Viewport**（\"click a mark in the viewport and this actor goes on it. Clicking anywhere else cancels.\"，在视口中点击一个标记，这个 Actor 就会放到它上面。点击其他任何位置则取消。）完成后显示 \"Put {actor} on Mark {n}.\"（已把 {actor} 放到标记 {n} 上。） |\n| 右键 **分配 Actor**（Assign Actor） | **Selected: {name}** 把选中的 Actor 放到这个标记上。**Nearby: {name}** 把站在标记附近的 Actor 放到上面。**清除**（Clear）把 Actor 从标记上移除。 |\n| **将 Actor 对齐到标记**（Snap Actors To Marks） | 立即把每个已分配的 Actor 放回它的标记上。 |\n\n如果把 Actor 分配给一个在舞台序列中带有变换轨道的标记，Actor 会保持在序列所指定的位置。消息会说明你可以使用 **为标记设关键帧**，或在 Editor Preferences 中开启 **Key When Assigning Sequenced Actor**。\n\n运行时有三种方式把 Actor 绑定到标记：标记的 **Actor**；与标记的绑定标签匹配的 **Actor Tag**（需开启 **Auto Bind Actors By Tag**）；以及按 **Player Index** 匹配的本地玩家 Pawn（需开启 **Auto Bind Players**）。参见 [序列与绑定](06_sequences.md)。\n\n## Key To Mark（键入标记）\n\n从一个标记走到另一个标记的 Actor 需要关键帧。这里的序列就是舞台的关卡序列。\n\n1. 在 Sequence 页面按 **打开序列**（Open Sequence）。\n2. 把 Sequencer 播放头停在 Actor 应该到达的时间点。\n3. 在关卡视口中右键点击 Actor，选择 **Framemark > Key To Mark**，或按 **K**，然后选择标记。\n\n在该时间点会添加一个变换关键帧，把 Actor 放到标记上。会遵循 **朝向标记方向** 和 Height Snapping。如果 Actor 还没有变换轨道，会创建一个。这是一步撤销。在另一个时间点重复操作，即可对应下一个标记。\n\n如果无法运行，消息会说明原因：“请在舞台上选择一个标记以设置关键帧。”、“请选择要关键帧到该标记的 Actor。”、“将 Actor 关键帧到标记之前，请先停止在编辑器中运行。”或 “请先在 Sequencer 中打开舞台的序列（打开序列），然后将播放头移到 Actor 应到达标记的位置。”（请先在 Sequencer 中打开舞台的序列（Open Sequence），然后把播放头移到 Actor 应该到达标记的位置。）\n\n**关键帧会跟随它们的标记。** 之后移动标记时，在它上面创建的关键帧会随之移动，且属于同一步撤销。你手动修改过的关键帧不再跟随。如果标记移动时序列是关闭的，打开它时会询问：**关键帧已过期**（Keys Out Of Date），\"{n} keys in {sequence} were keyed to marks that have moved since. Update them to follow the marks?\"（{sequence} 中有 {n} 个关键帧所对应的标记已经移动。要更新它们以跟随标记吗？），选项有 **更新**（Update）、**保持不变**（Leave）和 **不再询问**（Don't ask again）。可用 **Keys Follow Marks**（Editor Preferences，Sequence）关闭跟随。你的回答会保存为 **Keys Out Of Date On Open**。\n\n## Setup（布局组）\n\n![带有四个布局组的 Setups 选项卡](media/fm_setups.png)\n*Lamp Room 的 **布局组**（Setups）选项卡：每个布局组列出它的标记、Actor 和摄像机，并带有可见性和锁定开关。*\n\n布局组（setup）是一个已命名的标记、摄像机和灯光的组合，可以一起显示、虚化、独显或锁定。\n\n1. 在舞台上选择标记、摄像机或灯光。\n2. 按 **新建布局组**（New Setup，“用所选的标记、摄像机和灯光创建新布局组。每个新布局组都有自己的颜色。”，用你选中的标记、摄像机和灯光创建一个新布局组。每个新布局组有自己的颜色。），或右键选择 **Group > Add To Setup**。\n\n如果没有选中任何内容，会提示：“请先在舞台上选择标记、摄像机或灯光。”\n\n**布局组选项卡**（Setups Tab）会打开一个可停靠的面板，每个布局组一行：\n\n| 控件 | 描述 |\n|---|---|\n| 眼睛 | “显示或隐藏此布局组。Alt+点击仅显示此布局组；再次 Alt+点击显示全部布局组。” |\n| 锁 | \"Lock or unlock this setup.\"（锁定或解锁这个布局组。）被锁定的标记不能被点击或拖动，被锁定的成员 Actor 的位置也会被锁定。 |\n| 色块 | \"Click to change this setup's colour.\"（点击更改这个布局组的颜色。） |\n| 名称 | “按 F2 或使用右键菜单重命名” |\n| 计数 | \"{n} marks, {n} actors\"（{n} 个标记，{n} 个 Actor）。 |\n| 标题栏眼睛 | **全部显示**（Show All）：\"turns off solo and shows every setup.\"（关闭独显并显示所有布局组。） |\n| **新建布局组**、**删除**（Delete） | **删除**：“删除所选布局组。其标记和 Actor 仍保留在舞台上。” |\n| 搜索 | “搜索布局组、标记和 Actor” |\n| **Ghost** 勾选框 | \"hidden setups stay in the viewport as faint ghosts instead of disappearing.\"（隐藏的布局组会以淡淡的虚影留在视口中，而不是消失。） |\n| **重影不透明度**（Ghost Opacity） | “重影布局组的不透明度。0 为不可见，1 为完全不透明。” |\n\n双击一行可选中布局组中的所有内容。可在布局组之间拖动成员：按住 **Ctrl** 为复制。右键菜单有 **独显布局组**（Solo Setup）、**重命名布局组**（Rename Setup）、**从布局组移除**（Remove From Setup）、**复制到布局组**（Copy To Setup）、**移到布局组**（Move To Setup）和 **删除布局组**（Delete Setup）。只有附属于这个舞台的对象才能加入布局组。没有舞台时：“选择一个舞台以查看其布局组。”没有布局组时：“暂无布局组。请选择标记并点击“新建布局组”。”\n\n布局组会保存它的 Name、Colour、Visible 和 Locked 状态，以及它的标记、成员和备注。**显示所有布局组**（Show All Setups，Shoot 页面）会清除独显。\n\n> **注意：**虚化只是让标记变暗，并不会让它变透明。不是标记的成员 Actor 无法变暗，所以当其布局组不显示时，它们会被直接隐藏。\n\n## Marks Table（标记表）\n\n![包含七个标记的舞台的 Marks Table](media/fm_marks_table.png)\n*Marks Table：Mark Order、名称、角色类型、Actor、固定和朝向开关以及 Height Snapping，每个标记一行。*\n\n**标记表** 会打开一个包含舞台上所有标记的表格，方便你一起编辑它们。\n\n| 列 | 描述 |\n|---|---|\n| **标记顺序** | “标记在舞台上的顺序：显示在其徽标和扇形中的编号。单击可更改。” |\n| **名称**（Name） | “标记的名称。单击可重命名。” |\n| **角色类型** | “站在标记上的人或物。” |\n| **Actor** | “关卡中站在标记上的 Actor。” |\n| **固定到标记** | 把 Actor 的轨道固定到标记上。 |\n| **朝向标记方向** | Actor 转向标记所指的方向。 |\n| **高度对齐** | Snap To Floor 或 Keep Mark Height。 |\n| **序列轨道** | 跟随这个标记的轨道。 |\n| **布局组** | “此标记所属的布局组。” |\n| **动作** | “此标记上发生的动作。” |\n| **台词** | “在此标记上说的台词。” |\n| **排列顺序** | “多个标记叠放在同一位置时，哪个标记绘制在上层。数字越大越靠上。这不是标记顺序。” |\n\n每次编辑都是一步撤销，例如 **设置标记顺序**（Set Mark Order）或 **重命名标记**（Rename Mark）。各列属于工作区的一部分。\n\n## 路径\n\n走、跑、转身和摄像机路径在 Planner 中绘制，并作为 **Moves** 存储在舞台上。每个移动有类型（Walk、Run、Turn 或 Camera）、起点和终点的 Mark Order、路径点、持续时间、开始时间和一条备注。参见 [Planner（规划器）](07_planner.md)。\n\n## 锁定、复制和删除\n\n右键 **复制一份**（Duplicate）会复制标记（“复制标记”）。**删除** 会删除标记并跳过已锁定的标记：\"{n} mark(s) deleted, {n} locked mark(s) left.\"（已删除 {n} 个标记，剩余 {n} 个已锁定的标记。）**锁定**（Lock）和 **解锁**（Unlock）在同一组中。\n\n## 已知限制\n\n- 只有在其舞台或舞台上的某个标记被选中时，标记才能在视口中被点击。\n- 如果标记所在的布局组被锁定，该标记无法拖动。\n\n## 另请参阅\n\n- [舞台和 Stage Asset](03_stages.md)\n- [摄像机与灯光](05_cameras-and-lights.md)\n- [序列与绑定](06_sequences.md)\n- [Planner（规划器）](07_planner.md)\n- [键盘快捷键参考](13_shortcuts.md)\n"}, {"file": "05_cameras-and-lights.md", "slug": "cameras-and-lights", "title": "摄像机与灯光", "md": "# 摄像机与灯光\n\nFramemark 摄像机是带有 **Stage Camera**（舞台摄像机）组件的过场动画摄像机 Actor（Cine Camera Actor）。该组件记录镜头覆盖哪些标记、景别以及镜头描述。灯光是普通的虚幻引擎灯光，或者是附加到舞台并瞄准标记的 灯光装置。除非你要求，否则不会自动生成任何东西：摄像机和灯光都是逐个放置的。本页介绍 **Shoot** 页面、**设为视口视角**（Set To Viewport）、景别、**摄像机预设**（Camera Preset）、链接、第一人称和 **Hybrid**（混合）、摄像机格式、灯光，以及 **灯光组**（Light Rig）类型。\n\n## 前提条件\n\n- 一个至少有一个标记的舞台。参见 [标记与走位](04_marks-and-blocking.md)。\n- 使用 Light Rig 类型需要：**Framemark Light Rig Bridge** 插件和灯光装置插件。\n\n## 放置摄像机\n\n1. 在工具栏上选择 **放置摄像机**（Place Camera，快捷键 **C**）。\n2. 在关卡视口（Level Viewport）中点击。放置时，摄像机会瞄准最近标记的视线高度。摄像机高度在工具的设置中设定。\n3. 继续点击可放置更多摄像机。按 **Esc** 停止。\n\n或者右键点击并选择 **Framemark > Place Camera Here**。舞台的 **添加摄像机**（Add Camera）按钮会在舞台上添加一个摄像机并选中它。如果眼睛菜单中的 **摄像机**（Cameras）未勾选，消息会显示 “摄像机已放置。由于“显示摄像机”已关闭，它处于隐藏状态。”\n\n摄像机按命名预设命名，默认为 `{seq}_{shot}_{subject}_{type}`：序列代码、镜头编号、主体和镜头类型。可在 **Editor Preferences > Framemark > Naming** 中更改模式，参见 [设置参考](11_settings-reference.md)。镜头和它覆盖的标记会显示在视口标签上，例如 `SH0010  50mm  2>1`。\n\n## Set To Viewport（设为视口）\n\n1. 把关卡视口飞到你想要的构图。\n2. 选中摄像机。\n3. 在 Shoot 页面按 **设为视口视角**，或使用摄像机的 **Set To Current Viewport** 函数。\n\n摄像机一步就会采用视口的位置、旋转和视野（Field of View）。这不是实时链接。再次移动视口后，需要再按一次。选中舞台摄像机时，右键菜单中也有同样的入口。\n\n**通过摄像机观看**（Look Through，**Ctrl+Shift+P**）会让关卡视口通过选中的舞台摄像机进行导航，与虚幻引擎自己的 Pilot 相同。组件的 **Look Through This Camera** 函数作用相同。\n\n## Shoot 页面\n\n![Shoot 页面](media/ui_page_shoot.png)\n\n\"Cameras and lights, linking and setups.\"（摄像机和灯光、链接以及布局组。）\n\n| 按钮 | 描述 |\n|---|---|\n| **设为视口视角** | 见上文。 |\n| **通过摄像机观看** | 让视口通过摄像机导航。 |\n| **摄像机预设** | 批量创建摄像机。 |\n| **跟随**（Follow） | 选中子对象，最后选目标。它们会跟随目标的位置和旋转。 |\n| **朝向**（Look At） | 选中这些对象，最后选目标。摄像机使用自己的注视追踪。其他对象会得到一个旋转约束。 |\n| **取消链接**（Unlink） | “移除所选 Actor 上的所有 Framemark 链接。若要让 Actor 不再随舞台移动，请使用“从舞台分离”。”只会移除 Framemark 创建的约束。 |\n| **新建布局组**（New Setup）、**显示所有布局组**（Show All Setups）、**布局组选项卡**（Setups Tab） | 参见 [标记与走位](04_marks-and-blocking.md)。 |\n\n右键的 **链接**（Link）组有 **跟随**、**朝向**、**位置**（Position，“其他所选 Actor 仅跟随最后选中 Actor 的位置。”，其他选中的 Actor 只跟随最后选中的 Actor 的位置。）和 **旋转**（Rotation，\"... rotation only.\"，只跟随旋转。），标题为 “最后选择目标”。链接封装了虚幻引擎自己的变换约束。在 Planner 中，让摄像机停止追踪标记的按钮也叫 **取消链接**。\n\n## 景别\n\n| 景别 | 名称 | 画面 |\n|---|---|---|\n| 1 | **Full Close Up** | 肩部上方。 |\n| 2 | **关闭**（Close） | 胸部中段。 |\n| 3 | **Medium** | 腰部。默认值。 |\n| 4 | **Medium Full** | 大腿。 |\n| 5 | **Full** | 整个主体。 |\n\n## Stage Camera 属性\n\n在 **Stage Camera** 类别中：\n\n| 属性 | 描述 |\n|---|---|\n| **注视标记**（Look At Mark） | 这个摄像机注视的 Mark Order。默认 1。 |\n| **Look From Mark** | 这个摄像机越过其肩部拍摄的 Mark Order。默认 0，表示无。 |\n| **Shot Scale** | 五种景别之一。 |\n| **内景**（Interior）、**Use Interior Suffix** | 内景或外景，以及名称是否带内景后缀。 |\n| **Camera Mode** | **过场动画**（Cinematic）或 **Game**。 |\n| **Cropped Aspect Ratio** | 仅 Game 模式。默认 1.7778，范围 0.5 到 4。 |\n| **Tracking Look At Mark** | 只读。摄像机正在追踪的标记。 |\n\n**镜头**（Shot）类别包含 **Shot Description**、**剧本 / 分镜参考**（Script / Board Ref）、**摄像机角度**（Camera Angle）、**摄像机运动**（Camera Move）、**音频**（Audio）、**主体**（Subject）、**引用**（References）、**Other Fields** 和 **Show Cone In Plan**。\n\n该组件有以下编辑器按钮：**Aim At Look At Mark**、**Track Look At Mark**、**清除朝向目标**（Clear Look At）、**Set To Current Viewport**、**Rename From Marks** 和 **Look Through This Camera**。\n\n### Framemark Details 中的摄像机行\n\n| 行 | 描述 |\n|---|---|\n| **Lens Choice**（Cinematic） | 镜头列表以 **Universal Zoom** 开头，然后是其他变焦镜头，再是从最短到最长的定焦镜头。 |\n| **焦距**（Focal Length）、**Aperture** | 标准摄像机数值。 |\n| **Manual Focus Distance** | 单位为厘米。**Sample Scene Depth** 吸管可从场景中拾取该值。 |\n| **Look At Target** | |\n| **Filmback** | 虚幻引擎的胶片背板预设。 |\n| **Horizontal FOV**（Game 模式） | 游戏默认视野为 75 度。 |\n| **FOV Preset** | **90 度（第一人称）**（90 degrees (first person)）、**80 度（第一人称，主机）**（80 degrees (first person, console)）、**70 度（第三人称）**（70 degrees (third person)）。 |\n| **Crop Preset**、**Cropped Aspect Ratio** | Game 模式的裁切。 |\n| **Anamorphic**、**Squeeze Factor** | 1.33x、1.5x 或 2x。 |\n| **Camera Mode** | Cinematic 或 Game。 |\n| **Screen Width**、**Viewing Distance**、**Match Screen** | Game 模式的视野计算器。结果：**Screen Matched FOV**、**Vertical FOV**、**Focal Length On Filmback**（全部只读）。 |\n| **Debug Focus Plane** | 绘制对焦平面。 |\n\n### 摄像机格式\n\n舞台摄像机格式包括：Super 35 4-perf（1.85、2.39 和开放画框）；Super 35 3-perf；35mm 4-perf 2x 变形；大画幅（含 1.5x 和 2x 变形）；65mm 数字（含 1.25x 变形）；VistaVision 8-perf；IMAX 15/70；全画幅静态照片（含 1.5x 和 2x 变形）；以及 Game 16:9。可在 **Editor Preferences > Framemark > Cameras** 中添加你自己的格式。**将格式应用到摄像机**（Apply Format To Cameras）会应用到舞台上的所有摄像机。\n\n## Camera Preset（摄像机预设）\n\n**摄像机预设** 是需要主动选择的批量选项。它会为每个有序标记对、每个列出的景别各创建一个摄像机，所以三个标记配三种景别就是十八个摄像机。构图遵循动作线、四分之三角度和短边规则（short-siding）。它会跳过 Prop 标记和第一人称视角标记。在你按下之前不会发生任何事。请把每个结果当作起点。\n\n它需要至少一个标记，以及 **Preset Shot Scales** 中至少一个条目。它也在舞台的 Stage Tools 行中（Place 组）。\n\n| 舞台属性（Camera Preset 类别） | 描述 |\n|---|---|\n| **Preset Shot Scales** | 要创建的景别。 |\n| **Include Master** | 默认开启。添加一个主镜头。 |\n| **Interior Suffix** | 默认关闭。 |\n| **内景** | 默认开启。 |\n\n摄像机名称的顺序不是选项：摄像机名称来自标记。\n\n## 第一人称和 Hybrid\n\n把舞台的 **View Mode**（Playback 类别）设为：\n\n- **Framed**：默认。标记是摄像机的构图位置。\n- **First Person**：标记成为走位，而不是构图。在玩家的标记上勾选 **Point Of View**（显示为反向的 **允许生成摄像机**）。它会显示视锥而不是虚影，也不会生成朝向它的摄像机。**构建序列**（Build Sequence）不会创建 Camera Cuts 轨道，所以玩家保留自己的摄像机。\n- **Hybrid**：从玩家视角开始，在你放置了舞台摄像机的地方切换到这些摄像机。如果舞台有摄像机，Build Sequence 会创建 Camera Cuts 轨道。\n\n## 放置灯光\n\n![关卡视口中的 Lamp Room，带有舞台摄像机和灯光](media/vp_marks_lights.jpg)\n\n1. 选择 **放置灯光**（Place Light，快捷键 **L**）。\n2. 在工具的弹出菜单中选择类型。\n3. 在关卡视口中点击。放置灯光时以及在虚影上，它会瞄准 15 米范围内最近标记的视线高度。如果范围内没有标记，则保持原来的瞄准方向。灯光高度在工具的设置中设定。\n\n| 弹出菜单项 | 描述 |\n|---|---|\n| **聚光源**（Spot Light） | ““放置灯光”会放置聚光源：朝向光标下方地面的锥形光。” |\n| **点光源**（Point Light） | ““放置灯光”会放置点光源：向各个方向发光。” |\n| **矩形光源**（Rect Light） | ““放置灯光”会放置矩形光源：柔和的面板光，类似柔光箱。” |\n| 预设 | 你的灯光预设，加上 Directional。 |\n| **灯光组** | 见下文。 |\n\n**Light Type** 可以是 Spot、Point、Rect、Directional、Preset 或 Rig。**预设**（Preset）使用在 Preset 列表中选中的预设。预设位于 **Editor Preferences > Framemark > Lights**：每个预设有名称、要生成的 Actor（任何灯光 Actor 都可以，所以 灯光装置或灯光蓝图也行）、强度、颜色、照射范围和锥角。Spot Rim、Point Fill 和 Rect Key 已预置，**Default Preset** 指定 Place Light 首先使用哪一个。预设名称中包含角色词（key、fill、rim、background、hair、kick、ambient、practical、bounce）时，灯光就会获得该角色。\n\n灯光按 `lgt_0010`、`lgt_0020` 命名。在 Light 名称模式中，`{type}` 是 Spot、Point、Rect 或 Directional，`{role}` 是预设名称中的角色词，`{subject}` 是灯光所瞄准的标记上的角色。\n\n如果眼睛菜单中的 **灯光**（Lights）未勾选，消息会显示 “灯光已放置。由于“显示灯光”已关闭，它处于隐藏状态。”\n\n### 灯光属性\n\n| 属性 | 描述 |\n|---|---|\n| **注视标记** | 灯光瞄准的 Mark Order。0 表示无。 |\n| **Aim Height** | 单位为厘米。0 表示标记的视线高度。 |\n\nFramemark Details 首先显示 **Intensity**、**Intensity Units**、**Light Colour**、**Use Temperature** 和 **Temperature**，然后是 **注视标记** 和 **Aim Height**，再是 **Inner Cone Angle**、**Outer Cone Angle**、**Attenuation Radius**、**Source Radius**、**Soft Source Radius** 和 **Source Length**。\n\n### Light Rig 类型\n\n**灯光组** 项会在最近的标记上放置一个灯光装置。它的提示文字是：““放置灯光”会在最近的标记上放置一个灯光组。围绕角色移动即可设定主光的来向；灯光组会跟随站在该标记上的人。”没有 Bridge 时它是灰色的，从不隐藏，提示文字会说明要开启哪个插件。\n\n1. 选择 **放置灯光**，然后在弹出菜单中选择 **灯光组**。\n2. 把光标移到标记附近。如果附近没有标记，消息会显示 “将光标移到标记附近以放置灯光组：它会为该标记上的角色打光。”\n3. 点击。灯光装置会以 **放置灯光组**（Place Light Rig）的形式放置，作为舞台成员，并带有标签 `Framemark.Light`。\n\n灯光装置会跟随标记上的 Actor。当你在标记上安排另一个 Actor 时，灯光装置会移到他们身上。再次放置到已经有灯光装置的角色上，会重新瞄准它的主光，而不是再添加第二个。放置到空标记上会在标记的视线高度创建一个待命的灯光装置。被清空的标记会让灯光装置留在原处。Planner 的 Light 工具放置的是普通灯光，不是灯光装置。\n\n![灯光装置跟随前后的角色](media/lt_rig_toggle.gif)\n\n## 摄像机和灯光的外观\n\n在舞台的 **Look**、**Cameras and Lights** 下：\n\n| 属性 | 描述 |\n|---|---|\n| **Display** | **Sprite** 或 **UE Mesh**。 |\n| **尺寸**（Size） | 默认 40 厘米，范围 10 到 200。 |\n| **Always Face The Camera** | 默认开启。 |\n| **Show Name Label** | 默认开启。摄像机会附加镜头和覆盖信息，例如 `SH0010  50mm  2>1`。 |\n| **Show On Top Of Everything** | 默认关闭。 |\n\n放置之后，摄像机和灯光保留虚幻引擎自己的图标。Framemark 的精灵图只显示在放置时跟随光标的虚影上。灯光的图标采用灯光的颜色。\n\n## 已知限制\n\n- 隐藏摄像机和灯光是按舞台设置的，并持续到编辑器关闭。\n- Camera Preset 的结果只是起点，需要检查。\n\n## 另请参阅\n\n- [标记与走位](04_marks-and-blocking.md)\n- [序列与绑定](06_sequences.md)\n- [设置与命名参考](11_settings-reference.md)\n- [配套插件](12_integrations.md)\n"}, {"file": "06_sequences.md", "slug": "sequences", "title": "序列与绑定", "md": "# 序列与绑定\n\n一个舞台拥有一个**关卡序列**（Level Sequence）。**序列**（Sequence）页面根据舞台构建它，在标记移动时让它保持同步，并在编辑器和运行时把 Actor 绑定到它上面。你可以用它从走位直接得到 Sequencer 时间轴，而不必手动连接轨道，并保持镜头之间的连续性。\n\n## 前提条件\n\n- 一个带标记的舞台，以及你想要的任何摄像机。参见 [舞台和 Stage Asset](03_stages.md)。\n\n## 概念\n\n- **构建序列**（Build Sequence）会创建或更新舞台的关卡序列，名称按 Level Sequence 模式命名（默认 `LS_<Stage>`）。它会创建一个可拥有对象（**Possessable**），带有一条用于舞台摄像机的 Camera Cuts 轨道，以及每个标记一条带标签的轨道。再次运行只会添加缺少的内容。它绝不会编辑或覆盖你制作的动画。\n- First Person 舞台没有 Camera Cuts 轨道。如果舞台有摄像机，Hybrid 舞台会有。\n- 标记的绑定标签和它轨道的标签始终是同一个字符串：即 **Binding Tag**，如果标签为空则为 **Mark Name**。\n- 一个舞台可以有多个序列。**活动序列**（Active Sequence）是舞台播放和工作所用的那个。\n- 与某个副本共用序列的舞台在构建时会得到自己的序列：“This stage shared a sequence with a copy, so it now has its own.”（这个舞台与一个副本共用了序列，所以它现在有了自己的序列。）\n\n## Sequence 页面\n\n![Sequence 页面](media/ui_page_sequence.png)\n\n“Build the Level Sequence and keep it in step with the stage.”（构建关卡序列，并让它与舞台保持同步。）\n\n| 按钮 | 描述 |\n|---|---|\n| **构建序列** | 创建或更新关卡序列。第一次点击会打开对话框。之后点击会沿用你的选择。**Shift+点击**，或旁边的 **...** 按钮，会再次打开对话框。 |\n| **打开序列**（Open Sequence） | 在 Sequencer 中打开关卡序列。 |\n| **同步到序列**（Sync To Sequence） | 按需移动标记轨道，使其与标记匹配。 |\n| **匹配上一个**（Match Previous）、**匹配下一个**（Match Next）、**从此开始...**（Start From...）、**检查连续性**（Check Continuity） | 连续性工具。见下文。 |\n| **活动序列** | 切换、添加或移除舞台的序列。 |\n\n重新定位工具（Select Stage、Add To Stage、Attach Actors、Detach Actors）在 Stage 页面上。参见 [舞台和 Stage Asset](03_stages.md)。\n\n## 构建序列\n\n![Sequencer 中构建好的序列：Camera Cuts 轨道上每个舞台摄像机对应一个镜头](media/fm_sequencer.png)\n\n1. 选中舞台，或在面板中把它设为活动。\n2. 打开 **序列** 页面，按 **构建序列**。\n3. 在 **构建序列** 对话框中，检查 **舞台**（Stage）行 “要为其构建序列的舞台。”、序列名称和文件夹，以及镜头。对话框打开时已经填好了 Framemark 的名称和文件夹。预览行显示 “Creates {name}”（创建 {name}）或 “Creates {name} with {n} shots, the first {length}”（创建带有 {n} 个镜头的 {name}，第一个时长 {length}），对于已有序列则显示 “Updates {name}. Name, folder and shots are for a new sequence.”（更新 {name}。名称、文件夹和镜头只适用于新序列。）\n4. 可选：设置 **起始于**（Start From） “每个有标记的 Actor 都从它在此序列中的结束位置开始：在新序列开头加一个阶梯关键帧。”。默认值为 **无**（None） “让标记保持原位。”。\n5. 在对话框中按 **构建序列** “用这些设置创建舞台的序列，或将新增内容添加进去。你自己的修改会保留。”。\n\nSequencer 会打开该序列。结果消息显示 “Created {name}: {n} camera track(s), {n} mark track(s).”（已创建 {name}：{n} 条摄像机轨道，{n} 条标记轨道。）、“Updated {name}: added ...”（已更新 {name}：添加了……）或 “{name} is already up to date.”（{name} 已是最新。）\n\n勾选 **不再询问**（Don't ask again）可停止打开对话框：“Ticked: from now on a click runs with these settings. Shift-click or the ... button opens this dialog again. Change it later in Editor Preferences > Framemark > Generate.”（已勾选：从现在起，点击会按这些设置运行。Shift+点击或 ... 按钮会再次打开这个对话框。之后可在 Editor Preferences > Framemark > Generate 中更改。）该对话框的工作方式类似虚幻引擎的 Add Level Sequence with Shots。如果无法创建资产：“Could not create the Level Sequence asset. Check the Sequence Folder on the stage.”（无法创建 Level Sequence 资产。请检查舞台上的 Sequence Folder。）\n\n### Populate（填充）\n\n**Populate** 默认开启（Generate 设置中的 **Characters** 和 **道具**（Props）勾选框）。Build Sequence 和 Generate 会把场景中已链接的演员和道具添加到序列中。已经在关卡中的 Actor 会作为 **Possessable** 添加。不在关卡中的，则根据其链接的蓝图（Blueprint）作为 **Spawnable** 添加。没有链接的演员和道具会被排除。消息显示 “Populate: {n} characters and props added to the sequence.”（Populate：已有 {n} 个角色和道具添加到序列中。）角色在序列中站在自己的标记上，而不是舞台根节点上。\n\n### 轨道设置\n\n可选的空子序列，默认全部关闭，在对话框中或 **Editor Preferences > Framemark > Generate > Track Settings** 中设置：\n\n- **每个镜头**：ANM、FX、LGT、EDL。每个镜头会得到一条类似 `SH_ANM` 的轨道，其中包含类似 `ANM_SH069x00-01` 的序列。\n- **每个序列**：FX、LGT。轨道为 `SQ_FX` 和 `SQ_LGT`，其中包含 `LGT_SQ030-01`。\n\n如果你的工作室使用其他类型名称，请编辑这些名称。名称遵循 Naming 中的 **Shot Sub Sequence** 和 **Sequence Sub Sequence** 模式。参见 [设置与命名参考](11_settings-reference.md)。\n\n### Generate From Screenplay（从剧本生成）\n\nScreenplay 窗口有一个 **生成**（Generate）按钮和一个 **...** 按钮。**从剧本生成**（Generate From Screenplay）对话框增加了 **剧本**（Screenplay）行、**要包含的场景**（Scenes to include），以及三个勾选项：**创建舞台**（Create Stages） “为每个没有舞台的场景创建一个舞台。”、**创建序列**（Create Sequences） “为每个没有关卡序列的场景创建一个关卡序列，以其序列代码命名。”和 **链接现有项**（Link Existing） “场景直接使用已有的舞台或序列，而不是再创建一个。”。**生成** 会为每个勾选的场景创建或链接舞台和序列，角色放在标记上，台词作为对白标记。舞台为 **One Per Location**（默认）或 **One Per Scene**。新舞台按地点的缩写命名，所以 “tiny paris restaurant” 会得到 `STG_TPR_A_v001`。你已有的舞台不会被重命名。参见 [剧本与故事地图](08_screenplay-and-story-map.md)。\n\n## 舞台上的序列属性\n\n| 属性 | 描述 |\n|---|---|\n| **Linked Sequences** | 舞台的关卡序列。第一个是活动序列。 |\n| **Shot Length Seconds** | 默认 4，UI 范围 0.5 到 30。 |\n| **Sequence Folder** | 新序列的创建位置。 |\n| **Hold Marks In Sequence** | 默认开启。高级。 |\n| **Sequence Follows Stage** | 默认开启。舞台是序列的变换原点。 |\n\n## 多个序列\n\n**活动序列** 列出舞台的序列。选择一个即可将其设为活动（“Active sequence: {name}.”，活动序列：{name}。）。它还有 **添加序列**（Add Sequence）和 **移除序列**（Remove Sequence）。添加时显示 “Added {name} to {stage}. It is the active sequence now; the others stay linked.”（已把 {name} 添加到 {stage}。它现在是活动序列；其他序列仍保持链接。）移除时显示 “Removed {name} from {stage}. The sequence itself is kept.”（已把 {name} 从 {stage} 移除。序列本身会保留。）在 Screenplay 窗口中，**更改序列**（Change Sequence）会列出、切换和移除同样的序列。\n\n## 让序列保持同步\n\n开启 **Auto Sync Marks To Sequence**（默认开启，位于 Editor Preferences）后，手动移动标记、选择 Layout、撤销或重做都会在下一个编辑器 tick 移动该标记的 Actor 轨道，使其匹配。带关键帧的动画会随标记移动：现有关键帧按相同的偏移量平移。一次操作中移动的多个标记会被批量处理。PIE 运行期间，或在撤销、重做过程中，它绝不会触发。\n\n**同步到序列** 手动完成同样的事。它会报告 “Moved {n} mark track(s) to match their marks.”（已移动 {n} 条标记轨道以匹配它们的标记。）如果另一个舞台共用该序列，则不会移动任何东西。\n\n## 镜头与舞台链接\n\n当镜头或序列在 Sequencer 中打开时，会显示一个 **舞台** 按钮，内容为 “Stage: {name}” “播放此序列的舞台。可选择、框选它，或在镜头之间匹配 Actor。”。它的菜单标题为 “Stage for this sequence”（这个序列的舞台），包含 **Select {stage}**、**框选舞台**（Frame Stage）、**将标记同步到序列**（Sync Marks To Sequence），以及 **此处的其他舞台**（Other stages here），用于播放这个序列或其某个镜头的舞台。如果没有：“No stage uses this sequence”（没有舞台使用这个序列）。选择一个舞台并使用 **构建序列** 来链接它。\n\n## 连续性工具\n\n在 Sequencer 中打开主序列，并把播放头停在某个镜头内。\n\n| 命令 | 描述 |\n|---|---|\n| **匹配上一个** | “在此镜头的第一帧为每个已标记的 Actor 设置关键帧，位置为其在上一个镜头结束时的位置。”在打开了主序列、且播放头所在的镜头有上一个镜头之前，此项为灰色。 |\n| **匹配下一个** | 在这个镜头的最后一帧，为每个有标记的 Actor 键入它在下一个镜头开始时的位置。 |\n| **将 Actor 匹配到镜头...**（Match Actors To Shot...） | 选择任意其他镜头。在这个镜头之前的镜头在其最后一帧匹配，在这个镜头之后的镜头在其第一帧匹配。 |\n| **从此开始...** | 选择一个序列。每个有标记的 Actor 会在舞台序列的第一帧得到一个阶梯关键帧，位置是它在你所选序列中的结束位置。 |\n| **检查连续性** | 列出在某个镜头中第一帧的位置与上一个镜头最后一帧的位置不一致的 Actor。在打开了包含两个或更多镜头的主序列之前，此项为灰色。 |\n\n消息：“Matched {n} actor(s) to the last frame of {shot}, keyed on the first frame of this shot: {names}.”（已把 {n} 个 Actor 匹配到 {shot} 的最后一帧，并键入到这个镜头的第一帧：{names}。）以及 “Left alone {n} with no matching track or position in that shot”（有 {n} 个在那个镜头中没有匹配的轨道或位置，已保持不变）。如果镜头使用同一个序列：“Those two shots use the same sequence, so there is nothing to match.”（这两个镜头使用同一个序列，所以没有可匹配的内容。）撤销项为 **将 Actor 匹配到镜头**（Match Actors To Shot）。**起始于** 会报告 “Started {n} actor(s) where they end in {sequence}, stepped keys on the first frame: {names}.”（已让 {n} 个 Actor 从它们在 {sequence} 中的结束位置开始，在第一帧使用阶梯关键帧：{names}。）已锁定的序列保持不变。\n\n## 绑定\n\nActor 驱动标记轨道有三种方式：\n\n1. 标记上的 **Actor**：适用于放置在关卡中的任何对象。\n2. **Actor Tag**：开启 **Auto Bind Actors By Tag** 后，标签与标记绑定标签匹配的 Actor 会被自动绑定。生成的 NPC 就是这样被识别的。\n3. **Players**：开启 **Auto Bind Players** 后，本地玩家 Pawn 按 **Player Index**（0、1、2、3）匹配标记。-1 的 Player 标记按玩家 0 计算，所以单人游戏不需要设置。\n\n| 绑定属性 | 描述 |\n|---|---|\n| **Auto Bind Players** | 默认开启。 |\n| **Auto Bind Actors By Tag** | 默认开启。 |\n| **Snap Bound Actors To Marks** | 默认开启。 |\n| **Player End Mark** | 玩家结束时所在的标记（一个名称）。 |\n\n蓝图函数 **Bind Actor To Mark**（Mark Name、Actor、Snap To Mark）和 **Bind Player To Mark**（Player Index、Snap To Mark）可从代码中进行绑定。\n\n### 多个玩家\n\n给每个 Player 标记各自的 **Player Index**。舞台会把每个本地玩家的 Pawn 绑定到带有该序号的标记上。对于玩家 0，会回退到第一个 Player 标记。\n\n![拖动播放构建好的序列，视口锁定到 Camera Cuts](media/fm_sequencer_playback.gif)\n\n### 播放与中断\n\n| 属性 | 描述 |\n|---|---|\n| **Auto Trigger** | Manual、OnBeginPlay 或 WhenPlayerEntersBoundary。 |\n| **Play Once** | 默认关闭。 |\n| **Can Be Interrupted** | 默认关闭。 |\n| **Interrupt Triggers** | 带有重叠事件的 Actor。 |\n| **Interrupt Sequence** | \"Optional sequence to play after an interrupt.\"（中断之后可选播放的序列。） |\n\n蓝图函数 **Play Stage**、**Stop Stage**、**Interrupt Stage** 和 **Reset Has Played** 控制播放。\n\n## 重新定位\n\n开启 **Sequence Follows Stage** 后，移动或旋转舞台，摄像机会随之移动。序列数据本身不会改变。Actor 默认不会被附加。请使用 Stage 页面的 **附加 Actor**（Attach Actors）、**分离 Actor**（Detach Actors）、**添加到舞台**（Add To Stage）、**选择舞台**（Select Stage）和 **将 Actor 对齐到标记**（Snap Actors To Marks）。参见 [舞台和 Stage Asset](03_stages.md)。\n\n## Key To Mark（键入标记）\n\n参见 [标记与走位](04_marks-and-blocking.md)。Key To Mark 在右键菜单中，快捷键是 K。Sequencer 自己的绑定菜单中没有单独的入口。\n\n## 已知限制\n\n- Shot Designer 导入目前只针对一个场景做过检查。\n- 10 月 13 日之前创建的关键帧不会跟随它们的标记。\n\n## 另请参阅\n\n- [标记与走位](04_marks-and-blocking.md)\n- [摄像机与灯光](05_cameras-and-lights.md)\n- [剧本与故事地图](08_screenplay-and-story-map.md)\n- [渲染与发布](10_render-and-publish.md)\n- [故障排除与已知限制](14_troubleshooting.md)\n"}, {"file": "07_planner.md", "slug": "planner", "title": "Planner（规划器）", "md": "# Planner（规划器）\n\n**规划器**（Planner）是一个可停靠窗口，从上方显示你的舞台。你可以在平面图上放置标记、摄像机、灯光和道具，绘制行走路径和摄像机运动，对准镜头，并写下每个镜头中发生的事，全程都在一张平整易读的图上完成。你在 Planner 中做的一切都会编辑关卡视口所用的同一个 Stage Asset，因此平面图和 3D 场景始终保持同步。\n\n从 **Window > Framemark > Framemark Planner** 打开。它的选项卡名为 **规划器**。\n\n> **注意：** **俯视图**（Overhead View）和 **规划器** 是两回事。**俯视图** 会把关卡视口本身切换成自上而下的摄像机。**规划器** 是一个独立窗口，有自己的画布、工具、面板和撤销步骤。你可以任选其一，也可以同时使用。\n\n## 前提条件\n\n- 已启用 Framemark 插件（见[快速入门](01_getting-started.md)）。\n- 已打开一个关卡。关卡中不需要已有舞台：Planner 可以创建一个 **New Stage**（新建舞台），它在你放置之前只以 Stage Asset 的形式存在。\n- 可选：**Framemark Light Rig Bridge** 配套插件和灯光装置插件，用于灯环（见[灯环](#light-ring)）。\n\n## Overhead View 与 Planner\n\n| | Overhead View | Planner |\n|---|---|---|\n| 它是什么 | 视口开关 | 带有独立画布的窗口 |\n| 命令 | **俯视图**（快捷键 **O**） | **Window > Framemark > Framemark Planner** |\n| 工具提示 | “在俯视图和普通 3D 视图之间切换视口。” | “从上方看到的舞台。放置标记、摄像机和灯光，瞄准镜头，并为每个镜头写下其中发生的内容。” |\n| 显示内容 | 从上方看到的真实关卡，以舞台边界取景 | 绘制的平面图：边界、背景图片、标记、路径、摄像机、灯光、道具、草图 |\n| 再按一次 | 恢复之前的视口 | 不适用 |\n\n想在标记下方看到真实的关卡几何体和灯光时，使用 **俯视图**。想要干净的绘图、Shots 面板、图层、对齐、参考线和导出图纸时，使用 **规划器**。\n\n## Planner 窗口\n\n![带有 Lamp Room 舞台的 Planner](media/fm_planner.png)\n*`STG_LampRoom` 上的 **规划器**：工具栏、带有边界、标记和摄像机视锥的平面图画布，以及 Layers、Details 和 Library 面板。*\n\n窗口由顶部栏、工具栏、平面图和一组可停靠面板组成。\n\n1. 顶部栏：舞台选项卡、**New Stage**、舞台选择器、对齐磁铁、**已与关卡同步**（Synced With Level）/ **草稿**（Draft）开关、**快捷轮盘**（Quick Wheel）、**设置**（Settings）。\n2. 工具栏：绘图工具（见[工具](#tools)）。\n3. 平面图：画布。\n4. 面板：**平面图**（Plan）、**镜头**（Shots）、**图层**（Layers）、**细节**（Details）、**库**（Library）、**剧本**（Screenplay），另有一个 **捕获**（Capture）选项卡。\n5. 状态栏：光标位置、对齐、单位和旋转。\n\n### Panels 菜单\n\n每个面板都可以从 **面板**（Panels）菜单显示或隐藏（也在 **设置** 下）。\n\n| 面板 | 内容 |\n|---|---|\n| **平面图** | “从上方看到的舞台：工具侧栏和平面图。” |\n| **镜头** | “每台摄像机一张卡片。点击卡片选择其摄像机，输入此镜头中发生的内容，并将参考图片拖放到卡片上。” |\n| **图层** | 图层列表（见[图层](#layers)）。 |\n| **细节** | 所选对象、背景图片和草图的属性。 |\n| **库** | “Framemark 资产：文件夹、收藏、快速筛选和使用位置。” |\n| **剧本** | “与此舞台关联的场景。”见[剧本与故事地图](08_screenplay-and-story-map.md)。该页面与 **剧本** 窗口等宽。 |\n| **捕获** | “从关卡捕获：舞台下方关卡的俯视捕获图，按正确比例设为背景。” |\n\n### 舞台选项卡\n\n每个打开的 Stage Asset 都有一个选项卡。含有草稿的选项卡在名称后显示 \" *\"。\n\n右键点击选项卡可使用：\n\n- **关闭**（Close）\n- **关闭其他**（Close Others）\n- **关闭右侧**（Close To The Right）\n- **重命名**（Rename）\n- **浏览到资源**（Browse To Asset）\n- **在关卡中打开**（Open In Level）\n\n**New Stage** 会创建 Stage Asset 但不放置它。提示信息为 “已在 {1} 中创建舞台资源 {0}。放置之前它不在关卡中。”使用 “选择舞台” 下拉菜单切换到任何其他舞台。\n\n### Synced With Level 与 Draft\n\n默认情况下 Planner 处于 **已与关卡同步** 状态：在平面图上移动标记，关卡中的标记也会移动。\n\n关闭同步即可在 **草稿** 中工作。此时的编辑只改变 Planner 自己的副本，视口标签显示 “在规划器中起草”。\n\n| 操作 | 结果 |\n|---|---|\n| **保存**（Save，**Ctrl+S**） | \"Every placement in the level updates to it, as one undo step.\"（关卡中的每一处放置都会更新为它，作为一个撤销步骤。） |\n| **另存为**（Save As） | 在自己的选项卡中创建一个新的 Stage Asset。 |\n| 有草稿时重新开启同步 | 弹出提示，提供 **保存并同步**（Save and Sync）、**放弃草稿**（Discard Draft）或 **取消**（Cancel）。 |\n\n> **提示：** 用 Draft 可以在不触碰关卡的情况下尝试三种走位方案。每种都 **另存为**，然后留下你喜欢的那个。\n\n## 工具\n\n从工具栏选择工具，或按它的快捷键。你做的每次编辑都是一个撤销步骤。\n\n| 工具 | 快捷键 | 作用 |\n|---|---|---|\n| **选择**（Select） | **Q** | 点击，拖出方框，按 **Ctrl** 或 **Shift** 添加选择。拖动以移动。按 **E** 并拖动以旋转。 |\n| **Pan** | **Space**（按住） | 拖动以平移。中键或右键也可平移。滚轮缩放。 |\n| **标记**（Mark） | **M** | 点击放置。点击并拖动以设置朝向。 |\n| **摄像机**（Camera） | **C** | \"A camera is a shot.\"（一台摄像机就是一个镜头。）点击放置。 |\n| **浅色**（Light） | **L** | 打开弹出菜单：**Spot**、**点光源**（Point）、**矩形光源**（Rect）。**平行光源**（Directional）可从更改类型列表中选择。 |\n| **道具**（Prop） | **P** | 放置道具。 |\n| **Path** | **W** | 绘制行走、奔跑、转身或摄像机运动。 |\n| **Measure** | **U** | 在平面图上测量距离。 |\n| **草图**（Sketch） | 无 | 开始一个 **新建草图**（New Sketch），或打开已有的草图（安装了 Odyssey 时在 Odyssey 中打开）。 |\n\n如果某个灯光类型没有预设，Planner 会提示 “没有 {0} 预设。请在编辑器偏好设置 > Framemark > Lights 中添加。”\n\n工具栏跟随工作区的工具。不放置任何东西的工具会运行对应的模式命令，**快捷轮盘** 会在平面图上打开。\n\n> **注意：** 选中带灯光的角色或灯组（rig）时，工具栏的分隔线下会出现一条垂直的灯环控件条。见[灯环](#light-ring)。\n\n### 右键菜单\n\n在平面图上右键点击会弹出共用的 Framemark 菜单，其分区与关卡视口的 Framemark 菜单相同：**在此放置标记**（Place Mark Here）、**在此放置摄像机**（Place Camera Here）、**在此放置灯光**（Place Light Here）、Mark、Actor、Edit、Position、Colour、Overlapping Marks、Group、Camera 和 Stage。见 [Framemark 模式界面](02_interface.md)。\n\n右键点击路径会添加路径命令（见[路径](#paths)）。\n\n## 选择、移动和旋转\n\n1. 选择 **选择**（**Q**）。\n2. 点击一个对象，或拖出方框框住多个对象。按住 **Ctrl** 或 **Shift** 可添加到选择中。\n3. 拖动以移动。\n4. 按 **E**，然后拖动以旋转。\n\n选中多个对象时，栏中显示 “已选择 {0} 个”，并提供 **新建布局组**（New Setup）。\n\n已锁定的对象无法删除：“这些内容已锁定。请解锁后再删除。”\n\n## 选择栏\n\n选中对象后，平面图上方会出现一个栏。\n\n### Mark\n\n**角色类型**（Role）、**颜色**（Colour）、**置于顶层**（Bring To Front）、**置于底层**（Send To Back）、**Spread**、**锁定**（Lock）、**复制一份**（Duplicate）、**删除**（Delete）。\n\n### Camera\n\n| 控件 | 说明 |\n|---|---|\n| **镜头焦段**（Lens） | 焦距，显示为 \"{0} mm\"。 |\n| **Cone** | 切换平面图上的视野锥。 |\n| **注视标记...**（Look At Mark...） | 让摄像机对准一个标记。 |\n| **取消链接**（Unlink） | 断开 Look At 链接。 |\n| **通过摄像机观看**（Look Through） | 在关卡视口中导航该摄像机（**Ctrl+Shift+P**）。 |\n| **设为视口视角**（Set To Viewport） | 把摄像机设为当前视口的视角。 |\n| Mark Order 读数 | 显示该摄像机在 Mark Order 中的位置。 |\n\n摄像机的对焦手柄在平面图上是琥珀色，并绘有一条柔和的景深带，延伸到 100 m。在 **细节** 中 **Manual Focus Distance** 旁边，**Sample Scene Depth** 吸管可以让你 “请在摄像机前方选取一个位置。”按 **Esc** 取消。\n\n### Light\n\n- 在 **点光源**、**聚光源**（Spot）、**矩形光源** 和 **平行光源** 之间更改类型。更改会保留位置、颜色、强度和布局。\n- 用适合该灯光的单位设置强度：cd、lm、EV、nits 或 lux。\n- 设置 **Gobo**：Light Function 材质，或矩形光源上的源纹理。\n- 应用灯光预设。\n\n## 路径\n\n路径记录运动。选择 **Path** 工具（**W**），点击添加点，按 **Enter** 或双击结束自由路径。**Esc** 放弃该路径。\n\n### 路径类型\n\n| 类型 | 说明 |\n|---|---|\n| **行走**（Walk） | 角色沿此路径行走。 |\n| **奔跑**（Run） | 角色沿此路径奔跑。 |\n| **转向**（Turn） | \"Turns in place on its mark...\"（在自己的标记上原地转身……） |\n| **摄像机** | 摄像机运动：虚线，带有轨道连接点，位于镜头高度。 |\n\n路径采用其标记的颜色。在导出的平面图中，行走是带一个空心箭头的虚线，奔跑是长而粗的虚线配实心双箭头，转身是细长的虚线弧。\n\n> **注意：** 应用内 **行走** 的工具提示描述为 \"A solid line with one arrow.\"（带一个箭头的实线。）实际绘制的结果是带空心箭头的虚线，导出时看到的也是这样。\n\n### 编辑路径\n\nPlanner 中的提示为：\"Drag the squares to reshape, the round handles to curve. Drop an end on a mark to pin it. Double-click adds a point, Delete removes the picked point or the path.\"（拖动方块以改变形状，拖动圆形手柄以弯曲。把端点放到标记上即可固定。双击添加点，Delete 删除所选点或路径。）\n\n- 路径至少保留 2 个点。\n- 右键点击路径可使用 **在此添加点**（Add Point Here）、**移除点**（Remove Point）、**删除路径**（Delete Path）、**类型**（Kind）选项（**行走**、**奔跑**、**转向**、**摄像机**），以及地面选项 **地面**（Floor）、**避免碰撞**（Avoid Collision）和 **贴合地面**（Level To Floor）。\n- **避免碰撞** 会让路径绕开关卡几何体。**贴合地面** 会把路径放到地面上。\n\n### 原地转身\n\n对于叠放在同一位置的标记，**Turn To / Turn From** 菜单可以创建转身：一个标记从自己的朝向转向下一个标记。\n\n## 边界\n\n边界是舞台的轮廓。边界至少需要 3 个点。\n\n- 拖动条带以移动。\n- 拖动方形点以调整大小。\n- 拖动圆形手柄以弯曲一条边。形状会变为 **自定义**（Custom）。\n- 双击以添加点。\n- 按 **删除** 删除所选点。\n\n使用 **适配边界**（Fit Boundary，**To Stage**）和 **设置边界大小**（Set Boundary Size） / **Shape** 以数值方式设置。见[舞台和 Stage Asset](03_stages.md)。\n\n## 背景图片与草图\n\n在 **图层** 或 **细节** 中选择背景。\n\n| 命令 | 说明 |\n|---|---|\n| **设置背景...**（Set Background...） | 选择一张图片。 |\n| **从关卡捕获**（Capture From Level） | 对关卡做一次自上而下的截取。选项：**View Mode**、**显示**（Show）、**大纲视图**（Outliner）、**子关卡**（Sublevels）、**隐藏高于**（Hide above）、**Resolution**、裁剪、**确认**（Commit）。 |\n| **编辑背景**（Edit Background） | 编辑图片的放置。 |\n| **缩放背景**（Scale Background） | 点击两个点，然后输入 “两点之间的实际距离”，并选择 **应用**（Apply）或 **取消**。 |\n| **清除背景**（Clear Background） | 移除图片。纹理资产会保留。 |\n| **放置到舞台上**（Place On Stage） | 把图片放到舞台上。 |\n\n图片属性：**可见**（Visible）、**不透明度**（Opacity）、**宽度**（Width）、**旋转**（Rotation）、**缩放工具**（Scale tool）。\n\n草图有 **编辑**（Edit）、**新建草图** 和 **刷新底图**（Refresh Underlay）。在 **设置** 下设置 **草图分辨率**（Sketch Resolution）。数值过高会变慢，在某些机器上 8192 很慢。\n\n## 图层\n\n**图层** 面板列出：**背景**（Background）、**边界**（Boundary）、**设置**（Set）、**图片**（Images）、**标记**（Marks）、**摄像机**（Cameras）、**灯光**（Lights）、**草图**，以及 Props。\n\n- 眼睛图标只在平面图上隐藏图层，不会隐藏关卡中的任何东西。\n- 按住 **Alt** 点击眼睛图标，只显示该图层。\n- 锁定会阻止在该图层上拾取。**背景** 默认是锁定的。\n- 拖动抓取手柄可重新排序。**重置顺序**（Reset Order）恢复默认顺序。\n\n右键点击某一行可使用 **全部显示**（Show All）、**仅显示**（Show Only）、**锁定** / **解锁**（Unlock）、**选择图层中的全部**（Select All In Layer）、**重命名**和 **颜色...**（Colour...）。图层颜色保存在 Editor Preferences 中（`PlanLayerColours`，类别 **Overhead**）。\n\n## Shots 面板\n\n**镜头** 面板为每台摄像机放一张卡片。\n\n- 点击卡片以选择对应摄像机。\n- 在描述中输入镜头中发生的事（“此镜头中发生的内容”）。\n- 把图片拖到卡片上即可添加参考图。可以移除它们，或固定其中一张。\n- 点击图片可打开放大图片窗口：滚轮缩放，有滑块，点击百分比可回到 100%。\n\n## 对齐、网格和参考线\n\n对齐磁铁显示 \"Grid snap size: {0}\"。在平面图中按住 **Alt** 可自由移动。\n\n| 设置 | 位置 | 说明 |\n|---|---|---|\n| **吸附到**（Snap To） | **设置** | **吸附到网格**（Snap to Grid）、**吸附到参考线**（Snap to Guides）、**智能参考线**（Smart Guides）。 |\n| **参考线**（Guides） | **设置** | **显示参考线**（Show Guides）、**锁定参考线**（Lock Guides）、**清除参考线**（Clear Guides）。 |\n| **网格大小**（Grid Size） | **设置** | **关闭**（Off）或 \"{0} cm\"。 |\n| `PlannerGridSizeCm` | Editor Preferences，**规划器** | 默认 50 cm。滑块范围 5 到 500。每十格绘制一条主线。 |\n\n要创建参考线，从平面图的上边缘或左边缘拖出。把参考线拖出平面图即可删除。粉色线表示匹配到智能参考线。参考线属于工作区。\n\n拖动时，**Shift** 把移动锁定在一个轴上（横向、纵向或 45 度）。**Alt** 忽略对齐和智能参考线。\n\n## Settings 菜单\n\n| 项目 | 选项 |\n|---|---|\n| **主题**（Theme） | **深色**（Dark）、**浅色** |\n| **单位**（Units） | **米**（Metres）、**英尺**（Feet） |\n| **工具栏位置**（Toolbar Location） | **平面图**、**无**（None） |\n| **面板** | 显示或隐藏每个面板 |\n| **视图**（View） | **重置旋转**（Reset Rotation） |\n| **草图分辨率** | \"{0} px\" |\n| **吸附到**、**参考线**、**网格大小** | 见上文 |\n\n它的工具提示为 \"Planner settings: theme, units, toolbar location, panels and view rotation\"（Planner 设置：主题、单位、工具栏位置、面板和视图旋转）。\n\n### Planner Mark Look\n\n在 Editor Preferences 中，**Planner Mark Look**（类别 **Look**）设置标记的绘制方式：**Ring**（默认）、**Shoulders** 或 **自定义**。平面图导出采用相同的外观。\n\n## 视图控制\n\n| 操作 | 输入 |\n|---|---|\n| 缩放 | 鼠标滚轮 |\n| 平移 | 按住 **Space** 并拖动，或用中键或右键拖动 |\n| 旋转视图 | **Alt** + 用右键或中键拖动 |\n| 重置视图 | 双击指南针 |\n| 重置旋转 | **Settings > View > Reset Rotation** |\n| 框选全部 | **F** |\n\n指针在平面图之外时，状态栏显示 “光标在平面图之外”，其后是 “吸附 {0}”、“单位 {0}” 和 0 到 360 的旋转角度。\n\n## 平面图上的快捷键\n\n| 按键 | 操作 |\n|---|---|\n| **Esc** | 放弃草稿、回到 **选择**，或取消选择 |\n| **Enter** | 结束自由路径 |\n| **Ctrl+Z**、**Ctrl+Shift+Z**、**Ctrl+Y** | 撤销和重做（仅在活动窗口中） |\n| **Ctrl+D** | 复制 |\n| **Ctrl+A** | 全选 |\n| **Ctrl+C**、**Ctrl+X**、**Ctrl+V** | 复制、剪切、粘贴（光标在平面图上时，粘贴到光标处） |\n| **Ctrl+Shift+P** | Look Through |\n| **Tab** | Quick Wheel |\n| **删除**、**BackSpace** | 删除所选对象，或在选中边界时移除边界点 |\n| **F** | 框选全部 |\n| **F2** | 重命名唯一选中的对象 |\n| **E** | 启用旋转 |\n| **K** | Key To Mark 选择器 |\n| **O** | Overhead View 开关 |\n| **Q**、**M**、**C**、**L**、**P**、**U**、**W** | 工具 |\n\nFramemark 的全部快捷键见[键盘快捷键参考](13_shortcuts.md)。\n\n## Export Plan\n\n使用 **导出平面图**（Export Plan）把舞台的自上而下绘图保存下来，供导演、制片人或打印使用。它在 **Share** 页面中，也在 Planner 中。\n\n对话框标题为 “导出平面图：{0}”。\n\n1. 选择 **格式**（Format）。\n2. 选择 **样式**（Style）、**尺寸**（Size）和方向。\n3. 填写 **标题栏**（Title Block）。\n4. 勾选要 **包含**（Include）的内容。\n5. 选择 **背景**。\n6. 如果想在完成后打开文件，勾选 **完成后打开文件**（Open file when done）。\n7. 点击 **导出**（Export），选择名称和位置，然后保存。\n\n| 分区 | 选项 |\n|---|---|\n| **格式** | **图像**（Image）：“所选尺寸的图像文件。”（PNG）。**矢量图**（Vector drawing）：“矢量文件。任意尺寸都清晰，可在 Illustrator、Figma 或 Miro 中打开。”（SVG）。**文档**（Document）：“单页矢量文件，用于打印或发送。文字绘制为图形，因此在所有电脑上外观一致。”（PDF） |\n| **样式** | **深色**、**浅色** |\n| **尺寸** | **A4**、**A3**、**1920 x 1080**、**3840 x 2160**、**自定义**，以及 **横向**（Landscape） / **纵向**（Portrait） |\n| **标题栏** | **场景**（Scene，提示 “例如 场景 12 布局组 2”，从剧本预先填入）、**作者**（Author） |\n| **包含** | **网格**（Grid）、**图例**（Legend）、**边界**、**标记**、**道具**（Props）、**摄像机**、**摄像机视野**（Camera field of view）、**灯光**、**备注**（Notes）、**动作轴线**（Line of action）、**布局组颜色**（Setup colours） |\n| **背景** | 关卡的自上而下渲染，**截断高度 (cm)**（Cut Height (cm)）范围 50 到 5000 |\n| 页脚 | **完成后打开文件**、**导出**（“选择文件名和位置，然后保存平面图。”，选择文件名和位置，然后保存平面图）、**取消** |\n\n默认文件名遵循 Stage 命名模式，其中 `{type}` 设为 `plan`。扩展名为 `png`、`svg` 或 `pdf`。你的选择会在多次导出之间保留。\n\n**图例** 只列出平面图上有的内容：标记、道具、摄像机、灯光、边界、路径、动作线和布局。罗盘圆盘显示舞台正前方。\n\n如果 **边界**、**标记**、**道具**、**摄像机** 或 **灯光** 一个都没勾选，会自动打开 **边界**。\n\n| 消息 | 含义 |\n|---|---|\n| “已导出“{0}”的平面图。” | 成功。 |\n| “平面图已保存到 {0}，但没有程序能打开它。” | 文件已存在，但你的系统没有可打开它的程序。 |\n| “俯视渲染需要编辑器正在渲染，因此平面图没有背景图片。” | 关闭背景，或把编辑器切换到前台。 |\n| “该页面尺寸对于所选元素太小。” | 选择更大的尺寸，或少勾选一些元素。 |\n\n> **注意：** 命令工具提示写的是 \"Save a top-down plan of the stage as an image or SVG\"。该对话框也可以导出 PDF **文档**。\n\n## 灯环\n\n加载了 **Framemark Light Rig Bridge** 插件和灯光装置插件 后，Planner 会在灯组所跟随角色的头部周围，用一个环显示该灯组的三盏灯。没有加载 Bridge 时，Planner 不变。\n\n- **Key**、**Fill** 和 **Rim** 圆点以各自的颜色绘制。\n- 标有 **Broad**、**Short** 和 **Behind** 的弧线是以**镜头摄像机**为基准测量的：即在 Planner 中选中的摄像机，否则是最近的、对着该角色的舞台摄像机。没有摄像机时，环显示时不带弧线。\n- 一个灯组属于一个角色。灯组以角色为基础，而不是以标记为基础。\n\n| 操作 | 输入 |\n|---|---|\n| 让灯光绕头部移动 | 拖动圆点。它会吸附到摄像机角度（蓝色菱形标出吸附点）。 |\n| 更改高度 | **Alt** + 拖动。会显示一个小的侧视量规。 |\n| 更改亮度 | 在圆点上滚动鼠标滚轮。每格半档。 |\n| 单独显示一盏灯 | **Alt** + 点击。这是编辑器视图，不会保存，也不能撤销。 |\n| 把灯光放回原处 | **Esc** |\n| 把灯光效果复制给另一个角色 | 把灯组标签（三个彩色圆点）拖到另一个角色上。拖动时显示 \"Copy look to {0}\"。撤销步骤为 \"Copy Look: {0} to {1}\"。 |\n\n工具栏上的垂直条是 SLR 快捷工具栏。只有在选中带灯光的角色或灯组时才显示。\n\n> **注意：** **放置灯光**（Place Light）中的 **Rig** 类型只能在视口中使用。Planner 的 **浅色** 工具放置的是普通灯光。见[摄像机与灯光](05_cameras-and-lights.md)。\n\n## 另请参阅\n\n- [Framemark 模式界面](02_interface.md)\n- [舞台和 Stage Asset](03_stages.md)\n- [标记与走位](04_marks-and-blocking.md)\n- [摄像机与灯光](05_cameras-and-lights.md)\n- [剧本与故事地图](08_screenplay-and-story-map.md)\n- [导入、导出与分享](09_import-export.md)\n- [键盘快捷键参考](13_shortcuts.md)\n"}, {"file": "08_screenplay-and-story-map.md", "slug": "screenplay-and-story-map", "title": "剧本与故事地图", "md": "# 剧本与故事地图\n\n**剧本**（Screenplay）窗口把你的剧本显示为一页页文稿，与你的舞台并排。你可以导入 Fountain、Final Draft、文本、ink 或 articy 文件，把每个场景关联到一个舞台和一个关卡序列，查看修订，并编辑场景备注、演员和道具。**故事地图**（Story Map）把分支故事（ink 和 articy）绘制成方框和连线。Framemark 还可以把你的编辑写回 ink 或 articy 源文件。\n\n从 **Window > Framemark > Framemark Screenplay** 打开该窗口。它的工具提示为 “以页面形式显示的剧本：场景、修订版和待审阅的更改。点击场景可选择其舞台。”\n\n## 前提条件\n\n- 已启用 Framemark 插件。\n- 一个剧本文件，类型为以下之一：`*.fountain`、`*.spmd`、`*.fdx`、`*.txt`、`*.ink`、`*.articyue`。\n- 要写回 articy：需要 articy:draft X，并安装 **Framemark Bridge** 插件（见[在 articy:draft 中应用更改](#apply-changes-in-articydraft)）。\n\n## 导入剧本\n\n1. 打开 **Window > Framemark > Framemark Screenplay**。\n2. 点击 **导入**（Import）。导入对话框会打开，来源为 **剧本**。\n3. 点击 **浏览**（Browse）并选择文件，或粘贴路径。\n4. 设置 **剧本选项**（Screenplay Options）。\n5. 查看 **预览**（Preview）。\n6. 点击 **导入**。一个撤销步骤即可还原全部内容。\n\n你也可以从 **剧本** 选择器中选取项目里已有的剧本：“要使用的剧本。可搜索、选择、浏览，或清除为“无”。”\n\n### 剧本选项\n\n| 选项 | 说明 |\n|---|---|\n| **创建舞台**（Create Stages） | 为每个新场景创建一个舞台。 |\n| **角色转为标记**（Characters To Marks） | 为场景中的每个角色创建一个标记。需要 **创建舞台** 或 **链接现有项**（Link Existing）。 |\n| **链接现有项** | 把场景关联到已有的舞台。 |\n| **创建序列**（Create Sequences） | 为每个场景创建一个关卡序列。 |\n| **对白标记**（Dialogue Markers） | 为每个序列添加带时间的对白标记。需要 **创建序列** 或 **链接现有项**。 |\n| **节奏 %**（Pace %） | 设置阅读速度。100% 为每分钟 150 个词，外加 (beat) 和 (pause) 处的停顿，以及每分钟一页动作描写。 |\n| **跟踪更改**（Track Changes） | 与上一次导入对比，并标出待审阅的更改。 |\n\n如果导入会创建超过 24 个新场景，会提示：\"Make a stage for every one now?\"（现在为每个场景都创建舞台吗？）\n\n剧本资产默认创建在 `/Game/Framemark/Scripts` 下。\n\n### 支持的格式\n\n| 格式 | 说明 |\n|---|---|\n| Fountain（`.fountain`、`.spmd`） | 读取标题页、场景标题（用 `.`、`INT`、`EXT`、`EST`、`I/E`、以及 `#12A#` 这样的编号强制指定）、角色提示（`@`）、转场、居中文本和分页符。章节和概要会被忽略。(MORE) 和 CONTINUED 这类排版附加内容会被丢弃。强调标记会被去除。 |\n| Final Draft（`.fdx`） | 读取 FinalDraft 元素。没有该元素的文件会报错。 |\n| 纯文本（`.txt`） | 按 Fountain 读取。 |\n| ink（`.ink`） | 见 [ink](#ink)。 |\n| articy（`.articyue`） | 见 [articy](#articy)。 |\n\n### ink\n\n| ink 源 | 变为 |\n|---|---|\n| `=== knot ===` | 一个场景 |\n| `= stitch` | 一行 **镜头**（Shot） |\n| `Name: line` | 角色加对白 |\n| `* [text]` 或 `+ text` | `CHOICE: text TO KNOT` |\n| `-> knot` | `GO TO KNOT` |\n| `-> END`、`-> DONE` | `END` |\n| `# title:` 和 `# author:` 标签 | 标题页 |\n\n会跳过：`~` 行、`VAR`、`CONST`、`LIST`、`INCLUDE`、`EXTERNAL`、函数和 `{` 行。行内的 `{logic|alt}` 会被丢弃。`INCLUDE` 指定的文件不会被跟进读取。\n\n### articy\n\nFramemark 直接读取 `.articyue` 导出文件。\n\n- 每个 **Dialogue** 变为一个场景。\n- **DialogueFragment** 把 Speaker 作为角色，StageDirections 作为括号说明，Text 作为对白。\n- 从一个片段引出两条或更多连接时，会变为 `CHOICE: <MenuText>`。\n- **Jump** 得到 `GO TO NAME`。\n- 如果 Flow 中有同名的 Dialogue，则 Document 内的该 Dialogue 会被跳过。\n- 本地化文本使用编辑器语言，否则使用列出的第一种语言。\n\n## 认识 Screenplay 窗口\n\n![Screenplay 窗口：页面旁边的 Scenes、Scene 和 Cast 面板，修改过的行带有修订颜色](media/sp_screenplay.png)\n\n1. 页眉：**剧本** 选择器、**导入**、**显示更改**（Show Changes）、**全部接受**（Accept All）、**全部拒绝**（Reject All）、**重新导入**（Re-import）、设置齿轮、**打开**（Open）、搜索和页面缩放。\n2. 面板：**场景**（Scenes）、**场景**（Scene）、**演员表**（Cast）、**道具**（Props）、**关卡**（Levels）、**页面**（Page）、**故事地图**。可从齿轮菜单显示或隐藏每个面板。\n3. 页面：格式化成页的剧本。\n\n| 页眉控件 | 说明 |\n|---|---|\n| 搜索 | “搜索剧本”，带有 “第 {0} 个，共 {1} 个” 以及 **Previous** / **下一个**（Next）匹配项。 |\n| 页面缩放 | **Ctrl** + 滚轮。点击百分比可回到 100%。 |\n| **重新导入** | 在 “磁盘上的文件更新。”时显示。 |\n\n### Scenes 表\n\n| 列 | 说明 |\n|---|---|\n| **场景** | 场景编号。 |\n| **标题**（Heading） | 场景标题行（slugline）。 |\n| **长度**（Length） | “{0} 页，约 {1}”，以八分之一页计算。 |\n| **舞台**（Stage） | 关联的舞台。 |\n| **序列**（Sequence） | 关联的关卡序列。 |\n| **备注**（Notes） | 你为该场景写的备注。 |\n\n被省略的场景显示 “已省略”。\n\n用齿轮显示或隐藏列，用 **重置列**（Reset Columns）恢复。右键点击列标题可过滤：**全选**（Select All）、**清除**（Clear）、**确定**（OK）、**取消**（Cancel）、**按 A 到 Z 排序**（Sort A to Z）、**按 Z 到 A 排序**（Sort Z to A）、**按值筛选**（Filter By Values）、**清除此筛选**（Clear This Filter）。\n\n点击一个场景，即可在关卡中选中它的舞台。\n\n### Scene 面板\n\n| 按钮 | 说明 |\n|---|---|\n| **打开舞台**（Open Stage） | 打开关联的舞台。 |\n| **打开序列**（Open Sequence） | 打开关联的关卡序列。 |\n| **生成**（Generate） | 为该场景创建舞台和序列。按住 Shift 点击，或使用 \"...\" 按钮，可打开 Generate 选项对话框。 |\n| **更改舞台**（Change Stage） | 关联另一个舞台。 |\n| **更改序列**（Change Sequence） | 关联另一个关卡序列。 |\n\n未关联的场景显示警告图标：“还没有舞台”或 \"No Level Sequence yet\"（还没有关卡序列）。\n\n### Cast 表\n\n列：**名称**（Name）、**角色类型**（Role）、**场景**、**已关联**（Linked）。\n\n- **Link Selected Actor** 把选中的关卡 Actor 关联到该演员。**清除** 移除关联。\n- 重命名演员会同时重命名其标记。\n- **添加到舞台**（Add To Stage）把角色添加到舞台。\n- **角色类型** 设置该角色在 Story Map 上使用的颜色。\n\n### Props 表\n\n剧本中找到的道具会以灰显的建议形式出现。点击 **添加**（Add）接受，点击 **忽略**（Ignore）忽略。其他命令：**添加道具**（Add Prop，“输入道具名称，然后按回车”，输入道具名称，然后按 Enter）、**重命名**（Rename）、**移除**（Remove）。\n\n### Levels 表\n\n列出舞台所用的关卡。**打开地图**（Open Map）可打开其中一个。树形结构显示关卡、舞台、场景和条目。\n\n### 编辑页面\n\n右键点击页面。\n\n| 菜单 | 命令 |\n|---|---|\n| **修正拆分**（Fix The Split） | **与下一场景合并**（Merge With Next Scene）、**并入上一场景**（Merge Into Previous Scene） |\n| **所选文字**（Selected Words） | **添加到道具**（Add To Props）、**添加到演员表**（Add To Cast） |\n| **此段落**（This Paragraph） | **从此处开始新场景**（Start New Scene Here）、**更改为**（Change To）另一种段落类型 |\n\n每一项都是一个撤销步骤。步骤名称为：Change Scene Stage、Unlink Scene Stage、Change Scene Sequence、Unlink Scene Sequence、Renumber Scene、Change Scene Heading、Edit Scene Notes、Set Cast Role、Merge Scenes、Start New Scene Here、Change Paragraph Type。\n\n## 从剧本生成\n\n导入之后，用 **生成** 为场景创建舞台和序列。\n\n1. 在 **场景** 表中选择场景。\n2. 点击 **生成**。“从剧本生成” 对话框会打开。\n3. 在 “要包含的场景” 下选择场景。\n4. 按需勾选 **创建舞台**、**创建序列** 和 **链接现有项**。\n5. 点击确认按钮。\n\n勾选 “不再询问” 可跳过该对话框。舞台沿一行排列，间隔 2500 cm。对白标记的时间根据词数计算。\n\n| 设置（Editor Preferences，**剧本**） | 说明 |\n|---|---|\n| **舞台**（Stages） | 每个 **Location** 一个舞台，或每个 **场景** 一个舞台。 |\n| **Seq Code Start** | 第一个序列编号。默认 10。 |\n| **Seq Code Increment** | 编号之间的步长。默认 10。 |\n| **Abbreviation From Slugline** | 根据场景标题行生成简称。 |\n\n## 修订与 Track Changes\n\n开启 **跟踪更改** 后，重新导入会与上一稿对比。第一次导入标为 “白页稿”。之后会显示 “{0}，{1} 待审阅”。\n\n- **显示更改** 在页面上高亮显示更改。\n- **全部接受** 和 **全部拒绝** 一次处理全部更改。\n- 提示会提供 **审阅**（Review）、**全部保留**（Keep All）或 **始终保留**（Always keep）。\n\n如果没有可对比的内容，会显示 “没有可供对比的更早草稿。请先在关闭修订跟踪的情况下导入此草稿。”\n\n## 与源文件保持同步\n\n没有后台监视。你点回 Screenplay 时，Framemark 会检查文件，如果文件已更改，就询问该怎么做。这由 **源文件已更改**（Source File Changed）设置控制（Editor Preferences > Framemark > **剧本**）。\n\n| 值 | 行
