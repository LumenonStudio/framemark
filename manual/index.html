 stage that shares a sequence with a copy gets its own when you build: \"This stage shared a sequence with a copy, so it now has its own.\"\n\n## The Sequence Page\n\n![The Sequence page](media/ui_page_sequence.png)\n\n\"Build the Level Sequence and keep it in step with the stage.\"\n\n| Button | Description |\n|---|---|\n| **Build Sequence** | Creates or updates the Level Sequence. The first click opens the dialog. After that a click reuses your choices. **Shift-click**, or the **...** button beside it, opens the dialog again. |\n| **Open Sequence** | Opens the Level Sequence in Sequencer. |\n| **Sync To Sequence** | Moves the mark tracks to match their marks, on demand. |\n| **Match Previous**, **Match Next**, **Start From...**, **Check Continuity** | The continuity tools. See below. |\n| **Active Sequence** | Switches, adds or removes the stage's sequences. |\n\nThe relocate tools (Select Stage, Add To Stage, Attach Actors, Detach Actors) are on the Stage page. See [Stages and Stage Assets](03_stages.md).\n\n## Build a Sequence\n\n\n![Sequencer with a built sequence: one shot per stage camera on the Camera Cuts track](media/fm_sequencer.png)\n\n1. Select the stage, or make it active in the panel.\n2. Open the **Sequence** page and press **Build Sequence**.\n3. In the **Build Sequence** dialog, check the **Stage** row (\"The stage to build the sequence for.\"), the sequence name and folder, and the shots. The dialog opens already filled with Framemark's names and folders. The preview line reads \"Creates {name}\" or \"Creates {name} with {n} shots, the first {length}\", or, for an existing sequence, \"Updates {name}. Name, folder and shots are for a new sequence.\"\n4. Optionally set **Start From** (\"Each marked actor starts where it ends in this sequence: a stepped key at the start of the new one.\"). **None** (\"Leave the marks where they are.\") is the default.\n5. Press **Build Sequence** in the dialog (\"Create the stage's sequence with these settings, or add what is new to it. Your own edits are kept.\").\n\nSequencer opens with the sequence. The result message reads \"Created {name}: {n} camera track(s), {n} mark track(s).\", \"Updated {name}: added ...\", or \"{name} is already up to date.\"\n\nTick **Don't ask again** to stop the dialog opening: \"Ticked: from now on a click runs with these settings. Shift-click or the ... button opens this dialog again. Change it later in Editor Preferences > Framemark > Generate.\" The dialog works like Unreal's Add Level Sequence with Shots. If the asset cannot be made: \"Could not create the Level Sequence asset. Check the Sequence Folder on the stage.\"\n\n### Populate\n\n**Populate** is on by default (tick boxes **Characters** and **Props** in the Generate settings). Build Sequence and Generate add the scene's linked cast and props to the sequence. An actor already in the level is added as a **Possessable**. One that is not is added as a **Spawnable** from its linked Blueprint. Cast and props with no link are left out. The message reads \"Populate: {n} characters and props added to the sequence.\" A character stands on its own mark in the sequence, not at the stage root.\n\n### Track Settings\n\nOptional empty sub sequences, all off by default, set in the dialog or at **Editor Preferences > Framemark > Generate > Track Settings**:\n\n- **Per shot**: ANM, FX, LGT, EDL. Each shot gets a track like `SH_ANM` holding a sequence like `ANM_SH069x00-01`.\n- **Per sequence**: FX, LGT. Tracks `SQ_FX` and `SQ_LGT`, holding `LGT_SQ030-01`.\n\nEdit the type names if your studio uses others. Names follow the **Shot Sub Sequence** and **Sequence Sub Sequence** patterns in Naming. See [Settings and Naming Reference](11_settings-reference.md).\n\n### Generate From Screenplay\n\nThe Screenplay window has a **Generate** button and a **...** button. The **Generate From Screenplay** dialog adds the **Screenplay** row, **Scenes to include**, and three ticks: **Create Stages** (\"Make a stage for each scene that has none.\"), **Create Sequences** (\"Make a Level Sequence for each scene that has none, named with its sequence code.\") and **Link Existing** (\"Use a stage or sequence already there for the scene instead of making a second one.\"). **Generate** makes or links the stage and sequence for each ticked scene, with its characters on marks and its lines as dialogue markers. Stages are **One Per Location** (the default) or **One Per Scene**. A new stage is named from the location's abbreviation, so \"tiny paris restaurant\" gives `STG_TPR_A_v001`. Stages you already have are not renamed. See [Screenplay and Story Map](08_screenplay-and-story-map.md).\n\n## Sequence Properties on the Stage\n\n| Property | Description |\n|---|---|\n| **Linked Sequences** | The stage's Level Sequences. The first is the active one. |\n| **Shot Length Seconds** | Default 4, UI range 0.5 to 30. |\n| **Sequence Folder** | Where new sequences are made. |\n| **Hold Marks In Sequence** | Default on. Advanced. |\n| **Sequence Follows Stage** | Default on. The stage is the sequence's transform origin. |\n\n## Multiple Sequences\n\n**Active Sequence** lists the stage's sequences. Pick one to make it active (\"Active sequence: {name}.\"). It also has **Add Sequence** and **Remove Sequence**. Adding says \"Added {name} to {stage}. It is the active sequence now; the others stay linked.\" Removing says \"Removed {name} from {stage}. The sequence itself is kept.\" In the Screenplay window, **Change Sequence** lists, switches and removes the same sequences.\n\n## Keep the Sequence in Step\n\nWith **Auto Sync Marks To Sequence** on (default, Editor Preferences), moving a mark by hand, choosing a Layout, undo or redo moves that mark's actor track to match, on the next editor tick. Keyed animation moves with the mark: existing keys shift by the same delta. Several marks moved in one action are batched. It never fires while PIE runs or mid undo or redo.\n\n**Sync To Sequence** does the same manually. It reports \"Moved {n} mark track(s) to match their marks.\" If another stage shares the sequence, nothing is moved.\n\n## Shots and the Stage Link\n\nWhen a shot or the sequence is open in Sequencer, a **Stage** button shows \"Stage: {name}\" (\"The stage that plays this sequence. Select it, frame it, or match actors between shots.\"). Its menu is headed \"Stage for this sequence\" with **Select {stage}**, **Frame Stage**, **Sync Marks To Sequence**, and **Other stages here** for stages that play this sequence or one of its shots. With none: \"No stage uses this sequence\". Pick a stage and use **Build Sequence** to link it.\n\n## Continuity Tools\n\nOpen the master sequence in Sequencer and park the playhead inside a shot.\n\n| Command | Description |\n|---|---|\n| **Match Previous** | \"Key every marked actor on the first frame of this shot where it ends the previous shot.\" Greyed until a master sequence is open with the playhead in a shot that has one before it. |\n| **Match Next** | Key every marked actor on the last frame of this shot where it starts the next shot. |\n| **Match Actors To Shot...** | Pick any other shot. A shot before this one is matched at its last frame, a shot after at its first. |\n| **Start From...** | Pick a sequence. Every marked actor gets a stepped key on the first frame of the stage's sequence, where it ends in the one you picked. |\n| **Check Continuity** | Lists the actors whose first frame in a shot jumps from where they were on the previous shot's last frame. Greyed until a master sequence with two or more shots is open. |\n\nMessages: \"Matched {n} actor(s) to the last frame of {shot}, keyed on the first frame of this shot: {names}.\" and \"Left alone {n} with no matching track or position in that shot\". If shots use the same sequence: \"Those two shots use the same sequence, so there is nothing to match.\" The undo is **Match Actors To Shot**. **Start From** reports \"Started {n} actor(s) where they end in {sequence}, stepped keys on the first frame: {names}.\" Locked sequences are left alone.\n\n## Bindings\n\nThree ways an actor drives a mark's track:\n\n1. **Actor** on the mark: for anyone placed in the level.\n2. **Actor Tag**: with **Auto Bind Actors By Tag** on, an actor whose tag matches the mark's binding tag is bound automatically. Spawned NPCs are picked up this way.\n3. **Players**: with **Auto Bind Players** on, local player pawns match marks by **Player Index** (0, 1, 2, 3). A Player mark at -1 counts as player 0, so single player needs no setup.\n\n| Binding property | Description |\n|---|---|\n| **Auto Bind Players** | Default on. |\n| **Auto Bind Actors By Tag** | Default on. |\n| **Snap Bound Actors To Marks** | Default on. |\n| **Player End Mark** | The mark (a name) a player ends on. |\n\nBlueprint functions **Bind Actor To Mark** (Mark Name, Actor, Snap To Mark) and **Bind Player To Mark** (Player Index, Snap To Mark) bind from code.\n\n### Multiple Players\n\nGive each Player mark its own **Player Index**. The stage binds each local player's pawn to the mark carrying that index. For player 0 it falls back to the first Player mark.\n\n![Scrubbing a built sequence with the viewport locked to Camera Cuts](media/fm_sequencer_playback.gif)\n\n### Playback and Interrupts\n\n| Property | Description |\n|---|---|\n| **Auto Trigger** | Manual, OnBeginPlay or WhenPlayerEntersBoundary. |\n| **Play Once** | Default off. |\n| **Can Be Interrupted** | Default off. |\n| **Interrupt Triggers** | Actors with overlap events. |\n| **Interrupt Sequence** | \"Optional sequence to play after an interrupt.\" |\n\nBlueprint functions **Play Stage**, **Stop Stage**, **Interrupt Stage** and **Reset Has Played** control playback.\n\n## Relocate\n\nWith **Sequence Follows Stage** on, move or rotate the stage and the cameras move with it. The sequence data itself does not change. Actors are not attached by default. Use the Stage page's **Attach Actors**, **Detach Actors**, **Add To Stage**, **Select Stage** and **Snap Actors To Marks**. See [Stages and Stage Assets](03_stages.md).\n\n## Key To Mark\n\nSee [Marks and Blocking](04_marks-and-blocking.md). Key To Mark is on the right-click menu and K. Sequencer's own binding menu has no separate entry.\n\n## Known Limitations\n\n- Shot Designer import is checked against one scene so far.\n- Keys made before 13 October do not follow their marks.\n\n## See Also\n\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Cameras and Lights](05_cameras-and-lights.md)\n- [Screenplay and Story Map](08_screenplay-and-story-map.md)\n- [Rendering and Publishing](10_render-and-publish.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "07_planner.md", "slug": "planner", "title": "The Planner", "md": "# The Planner\n\nThe **Planner** is a dockable window that shows your stage from above. You place marks, cameras, lights and props on the plan, draw walks and camera moves, aim shots, and write what happens in each shot, without leaving a flat, readable drawing. Everything you do in the Planner edits the same Stage Asset the Level Viewport uses, so the plan and the 3D scene stay in step.\n\nOpen it from **Window > Framemark > Framemark Planner**. Its tab is called **Planner**.\n\n> **Note:** **Overhead View** and the **Planner** are different things. **Overhead View** flips the Level Viewport itself to a top-down camera. The **Planner** is a separate window with its own canvas, tools, panels and undo steps. You can use either, or both at once.\n\n## Prerequisites\n\n- The Framemark plugin is enabled (see [Getting Started](01_getting-started.md)).\n- A level is open. You do not need a stage in the level: the Planner can make a **New Stage** that exists only as a Stage Asset until you place it.\n- Optional: the **Framemark Light Rig Bridge** companion plugin and the light rig plugin, for the light ring (see [Light ring](#light-ring)).\n\n## Overhead View and the Planner\n\n| | Overhead View | Planner |\n|---|---|---|\n| What it is | A viewport toggle | A window with its own canvas |\n| Command | **Overhead View** (key **O**) | **Window > Framemark > Framemark Planner** |\n| Tooltip | \"Switch the viewport between a top-down overhead and the normal 3D view.\" | \"The stage from above. Place marks, cameras and lights, aim shots and write what happens in each one.\" |\n| Shows | The real level from above, framed on the stage boundary | A drawn plan: boundary, background picture, marks, paths, cameras, lights, props, sketch |\n| Press again | Restores the viewport you had before | Not applicable |\n\nUse **Overhead View** when you want the real level geometry and lighting under your marks. Use the **Planner** when you want a clean drawing, a Shots panel, layers, snapping, guides and the export sheet.\n\n## The Planner window\n\n![The Planner with the Lamp Room stage](media/fm_planner.png)\n*The **Planner** on `STG_LampRoom`: tool rail, plan canvas with boundary, marks and camera frustums, Layers, Details and Library panels.*\n\nThe window has a top bar, a tool rail, the plan, and a set of dockable panels.\n\n1. Top bar: stage tabs, **New Stage**, the stage picker, the snap magnet, the **Synced With Level** / **Draft** toggle, **Quick Wheel**, **Settings**.\n2. Tool rail: the drawing tools (see [Tools](#tools)).\n3. Plan: the canvas.\n4. Panels: **Plan**, **Shots**, **Layers**, **Details**, **Library**, **Screenplay**, plus a **Capture** tab.\n5. Status bar: cursor position, snap, units and rotation.\n\n### Panels menu\n\nEvery panel can be shown or hidden from the **Panels** menu (also under **Settings**).\n\n| Panel | What it holds |\n|---|---|\n| **Plan** | \"The stage from above: the tool rail and the plan.\" |\n| **Shots** | \"One card per camera. Click a card to select its camera, type what happens in the shot, drop reference images on it.\" |\n| **Layers** | The layer list (see [Layers](#layers)). |\n| **Details** | Properties of the selection, the background picture and the sketch. |\n| **Library** | \"Framemark assets: folders, favourites, quick filters and Used In.\" |\n| **Screenplay** | \"The scene linked to this stage.\" See [Screenplay and Story Map](08_screenplay-and-story-map.md). The page is the same width as the **Screenplay** window. |\n| **Capture** | \"Capture From Level: a top-down capture of the level under the stage, set as the Background at the right scale.\" |\n\n### Stage tabs\n\nEach open Stage Asset gets a tab. A tab that holds a draft shows \" *\" after its name.\n\nRight-click a tab for:\n\n- **Close**\n- **Close Others**\n- **Close To The Right**\n- **Rename**\n- **Browse To Asset**\n- **Open In Level**\n\n**New Stage** makes a Stage Asset without placing it. The message reads \"Made Stage Asset {0} in {1}. It is not in the level until you place it.\" Use the \"Pick a stage\" drop-down to switch to any other stage.\n\n### Synced With Level and Draft\n\nBy default the Planner is **Synced With Level**: moving a mark on the plan moves it in the level.\n\nTurn sync off to work in a **Draft**. Edits then change only the Planner's copy, and the viewport label reads \"Draft in Planner\".\n\n| Action | Result |\n|---|---|\n| **Save** (**Ctrl+S**) | \"Every placement in the level updates to it, as one undo step.\" |\n| **Save As** | Makes a new Stage Asset in its own tab. |\n| Turn sync back on with a draft | A prompt offers **Save and Sync**, **Discard Draft** or **Cancel**. |\n\n> **Tip:** Use a Draft to try three blocking ideas without touching the level. **Save As** each one, then keep the one you like.\n\n## Tools\n\nPick a tool from the rail, or press its key. Each edit you make is one undo step.\n\n| Tool | Key | What it does |\n|---|---|---|\n| **Select** | **Q** | Click, drag a box, **Ctrl** or **Shift** to add. Drag to move. Press **E** and drag to turn. |\n| **Pan** | **Space** (hold) | Drag to pan. Middle or right button also pans. The wheel zooms. |\n| **Mark** | **M** | Click to place. Click and drag to set facing. |\n| **Camera** | **C** | \"A camera is a shot.\" Click to place. |\n| **Light** | **L** | Opens a flyout: **Spot**, **Point**, **Rect**. **Directional** is available from the change-type list. |\n| **Prop** | **P** | Place a prop. |\n| **Path** | **W** | Draw a walk, run, turn or camera move. |\n| **Measure** | **U** | Measure a distance on the plan. |\n| **Sketch** | none | Starts a **New Sketch**, or opens the existing one (in Odyssey when it is installed). |\n\nIf a light type has no preset, the Planner reports \"No {0} preset. Add one in Editor Preferences > Framemark > Lights.\"\n\nThe rail follows the workspace's tools. Tools that do not place anything run the matching mode command, and the **Quick Wheel** opens on the plan.\n\n> **Note:** When a lit character or a rig is selected, a vertical strip of light-ring controls appears under a separator on the rail. See [Light ring](#light-ring).\n\n### Right-click menu\n\nRight-click the plan for the shared Framemark menu, the same sections as the Level Viewport Framemark menu: **Place Mark Here**, **Place Camera Here**, **Place Light Here**, Mark, Actor, Edit, Position, Colour, Overlapping Marks, Group, Camera and Stage. See [Framemark Mode Interface](02_interface.md).\n\nRight-clicking a path adds path commands (see [Paths](#paths)).\n\n## Selecting, moving and turning\n\n1. Choose **Select** (**Q**).\n2. Click an item, or drag a box round several. Hold **Ctrl** or **Shift** to add to the selection.\n3. Drag to move.\n4. Press **E**, then drag to turn.\n\nWhen you select several items the bar reads \"{0} selected\" and offers **New Setup**.\n\nLocked items cannot be deleted: \"Those are locked. Unlock them to delete.\"\n\n## Selection bars\n\nA bar appears over the plan for the selected item.\n\n### Mark\n\n**Role**, **Colour**, **Bring To Front**, **Send To Back**, **Spread**, **Lock**, **Duplicate**, **Delete**.\n\n### Camera\n\n| Control | Description |\n|---|---|\n| **Lens** | The focal length, shown as \"{0} mm\". |\n| **Cone** | Toggles the field-of-view cone on the plan. |\n| **Look At Mark...** | Aims the camera at a mark. |\n| **Unlink** | Breaks the Look At link. |\n| **Look Through** | Pilots the camera in the Level Viewport (**Ctrl+Shift+P**). |\n| **Set To Viewport** | Sets the camera to the current viewport view. |\n| Mark Order readout | Shows where this camera sits in the Mark Order. |\n\nThe camera's focus handle is amber on the plan, with a soft depth-of-field band drawn out to 100 m. Next to **Manual Focus Distance** in **Details**, the **Sample Scene Depth** eyedropper lets you \"Pick a spot in front of the camera.\" Press **Esc** to cancel.\n\n### Light\n\n- Change the type between **Point**, **Spot**, **Rect** and **Directional**. The change keeps place, colour, intensity and setups.\n- Set intensity in the unit that suits the light: cd, lm, EV, nits or lux.\n- Set a **Gobo**: a Light Function material, or a source texture on rect lights.\n- Apply light presets.\n\n## Paths\n\nA path records movement. Pick the **Path** tool (**W**), click to add points, and press **Enter** or double-click to end a free path. **Esc** drops it.\n\n### Path kinds\n\n| Kind | Description |\n|---|---|\n| **Walk** | A character walks this path. |\n| **Run** | A character runs this path. |\n| **Turn** | \"Turns in place on its mark...\" |\n| **Camera** | A camera move: dashed, with track ties, at lens height. |\n\nPaths take the colour of their mark. In the exported plan a walk is a dashed line with one open chevron, a run is long heavy dashes with a filled double head, and a turn is a slim dashed arc.\n\n> **Note:** The in-app tooltip for **Walk** describes it as \"A solid line with one arrow.\" The drawn result is a dashed line with an open chevron, which is what the export shows.\n\n### Editing a path\n\nThe hint in the Planner reads: \"Drag the squares to reshape, the round handles to curve. Drop an end on a mark to pin it. Double-click adds a point, Delete removes the picked point or the path.\"\n\n- A path keeps at least 2 points.\n- Right-click a path for **Add Point Here**, **Remove Point**, **Delete Path**, the **Kind** choices (**Walk**, **Run**, **Turn**, **Camera**), and the floor options **Floor**, **Avoid Collision** and **Level To Floor**.\n- **Avoid Collision** steers the path round level geometry. **Level To Floor** drops the path onto the floor.\n\n### Turn on the spot\n\nOn marks stacked in one place, the **Turn To / Turn From** menu makes a turn: one mark that turns from its own facing to the next.\n\n## Boundary\n\nThe boundary is the stage outline. A boundary needs at least 3 points.\n\n- Drag the strip to move it.\n- Drag the square points to resize.\n- Drag the round handles to bend an edge. The shape becomes **Custom**.\n- Double-click to add a point.\n- Press **Delete** to remove the selected point.\n\nUse **Fit Boundary** (**To Stage**) and **Set Boundary Size** / **Shape** to set it numerically. See [Stages and Stage Assets](03_stages.md).\n\n## Background picture and sketch\n\nSelect the background in **Layers** or **Details**.\n\n| Command | Description |\n|---|---|\n| **Set Background...** | Choose a picture. |\n| **Capture From Level** | Takes a top-down capture of the level. Options: **View Mode**, **Show**, **Outliner**, **Sublevels**, **Hide above**, **Resolution**, crop, **Commit**. |\n| **Edit Background** | Edit the picture's placement. |\n| **Scale Background** | Click two points, then enter the \"Real distance between the two points\" and choose **Apply** or **Cancel**. |\n| **Clear Background** | Removes the picture. The texture asset is kept. |\n| **Place On Stage** | Places the picture on the stage. |\n\nPicture properties: **Visible**, **Opacity**, **Width**, **Rotation**, **Scale tool**.\n\nThe sketch has **Edit**, **New Sketch** and **Refresh Underlay**. Set **Sketch Resolution** under **Settings** (\"{0} px\"). High values are slow, and 8192 is slow on some machines.\n\n## Layers\n\nThe **Layers** panel lists: **Background**, **Boundary**, **Set**, **Images**, **Marks**, **Cameras**, **Lights**, **Sketch**, and Props.\n\n- The eye hides a layer on the plan only. It does not hide anything in the level.\n- **Alt**-click an eye to show only that layer.\n- The lock stops picking on that layer. **Background** is locked to start with.\n- Drag the grab handle to reorder. **Reset Order** restores the default.\n\nRight-click a row for **Show All**, **Show Only**, **Lock** / **Unlock**, **Select All In Layer**, **Rename** (built-in layers keep their names) and **Colour...**. Layer colours are saved in Editor Preferences (`PlanLayerColours`, category **Overhead**).\n\n## Shots panel\n\nThe **Shots** panel holds one card per camera.\n\n- Click a card to select its camera.\n- Type what happens in the shot into the description (\"What happens in this shot\").\n- Add reference pictures by dropping images on the card. Remove them, or pin one.\n- Click a picture to open the enlarged image window: wheel to zoom, a slider, and click the % to return to 100%.\n\n### Viewport overlay\n\nShow one of a shot's reference pictures over the level viewport while you look through that camera. Use it to match a storyboard frame or a reference still.\n\n1. Drop the picture on the shot's card, or click the **camera button** at the right of the drop line to capture a still of what the camera sees. The capture lands with the other references.\n2. Click the **eye** at the top left of its thumbnail. The eye turns blue. Only one picture per shot shows.\n3. Look through the camera: **Look Through This Camera**, pilot it, or play the sequence with the camera cut. The picture sits over the camera frame.\n4. Click the eye again to stop showing it.\n\nEach click is one undo step. Removing the picture from the card also stops the overlay.\n\n| Property | Description |\n|---|---|\n| **Overlay Picture** | The picture drawn over the viewport. Any texture can go here, not only the card's references. Empty: no overlay. |\n| **Overlay Opacity** | 0 hidden, 1 solid. Default 0.5. |\n| **Overlay Fit** | **Fit**: the whole picture, with bars where its shape differs from the frame. **Fill**: covers the frame, edges cut off. **Stretch**: squashed to the frame. |\n\nThese are in the camera's **Details**, under **Shot > Viewport Overlay**. They belong to the **Stage Camera** component on the Cine Camera Actor, so a camera you placed yourself gets them once you add that component.\n\nThe picture follows the camera frame, including the Cine Camera's **Crop Settings**: a 2.39 crop on a 16:9 filmback puts the picture inside the 2.39 frame. Overlays stay on top of it: **Camera Safe Frames** in the level viewport, and Sequencer's film overlays (grids, rule of thirds) in the Cinematic Viewport.\n\n> **Note:** The overlay is drawn by the editor only. It never shows in a render, a Movie Render Queue output, a packaged game or the plan export. It travels with the stage in a `.framemark.json` file and in a Stage Asset; USD and FBX export leave it out.\n\n## Snapping, grid and guides\n\nThe snap magnet shows \"Grid snap size: {0}\". Hold **Alt** in the plan to move freely.\n\n| Setting | Where | Description |\n|---|---|---|\n| **Snap To** | **Settings** | **Snap to Grid**, **Snap to Guides**, **Smart Guides**. |\n| **Guides** | **Settings** | **Show Guides**, **Lock Guides**, **Clear Guides**. |\n| **Grid Size** | **Settings** | **Off** or \"{0} cm\". |\n| `PlannerGridSizeCm` | Editor Preferences, **Planner** | Default 50 cm. Range 5 to 500 in the slider. Major lines are drawn every ten. |\n\nTo make a guide, drag from the top or left edge of the plan. Drag a guide off the plan to delete it. A pink line marks a smart-guide match. Guides belong to the workspace.\n\nWhile dragging, **Shift** locks the movement to one axis (across, down or 45 degrees). **Alt** ignores snap and smart guides.\n\n## Settings menu\n\n| Item | Options |\n|---|---|\n| **Theme** | **Dark**, **Light** |\n| **Units** | **Metres**, **Feet** |\n| **Toolbar Location** | **Plan** (the rail sits beside the plan), **None** |\n| **Panels** | Show or hide each panel |\n| **View** | **Reset Rotation** |\n| **Sketch Resolution** | \"{0} px\" |\n| **Snap To**, **Guides**, **Grid Size** | See above |\n\nIts tooltip reads \"Planner settings: theme, units, toolbar location, panels and view rotation\".\n\n### Planner Mark Look\n\nIn Editor Preferences, **Planner Mark Look** (category **Look**) sets how marks are drawn: **Ring** (default), **Shoulders** or **Custom**. The plan export draws the same look.\n\n## View controls\n\n| Action | Input |\n|---|---|\n| Zoom | Mouse wheel |\n| Pan | Hold **Space** and drag, or drag with the middle or right button |\n| Rotate the view | **Alt** + drag with the right or middle button |\n| Reset the view | Double-click the compass |\n| Reset rotation | **Settings > View > Reset Rotation** |\n| Frame all | **F** |\n\nThe status bar reads \"Cursor off the plan\" when the pointer is outside, then \"Snap {0}\", \"Units {0}\" and the rotation from 0 to 360.\n\n## Keys on the plan\n\n| Key | Action |\n|---|---|\n| **Esc** | Drop the draft, return to **Select**, or deselect |\n| **Enter** | End a free path |\n| **Ctrl+Z**, **Ctrl+Shift+Z**, **Ctrl+Y** | Undo and redo (only in the active window) |\n| **Ctrl+D** | Duplicate |\n| **Ctrl+A** | Select all |\n| **Ctrl+C**, **Ctrl+X**, **Ctrl+V** | Copy, cut, paste (paste goes to the cursor when it is over the plan) |\n| **Ctrl+Shift+P** | Look Through |\n| **Tab** | Quick Wheel |\n| **Delete**, **BackSpace** | Delete the selection, or remove the boundary point if the boundary is selected |\n| **F** | Frame all |\n| **F2** | Rename the single selected item |\n| **E** | Arm rotate |\n| **K** | Key To Mark picker |\n| **O** | Overhead View toggle |\n| **Q**, **M**, **C**, **L**, **P**, **U**, **W** | Tools |\n\nSee [Keyboard Shortcuts Reference](13_shortcuts.md) for every shortcut in Framemark.\n\n## Export Plan\n\nUse **Export Plan** to save a top-down drawing of the stage for a director, a producer or a printer. Find it on the **Share** page, or in the Planner.\n\nThe dialog is titled \"Export Plan: {0}\".\n\n1. Choose a **Format**.\n2. Choose **Style**, **Size**, and orientation.\n3. Fill in the **Title Block**.\n4. Tick what to **Include**.\n5. Choose a **Background**.\n6. Tick **Open file when done** if you want it opened.\n7. Click **Export**, pick a name and location, then save.\n\n| Section | Options |\n|---|---|\n| **Format** | **Image**: \"Image file at the chosen size.\" (PNG). **Vector drawing**: \"Vector file. Sharp at any size, opens in Illustrator, Figma or Miro.\" (SVG). **Document**: \"One page vector file for printing or sending. Text is drawn as shapes, so it looks the same on every computer.\" (PDF) |\n| **Style** | **Dark**, **Light** |\n| **Size** | **A4**, **A3**, **1920 x 1080**, **3840 x 2160**, **Custom** (400 to 8192 px), and **Landscape** / **Portrait** |\n| **Title Block** | **Scene** (hint \"For example Scene 12 Setup 2\"; pre-filled from the screenplay), **Author** |\n| **Include** | **Grid**, **Legend**, **Boundary**, **Marks**, **Props**, **Cameras**, **Camera field of view**, **Lights**, **Notes**, **Line of action**, **Setup colours** |\n| **Background** | A top-down render of the level, with **Cut Height (cm)** from 50 to 5000 |\n| Footer | **Open file when done**, **Export** (\"Pick a file name and location, then save the plan.\"), **Cancel** |\n\nThe default file name follows the Stage naming pattern with `{type}` set to `plan`. The extension is `png`, `svg` or `pdf`. Your choices persist between exports.\n\nThe **Legend** lists only what is on the plan: marks, props, cameras, lights, boundary, paths, line of action and setups. A compass disc shows stage forward.\n\nIf none of **Boundary**, **Marks**, **Props**, **Cameras** or **Lights** is ticked, **Boundary** is switched on for you.\n\n| Message | Meaning |\n|---|---|\n| \"Exported plan for '{0}'.\" | Success. |\n| \"The plan was saved to {0}, but no program could open it.\" | The file exists, but your system has no program for it. |\n| \"The top-down render needs the editor to be rendering, so the plan has no background picture.\" | Switch off the background or bring the editor to the front. |\n| \"That page size is too small for the elements chosen.\" | Choose a bigger size or tick fewer elements. |\n\n> **Note:** The command tooltip says \"Save a top-down plan of the stage as an image or SVG\". The dialog also exports a PDF **Document**.\n\n## Light ring\n\nWhen the **Framemark Light Rig Bridge** plugin and the light rig plugin are loaded, the Planner shows each rig's three lights on a ring round the head of the character the rig follows. With no bridge loaded, the Planner is unchanged.\n\n- **Key**, **Fill** and **Rim** dots are drawn in their own colours.\n- Arcs labelled **Broad**, **Short** and **Behind** are measured from the **shot camera**: the camera picked in the Planner, otherwise the nearest stage camera pointing at the character. With no camera the ring shows without arcs.\n- One rig belongs to one character. A rig is character based, not mark based.\n\n| Action | Input |\n|---|---|\n| Move a light round the head | Drag a dot. It snaps to the camera angles (blue diamonds mark the snap points). |\n| Change height | **Alt** + drag. A small side-on gauge shows. |\n| Change brightness | Mouse wheel on a dot. Half a stop per notch. |\n| Solo a light | **Alt** + click. This is an editor view and is never saved or undone. |\n| Put the light back | **Esc** |\n| Copy the look to another character | Drag the rig chip (three coloured dots) onto the other character. The drag shows \"Copy look to {0}\". The undo step is \"Copy Look: {0} to {1}\". |\n\nThe vertical strip on the rail is the SLR quick toolbar. It shows only while a lit character or rig is selected.\n\n> **Note:** The **Rig** type in **Place Light** works from the viewport only. The Planner's **Light** tool places plain lights. See [Cameras and Lights](05_cameras-and-lights.md).\n\n## See Also\n\n- [Framemark Mode Interface](02_interface.md)\n- [Stages and Stage Assets](03_stages.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Cameras and Lights](05_cameras-and-lights.md)\n- [Screenplay and Story Map](08_screenplay-and-story-map.md)\n- [Import, Export and Sharing](09_import-export.md)\n- [Keyboard Shortcuts Reference](13_shortcuts.md)\n"}, {"file": "08_screenplay-and-story-map.md", "slug": "screenplay-and-story-map", "title": "Screenplay and Story Map", "md": "# Screenplay and Story Map\n\nThe **Screenplay** window shows your script as a page next to your stages. You import a Fountain, Final Draft, text, ink or articy file, link each scene to a stage and a Level Sequence, review revisions, and edit scene notes, cast and props. The **Story Map** draws branching stories (ink and articy) as boxes and wires. Framemark can also write your edits back to the ink or articy source.\n\nOpen the window from **Window > Framemark > Framemark Screenplay**. Its tooltip reads \"The screenplay as a page: scenes, revisions and changes to review. Click a scene to select its stage.\"\n\n## Prerequisites\n\n- The Framemark plugin is enabled.\n- A screenplay file in one of these types: `*.fountain`, `*.spmd`, `*.fdx`, `*.txt`, `*.ink`, `*.articyue`.\n- For articy write-back: articy:draft X with the **Framemark Bridge** plugin installed (see [Apply Changes in articy:draft](#apply-changes-in-articydraft)).\n\n## Importing a screenplay\n\n1. Open **Window > Framemark > Framemark Screenplay**.\n2. Click **Import**. The Import dialog opens on the **Screenplay** source.\n3. Click **Browse** and pick your file, or paste a path.\n4. Set the **Screenplay Options** (below).\n5. Check the **Preview**.\n6. Click **Import**. One undo step puts everything back.\n\nYou can also pick a screenplay already in the project from the **Screenplay** picker: \"The script to work from. Search, pick, browse to it, or clear it to None.\"\n\n### Screenplay options\n\n| Option | Description |\n|---|---|\n| **Create Stages** | Makes a stage for each new scene. |\n| **Characters To Marks** | Makes a mark for each character in the scene. Needs **Create Stages** or **Link Existing**. |\n| **Link Existing** | Links scenes to stages that already exist. |\n| **Create Sequences** | Makes a Level Sequence for each scene. |\n| **Dialogue Markers** | Adds timed dialogue markers to each sequence. Needs **Create Sequences** or **Link Existing**. |\n| **Pace %** | Sets the reading speed. 100% is 150 words a minute, plus pauses for (beat) and (pause), and one page of action a minute. |\n| **Track Changes** | Compares with the previous import and marks changes for review. |\n\nIf the import would create more than 24 new scenes, you are asked: \"Make a stage for every one now?\".\n\nScreenplay assets are created under `/Game/Framemark/Scripts` by default.\n\n### Supported formats\n\n| Format | Notes |\n|---|---|\n| Fountain (`.fountain`, `.spmd`) | Title page, scene headings (forced with `.`, `INT`, `EXT`, `EST`, `I/E`, numbers such as `#12A#`), character cues (`@`), transitions, centred text and page breaks are read. Sections and synopses are ignored. Furniture such as (MORE) and CONTINUED is dropped. Emphasis marks are stripped. |\n| Final Draft (`.fdx`) | Reads the FinalDraft element. A file without one gives an error. |\n| Plain text (`.txt`) | Read as Fountain. |\n| ink (`.ink`) | See [ink](#ink). |\n| articy (`.articyue`) | See [articy](#articy). |\n\n### ink\n\n| ink source | Becomes |\n|---|---|\n| `=== knot ===` | A scene |\n| `= stitch` | A **Shot** line |\n| `Name: line` | Character plus Dialogue |\n| `* [text]` or `+ text` | `CHOICE: text TO KNOT` |\n| `-> knot` | `GO TO KNOT` |\n| `-> END`, `-> DONE` | `END` |\n| `# title:` and `# author:` tags | The title page |\n\nSkipped: `~` lines, `VAR`, `CONST`, `LIST`, `INCLUDE`, `EXTERNAL`, functions and `{` lines. Inline `{logic|alt}` is dropped. Files named by `INCLUDE` are not followed.\n\n### articy\n\nFramemark reads the `.articyue` export directly.\n\n- Each **Dialogue** becomes a scene.\n- A **DialogueFragment** gives the Speaker as the Character, StageDirections as a Parenthetical, and Text as Dialogue.\n- Two or more connections out of a fragment become `CHOICE: <MenuText>`.\n- A **Jump** gives `GO TO NAME`.\n- A Dialogue inside a Document is skipped when the Flow has one with the same name.\n- Localised text uses the editor language, otherwise the first language listed.\n\n## Reading the Screenplay window\n\n![The Screenplay window: Scenes, Scene and Cast panels beside the page, with revision colours on changed lines](media/sp_screenplay.png)\n\n1. Header: the **Screenplay** picker, **Import**, **Show Changes**, **Accept All**, **Reject All**, **Re-import**, the settings gear, **Open** (the full tab), search and page zoom.\n2. Panels: **Scenes**, **Scene**, **Cast**, **Props**, **Levels**, **Page**, **Story Map**. Show or hide each from the gear.\n3. The page: the script as formatted pages.\n\n| Header control | Description |\n|---|---|\n| Search | \"Search the screenplay\", with \"{0} of {1}\" and **Previous** / **Next** match. |\n| Page zoom | **Ctrl** + wheel. Click the % for 100%. |\n| **Re-import** | Shown when \"The file on disk is newer.\" |\n\n### Scenes sheet\n\n| Column | Description |\n|---|---|\n| **Scene** | The scene number. |\n| **Heading** | The slugline. |\n| **Length** | \"{0} pages, about {1}\", counted in eighths. |\n| **Stage** | The linked stage. |\n| **Sequence** | The linked Level Sequence. |\n| **Notes** | Your notes for the scene. |\n\nOmitted scenes show \"OMITTED\".\n\nUse the gear to show or hide columns, and **Reset Columns** to restore them. Right-click a column header to filter: **Select All**, **Clear**, **OK**, **Cancel**, **Sort A to Z**, **Sort Z to A**, **Filter By Values**, **Clear This Filter**.\n\nClick a scene to select its stage in the level.\n\n### Scene panel\n\n| Button | Description |\n|---|---|\n| **Open Stage** | Opens the linked stage. |\n| **Open Sequence** | Opens the linked Level Sequence. |\n| **Generate** | Makes the stage and sequence for this scene. Shift-click, or use the \"...\" button, for the Generate options dialog. |\n| **Change Stage** | Links a different stage. |\n| **Change Sequence** | Links a different Level Sequence. |\n\nUnlinked scenes show a warning icon: \"No stage yet\" or \"No Level Sequence yet\".\n\n### Cast sheet\n\nColumns: **Name**, **Role**, **Scenes**, **Linked**.\n\n- **Link Selected Actor** links the selected level actor to the cast member. **Clear** removes the link.\n- Renaming a cast member renames their marks.\n- **Add To Stage** adds the character to the stage.\n- **Role** sets the colour used for the character on the Story Map.\n\n### Props sheet\n\nProps found in the script appear dimmed as suggestions. Click **Add** to accept one or **Ignore** to dismiss it. Other commands: **Add Prop** (\"Prop name, then Enter\"), **Rename**, **Remove**.\n\n### Levels sheet\n\nLists the levels used by the stages. **Open Map** opens one. The tree shows level, stage, scene and entry.\n\n### Editing the page\n\nRight-click the page.\n\n| Menu | Command |\n|---|---|\n| **Fix The Split** | **Merge With Next Scene**, **Merge Into Previous Scene** |\n| **Selected Words** | **Add To Props**, **Add To Cast** |\n| **This Paragraph** | **Start New Scene Here** (numbers the scene with a letter, such as 12A), **Change To** another paragraph type |\n\nEach is one undo step. The step names are: Change Scene Stage, Unlink Scene Stage, Change Scene Sequence, Unlink Scene Sequence, Renumber Scene, Change Scene Heading, Edit Scene Notes, Set Cast Role, Merge Scenes, Start New Scene Here, Change Paragraph Type.\n\n## Generate from the screenplay\n\nUse **Generate** to make stages and sequences for scenes after import.\n\n1. Select the scenes in the **Scenes** sheet.\n2. Click **Generate**. The \"Generate From Screenplay\" dialog opens.\n3. Under \"Scenes to include\", pick the scenes.\n4. Tick **Create Stages**, **Create Sequences** and **Link Existing** as needed.\n5. Click the confirm button.\n\nTick \"Don't ask again\" to skip the dialog. Stages are spaced 2500 cm apart in a row. Dialogue markers are timed from the words.\n\n| Setting (Editor Preferences, **Screenplay**) | Description |\n|---|---|\n| **Stages** | One stage per **Location** or one per **Scene**. |\n| **Seq Code Start** | First sequence code. Default 10. |\n| **Seq Code Increment** | Step between codes. Default 10. |\n| **Abbreviation From Slugline** | Builds the short name from the slugline. |\n\n## Revisions and Track Changes\n\nWith **Track Changes** on, a re-import is compared with the previous draft. The first import is labelled \"White draft\". After that you see \"{0}, {1} to review\".\n\n- **Show Changes** highlights changes on the page.\n- **Accept All** and **Reject All** settle every change at once.\n- A prompt offers **Review**, **Keep All** or **Always keep**.\n\nIf there is nothing to compare with, you see \"There is no earlier draft to compare with. Import this one with Track Changes off first.\"\n\n## Keeping in step with the source file\n\nThere is no background watcher. Framemark checks the file when you click back into the Screenplay and, if it has changed, asks what to do. This is the **Source File Changed** setting (Editor Preferences > Framemark > **Screenplay**).\n\n| Value | Behaviour |\n|---|---|\n| **Ask** | Shows \"Re-import it? The changes come in as a revision to review.\" with a \"Don't ask again\" tick. |\n| **Re-import** | Re-imports at once. |\n| **Ignore** | Does nothing. The **Re-import** button still shows. |\n\n### Write back to ink\n\nWhen you save, Framemark writes edited, added and cut lines to the `.ink` file and keeps the old file as `.bak`.\n\n- Choices, diverts, headings and scene lines are **not** written. The message says so.\n- It refuses when the file has changed since import, when version control has it locked or out of date, or when it is read-only.\n- A glue (`<>`) note appears when new lines follow a glued line.\n\n### Write back to articy\n\nFramemark writes `<export>.framemark-changes.json` next to the `.articyue`. After you apply it, the file is renamed `.framemark-changes.applied.json`.\n\n- It refuses if the export has changed since import, or if articy already has the last changes.\n- The change list covers text, speaker, added lines and cut lines.\n\n#### Apply Changes in articy:draft\n\nThe **Framemark Bridge** plugin (Framemark.ArticyBridge 1.0.0, needs articy:draft 4.2.2 or later) adds a **Framemark** menu in articy:draft.\n\n1. In articy:draft, choose **Framemark > Apply Changes**.\n2. Pick the `*.framemark-changes.json` file. The plugin checks it.\n3. Confirm. The plugin writes the changes, saves `.undo.json` and `.applied.json`, and deletes the original.\n4. Export for Unreal again and re-import in Framemark.\n\nTo reverse an apply, choose **Framemark > Undo Last Apply**.\n\n> **Warning:** **Ctrl+Z** in articy:draft does not undo an Apply. Use **Undo Last Apply**.\n\n## Story Map\n\nThe **Story Map** draws a branching screenplay (ink or articy) as a flow chart. Show it from **Panels > Story Map**.\n\n- A box per scene, left to right.\n- Wires between boxes are labelled with choice words, **GO TO** and next.\n- A ruler shows each column's scene numbers.\n- Dots under a box show the speakers in the Cast role colours.\n- Notes appear above a box (\"Notes: {0}\"). Click **Save Notes** to keep an edit.\n- Backward wires are dim and dotted.\n- A GO TO with no target ends at a dashed **Exits** box.\n- The header switch **By Scene** / **By Sequence** changes what a box stands for. It is kept per screenplay.\n\n| Action | Result |\n|---|---|\n| Click a box | Selects the scene and jumps to it. |\n| Double-click a box | Opens the sequence. |\n\n> **Note:** The Story Map is read only for the story. Change the story in the Screenplay, ink or articy.\n\n### Context menus\n\n| Where | Commands |\n|---|---|\n| Scene box | **Open Stage**, **Open Sequence**, **Generate**, **Change Stage**, **Change Sequence**, **Show in Screenplay**, **Edit Notes**, **Open Source** (\"Open it in articy\", or the ink file), **Copy Scene Name** |\n| Empty space | **Frame All**, **Frame Selection**, **Show Omitted Scenes**, **Show Comment Bubbles**, **Collapse All Groups**, **Expand All Groups**, **New Group** |\n| Wire | **Go To Target Scene**, **Show Choice Line in Screenplay** |\n\n### Groups\n\nGroup scenes to keep a big story readable.\n\n| Command | Description |\n|---|---|\n| **New Group From Selection** | Groups the selected boxes. |\n| **Add To Group**, **Remove From Group** | Change a group's members. |\n| **Rename**, **Edit Comment** | Label the group. |\n| **Expand** / **Collapse** | Show or hide members. |\n| **Drill In** | Opens the group full size. A breadcrumb takes you back. |\n| **Ungroup** | Removes the group, keeps the scenes. |\n\nA group of groups is an act. One level only. Groups are saved with the screenplay.\n\n## Known limitations\n\n- There is no live file watcher or Inkpot link: re-import is prompted when you click back, and write-back happens on save.\n- articy key names for speaker and text have not been checked against every export version.\n\n## See Also\n\n- [The Planner](07_planner.md)\n- [Sequences and Bindings](06_sequences.md)\n- [Import, Export and Sharing](09_import-export.md)\n- [Companion Plugins](12_integrations.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n"}, {"file": "09_import-export.md", "slug": "import-export", "title": "Import, Export and Sharing", "md": "# Import, Export and Sharing\n\nThe **Share** page of the Framemark mode moves your work in and out of Unreal. You save a whole stage to a file, bring in a shot list, a screenplay or a Shot Designer scene, export a plan sheet, and send a stage to Maya, Houdini or Blender as USD or FBX. When the other tool changes the file, you re-import it and review the changes before anything is applied.\n\n## Prerequisites\n\n- The Framemark plugin is enabled.\n- For USD: the optional **Framemark USD Bridge** plugin (Category **Cinematics**, off by default, needs USDCore). Enable it in **Edit > Plugins** and restart the editor.\n- For FBX: nothing extra.\n\n## The Share page\n\n![The Share page of the Framemark panel](media/ui_page_share.png)\n\n| Button | Description |\n|---|---|\n| **Export Stage** | \"Save the whole stage to a file: marks, notes, setups, boundary, cameras and lights.\" |\n| **Import** | \"Bring in a Framemark file, a shot list or a screenplay.\" |\n| **Export Plan** | Saves a top-down plan as an image, vector drawing or document. See [The Planner](07_planner.md#export-plan). |\n| **Export USD** | Writes the stage as USD. Needs the Framemark USD Bridge. |\n| **Export FBX** | Writes the stage as FBX. |\n\n## Export Stage and import a Framemark file\n\n1. Select the stage.\n2. On the **Share** page, click **Export Stage**.\n3. Pick a name. The file is saved as `<label>.framemark.json` (filter \"Framemark (*.framemark.json)\").\n4. You see \"Exported '{0}'.\".\n\nTo bring it back, use **Import** and pick the **Framemark File** tile. It comes back as a new stage. A file saved by a newer version gives \"That file was saved by a newer version of Framemark.\"\n\nWhen a stage is imported, a prompt asks \"Where should '{0}' go?\" with **Original Location**, **At Viewport** or **Cancel**. Actor references reconnect by exact label match: \"{0} actor reference(s) reconnected.\"\n\n## The Import panel\n\nClick **Import** to open the Import panel. Choose a tile in **Source**.\n\n| Tile | Subtitle | Notes |\n|---|---|---|\n| **Framemark File** | `.framemark.json` | \"A stage saved with Export Stage. It comes back as a new stage.\" |\n| **Shot List** | CSV, StudioBinder | See [Shot lists](#shot-lists). |\n| **Screenplay** | Fountain, Final Draft, text, ink, articy | See [Screenplay and Story Map](08_screenplay-and-story-map.md). |\n| **Shot Designer** | Scene `.hcw` or CSV export | See [Shot Designer](#shot-designer). |\n| **USD** | Houdini, Maya, pipeline | Needs the Framemark USD Bridge. |\n| **FBX** | Maya, Blender, MotionBuilder | |\n\nThe panel has these regions: **Source**, **File** (**Browse**, or \"Paste a path or press Browse\"), **Column Mapping**, **Mapping**, **Screenplay Options**, **Preview**, and the **Import** and **Cancel** buttons. Only the regions that suit the chosen source show.\n\nEvery import is one undo step.\n\n## Shot lists\n\nA shot list in CSV becomes cameras on a stage.\n\n1. On the **Share** page, click **Import** and choose **Shot List**.\n2. Click **Browse** and pick the CSV.\n3. Use the **Stage** picker to choose where cameras go.\n4. In **Column Mapping**, set each column to a field (or accept the auto-detect).\n5. Check the **Preview**.\n6. Click **Import**.\n\nThe parser accepts comma, semicolon or tab separators, quotes and a byte order mark. It reads up to 50000 rows.\n\n### Mapping fields\n\n| Field | Description |\n|---|---|\n| **Shot Number** | Matches an existing camera or creates a new one. |\n| **Script / Board Ref** | Page or storyboard reference. |\n| **Scene** | Scene name. |\n| **Description** | What happens in the shot. |\n| **Shot Size** | The size term sets shot scale and lens. |\n| **Camera Angle** | Terms such as High Angle set camera height and tilt. |\n| **Camera Move** | The move. |\n| **Audio** | Audio note. |\n| **Subject** | The subject. |\n| **Interior / Exterior** | Location type. |\n| **Focal Length** | Overrides the lens. |\n| **Custom Field** | A free column. |\n| **Skip** | Ignore the column. |\n\n**Auto-detect** maps the first matching column to each field. If no column is set to **Shot Number**, you see \"No column is set to Shot Number, so rows are numbered 1, 2, 3 in order.\"\n\n### Presets\n\nBuilt-in presets: \"StudioBinder\" and \"Shot Designer\". Make your own with **Save As**, **Save** and **Delete Preset**. User presets are per user and work in every project.\n\n### Preview and result\n\nA matching shot number updates its camera (SH0010 is shot 1 with step 10). A new number adds a camera. The preview marks each row **Add**, **Update**, **Skip** or **No Change**, and summarises: \"{0} to add, {1} to update, {2} unchanged{3}\".\n\nWhen done: \"Imported the shot list: {0} cameras added, {1} updated.\"\n\n## Shot Designer\n\nImport a Shot Designer scene (`.hcw`) or its CSV export.\n\n1. Choose the **Shot Designer** tile and pick the file.\n2. Choose **Create New Stage** (on by default) or **Select Stage**.\n3. Set **Scale**, in cm per Shot Designer unit.\n4. In **Mapping**, set how each Shot Designer object becomes a mark or prop.\n5. Choose **Tracked Setups** or **Locked-Off Setups**.\n6. Check the preview (zoom, **Fit**).\n7. Click **Import**.\n\n| Option | Description |\n|---|---|\n| **Mapping** rows | Each object takes **Default**, **Pick One**, **New: {0}** or **None**. Role names: **Player**, **NPC**, **Companion**, **Extra**, **Prop**, **Enemy**, **Transport**. |\n| **Tracked Setups** | Cameras ride the Camera Rig Rail from the rail start. |\n| **Locked-Off Setups** | Cameras stay fixed. |\n\nMarks are named `mrk_{subject}_010`. When finished: \"Shot Designer scene imported: {0} marks, {1} props, {2} cameras, {3} moves, {4} pictures.\"\n\nA Shot Designer CSV goes through the shot-list mapper with its own preset.\n\n> **Note:** **Tracked Setups** places the camera on the rail but does not key its position along the rail.\n\n## USD and FBX export\n\nExport sends the stage to other tools. Select the stage and click **Export USD** or **Export FBX**.\n\n### Where the file goes\n\n| Setting (Editor Preferences, Pipeline) | Description |\n|---|---|\n| **Export Folder** (`PipelineFolder`) | Default `<Project>/Pipeline`. |\n| **Export File Name** (`PipelineFileName`) | Default `{stage}`. Tokens: `{show}`, `{seq}`, `{stage}`. |\n| **When The File Exists** (`PipelineVersioning`) | **New Version**: `<name>_v001`, up to `_v999`. **Overwrite**: `<name>`, with the old file kept as `.bak`. |\n| **Write Back On Save** (`bPipelineWriteBackOnSave`) | Default on. Saving the stage writes your edits back. |\n\n### What is written\n\n| Export | Files |\n|---|---|\n| USD | `<name>[_vNNN].usda` (open this one), `<name>[_vNNN].framemark.usda` (rewritten every export), `<name>_edits.usda` (no version suffix; Framemark never writes it) |\n| FBX | `<name>[_vNNN].fbx` |\n| Both | `<file>.framemark-sync.json`, the sync file |\n\nOn success you see \"Exported {0}. Edit in {1}, Framemark never writes it.\". Put your changes in `_edits.usda`, not in the other files.\n\n> **Note:** Under the default **New Version** setting the USD file is `<name>_v001.usda`. You get the plain `<name>.usda` only with **Overwrite**.\n\n### Export problems\n\n| Message | Fix |\n|---|---|\n| \"{0} is checked out by {1}.\" | Ask them to check it in. |\n| \"{0} is out of date. Get the latest first.\" | Sync from version control. |\n| \"{0} is read-only.\" | Make it writable or check it out. |\n| \"{0} changed outside Unreal since the last sync, so it was not written. Re-import it first.\" | Re-import, then export again. |\n\n## Re-import from a file\n\nWhen the exported file changes outside Unreal, click back into Framemark. The **Pipeline File Changed** prompt reads \"Re-import it? You see the changes before anything is applied.\" It uses the same **Source File Changed** setting as the Screenplay, with **Re-import**, **Ignore** and \"Don't ask again\".\n\nThe **Re-import From File** window lists every change.\n\n1. Read each row. The type is **Changed**, **Conflict**, **Added** or **Removed**.\n2. Untick any row you do not want (\"Apply this change\").\n3. For a **Conflict**, pick **Take File** (\"Use the file's change and replace what is in Unreal.\") or **Keep Unreal**. The row shows \"In the file:\" and \"In Unreal:\".\n4. Click **Apply** (\"Apply the ticked changes to the stage.\") or **Cancel**.\n\nThe result reads \"{0}: {1} changes applied to {2}.\"\n\nFor what a DCC tool should and should not change inside the USD, see `PIPELINE.md` in the plugin folder.\n\n## Samples\n\nThe plugin installs sample files under `Plugins/Framemark/Docs/Samples/` (in the source repository: `Samples/`):\n\n- `Doorway_Standoff.usda`\n- `Doorway_Standoff.framemark.usda`\n- `Doorway_Standoff_edits.usda`\n- `Doorway_Standoff.fbx`\n\nOpen `Doorway_Standoff.usda` in Maya, Houdini or Blender to see the layout.\n\n## Known limitations\n\n- Maya and Houdini round trips have not been checked end to end.\n- Only one Shot Designer scene has been tested.\n\n## See Also\n\n- [The Planner](07_planner.md)\n- [Screenplay and Story Map](08_screenplay-and-story-map.md)\n- [Rendering and Publishing](10_render-and-publish.md)\n- [Companion Plugins](12_integrations.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "10_render-and-publish.md", "slug": "render-and-publish", "title": "Rendering and Publishing", "md": "# Rendering and Publishing\n\nFramemark ships a script that builds six **Movie Render Graph** templates for the common outputs of a previs shot: dailies, stills, a final master, a path-traced master, a VFX turnover and a UK broadcast file. A second script, the render hook, runs when a render finishes, writes a manifest of what was made, and can upload the video to a review platform.\n\n## Prerequisites\n\n- Movie Render Graph and the Python Editor Script Plugin are enabled.\n- A Level Sequence to render (see [Sequences and Bindings](06_sequences.md)).\n- For uploads: a Python 3 with the client library of your review platform (see [Review uploader](#review-uploader)).\n\n## Render templates\n\nThe script `Samples/Render/framemark_render_templates.py` builds the graphs.\n\n1. Choose **Tools > Execute Python Script**.\n2. Pick `framemark_render_templates.py`.\n3. Open the Content Browser at `/Game/Cinematics/Render/Templates`.\n\nThe script deletes and rebuilds only the graphs whose names start `CS_`. Your own graphs are untouched. When it finishes the log reads \"RESULT n of 6 templates evaluate\".\n\nAll six graphs share these output settings:\n\n- Output directory: `{project_dir}/Saved/MovieRenders/{sequence_name}/{date}`\n- **Overwrite existing output**: off\n- Frame numbers padded to 4 digits\n\n### The six templates\n\n| Template | Size and rate | Output | Quality |\n|---|---|---|---|\n| **CS_Dailies** | 1080p (FHD), 24 fps | MP4 with audio, burn-in enabled on the encoder | Temporal samples 1 |\n| **CS_Stills** | FHD | PNG sequence | Spatial samples 8, anti-aliasing None, warm-up 32 |\n| **CS_Final_Master** | 4K UHD | ProRes 4444 XQ (video without audio) plus an Audio Output node (WAV) | Temporal samples 16, warm-up 120, motion blur emulated, anti-aliasing None, final CVars |\n| **CS_Final_PathTraced** | 4K | EXR (ZIP) plus WAV | Path Tracer with denoiser and reference motion blur, temporal samples 64, warm-up 120 |\n| **CS_VFX_Turnover** | 4K | Multilayer EXR (ZIP), plus a ProRes 422 HQ reference with audio | Temporal samples 16, tone curve off |\n| **CS_UK_Broadcast** | FHD, 25 fps | ProRes 422 HQ with audio, plus WAV | Temporal samples 16, warm-up 120 |\n\n### Final CVars\n\nThe final-quality graphs set:\n\n- `r.MotionBlurQuality 4`\n- `r.MotionBlurSeparable 1`\n- `r.DepthOfFieldQuality 4`\n- `r.BloomQuality 5`\n- `r.Tonemapper.Quality 5`\n\nThey also set the Global Game Overrides: disable LODs, disable texture streaming and flush grass streaming.\n\n### Use a template\n\n1. Open **Window > Cinematics > Movie Render Queue**.\n2. Click **Render (Local)** or **Render (Remote)** on a new job and pick the Level Sequence.\n3. Choose the graph from `/Game/Cinematics/Render/Templates`.\n4. Click **Render**.\n\nTo change resolution or frame rate, duplicate a template and edit the copy. The templates do not expose them as graph variables.\n\n> **Note:** **CS_UK_Broadcast** gives you the picture and sound formats. UK broadcast delivery also needs loudness of -23 LUFS, an MXF wrap, timecode starting 10:00:00:00 and a clock, none of which Unreal produces. Do those in your finishing tool.\n\n> **Note:** No template is named after a studio. None of the studios checked publish a turnover spec.\n\n## Render hook\n\nThe render hook publishes a manifest when a render finishes.\n\n1. Open **Edit > Project Settings > Plugins > Python**.\n2. Add `framemark_render_hooks.py` to **Startup Scripts**.\n3. Restart Unreal.\n4. Open your Movie Render Graph.\n5. Add an **Execute Script** node.\n6. Set **Editor-Only Script** to `FramemarkPublish`.\n\n`FramemarkPublish` is a `MovieGraphScriptBase` subclass. Its `on_job_finished` method writes `framemark_publish_<YYYYMMDD_HHMMSS>.json` next to the first output file. The manifest records the job, sequence, graph, success, created time and layers.\n\nA failed render is not published. A failure inside the hook never fails the render.\n\n### Uploading after the render\n\nIf `~/.framemark/publish.json` exists, the hook starts a detached Python process that runs the uploader. It uses the `python` key from that file, or else the Engine's bundled Python 3. The log is written to `<manifest>.log`.\n\n## Review uploader\n\n`framemark_publish.py` sends the rendered video to review platforms.\n\n```\npython framemark_publish.py <manifest.json> [--dry-run]\npython framemark_publish.py --self-test\n```\n\n- `--dry-run` logs what would be sent without sending.\n- `--self-test` checks the script without any network.\n- Only `.mov` and `.mp4` files are uploaded.\n- Each upload has 3 attempts, with waits of 5 and 10 seconds. One platform failing does not stop the others.\n- The log marks each step **OK**, **RETRY**, **FAILED** or **WOULD** and ends \"RESULT n published, m failed\".\n- Any config value can be `\"env:NAME\"` to read an environment variable.\n\n### publish.json targets\n\n| Target | Keys | Needs |\n|---|---|---|\n| `frameio` | `account_id`, `folder_id`, `token`, or `client_id` and `client_secret` for Adobe server-to-server | |\n| `syncsketch` | `user`, `api_key`, `review_id`, optional `host` | |\n| `shotgrid` | `site`, `script_name`, `api_key`, `project_id`, `entity_type`, `entity_id` | `shotgun_api3` |\n| `ftrack` | `server`, `api_user`, `api_key`, `task_id`, `asset_type` | `ftrack-python-api` |\n| `kitsu` | `host`, `email`, `password`, `task_id`, `task_status_id` | `gazu` |\n\nFrame.io accepts a legacy `token` or the Adobe server-to-server pair.\n\n> **Warning:** Only Kitsu has been tested with a live upload (8 November). Frame.io, SyncSketch, ShotGrid and ftrack have been checked in dry runs and the self-test only.\n\n## Known limitations\n\n- Wwise audio and ffmpeg steps (mux, loudness, MXF, timecode) are not built.\n- Deadline is not part of Framemark: use the AWS Deadline Cloud Unreal submitter.\n- Burn-in on **CS_Dailies** is set on the encoder only. The script does not add a Burn-In node, so check the output before relying on it.\n\n## See Also\n\n- [Sequences and Bindings](06_sequences.md)\n- [Import, Export and Sharing](09_import-export.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "11_settings-reference.md", "slug": "settings-reference", "title": "Settings and Naming Reference", "md": "# Settings and Naming Reference\n\nFramemark keeps its project-wide options in **Editor Preferences**, its per-project defaults in a **Profile** Data Asset, and the defaults for the Generate dialog in a Generate settings object. This page lists every property, its default and what it does. Use it when you need to change how Framemark names things, where it saves them, or how it behaves while you work.\n\n## Where the Settings Live\n\n| Where | Menu path | Stored in |\n|---|---|---|\n| General, Naming, Lights, Cameras, Sequence, Generate | **Edit > Editor Preferences > Framemark** | Your per-project user settings (`EditorPerProjectUserSettings`), so they are not shared through source control |\n| Marks | **Edit > Editor Preferences > Plugins > Framemark Marks** | The same per-project user settings |\n| Profile | A **Framemark Profile** Data Asset in the Content Browser | The asset itself, so you can share it |\n\n> **Note:** The Marks page sits under **Plugins**, not under **Framemark**. The other six pages share one section.\n\n> **Tip:** Use the search box at the top of Editor Preferences. Type a property name from the tables below to jump straight to it.\n\n## Prerequisites\n\n- The Framemark plugin is enabled (**Edit > Plugins**) and the editor has been restarted.\n- For the Profile, an asset of type **Framemark Profile** exists. Create one with **Add > Miscellaneous > Data Asset** in the Content Browser and pick **Framemark Profile**, then assign it in **Active Profile** (see below).\n\n---\n\n## General Page\n\nThe General page holds the behaviour options. Each heading below is a category inside the page.\n\n### Viewport\n\n| Property | Default | Description |\n|---|---|---|\n| **Show Labels** | On | Draws the name of each mark, camera and light in the Level Viewport. |\n| **Label Draw Distance** | 6000 cm | How far from the viewport camera labels still draw. Minimum 500. Only editable when **Show Labels** is on. |\n\n### Scene Boundary\n\n| Property | Default | Description |\n|---|---|---|\n| **Warn When Editing Inside Boundary** | On | Shows a warning toast when you edit something that sits inside a stage's boundary. |\n| **Auto Fit Boundary** | On | Resizes the boundary to enclose the stage's contents as you add or move them. |\n\n### Placement\n\n| Property | Default | Description |\n|---|---|---|\n| **Add Default Marks On Place** | On | A newly placed stage starts with its default marks. |\n| **Snap To Ground On Place** | On | Drops a placed item onto the floor beneath it. |\n| **Stage Anchor Location** | Centre | Which point of a new stage sits where you click. Options: **Centre**, **Front Centre**, **Back Centre**, **Front Left**, **Front Right**. |\n\n### Sequence\n\n| Property | Default | Description |\n|---|---|---|\n| **Auto Sync Marks To Sequence** | On | Keeps a stage's Level Sequence in step when its marks change. |\n| **Key To Mark Interpolation** | Stepped | The interpolation of keys made by Key To Mark. Options: **Stepped**, **Linear**, **Cubic**. |\n| **Key Sequence Start On First Key** | On | Starts the sequence's playback range on the first key you make. |\n| **Key When Assigning Sequenced Actor** | On | Keys an actor to its mark as soon as you assign it. |\n| **Keys Follow Marks** | On | Moves keys when you move the mark they were made for. |\n| **Keys Out Of Date On Open** | Ask | What happens on opening a stage whose keys no longer match its marks. Options: **Ask**, **Update**, **Leave**. Only editable when **Keys Follow Marks** is on. |\n\n### Marks\n\n| Property | Default | Description |\n|---|---|---|\n| **Drop To Mark Assigns** | On | Dropping an actor on a mark assigns it to that mark. |\n| **Drop To Mark Radius** | 60 cm | How close a dropped actor must be to a mark to count. Minimum 10, slider up to 200. |\n\n### Moves\n\n| Property | Default | Description |\n|---|---|---|\n| **Walk Speed** | 140 cm/s | Speed used for a walk move between marks. Minimum 10. |\n| **Run Speed** | 400 cm/s | Speed used for a run move between marks. Minimum 10. |\n\n### Screenplay\n\n| Property | Default | Description |\n|---|---|---|\n| **Source File Changed** | Ask | What Framemark does when an imported Screenplay file changes on disk. Options: **Ask**, **Re-import**, **Ignore**. |\n\n### Pipeline\n\n| Property | Default | Description |\n|---|---|---|\n| **Export Folder** | Empty | Where USD and FBX exports go. Empty uses the project's `Pipeline` folder. |\n| **Export File Name** | `{stage}` | The file name pattern. Tokens: `{show}`, `{seq}`, `{stage}`. |\n| **When The File Exists** | New Version | **New Version** writes the next version number. **Overwrite** replaces the file and keeps the old one as `.bak`. |\n| **Write Back On Save** | On | Saving a stage rewrites its linked USD layer or FBX. It refuses if the file changed outside Unreal or is locked in source control. |\n\n### Planner\n\n| Property | Default | Description |\n|---|---|---|\n| **Planner Grid Size** | 50 cm | Grid spacing the Planner snaps to. Minimum 5, slider up to 500. |\n\n### Profile\n\n| Property | Default | Description |\n|---|---|---|\n| **Active Profile** | Empty | The Framemark Profile asset to use. Empty means built-in defaults. |\n| **Default Project Type** | Third Person Game | The project type used when no profile is set. Options: **Third Person Game**, **First Person Game**, **Offline CG**, **Branching Dialogue**. |\n\n### Overhead\n\n| Property | Default | Description |\n|---|---|---|\n| **Plan Layer Colours** | Eight built-in rows | A list of layer name and colour pairs for the Layers panel. Defaults are below. |\n\n| Layer | Default colour |\n|---|---|\n| Background | `#8a8a8a` |\n| Boundary | `#f5c518` |\n| Set | `#a08a6a` |\n| Images | `#d09a5a` |\n| Marks | `#e05064` |\n| Cameras | `#6ec1ff` |\n| Lights | `#ffd36b` |\n| Sketch | `#b48cf0` |\n\n---\n\n## Naming Page\n\nFramemark builds every name from a **pattern**: text with `{tokens}` in it. Pick a **Preset** to start, then adjust any rule.\n\n### Naming\n\n| Property | Default | Description |\n|---|---|---|\n| **Preset** | Custom | Loads a full set of rules. See [Presets](#presets). Editing any rule switches it back to **Custom**. |\n| **Master Scope** | Project | What one master sequence covers. Options: **Project**, **Level**, **Sequence**. |\n| **Shot Sub Sequence Pattern** | `{type}_{shot}-01` | Name for a sub sequence made for a shot. |\n| **Sequence Sub Sequence Pattern** | `{type}_{seq}-01` | Name for a sub sequence made for a sequence. |\n\n### Rules\n\nThere are 11 rules. Each has the same six fields.\n\n| Field | Description |\n|---|---|\n| **Pattern** | The name template. |\n| **Separator** | Joins the parts. **As Written**, **Underscore**, **Hyphen**, **Dot**, **None**. |\n| **Case** | **As Typed**, **Lower**, **Upper**. |\n| **Padding** | Digits in a counter. 0 to 8. |\n| **Step** | How much the counter rises each time. Minimum 1. |\n| **Preview** | Read-only. Shows an example name from the current pattern. |\n\nDefaults for the **Framemark** preset:\n\n| Rule | Pattern | Padding | Step | Case |\n|---|---|---|---|---|\n| Stage | `STG_{location}_{variant}_v{v}` | 0 | 1 | As typed |\n| Mark | `mrk_{subject}_{n}` | 3 | 10 | Lower |\n| Camera | `{seq}_{shot}_{subject}_{type}` | 4 | 10 | As typed |\n| Light | `lgt_{type}_{subject}_{role}_{n}` | 2 | 1 | Lower |\n| Prop | `prp_{name}_{n}` | 2 | 1 | Lower |\n| Level Sequence | `LS_{seq}` | 0 | 10 | As typed |\n| Shot | `LS_{seq}_{shot}_v{v}` | 4 | 10 | As typed |\n| Master (Project) | `LS_{project}_Master` | 0 | 1 | As typed |\n| Master (Level) | `LS_{level}_Master` | 0 | 1 | As typed |\n| Master (Sequence) | `LS_{seq}_Master` | 0 | 1 | As typed |\n| Other Stage Element | `{type}_{desc}_{n}` | 2 | 1 | Lower |\n\n### Tokens\n\n| Token | Meaning |\n|---|---|\n| `{show}` `{ep}` `{seq}` | Show, episode and sequence codes from the **Codes** category |\n| `{shot}` | Shot number |\n| `{mark}` | Mark Order number |\n| `{role}` | The role of a mark or light, such as Key |\n| `{from}` `{at}` | Source and target of a move |\n| `{scale}` | Shot scale, such as MS |\n| `{type}` | Item type, such as camera or spot |\n| `{lens}` | Focal length |\n| `{v}` | Version number |\n| `{stage}` | Stage name |\n| `{n}` | Running counter, padded and stepped by the rule |\n| `{name}` | The item's own name |\n| `{subject}` | The actor or character at the item. Always lower case. |\n| `{desc}` | A short description |\n| `{location}` `{variant}` | Location and variant of a stage |\n| `{project}` `{level}` | Project and level names |\n| `{cine_dir}` | The Cinematics folder |\n\n- **Width:** add a colon and a number to pad a token, such as `{shot:4}`.\n- **Empty tokens:** a token with no value is dropped, together with the separator before it.\n- **Allowed characters:** a finished name keeps only `a-z A-Z 0-9 . _ -`. Anything else becomes `_`.\n\n### Presets\n\n| Preset | Style |\n|---|---|\n| **Custom** | Your own edits. |\n| **Framemark** | The defaults above. |\n| **Unreal (linear content)** | Epic's linear content style: `Stage_{n}`, `Mark_{name}_{n}`, `{seq}_SH{n}`, `Light_{n}`, `Prop_{name}_{n}`, `LS_{stage}_{seq:3}_{shot:4}`. Padding 4, step 10. |\n| **VFX (SEQ_SHOT_task_v001)** | Lower case. Level Sequence `{seq:3}_{shot:4}_{stage}_previs_v{v}`, shot `{seq}_sh{shot}_previs_v{v}`, masters `{project}_master_v{v}`. |\n| **Netflix plate** | `SHOW_EP_SEQ_SHOT` style: camera `{show}_{ep}_{seq}_{n}`, shot `{show}_{ep}_{seq}_{shot}`, Level Sequence `{show}_{ep}_{seq}_{stage}_v{v}`. Case as typed. |\n| **Blender Studio** | Lower case. Hyphens between items, underscores inside: `set-{stage}`, `{seq}-sh{n}`, `{seq:3}_{shot:4}-{stage}-previs-v{v}`. |\n\n### Schema Buttons\n\n| Button | What it does |\n|---|---|\n| **Export Schema** | Saves the whole naming setup, folders included, to a `.framemarknaming` file. |\n| **Import Schema** | Loads a `.framemarknaming` file. |\n| **Reset To Defaults** | Restores the Framemark preset and default folders. |\n\n> **Tip:** Share a `.framemarknaming` file with your team so everyone names things the same way.\n\n### Folders\n\n| Property | Default | Description |\n|---|---|---|\n| **Cinematics Folder** | `/Game/Cinematics` | The root folder. Available as `{cine_dir}`. |\n\nEach folder type has one template. Folder tokens: `{cine_dir}`, `{project}`, `{level}`, `{seq}`, `{shot}`, `{stage}`, `{location}`, `{variant}`.\n\n| Folder | Default template |\n|---|---|\n| Master | `{cine_dir}/{project}/Master` |\n| Scripts | `{cine_dir}/{project}/Scripts` |\n| Stages | `{cine_dir}/{project}/Stages/{stage}` |\n| Sequences | `{cine_dir}/{project}/Sequences/{seq}` |\n| Shots | `{cine_dir}/{project}/Sequences/{seq}/Shots/{seq}_{shot}` |\n| Edits | `{cine_dir}/{project}/Sequences/{seq}/Edits` |\n| Image Refs | `{cine_dir}/{project}/Refs` |\n| Sketches | `{cine_dir}/{project}/Sketches` |\n\n### Codes\n\n| Property | Default | Description |\n|---|---|---|\n| **Show Code** | Empty | Fills `{show}`. |\n| **Episode Code** | Empty | Fills `{ep}`. |\n| **Sequence Code** | Empty | Fills `{seq}` when nothing else sets it. |\n\n> **Note:** Old default patterns from earlier versions are upgraded to the current defaults on load. Patterns you changed are left alone.\n\n---\n\n## Lights Page\n\n| Property | Default | Description |\n|---|---|---|\n| **Presets** | Three built-in presets | The list of light presets offered by Place Light. |\n| **Default Preset** | Spot Rim | The preset used when none is picked. |\n| **Reset To Built-In Presets** | Button | Restores the three presets below. Your own presets are removed. |\n\nEach preset has these fields. Defaults shown are for a new row.\n\n| Field | Default | Description |\n|---|---|---|\n| **Name** | | The label shown in the tool. |\n| **Light Class** | Empty | The light actor to spawn. Empty uses the tool's own spot light. |\n| **Intensity** | 50 | In candelas. |\n| **Colour** | White | Light colour. |\n| **Attenuation Radius** | 1000 cm | How far the light reaches. |\n| **Outer Cone Angle** | 38 degrees | Spot lights only. |\n\nBuilt-in presets:\n\n| Preset | Class | Intensity | Colour (R, G, B) | Radius | Cone |\n|---|---|---|---|---|---|\n| Spot Rim | Tool's spot light | 150 | 1, 0.9, 0.75 | 1500 | 38 |\n| Point Fill | Point Light | 20 | 0.7, 0.82, 1 | 1000 | n/a |\n| Rect Key | Rect Light | 25 | 1, 0.96, 0.9 | 800 | n/a |\n\n---\n\n## Cameras Page\n\n| Property | Default | Description |\n|---|---|---|\n| **User Formats** | Empty list | Your own film formats, added to the built-in list. |\n| **User Lenses** | Empty list | Your own lenses, added to the built-in list. |\n\nFields of a user format:\n\n| Field | Default | Description |\n|---|---|---|\n| **Format Name** | | The label shown in menus. |\n| **Sensor Width** | 24.89 mm | Gate width. |\n| **Sensor Height** | 18.66 mm | Gate height. |\n| **Squeeze** | 1 | Anamorphic squeeze, 1 to 2. |\n| **Crop Aspect** | 0 | Crops the gate to this aspect. 0 keeps the whole gate. |\n\nFields of a user lens:\n\n| Field | Default | Description |\n|---|---|---|\n| **Lens Name** | | The label shown in menus. |\n| **Focal Length** | 35 mm | The lens's focal length. |\n\n---\n\n## Sequence Page\n\nFour options set what a new Level Sequence starts with. Each has a tick box and a value. The value only applies when its box is ticked. All four boxes are off by default, so Unreal's own defaults are used.\n\n| Option | Default value | Description |\n|---|---|---|\n| **Frame Rate** | 24 fps | Display frame rate. |\n| **Clock Rate** | 24000 | Tick resolution. |\n| **Length** | 10 s | Playback length. Minimum 0.1, slider up to 600. |\n| **Name** | `LS_{stage}` | Name for a new sequence. |\n\n---\n\n## Generate Page\n\nThese are the defaults for the **Generate** and **Build Sequence** dialogs.\n\n### Sequence\n\n| Property | Default | Description |\n|---|---|---|\n| **Name** | Empty | Name of the sequence. |\n| **Suffix** | Empty | Added to the end of the name. |\n| **Base Path** | Empty | Content folder for the result. |\n| **Seq Code** | Empty | Sequence code, as in `{seq}`. |\n| **Abbreviation** | Empty | Short form used in shot names. |\n| **Number Of Shots** | 1 | How many shots to make. 0 to 100. |\n| **Sequence To Duplicate** | None | Copies this sequence instead of making a blank one. Not saved. |\n| **Sub Sequence Names** | Empty | Names of sub sequences to make. |\n| **Instance Sub Sequences** | Off | Reuses sub sequences rather than copying them. |\n\n### Timeline\n\n| Property | Default | Description |\n|---|---|---|\n| **Start Time** | 0 s | Where the first shot starts. |\n| **Duration** | 5 s | Length of each shot. |\n\n### Shots\n\n| Property | Default | Description |\n|---|---|---|\n| **Shot Directory** | Empty | Content folder for shot assets. |\n| **Shot Prefix** | Empty | Added to each shot name. |\n| **First Shot Number** | 10 | Number of the first shot. |\n| **Shot Increment** | 10 | Gap between shot numbers. |\n| **Shot Digits** | 4 | Digits in a shot number. |\n| **Take (Version) Digits** | 3 | Digits in a take number. |\n\n### Track Settings\n\nA list of tracks to add, with a **Create** tick for each. All ticks are off by default.\n\n| List | Default entries |\n|---|---|\n| **Per Shot** | ANM, FX, LGT, EDL |\n| **Per Sequence** | FX, LGT |\n\n### Populate\n\n| Property | Default | Description |\n|---|---|---|\n| **Characters** | On | Adds the stage's characters as bindings. |\n| **Props** | On | Adds the stage's props as bindings. |\n\n### Screenplay\n\n| Property | Default | Description |\n|---|---|---|\n| **Stages** | One Per Location | Make one stage per location, or **One Per Scene**. |\n| **Seq Code Start** | 10 | First sequence code. |\n| **Seq Code Increment** | 10 | Gap between sequence codes. |\n| **Abbreviation From Slugline** | On | Takes the sequence abbreviation from the scene heading. |\n\n### Dialogs\n\n| Property | Default | Description |\n|---|---|---|\n| **Don't Ask Again: Build Sequence** | On | Skips the Build Sequence dialog and uses these values. Shift-click **Build Sequence** to open it anyway. |\n| **Don't Ask Again: Generate From Screenplay** | On | Skips the Generate dialog. |\n\nTwo hidden flags, `bBuildSequenceDialogSeen` and `bGenerateDialogSeen`, record whether you have seen each dialog once. You cannot edit them.\n\n---\n\n## Marks Page\n\nOpen **Edit > Editor Preferences > Plugins > Framemark Marks**.\n\n> **Note:** **Size**, **Opacity**, **Height Pin**, **Colour** and **Custom Mark** are only starting values for a new stage's **Look > Marks**. After that, each stage has its own. **Pin Thickness**, **Handle Colour** and **Conform To Ground** apply everywhere.\n\n### Look\n\n| Property | Default | Description |\n|---|---|---|\n| **Ring Radius** | 35 cm | Size of a mark's ring. 15 to 80. |\n| **Pin Thickness** | 1.5 | Thickness of the height pin line. 0.5 to 6. |\n| **Handle Colour** | Blue (0, 112, 224) | Colour of the selected handle. |\n| **Mark Opacity** | 1 | 0.1 to 1. |\n| **Height Pin** | Always | When the height pin shows: **Always**, **Selected**, **Off**. |\n| **Colour** | By Role | **By Role** uses the Role Colours. **One** uses a single colour. |\n| **One Colour** | Orange (0.913, 0.479, 0.014) | The colour used when **Colour** is **One**. |\n| **Conform To Ground** | On | Bends a mark's ring to follow uneven floor. |\n| **Planner Mark Look** | Ring | How marks draw in the Planner: **Ring**, **Shoulders**, **Custom**. |\n\n### Custom Look\n\n| Property | Default | Description |\n|---|---|---|\n| **Custom Mark** | Empty | A mesh or material to use as the mark. |\n| **Preview Character** | Empty | A character shown standing on unassigned marks. |\n| **Show Preview Character When Unassigned** | On | Shows the preview character on marks with no actor. |\n\n### Role Colours\n\n| Role | Colour (R, G, B) |\n|---|---|\n| Player | 1, 0.08, 0.06 |\n| Companion | 0.2, 0.75, 0.35 |\n| NPC | 1, 0.82, 0 |\n| Enemy | 1, 0.42, 0 |\n| Prop | 0.55, 0.3, 1 |\n| Transport | 1, 0.3, 0.65 |\n| Extra | 0.35, 0.37, 0.4 |\n\n---\n\n## Framemark Profile Asset\n\nA **Framemark Profile** is a Data Asset that carries the defaults for one project. Assign it in **General > Profile > Active Profile**. It has no `.ini` file, so it travels with the project.\n\n### Project\n\n| Property | Default | Description |\n|---|---|---|\n| **Project Type** | Third Person Game | **Third Person Game**, **First Person Game**, **Offli
