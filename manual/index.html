const PAGES = [{"file": "index.md", "slug": "overview", "title": "Framemark Overview", "md": "# Framemark Overview\n\n**Framemark** is an editor plugin for Unreal Engine 5.8 that brings floor plans, blocking and shot layout into the Level Editor. You place one **stage** actor in a level. The stage fences off the playing area with a boundary, holds the **marks** where every character stands, owns the cameras and lights you place, and owns the **Level Sequence** for the scene. Move the stage and the whole scene moves with it.\n\nOverheads and floor plans are standard practice in live action, CG and games, but they normally live in a separate tool from the one where the shot is made. Framemark puts them inside Unreal, next to Sequencer, so the plan and the shot are the same data.\n\nFramemark works for third person framed dialogue and for first person scenes. You choose which with the stage's **View Mode**.\n\n## Prerequisites\n\n- Unreal Engine **5.8**.\n- The **Framemark** plugin enabled in **Edit > Plugins > Cinematics**.\n- Optional companion plugins for extra features. See [Companion Plugins](12_integrations.md).\n\n## Key Concepts\n\n| Concept | Description |\n|---|---|\n| **Stage** | The `Cine Stage` actor. The root of a scene: boundary, marks, cameras, lights, props and the Level Sequence are all its members, so relocating the stage relocates the scene. |\n| **Stage Asset** | A stage saved as an asset in the **Content Browser**. A placed stage points at its Stage Asset and stays synced with it, so the same scene can be placed in many levels. |\n| **Mark** | A floor position for a character, with a facing. **Mark Order** sets who is first; Mark 1 is the lead. |\n| **Setup** | A saved arrangement of marks, cameras and lights for one beat or shot, that you can switch between. |\n| **Planner** | A 2D top-down editor for the stage (**Window > Framemark > Framemark Planner**). Not the same as **Overhead View**, which is a top-down toggle of the Level Viewport. |\n| **Screenplay** | The scene's dialogue and action, imported from a file or typed in, linked to marks, shots and sequences. |\n| **Story Map** | A map of the Screenplay's scenes and branches, laid out by group or by sequence. |\n\n## The Framemark Workflow\n\nThe Framemark panel walks you through the scene in order. Each page has its own chapter.\n\n1. **Plan**: lay out the scene top down in the [Planner](07_planner.md), or bring in a [Screenplay](08_screenplay-and-story-map.md).\n2. **Stage**: place and size the stage. See [Stages and Stage Assets](03_stages.md).\n3. **Block**: place marks and cast characters. See [Marks and Blocking](04_marks-and-blocking.md).\n4. **Shoot**: place cameras and lights. See [Cameras and Lights](05_cameras-and-lights.md).\n5. **Sequence**: build and edit the Level Sequence. See [Sequences and Bindings](06_sequences.md).\n6. **Share**: export plans, sheets, USD and FBX. See [Import, Export and Sharing](09_import-export.md).\n\nEvery button in the panel is one undo step.\n\n## In This Section\n\n| Page | What it covers |\n|---|---|\n| [Getting Started](01_getting-started.md) | Install, enable, and your first stage in 60 seconds. |\n| [Framemark Mode Interface](02_interface.md) | The panel, Home, pages, workspaces, toolbar, View menu, Quick Wheel and right-click menu. |\n| [Stages and Stage Assets](03_stages.md) | Placing stages, the boundary and film formats, Stage Assets, the Library and relocation. |\n| [Marks and Blocking](04_marks-and-blocking.md) | Marks, Mark Order, layouts, Setups, the Marks Table, paths and Key To Mark. |\n| [Cameras and Lights](05_cameras-and-lights.md) | The Shoot page, Set To Viewport, first person and Hybrid, lights and light rigs. |\n| [Sequences and Bindings](06_sequences.md) | The Sequence page, shots, bindings, multiple players and continuity tools. |\n| [The Planner](07_planner.md) | The 2D Planner, its tools, drawing grammar, snapping and export sheets. |\n| [Screenplay and Story Map](08_screenplay-and-story-map.md) | Importing and editing the Screenplay, source updates, write back and the Story Map. |\n| [Import, Export and Sharing](09_import-export.md) | The Share page, Shot Designer import, USD and FBX round trips. |\n| [Rendering and Publishing](10_render-and-publish.md) | Movie Render Graph templates, audio, encoding and review uploads. |\n| [Settings and Naming Reference](11_settings-reference.md) | Every Framemark setting, profile and naming rule. |\n| [Companion Plugins](12_integrations.md) | CAT Bridge, Odyssey Bridge, FramemarkSLR, FramemarkUSD, articy and ink. |\n| [Keyboard Shortcuts](13_shortcuts.md) | Every Framemark shortcut. |\n| [Troubleshooting](14_troubleshooting.md) | Common problems, messages and known limitations. |\n| [Case Study: The Lamp Room](15_case-study.md) | One scene end to end: plan, stage, block, shoot, sequence and render. |\n"}, {"file": "01_getting-started.md", "slug": "getting-started", "title": "Getting Started with Framemark", "md": "# Getting Started with Framemark\n\nFramemark is an Unreal Engine 5.8 editor plugin for staging cinematics. One actor, the **Cine Stage**, fences off an area of your level with a film-strip boundary, holds the **marks** where each character stands, owns the cameras and lights you place, and owns the **Level Sequence** that plays the scene. Move the stage and the whole scene moves with it. You use it to block a scene, frame the shots and build a Sequencer timeline from the same place, without hand-wiring tracks.\n\nFramemark works for third person framed dialogue and for first person. A stage property called **View Mode** (Framed, First Person or Hybrid) says which.\n\nThis page covers installing the plugin, switching it on, and placing your first stage, camera and sequence.\n\n## Prerequisites\n\n- Unreal Engine 5.8 and a project that uses it.\n- The Framemark plugin source folder, with its two build scripts, `Build_Framemark.bat` and `Install_To_Project.bat`.\n- Optional: the companion plugins **Framemark CAT Bridge**, **Framemark Odyssey Bridge**, **Framemark Light Rig Bridge** and FramemarkUSD. Framemark works without all of them. A feature that needs one is greyed out, and its tooltip names the plugin to switch on. See [Companion Plugins](12_integrations.md).\n\n## Install\n\n1. Double-click `Build_Framemark.bat`. It takes a few minutes and writes its log to `BuildLog.txt`. It builds Framemark and its small bridge plugins. A bridge is skipped, and the log says so, when the engine plugin it needs is not installed.\n2. Close the Unreal Editor.\n3. Drag your `.uproject` file onto `Install_To_Project.bat`. It installs whatever got built into the project's `Plugins` folder.\n\n> **Note:** The install script needs the editor closed. If you build and install from several sessions at once, queue the install instead of running it by hand, so it waits until no editor has the project open.\n\n## Enable the Plugin\n\n1. Open the project.\n2. Choose **Edit > Plugins**.\n3. Under **Cinematics**, tick **Framemark** if it is not already on.\n4. If you want a companion, tick **Framemark CAT Bridge**, **Framemark Odyssey Bridge** or **Framemark Light Rig Bridge** as well.\n5. Restart the editor when prompted.\n\n## Open the Framemark Mode\n\nFramemark is an Editor Mode. Open the **Mode switcher** on the main toolbar, next to Select, Landscape and Modeling, and choose **Framemark**. The mode toolkit opens the **Framemark** panel. To leave the mode, choose **Select** in the Mode switcher.\n\nWith Framemark mode on, a slim toolbar floats over the Level Viewport and the Framemark keys work: **Tab** for the Quick Wheel, **M**, **C**, **L**, **P** and **K** for the place tools and Key To Mark, and **O** for Overhead View. With the mode off, those keys keep Unreal's own meaning. See [Keyboard Shortcuts Reference](13_shortcuts.md).\n\nIf the level has no stage yet, the panel shows the **Home** page. See [Framemark Mode Interface](02_interface.md).\n\n## Your First Stage in 60 Seconds\n\n1. Choose **Framemark** in the Mode switcher.\n2. On the Home page, press **Add Stage**. If the level already has a stage, open the **Stage** page and press **Add Stage** there instead. The stage appears where the Level Viewport is looking, drops to the floor, and gets two marks: a **Player** and an **NPC**, facing each other.\n3. On the toolbar, choose **Place Camera**, then click in the Level Viewport to place a camera. The camera aims at the nearest mark's eye line as you place it. Press **Esc** to stop placing.\n4. Fly the Level Viewport to the framing you want.\n5. Select the camera, open the **Shoot** page, and press **Set To Viewport**. The camera takes the viewport's position, rotation and field of view in one step.\n6. Open the **Sequence** page and press **Build Sequence**. The first time, a dialog asks for the sequence name, the stage and the shots. Press **Build Sequence** in the dialog. Framemark creates the Level Sequence and opens Sequencer.\n7. Press **Tab** in the Level Viewport to open the Quick Wheel. That is most of the tool.\n\n![A finished stage in the Level Viewport: marks, cameras and the boundary](media/fm_stage_overview.jpg)\n\nEvery button is one undo step.\n\n> **Tip:** The Quick Wheel is a ring of the current workspace's tools at your cursor. Hold **Tab**, flick towards a tool and let go to pick it. Or tap **Tab** and click a tool.\n\n## Without the Mode\n\nYou can do the same loop by hand from the ordinary editor:\n\n1. Open **Place Actors > Cinematic > Cine Stage** and drag the stage into the level. It drops to the floor and gets a Player mark and an NPC mark.\n2. Right-click in the Level Viewport and choose **Framemark > Place Mark Here**. The mark appears where you clicked, facing the middle of the stage. The same menu has **Place Camera Here** and **Place Light Here**.\n3. Select the stage and pick a **Layout** in the **Stage** category of the Details panel if you want the marks arranged for you.\n4. Fly to a framing, then use **Set To Current Viewport** on the camera's Stage Camera component.\n5. Use the **Stage Tools** icon row at the top of the stage's Details panel: **Build Sequence** and **Open Sequence** are in its Sequence group.\n\n## What Happens Next\n\n| To do this | Read |\n|---|---|\n| Learn the panel, pages, workspaces and menus | [Framemark Mode Interface](02_interface.md) |\n| Place, size and save stages | [Stages and Stage Assets](03_stages.md) |\n| Place and arrange marks | [Marks and Blocking](04_marks-and-blocking.md) |\n| Frame shots and light them | [Cameras and Lights](05_cameras-and-lights.md) |\n| Build and maintain the Level Sequence | [Sequences and Bindings](06_sequences.md) |\n| Lay out the stage from above | [The Planner](07_planner.md) |\n\n## Known Limitations\n\n- A mark is only clickable in the Level Viewport while its stage, or a mark on it, is selected. If a handle does not respond, select the stage first.\n\n## See Also\n\n- [Framemark Mode Interface](02_interface.md)\n- [Stages and Stage Assets](03_stages.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Cameras and Lights](05_cameras-and-lights.md)\n- [Sequences and Bindings](06_sequences.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "02_interface.md", "slug": "interface", "title": "Framemark Mode Interface", "md": "# Framemark Mode Interface\n\nThe Framemark mode gives you one panel, one toolbar and six pages that follow the order you do the job: plan the stage, place it, block the marks, shoot, build the sequence and share. This page is the reference for every region of that interface: the panel header, the Home page, the pages, workspaces, the toolbar and Edit Toolbar, the View menu, the Quick Wheel, the right-click menu and the Details panels.\n\n## Prerequisites\n\n- Framemark is enabled and the **Framemark** mode is chosen in the Mode switcher. See [Getting Started with Framemark](01_getting-started.md).\n\n## The Panel\n\n![The Framemark panel on the Stage page](media/ui_framemark_panel.png)\n*The Framemark panel: title and workspace, Stage Picker, page buttons and the Stage page's tools.*\n\n1. **Title and workspace menu.** The panel title is **Framemark**. The workspace combo picks a workspace.\n2. **Workspace status.** A small dot with **Save**, **Save As** and **Revert** icons appears when you change a workspace.\n3. **Eye (View) button.** The **Show In Viewport** menu.\n4. **Menu button.** Home, Framemark Details, Toolbar Location, Settings and Manage.\n5. **Stage row.** A **Stage** label and a searchable Stage Asset picker. Its label shows the Stage Asset's name, or **No stage**.\n6. **Toolbar.** Shown in the panel when the workspace's Toolbar Location includes the panel.\n7. **Page tabs.** **Plan, Stage, Block, Shoot, Sequence, Share**, each with an icon. The icons shrink evenly when you make the panel narrow.\n8. **Page area.** The buttons of the page you are on, then the details of whatever you have selected: a stage, a mark, a camera or a light. With nothing selected, it says so.\n\nTool rows wrap onto a second row when the panel is narrow. A vertical scrollbar appears if the panel is thin. Icons are grey until you hover them, press them, or until they are the active or ticked one.\n\n### The Stage Picker\n\nThe Stage row picks the **active stage**: the one menus and tools work on. Its tooltip reads \"Active stage: the one menus and tools work on. Pick a stage in this level, or place a Stage Asset that isn't placed yet.\" The list has these parts:\n\n| Part | Description |\n|---|---|\n| **In This Level** | The stages placed in the level. Choosing one makes it active and selects it. If there are none, it reads **No stages in this level**. |\n| **Stage Assets Not In This Level** | Stage Assets in the project that are not placed. Each has a **Place {name}** entry that places it in front of the viewport camera and makes it active. |\n| **More in the planner's Library...** | Opens the Library. See [Stages and Stage Assets](03_stages.md). |\n| **Every Stage Asset is placed** | Shown when nothing is left to place. |\n\nYou can search by name, browse folders, or switch to thumbnails. Choosing a stage is one undo step (**Set Active Stage**).\n\n## The Menu Button\n\n| Item | Description |\n|---|---|\n| **Home** | Opens the Home page. |\n| **Framemark Details** | Opens the dockable Framemark Details tab. |\n| **Toolbar Location** | **Viewport**, **Panel**, **Both** or **None**, set per workspace. |\n| **Settings** | Opens Editor Preferences on any Framemark page: **General**, **Naming**, **Lights**, **Cameras**, **Sequence**, **Generate**, **Marks**. See [Settings and Naming Reference](11_settings-reference.md). |\n| **Manage** | **Edit Toolbar**, **Set As Startup Page**, **Export Workspaces**, **Import Workspaces**. |\n\n**Toolbar Location** choices:\n\n- **Viewport** (default): a slim strip over the Level Viewport.\n- **Panel**: a row at the top of the panel.\n- **Both**.\n- **None**: no toolbar at all. Use the Quick Wheel. The Planner has the same four choices.\n\n**Set As Startup Page** makes the page you are on the one the workspace starts on.\n\n## The Home Page\n\nHome is the start page. It shows when a level has no stages. A level that already has stages skips Home and picks the first stage by name. To get it back, choose **Home** in the menu button. The **X** at its top right (tooltip \"Close Home and open the Framemark panel\") closes it.\n\n1. **Logo and strapline.** **Framemark**, \"Floor plans and stages for Sequencer\".\n2. **Slate.** A slate with an LED captioned **Sequence length**, showing the active sequence's length, and rows **Level**, **Stages**, **Sequence** and **Last stage**. Empty values read **No level**, **None yet** or **None**.\n3. **Three choices.**\n   - **Add Stage** (primary): \"Places a stage where the viewport is looking.\"\n   - **Open the Planner**.\n   - **Import a stage, shot list or screenplay**.\n4. **Stage Assets in this project.** A list of the project's Stage Assets. Clicking one places it in the level, or goes to it if it is already placed (\"Place this stage in the level, or go to it if it's already placed.\"). The sort button (\"Sort the Stage Assets list\") offers **Recent** (the default), **In this level** and **Name A to Z**.\n5. **Documentation links.** Links that open the manual files from the plugin folder.\n\n## The Pages\n\nThe six pages hold every command. The same commands also appear in the Edit Toolbar gallery, the Quick Wheel and the right-click menu. Page tooltips are quoted below.\n\n### Plan\n\n![The Plan page](media/ui_page_plan.png)\n\n\"The stage from above. Open the Planner and the Screenplay, switch the viewport to Overhead View.\"\n\n| Button | Description |\n|---|---|\n| **Planner** | Opens the Planner window. See [The Planner](07_planner.md). |\n| **Screenplay** | Opens the Screenplay window. See [Screenplay and Story Map](08_screenplay-and-story-map.md). |\n| **Overhead View** (key **O**) | Flips the active Level Viewport between perspective and a top-down orthographic view framed on the stage's boundary. Press again to return to exactly where you were. |\n| **Capture** | Visible only while Overhead View is on, and enabled only when a capture is possible. Captures the level under the stage as the Planner background. See [Stages and Stage Assets](03_stages.md). |\n\n> **Note:** If you change the view yourself between two presses of Overhead View, the next press starts fresh instead of getting stuck in Top. Only one viewport's state is remembered at a time.\n\n### Stage\n\n![The Stage page](media/ui_page_stage.png)\n\n\"Place the stage, set it on the ground, fit its boundary, select it, and add or attach actors so they move with it.\"\n\n| Button | Description |\n|---|---|\n| **Add Stage** | \"Adds the 3D stage to the level where the viewport is looking. Marks, cameras and lights live on it.\" |\n| **Snap To Ground** | Drops the stage onto the floor under it. |\n| **Fit Boundary** | Wraps the boundary round every mark, camera and light on the stage. |\n| **Select Stage** | Selects the stage and everything attached to it. |\n| **Add To Stage** | Attaches the selected actors, keeping their world transform. |\n| **Attach Actors** | Attaches every assigned actor so it travels with the stage. |\n| **Detach Actors** | Detaches them, leaving them where they are. |\n\n### Block\n\n![The Block page](media/ui_page_block.png)\n\n\"Place, arrange and number marks and props.\"\n\n| Button | Description |\n|---|---|\n| **Renumber Marks** | Reorders Mark Order: Players first, then NPC, Companion, Extra, then Props, each in current order. |\n| **Move Mark To Actor** | Moves each selected actor's mark to where the actor now stands. |\n| **Bring Forward**, **Bring To Front**, **Send Backward**, **Send To Back** | Change which of several stacked marks is on top and wins clicks. |\n| **Spread Marks** | \"Move marks that share a spot onto a small circle, keeping their facing. Right-click a mark for Row and By Facing.\" |\n| **Cycle Stacked Mark** | \"Select the next mark stacked on the same spot. Clicking the stack again does the same, Shift+click goes back up.\" |\n| **Marks Table** | Opens a table of every mark on the stage. |\n\n**Apply Layout** exists as a command but is hidden from the page, because choosing a Layout on the stage applies it at once. **Re-apply Layout** is in the right-click menu. **Place Mark** (key **M**), **Place Prop** (key **P**), **Mark From Actor**, **Assign To Mark**, **Key To Mark** (key **K**) and **Snap Actors To Marks** are core tools: they sit on the toolbar and in the Quick Wheel, and they are in the Edit Toolbar gallery under **Main**. See [Marks and Blocking](04_marks-and-blocking.md).\n\n### Shoot\n\n![The Shoot page](media/ui_page_shoot.png)\n\n\"Cameras and lights, linking and setups.\"\n\n| Button | Description |\n|---|---|\n| **Set To Viewport** | Copies the Level Viewport's position, rotation and field of view to the selected camera. |\n| **Look Through** (**Ctrl+Shift+P**) | Pilots the viewport through the selected stage camera. |\n| **Camera Preset** | Bulk-makes cameras from the marks. |\n| **Follow** | The other selected actors follow the last selected actor's position and rotation. |\n| **Look At** | The other selected actors, or cameras, look at the last selected actor. |\n| **Unlink** | Removes every Framemark link on the selected actors. |\n| **New Setup** | Groups the current selection into a new setup. |\n| **Show All Setups** | Turns off solo and shows every setup. |\n| **Setups Tab** | Opens the dockable Setups panel. |\n\n**Place Camera** (key **C**) and **Place Light** (key **L**) are core tools. See [Cameras and Lights](05_cameras-and-lights.md).\n\n### Sequence\n\n![The Sequence page](media/ui_page_sequence.png)\n\n\"Build the Level Sequence and keep it in step with the stage.\"\n\n| Button | Description |\n|---|---|\n| **Build Sequence** | Creates or updates the stage's Level Sequence. Shift-click, or the **...** button beside it, reopens the dialog. |\n| **Open Sequence** | Opens the stage's Level Sequence in Sequencer. |\n| **Sync To Sequence** | Moves the mark tracks to match their marks now. |\n| **Match Previous** | Keys every marked actor on the first frame of this shot where it ends the previous shot. Greyed until a master sequence is open in Sequencer with the playhead in a shot that has one before it. |\n| **Match Next** | The mirror: the last frame of this shot, where it starts the next shot. |\n| **Start From...** | Picks a sequence and keys every marked actor on the first frame of the stage's sequence, where it ends in the one you picked. |\n| **Check Continuity** | Lists the actors whose first frame in a shot jumps from where they were on the previous shot's last frame. Greyed until a master sequence with two or more shots is open in Sequencer. |\n| **Active Sequence** | \"Pick which of the stage's Linked Sequences it plays and works on, add a Level Sequence to the stage, or take one off it.\" |\n\nSee [Sequences and Bindings](06_sequences.md).\n\n### Share\n\n![The Share page](media/ui_page_share.png)\n\n\"Export and import stages, export the plan.\"\n\n| Button | Description |\n|---|---|\n| **Export Stage** | Saves the stage as a `.framemark.json` file. |\n| **Import** | \"Bring in a Framemark file, a shot list or a screenplay.\" |\n| **Export Plan** | Opens the export dialog for the plan sheet. |\n| **Export USD** | Exports the stage as USD. |\n| **Export FBX** | Exports the stage as FBX. |\n\nSee [Import, Export and Sharing](09_import-export.md).\n\n## Workspaces\n\nA workspace is a toolbar, the page you start on, and the windows it opens and docks. Picking a workspace opens its windows and never closes ones you already have open.\n\n| Workspace | Starts on | Opens | Toolbar |\n|---|---|---|---|\n| **Director** | Plan | Planner, Screenplay | Select, Add Stage, Place Mark, Place Camera, Place Light, Place Prop, Build Sequence, Open PIE |\n| **Layout** | Block | Sequencer, Marks Table | Select, Place Mark, Place Prop, Mark From Actor, Move Mark To Actor, Assign To Mark, Key To Mark, Spread Marks, Renumber Marks, Snap Actors To Marks |\n| **Camera** | Shoot | Sequencer | Select, Place Camera, Set To Viewport, Look Through, Camera Preset, Look At, Follow, Unlink, Build Sequence, Open Sequence |\n| **Lighting** | Shoot | Nothing extra | Select, Place Light, Look At, Follow, Unlink, Look Through, Set To Viewport |\n\nYour own workspaces sit under **Custom** in the same menu. The first time you open the mode you get a workspace called Custom to start from, which starts on the Stage page. A new custom workspace's tools are Select, Place Mark, Place Prop, Place Camera, Place Light, Mark From Actor, Snap Actors To Marks and Open PIE.\n\n- **Built-in workspaces cannot be overwritten.** Change one, then choose **Save As** to keep your version.\n- Change anything (add a tool, move the toolbar) and the status dot appears. Its three icons are **Save** (\"keep your changes in this workspace\"), **Save As** (\"keep your changes as a new custom workspace\") and **Revert** (\"drop your changes and go back to the saved workspace\"). The dot's tooltip reads \"This workspace has changes you have not saved.\" **Save** is only for custom workspaces. Picking another workspace drops changes you have not saved.\n- Hover a custom workspace to see a pencil (rename) and a bin (delete).\n- A workspace also keeps your settings: the Planner's snap size and snap ticks, guides, units, theme, toolbar location, layer order, sketch resolution and panel layout; the Capture From Level options; hidden Details sections; Marks Table and Screenplay columns; and Export and Import options. Changing one is a workspace change. Per-screenplay things, such as scene order, closed scenes and ignored props, stay with the screenplay.\n- Built-in grid snap differs: Director 10 cm, Layout 25 cm, Camera 5 cm, Lighting 10 cm.\n- **Export Workspaces** and **Import Workspaces** (in **Manage**) read and write one `.framemarkworkspace` file you can send to your team.\n\n## The Toolbar and Edit Toolbar\n\nThe toolbar carries your workspace's tools, **Select** at the start and a **...** button at the end after a divider. **...** opens Edit Toolbar. The **More Tools** button shows \"the Framemark tools that are not on this toolbar.\"\n\n### Edit Toolbar\n\nThe Edit Toolbar gallery lists every tool, grouped as **Main**, then one group per page, then **View**.\n\n1. Click **...** at the end of the toolbar, or choose **Manage > Edit Toolbar**.\n2. Click a tool to add it, or drag it onto the toolbar. The hint reads \"Click a tool to add it, or drag it onto the toolbar. Drag toolbar buttons to reorder them, or right-click one for Move Left and Move Right.\"\n3. Right-click a toolbar button for **Remove** (\"Take this tool off the toolbar. It stays on its page.\"), **Move Left** or **Move Right**. A tool in the gallery has **Add To Toolbar**.\n4. Press **Reset to Workspace** (\"undo the changes you made since you pressed Edit Toolbar\"), **Cancel**, or **Done** (\"finish editing the toolbar\").\n\nWhile you edit, the toolbar row shows in the panel so you can drag. The reset, cancel and done buttons sit on their own row under the tools, so they never get cropped. **Esc** cancels and throws your changes away.\n\n**Edit Toolbar** and **Stage Settings** (the gear) are hidden tools: they have commands but no page button.\n\n## The Show In Viewport Menu\n\nThe eye button opens **Show In Viewport**. The menu stays open so you can flip several ticks, and the tick always shows the real state.\n\n| Item | Description |\n|---|---|\n| **Marks**, **Labels**, **Notes**, **Boundary**, **Props** | Framemark show flags, the same switches as **Show > Custom** in the Level Viewport, set in every level viewport at once. |\n| **Cameras**, **Lights** | Hide or show the stage's cameras and lights in the editor only. Per stage, for as long as the editor is open, and not saved into the level. A camera or light you place later follows the setting. |\n\nEach tooltip reads \"Same switch as Show > Custom > Framemark {name}\". The viewport **Show > Custom** menu lists **Framemark Marks**, **Framemark Props**, **Framemark Boundary**, **Framemark Labels**, **Framemark Notes** and **Framemark Cameras**.\n\n> **Tip:** If you place a camera or light and it is not there, check that **Cameras** or **Lights** is ticked. A message says so when you place one while it is off.\n\n## The Quick Wheel\n\nPress **Tab** with the pointer over the Level Viewport (Framemark mode on) or the Planner. A ring of the workspace's tools opens at your cursor. Hold **Tab**, flick to a tool and let go, or tap **Tab** and click one. It runs the same commands as everywhere else. In the viewport it works with nothing selected. Anywhere else, **Tab** keeps Unreal's meaning.\n\n## The Right-Click Menu\n\nRight-click in the Level Viewport and choose **Framemark**. Right-click a mark and the same entries show flat. Entries share icons with the toolbar, except the ticking ones (**Orient To Mark**, **Pin To Mark**).\n\n| Group | Entries |\n|---|---|\n| Place | **Place Mark Here**, **Place Camera Here**, **Place Light Here**, at the exact point you clicked. |\n| Mark | **Assign Actor** (with **Selected:**, **Nearby:** and **Clear**), **Orient To Mark**, **Pin To Mark**. |\n| Actor | **Mark From Actor**, **Key To Mark**, **Move Its Mark Here**, **Assign To Mark** (with a search box, a mark list and **Pick In Viewport**), **Add To Stage**. |\n| Edit | **Duplicate**, **Delete**, **Lock** and **Unlock**. |\n| Position | **Snap To Ground**, **Snap To Actor**, and **Colour**: role swatches, **Back To Role Colour** and **Custom...**. |\n| Overlapping Marks | **Arrange** (**Bring Forward**, **Bring To Front**, **Send Backward**, **Send To Back**), **Spread Marks** (**Row**, **Circle**, **By Facing**), **Select Next Mark Underneath**. |\n| Group | **Move To Stage**, **Add To Setup**, **Remove From Setup**, and **Link** (**Follow**, **Look At**, **Position**, **Rotation**, **Unlink**). |\n| Camera | **Set To Viewport**, **Look Through**. |\n| Stage | **Fit Boundary To Stage**, **Re-apply Layout**, **Select Stage + Attached**, **Renumber Marks**, **Marks Table**. |\n\n> **Note:** If the Framemark submenu says \"Select a Cine Stage first.\", select the stage, anything attached to it, or a camera whose Stage Camera component points at it, and right-click again.\n\n## Details Panels\n\nFramemark shows the selected stage, mark, camera or light in three places.\n\n- **The Framemark panel page area**, under the page buttons.\n- **Framemark Details**, a dockable tab. Its tooltip reads \"Framemark Details: the selected stage, marks, cameras and lights. Dock it anywhere, or float it.\" Its empty state reads \"Select a stage, mark, camera or light to see its details here.\" It has sections **Stage**, **Marks**, **Cameras** and **Lights**. Several selected marks edit together and show **Multiple Values** where they differ. The **Sections** menu (\"tick the sections Framemark Details shows\") has **Show All**.\n- **The ordinary Details panel.** Selecting a mark, prop, camera or light shows only its own properties, not the Stage section.\n\n### Stage Tools Row\n\n![The Details panel with a stage selected](media/fm_stage_details.png)\n*The **Stage Tools** row at the top of a stage's Details panel.*\n\nThe ordinary Details panel for a stage opens with a **Stage Tools** icon row. Each icon's tooltip reads \"Label: description\".\n\n| Group | Buttons |\n|---|---|\n| Add | **Add Mark** (\"Add one mark in front of the stage and select it.\"), **Add Camera** (\"Add one camera on the stage and select it.\"), **Add Light** (\"Add one light on the stage and select it.\"). |\n| Marks | **Renumber Marks**, **Snap Actors To Marks**. |\n| Place | **Snap To Ground**, **Fit Boundary**, **Camera Preset**. |\n| Sequence | **Build Sequence**, **Open Sequence**. |\n| Relocate | **Select Stage**, **Attach Actors**, **Detach Actors**. |\n\n### Stage Property Order\n\nThese are the stage's categories in the order the Details panel shows them. The properties are described in [Stages and Stage Assets](03_stages.md) and [Sequences and Bindings](06_sequences.md).\n\n| Category | Properties |\n|---|---|\n| **Stage** | Stage Asset, Layout, Layout Count, Mark Spacing, Flip Line Of Action |\n| **Look** | Marks, Cameras and Lights |\n| **Sequence** | Linked Sequences, Shot Length Seconds, Sequence Folder, Hold Marks In Sequence |\n| **Setups** | Ghost Opacity, Ghost Hidden Setups |\n| **Plan** | Background, Sketch |\n| **Playback** | Sequence Follows Stage, View Mode, Auto Trigger, Play Once, Has Played, Show Guides In Game |\n| **Binding** | Auto Bind Players, Auto Bind Actors By Tag, Snap Bound Actors To Marks, Player End Mark |\n| **Interrupt** | Can Be Interrupted, Interrupt Triggers, Interrupt Sequence |\n| **Camera Preset** | Preset Shot Scales, Include Master, Interior Suffix, Interior |\n\n### Mark Property Order\n\nMark rows appear in this order: **Mark** (Mark Name, Actor, Role, Prop Footprint), **Notes** (Action, Line), **Look** (Show Preview Character, Custom Colour, Preview Character), the **Actor** rows (Mark Order, Pin To Mark, Orient To Mark, Height Snapping, Sequence Track, Facing Offset, Facing Offset Degrees, Arrange Order, Pivot Height, Snap To Floor At Runtime), then **Camera**, then **Players**. A prop shows only Mark Name, Actor, Prop Footprint, Role, Notes, Look, then the Actor rows with Pin To Mark first. Every property is described in [Marks and Blocking](04_marks-and-blocking.md).\n\n### Camera and Light Rows\n\nCameras show Lens Choice, Focal Length, Aperture, Manual Focus Distance, Look At Target and Filmback, with game-mode rows when the camera is in Game mode. Lights show Intensity, Intensity Units, Light Colour, Use Temperature and Temperature first, then Look At Mark and Aim Height, then the cone and source rows. See [Cameras and Lights](05_cameras-and-lights.md).\n\n## Known Limitations\n\n- Marks are only clickable in the Level Viewport while their stage, or a mark on it, is selected.\n- Hiding cameras and lights lasts until you close the editor and is not saved with the level.\n\n## See Also\n\n- [Getting Started with Framemark](01_getting-started.md)\n- [Stages and Stage Assets](03_stages.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Keyboard Shortcuts Reference](13_shortcuts.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n"}, {"file": "03_stages.md", "slug": "stages", "title": "Stages and Stage Assets", "md": "# Stages and Stage Assets\n\nThe **stage** is the one actor you place to start a scene. A Cine Stage actor fences the area with a film-strip **boundary**, holds the marks, cameras and lights, and owns the Level Sequence. A **Stage Asset** (a Cine Stage Asset, which is a Data Asset) stores the stage's contents in the project, so the same stage can be placed in several levels, edited in the Planner, and kept in step everywhere. This page covers placing a stage, the boundary and film formats, Stage Asset sync, Draft, Save and Save As, the Library, relocating a stage, Capture From Level, and locking.\n\n## Prerequisites\n\n- Framemark is enabled and the Framemark mode is on. See [Getting Started with Framemark](01_getting-started.md).\n\n## Concepts\n\n### What a Stage Holds\n\n- **Marks** (Stage Mark components): where each character or prop stands. See [Marks and Blocking](04_marks-and-blocking.md).\n- **Cameras** (Cine Camera Actors carrying a Stage Camera component) and **lights**. See [Cameras and Lights](05_cameras-and-lights.md).\n- **A boundary** (the Ropes component): the film strip.\n- **A Level Sequence**, or several. See [Sequences and Bindings](06_sequences.md).\n\nThe stage is the sequence's transform origin and cameras are attached to it, so moving or rotating the stage moves the shot. The boundary, marks and labels are editor only.\n\n### Stage Assets\n\nA Stage Asset stores the stage as JSON (marks, cameras, lights, setups, boundary), a revision number, and counts of marks, cameras and lights, which the Content Browser tooltip shows. It can also carry a Script, a Scene ID and a Scene Number when the stage was made for a screenplay scene. Actor identities are stored as tags so a reload reconnects the same objects.\n\nThe stage's **Stage Asset** property reads: \"The Stage Asset this placement shows. Edit the stage here and the asset, and every other placement of it, follows. Pick a different asset to swap the whole stage. Editor only.\"\n\nPlacing the same asset twice gives two placements that stay in step, as Blueprint instances do.\n\n### Draft\n\nWhen you edit a stage in the Planner, the edits go to a **Draft**, not straight to the level. The Planner's live indicator reads **Draft** and its tooltip says: \"Draft: Planner edits go to the Stage Asset only. Save it (Ctrl+S) and every placement in the level updates, as Blueprint instances do. Click to sync with the level again.\"\n\nWhile a stage has an unsaved Draft, editing it in the level is held. The message reads \"Draft in Planner: '{name}' has Planner changes not saved yet. Save or discard them in the Planner to edit this stage here.\"\n\n| Action | Description |\n|---|---|\n| **Save** (**Ctrl+S**) | \"Save the Stage Asset (Ctrl+S). Every placement in the level updates to it, as one undo step.\" |\n| **Save As** | \"The draft becomes a new Stage Asset in its own tab. This stage goes back to its saved state.\" The **Save Stage Asset As** dialog asks for the new asset. |\n| **Discard Draft** | Drops the Planner changes. |\n\nIf you close the Planner with unsaved changes, an **Unsaved draft** dialog says the stage has Planner changes the level does not have yet, with **Save and Sync** and **Discard Draft**.\n\n> **Note:** If the stage's asset is shared with a copy, **Make Unique** gives this stage its own asset. The message reads \"This stage now has its own asset, '{name}'.\" Stage Assets made for stages that had none read \"Made {n} Stage Asset(s). Save them with the level.\"\n\n## Place a Stage\n\n1. Open the **Stage** page, or the Home page.\n2. Press **Add Stage**. The stage appears where the Level Viewport is looking, snaps to the floor, and gets a **Player** mark and an **NPC** mark facing each other.\n\nOr, without the mode: drag **Place Actors > Cinematic > Cine Stage** into the level.\n\nYou can turn off both the floor snap and the two starting marks in Editor Preferences. **Stage Anchor Location** (Editor Preferences) says where on a new stage the anchor is; the Framemark icon in the viewport sits on that point. See [Settings and Naming Reference](11_settings-reference.md).\n\n### Stage Page Commands\n\n| Command | Description |\n|---|---|\n| **Add Stage** | \"Adds the 3D stage to the level where the viewport is looking. Marks, cameras and lights live on it.\" |\n| **Snap To Ground** | Drops the stage onto the floor under it. If there is nothing, the message reads \"No floor found underneath.\" |\n| **Fit Boundary** | Wraps the boundary round every mark, camera and light on the stage. Sizes it makes are rounded up to whole centimetres. A size you type is kept as typed. |\n| **Select Stage** | Selects the stage and everything attached. |\n| **Add To Stage** | Attaches selected actors, keeping their world transform. |\n| **Attach Actors** | Attaches every assigned actor. |\n| **Detach Actors** | Detaches them. |\n\n> **Note:** **Snap To Ground** finds the floor on the Visibility channel below the stage, ignoring the stage and its own attachments. Move the stage above real collision first.\n\n## The Boundary\n\nThe boundary is a closed spline drawn as a strip of real film, so the rest of the team can see the footprint of the cinematic before they build through it. It draws against the sky and the level like any other object and is visible from low angles. It is editor only.\n\n![A selected stage: the boundary, the marks with their preview characters, and the stage cameras](media/st_boundary.jpg)\n\n### Boundary Properties\n\nSelect the stage and open its Boundary component (the Ropes component, category **SceneBoundary**). The Framemark Details panel shows the same properties as Boundary Shape, Boundary Width, Boundary Depth, Corner Radius, Boundary Radius, Film Format, Film Scale and Height Off Floor.\n\n| Property | Description |\n|---|---|\n| **Shape** | **Rounded Rectangle**, **Circle** or **Custom**. Dragging a spline point switches it to Custom. |\n| **Width** | Default 700 cm. |\n| **Depth** | Default 600 cm. |\n| **Corner Radius** | Default 150 cm. Rounded Rectangle only. |\n| **Radius** | Default 300 cm. Circle only. |\n| **Centre Offset** | Advanced. Shifts the boundary's centre. |\n| **Film Format** | The film stock drawn. Default **35mm 4-perf**. |\n| **Film Scale** | Default 1, range 0.25 to 5. \"1 stands 40 cm tall.\" |\n| **Height Off Floor** | Default 85 cm. |\n| **Frame Color** | Default orange. |\n| **Base Color**, **Perforation Color**, **Ground Color** | The strip's other colours. The picker tiles use the strip's own colours: a yellow frame, black base and light perforations. |\n| **Draw Floor Line** | Default on. |\n| **Inside Height Tolerance** | Default 400 cm. Advanced. How high above the boundary still counts as inside it. |\n\n### Film Formats\n\n| Label | Description |\n|---|---|\n| **35mm 4-perf** | The default. |\n| **35mm 3-perf** | |\n| **35mm 8-perf VistaVision** | |\n| **65mm 5-perf** | |\n| **70mm 5-perf print** | |\n| **IMAX 15/70** | |\n\nThe formats use real stock proportions, so the strip always reads as film. A separate list of camera film formats, used for the camera's Filmback, is described in [Cameras and Lights](05_cameras-and-lights.md).\n\n### Boundary Behaviour\n\n- **Auto Fit Boundary** (Editor Preferences, Scene Boundary, on by default): when you let go of a stage element, the boundary refits round the stage, growing or shrinking, as Fit Boundary does. A Custom outline is left as drawn. One undo puts both back.\n- Moving an actor that is not part of a stage inside someone's boundary shows a warning once per actor per 30 seconds. Turn it off at **Editor Preferences > Framemark > General > Scene Boundary > Warn When Editing Inside Boundary**.\n\n## Stage Properties\n\nThese are the stage's own properties, in the order the Details panel shows them. Sequence and Binding properties are also described in [Sequences and Bindings](06_sequences.md).\n\n![The Details panel with a stage selected](media/fm_stage_details.png)\n\n### Stage\n\n| Property | Description |\n|---|---|\n| **Stage Asset** | The Stage Asset this placement shows. Editor only. |\n| **Layout** | The arrangement of the marks. Choosing one applies it at once. Default **I - two facing**. See [Marks and Blocking](04_marks-and-blocking.md). |\n| **Layout Count** | Default 5. Shown for the O and U layouts only. |\n| **Mark Spacing** | Default 180 cm, UI range 40 to 800. The distance between mark 1 and mark 2. \"Around 100 reads as intimate, 300 as formal.\" |\n| **Flip Line Of Action** | Default off. Swaps the side of the line of action where cameras are allowed. |\n\n### Look\n\n| Property | Description |\n|---|---|\n| **Marks** | How marks draw: Style, Asset, Preview Character, Size, Opacity, Height Pin, Colour, One Colour. See [Marks and Blocking](04_marks-and-blocking.md). |\n| **Cameras and Lights** | How cameras and lights draw: Display, Size, Always Face The Camera, Show Name Label, Show On Top Of Everything. See [Cameras and Lights](05_cameras-and-lights.md). |\n\nNew stages copy their starting Look from the **Framemark Marks** settings page.\n\n### Setups\n\n| Property | Description |\n|---|---|\n| **Ghost Opacity** | Default 0.25, range 0 to 1. How solid ghosted setups look. |\n| **Ghost Hidden Setups** | Default on. Hidden setups dim instead of disappearing. |\n\n### Plan\n\n| Property | Description |\n|---|---|\n| **Background** | Image layers behind the plan. Each layer has a Texture, a centre, a **Width** (default 2000 cm), a rotation, an **Opacity** and a visibility tick. |\n| **Sketch** | The Planner sketch. See [The Planner](07_planner.md). |\n\n### Playback\n\n| Property | Description |\n|---|---|\n| **Sequence Follows Stage** | Default on. The stage is the sequence's transform origin. |\n| **View Mode** | **Framed** (default), **First Person** or **Hybrid**. |\n| **Auto Trigger** | **Manual**, **OnBeginPlay** or **WhenPlayerEntersBoundary**. |\n| **Play Once** | Default off. |\n| **Has Played** | Read-only and advanced. A save-game property. |\n| **Show Guides In Game** | Default off. Advanced. |\n\nThe stage also has event dispatchers, **On Stage Play**, **On Stage Paused**, **On Stage Stopped**, **On Stage Finished** and **On Stage Interrupted**, and Blueprint functions such as Play Stage, Stop Stage, Interrupt Stage and Reset Has Played.\n\n## Save, Save As and the Library\n\n### Save a Stage Asset\n\n1. Edit the stage in the Planner. The live indicator shows **Draft**.\n2. Press **Ctrl+S** or the Save button. Every placement of the asset in the level updates, as one undo step.\n3. To keep your edit as a new asset instead, choose **Save As**, name the asset in **Save Stage Asset As**, and confirm.\n\n### The Library\n\nThe Library is a dockable tab, **Library**: \"Framemark assets: folders, favourites, quick filters and Used In.\" It browses Stage Assets and Level Sequences by folder.\n\n| Control | Description |\n|---|---|\n| **Add** | \"Make a new Stage Asset or Level Sequence in this folder.\" |\n| **Import** | \"Import files into this folder, as the Content Browser's Import does.\" |\n| Search box | Hint \"Find a stage, scene or folder\". |\n| **In this level** | \"Only stages placed in this level.\" |\n| **All screenplays** | A filter by screenplay: \"Only stages made for one screenplay.\" |\n| Back and Forward | \"Back to the previous folder.\" and \"Forward to the next folder.\" |\n| **Go to** | \"Select it in the level, frame it and open Framemark.\" |\n| **Place** | \"Place it in front of the viewport camera.\" |\n| **Used In** | Shows where the selected asset is used. |\n| **Open in Planner** | \"Open the selected Stage Asset's plan.\" |\n| **Show in Content Browser** | \"Find the selected asset in the Content Browser.\" |\n\nEach row shows the stage name and scene, a count line such as \"{n} marks, {n} cameras, {n} lights\", and whether it is placed: \"Placed here x{n}\" or \"Not in this level\".\n\n> **Note:** The Library's layout is being redesigned and will change.\n\n## Relocate a Stage\n\nWith **Sequence Follows Stage** on, moving or rotating the stage moves the cameras with it, because they are attached. The sequence data does not change, only where it plays out.\n\nActors are not attached to the stage by default. A mark's Actor is a plain reference. Use these commands:\n\n1. **Select Stage** grabs the stage and everything attached, ready to move or copy as one.\n2. **Add To Stage** attaches selected actors, keeping their world transform.\n3. **Attach Actors** attaches every assigned actor so it travels with the stage.\n4. **Detach Actors** leaves actors where they are.\n5. **Snap Actors To Marks** puts every assigned actor back on its mark now, without touching attachment.\n\nRight-click entries **Move To Stage** and **Link** also move marks between stages. If an actor is attached to the target, **Link** reports \"Can't link an actor that is attached to the target. Use Detach From Stage first, or pick a different target.\"\n\n## Capture From Level\n\n**Capture From Level** takes a top-down capture of the level under the stage and sets it as the **Background** at the right scale. It is on the Plan page as **Capture** while Overhead View is on, and as a dockable **Capture** tab (\"Capture From Level: a top-down capture of the level under the stage, set as the Background at the right scale.\").\n\n1. Place the stage in the level. Capture needs a stage that is placed. Otherwise the reasons read \"There is no stage to capture. Pick a stage first.\" or \"The stage is not placed in the level. Place it in the level to capture it.\"\n2. Turn on **Overhead View** on the Plan page, or open the Capture tab.\n3. Press **Capture** (or **Capture From Level**).\n\nThe capture is one undo step. If it cannot run, nothing is changed, and the message says why, for example \"The capture needs the editor to be rendering. Nothing was changed.\"\n\n## Lock\n\n**Lock** keeps the selection where it is, in the viewport and the Planner. Its tooltip reads \"Lock: keeps the selection where it is, here and in the viewport. Locked marks keep their colour with a dashed ring and a padlock. Locked cameras and lights cannot be moved.\" The right-click **Lock** entry says \"A locked mark or actor can't be moved or deleted from here until you unlock it.\" A locked mark cannot be dragged, assigned an actor, or deleted. Messages read \"Those marks are locked.\" and \"That mark is locked.\" Setups can also lock their members. See [Marks and Blocking](04_marks-and-blocking.md).\n\n## Known Limitations\n\n- Hiding cameras and lights is per stage, lasts until the editor closes and is not saved.\n- Imported stages reconnect actors by exact label match only.\n\n## See Also\n\n- [Framemark Mode Interface](02_interface.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [The Planner](07_planner.md)\n- [Import, Export and Sharing](09_import-export.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n"}, {"file": "04_marks-and-blocking.md", "slug": "marks-and-blocking", "title": "Marks and Blocking", "md": "# Marks and Blocking\n\nA **mark** is a spot on the stage where a character or prop stands. Marks give every actor a place and a facing, give the Level Sequence a track per mark, and tell cameras which characters they cover. Blocking is the work of placing, naming, ordering and arranging marks until the scene reads. This page covers placing marks and props, Mark Order, names, Layouts, facing, stacks, Setups, the Marks Table, Key To Mark, casting actors onto marks, and preview characters.\n\n## Prerequisites\n\n- A stage in the level. See [Stages and Stage Assets](03_stages.md).\n- The Framemark mode on. Marks are only clickable in the Level Viewport while their stage, or a mark on it, is selected.\n\n## Concepts\n\n- **Mark Order** is the mark's number (1, 2, 3...). It orders, names and finds marks, and cameras refer to marks by it. There is no upper limit. Mark 1 is the lead.\n- **Role** says who or what stands on the mark: **Player**, **NPC**, **Companion**, **Prop**, **Extra**, **Enemy** or **Transport**. Roles set the mark's colour.\n- **Actor** is the actor in the level that stands on the mark. A mark's Actor is a plain reference, not an attachment.\n- A mark draws as a ring that hugs the ground, a facing arrow and its number.\n\n## Place Marks and Props\n\n**Place Mark** (key **M**) and **Place Prop** (key **P**) are click-to-place tools. Click to place, keep clicking, and press **Esc** to stop. A ghost (ring and facing arrow) follows your cursor before you click. While a tool runs, its settings show in a small panel. For marks they are **Face Stage Centre**, **Snap To Floor** and **Auto Number**.\n\n- The first mark on an empty stage is a **Player**. Every one after that is an **NPC**. Props are always the **Prop** role.\n- A Prop or Transport mark draws as a footprint rectangle with a facing arrow, not a ghost body. Props are green in the Planner and the viewport.\n- Right-click in the viewport and choose **Framemark > Place Mark Here** to place at the exact point you clicked.\n- The stage's **Add Mark** button in the Stage Tools row adds one mark in front of the stage and selects it.\n\n**Mark From Actor** needs actors selected. It makes a mark under each selected actor's feet, facing the way the actor faces, with the actor assigned. If the actor already has a mark on this stage, it moves that mark instead. **Move Mark To Actor** moves each selected actor's existing mark to where the actor now stands. The right-click **Move Its Mark Here** does the same, and if the actor has no mark yet it says \"That actor has no mark on this stage yet.\"\n\nTo move a mark by hand, select the stage (or any mark on it), click the mark's ring handle, and drag with the move or rotate gizmo. Position and yaw only. A locked mark does not respond.\n\n## Mark Order and Names\n\nNew marks are named `Mark_0010`, `Mark_0020` and so on, following the Mark pattern in Naming. A name you type is kept. See [Settings and Naming Reference](11_settings-reference.md).\n\n**Renumber Marks** reorders Mark Order: Players first, then NPC, Companion and Extra, then Props, each in current order. A mark still using a default name gets the default name for its new number. A name you typed stays.\n\n## Layouts\n\nPick a **Layout** on the stage and the marks arrange at once, spaced by **Mark Spacing**. It is one undo step. Missing marks are added. Marks beyond the count stay where they are, and a message names them.\n\n| Layout label | Marks | Arrangement |\n|---|---|---|\n| **Freeform (leave as is)** | any | Does nothing. |\n| **I - two facing** | 2 | The default. Facing each other. |\n| **Reverse I - two back to back** | 2 | Back to back. |\n| **Split I - two shoulder to shoulder** | 2 | Shoulder to shoulder, facing out. |\n| **A - three turned in** | 3 | Turned in towards each other. |\n| **L - three in an L** | 3 | Mark 1 leads, one ahead, one round the corner. |\n| **T - two talk, one observes** | 3 | Marks 1 and 2 talk, mark 3 observes. |\n| **Split T - two against one** | 3 | Marks 2 and 3 against mark 1. |\n| **V - three facing out** | 3 | All facing out, dialogue over the shoulder. |\n| **O - ring** | Layout Count | A ring facing the middle. |\n| **U - arc, open to camera** | Layout Count | An arc with one side open for the camera. |\n\n**Layout Count** (default 5, at least 4) only shows for O and U. **Mark Spacing** is the distance in centimetres between mark 1 and mark 2. It sets the spacing and how close the shots read.\n\n**Re-apply Layout** (right-click, **Stage** group) puts the marks back in the shape after you dragged them about. The **Apply Layout** command exists but is hidden from the page, because choosing a Layout applies it.\n\n## Facing\n\n- **Orient To Mark** makes the actor take the mark's facing (yaw only). The facing arrow is solid when it is on, and hollow with a dashed stem when it is off.\n- **Facing Offset** is **Auto** or **Manual**. With **Manual**, **Facing Offset Degrees** turns the character off the mark's direction.\n- **Face Stage Centre** in the Place Mark settings points new marks at the middle of the stage.\n- **Flip Line Of Action** on the stage swaps the side of the line where cameras are allowed.\n\n## Stacks: Marks on the Same Spot\n\nMarks on one spot show a count such as **x3**, and the top one wears the number.\n\n| Command | Description |\n|---|---|\n| **Bring Forward** | \"Moves the selected marks up one place.\" |\n| **Bring To Front** | \"Draws the selected marks on top, and clicks pick them first.\" |\n| **Send Backward** | \"Moves the selected marks down one place.\" |\n| **Send To Back** | \"Draws the selected marks underneath the others.\" |\n| **Spread Marks** | \"Move marks that share a spot onto a small circle, keeping their facing.\" |\n| **Cycle Stacked Mark** | \"Select the next mark stacked on the same spot. Clicking the stack again does the same, Shift+click goes back up.\" |\n\nRight-click **Spread Marks** for **Row** (\"Lines the marks up across the stage, in number order. Undo puts them back.\"), **Circle** (\"Puts the marks on a small circle round the spot.\") and **By Facing** (\"Pushes each mark out the way it faces.\"). The right-click heading for the arrange commands is \"When marks overlap\", and for spreading it is \"Pull the stack apart\". **Select Next Mark Underneath** is the right-click form of Cycle Stacked Mark.\n\n**Arrange Order** (a mark property) sets which mark draws on top. A higher number draws on top. It is not the Mark Order.\n\n## Mark Properties\n\nThese are in the order the Details panel shows them.\n\n### Mark\n\n| Property | Description |\n|---|---|\n| **Mark Name** | Default \"Mark 1\". |\n| **Actor** | The actor that stands on the mark. |\n| **Role** | Player, NPC, Companion, Prop, Extra, Enemy or Transport. |\n| **Prop Footprint** | Default 60 by 60 cm. Prop and Transport only. |\n\n### Notes\n\n| Property | Description |\n|---|---|\n| **Action** | What happens on this mark. |\n| **Line** | The line of dialogue said on this mark. Multi-line. |\n\nNotes show in the panel when the mark is selected, and in the viewport with **Notes** ticked in the eye menu.\n\n### Look\n\n| Property | Description |\n|---|---|\n| **Show Preview Character** | Default on. Shows a character at the mark so heights and spacing can be judged. Assigning an actor turns it off. |\n| **Custom Colour** | Tick to override the role colour. |\n| **Colour** | The mark's own colour. A custom colour wins over the role colour. |\n| **Preview Character** | Advanced. This mark's own preview character. It wins over the stage's. |\n\n![Marks in the Level Viewport: empty marks show a yellow preview character, cast marks show their actor](media/vp_marks_lights.jpg)\n\n### Actor\n\n| Property | Description |\n|---|---|\n| **Mark Order** | The mark's number. Minimum 1. |\n| **Pin To Mark** | Default on. \"Keeps the actor's track pinned to the mark for the whole sequence.\" |\n| **Orient To Mark** | Default on. \"The actor turns to face the way the mark points.\" |\n| **Height Snapping** | **Snap To Floor** drops the actor onto the floor under the mark. **Keep Mark Height** leaves it at the mark's own height, for raised spots. |\n| **Sequence Track** | \"The track in the stage's sequence that follows this mark.\" |\n| **Facing Offset**, **Facing Offset Degrees** | See Facing. |\n| **Arrange Order** | Advanced. |\n| **Pivot Height** | Advanced. |\n| **Snap To Floor At Runtime** | Advanced. |\n\n### Camera\n\n| Property | Description |\n|---|---|\n| **Allow Camera Generation** | On by default. Untick for a point-of-view mark, which draws a view cone instead of a ghost and gets no generated cameras looking at it. Locked on when the project type is First Person Game. |\n| **Default Camera**, **Close Camera**, **Wide Camera** | Advanced. |\n\n### Players\n\n| Property | Description |\n|---|---|\n| **Player Index** | Default -1. A Player mark left at -1 counts as player 0. |\n| **Binding Tag** | Advanced. The tag a sequence track binds to. If empty, the Mark Name is used. |\n\nA prop shows Mark Name, Actor, Prop Footprint, Role, Notes, Look, then the Actor rows. Players and Camera are hidden.\n\n## Role Colours\n\nColour is by role, the same in the viewport, the plan and the export. Defaults follow script breakdown colours: Player red, Companion green, NPC yellow, Enemy orange, Prop purple, Transport pink, Extra dark grey. Change them at **Editor Preferences > Plugins > Framemark Marks > Role Colours**. A mark's own **Custom Colour** wins.\n\nIn the viewport, hover lightens the ring and shows the name. A selected mark has a white inner ring, blue handles and a height label. A locked mark keeps its colour, with a dashed ring and a padlock on a dark plate. The height shows only when the mark is off the floor, as \"0.25 m above floor\".\n\n## Mark Look and Preview Characters\n\nOn the stage, under **Look**, **Marks**:\n\n| Property | Description |\n|---|---|\n| **Style** | **Ring**, **Decal**, **Mesh** or **Custom**. |\n| **Asset** | The Decal or Mesh asset. |\n| **Preview Character** | For **Custom**: shows this character on every mark. A mark's own Preview Character wins. |\n| **Size** | Ring radius, default 35 cm, range 15 to 80. |\n| **Opacity** | Default 1, range 0.1 to 1. |\n| **Height Pin** | **Always**, **Selected** or **Off**. |\n| **Colour** | **By Role** or **One**. |\n| **One Colour** | The colour when Colour is **One**. |\n\nIn the Planner, **Planner Mark Look** (**Ring**, **Shoulders** or **Custom**) decides what a character mark draws. See [The Planner](07_planner.md).\n\n## Cast Actors onto Marks\n\n| Command | Description |\n|---|---|\n| **Assign To Mark** | Opens a mark list with a search box (\"Search marks\"). Choose a mark to put the selected actor on it. **Pick In Viewport** (\"click a mark in the viewport and this actor goes on it. Clicking anywhere else cancels.\") finishes with \"Put {actor} on Mark {n}.\" |\n| Right-click **Assign Actor** | **Selected: {name}** puts the selected actor on this mark. **Nearby: {name}** puts the actor standing close to the mark on it. **Clear** takes the actor off. |\n| **Snap Actors To Marks** | Puts every assigned actor back on its mark now. |\n\nAssigning an actor to a mark that has a transform track in the stage's sequence leaves the actor where the sequence puts it. The message reads that you can use **Key To Mark**, or turn on **Key When Assigning Sequenced Actor** in Editor Preferences.\n\nAt runtime three routes bind an actor to a mark: the mark's **Actor**; an **Actor Tag** matching the mark's binding tag (with **Auto Bind Actors By Tag** on); and a local player's pawn matched by **Player Index** (with **Auto Bind Players** on). See [Sequences and Bindings](06_sequences.md).\n\n## Key To Mark\n\nAn actor that walks from mark to mark needs keys. The sequence is the stage's Level Sequence.\n\n1. Press **Open Sequence** on the Sequence page.\n2. Park the Sequencer playhead where the actor should arrive.\n3. Right-click the actor in the Level Viewport and choose **Framemark > Key To Mark**, or press **K**, and pick the mark.\n\nOne transform key is added at that time, putting the actor on the mark. **Orient To Mark** and Height Snapping are respected. If the actor has no transform track yet, one is made. It is one undo step. Do it again at another time for the next mark.\n\nIf it cannot run, the message says why: \"Pick a mark on a stage to key to.\", \"Select an actor to key to the mark.\", \"Stop Play In Editor before keying actors to marks.\", or \"Open the stage's sequence in Sequencer first (Open Sequence), then move the playhead to where the actor should reach the mark.\"\n\n**Keys follow their mark.** Move a mark later and keys made on it move with it, in the same undo step. A key you changed by hand stops following. A sequence that was closed when the mark moved asks when you open it: **Keys Out Of Date**, \"{n} keys in {sequence} were keyed to marks that have moved since. Update them to follow the marks?\" with **Update**, **Leave** and **Don't ask again**. Turn following off with **Keys Follow Marks** (Editor Preferences, Sequence). The answer is stored as **Keys Out Of Date On Open**.\n\n## Setups\n\n![The Setups tab with four setups](media/fm_setups.png)\n*The **Setups** tab for the Lamp Room: each setup lists its marks, actors and cameras, with visibility and lock toggles.*\n\nA setup is a named group of marks, cameras and lights that you show, ghost, solo or lock together.\n\n1. Select marks, cameras or lights on the stage.\n2. Press **New Setup** (\"Makes a new setup from the marks, cameras and lights you have selected. Each new setup gets its own colour.\"), or right-click and choose **Group > Add To Setup**.\n\nIf nothing is selected: \"Select marks, cameras or lights on the stage first.\"\n\n**Setups Tab** opens a dockable panel with a row per setup:\n\n| Control | Description |\n|---|---|\n| Eye | \"Show or hide this setup. Alt-click to show only this setup; Alt-click again to show all setups.\" |\n| Lock | \"Lock or unlock this setup.\" Locked marks cannot be clicked or dragged; locked member actors get their location locked too. |\n| Swatch | \"Click to change this setup's colour.\" |\n| Name | \"Press F2 or use the right click menu to rename\". |\n| Count | \"{n} marks, {n} actors\". |\n| Header eye | **Show All**: \"turns off solo and shows every setup.\" |\n| **New Setup**, **Delete** | **Delete**: \"Deletes the selected setups. Their marks and actors stay on the stage.\" |\n| Search | \"Search setups, marks and actors\". |\n| **Ghost** tick | \"hidden setups stay in the viewport as faint ghosts instead of disappearing.\" |\n| **Ghost Opacity** | \"How solid ghosted setups look. 0 is invisible, 1 is solid.\" |\n\nDouble-click a row to select everything in the setup. Drag members between setups: hold **Ctrl** to copy. Right-click gives **Solo Setup**, **Rename Setup**, **Remove From Setup**, **Copy To Setup**, **Move To Setup** and **Delete Setup**. Only things attached to this stage can join a setup. With no stage: \"Select a stage to see its setups.\" With none: \"No setups yet. Select marks and press New Setup.\"\n\nA setup keeps its Name, Colour, Visible and Locked state, its marks, members and notes. **Show All Setups** (Shoot page) clears solo.\n\n> **Note:** Ghosting dims a mark, it does not make it see-through. Member actors that are not marks cannot dim, so they hide outright when their setup is not shown.\n\n## The Marks Table\n\n![The Marks Table for a stage with seven marks](media/fm_marks_table.png)\n*The **Marks Table**: Mark Order, name, role, actor, pin and orient toggles and Height Snapping, one row per mark.*\n\n**Marks Table** opens a table of every mark on the stage so you can edit them together.\n\n| Column | Description |\n|---|---|\n| **Mark Order** | \"The mark's order on the stage: the number on its badge and in the fan. Click to change it.\" |\n| **Name** | \"The name of the mark. Click to rename.\" |\n| **Role** | \"Who or what stands on the mark.\" |\n| **Actor** | \"The actor in the level that stands on the mark.\" |\n| **Pin To Mark** | Pins the actor's track to the mark. |\n| **Orient To Mark** | The actor turns to face the way the mark points. |\n| **Height Snapping** | Snap To Floor or Keep Mark Height. |\n| **Sequence Track** | The track that follows this mark. |\n| **Setups** | \"The setups this mark is in.\" |\n| **Action** | \"What happens on this mark.\" |\n| **Line** | \"The line of dialogue said on this mark.\" |\n| **Arrange Order** | \"Which mark draws on top when marks are stacked on one spot. A higher number draws on top. This is not the Mark Order.\" |\n\nEach edit is one undo step, such as **Set Mark Order** or **Rename Mark**. Columns are part of the workspace.\n\n## Paths\n\nWalks, runs, turns and camera paths are drawn in the Planner and stored on the stage as **Moves**. Each move has a kind (Walk, Run, Turn or Camera), a From and To Mark Order, points, a duration, a start time and a note. See [The Planner](07_planner.md).\n\n## Lock, Duplicate and Delete\n\nRight-click **Duplicate** copies marks (\"Duplicate Marks\"). **Delete** removes them and skips locked marks: \"{n} mark(s) deleted, {n} locked mark(s) left.\" **Lock** and **Unlock** are in the same group.\n\n## Known Limitations\n\n- A mark is only clickable in the viewport while its stage, or a mark on it, is selected.\n- A mark will not drag if its setup is locked.\n\n## See Also\n\n- [Stages and Stage Assets](03_stages.md)\n- [Cameras and Lights](05_cameras-and-lights.md)\n- [Sequences and Bindings](06_sequences.md)\n- [The Planner](07_planner.md)\n- [Keyboard Shortcuts Reference](13_shortcuts.md)\n"}, {"file": "05_cameras-and-lights.md", "slug": "cameras-and-lights", "title": "Cameras and Lights", "md": "# Cameras and Lights\n\nFramemark cameras are Cine Camera Actors that carry a **Stage Camera** component. The component records which marks the shot covers, the shot scale, and the shot description. Lights are ordinary Unreal lights, or a light rig, attached to the stage and aimed at marks. Nothing is generated unless you ask: you place cameras and lights one at a time. This page covers the Shoot page, Set To Viewport, shot scales, Camera Preset, linking, first person and Hybrid, camera formats, lights, and the Light Rig type.\n\n## Prerequisites\n\n- A stage with at least one mark. See [Marks and Blocking](04_marks-and-blocking.md).\n- For the Light Rig type: the **Framemark Light Rig Bridge** plugin and the light rig plugin.\n\n## Place a Camera\n\n1. Choose **Place Camera** (key **C**) on the toolbar.\n2. Click in the Level Viewport. The camera aims at the nearest mark's eye line as you place it. Set the camera height in the tool's settings.\n3. Keep clicking to place more. Press **Esc** to stop.\n\nOr right-click and choose **Framemark > Place Camera Here**. The stage's **Add Camera** button adds one camera on the stage and selects it. If **Cameras** is unticked in the eye menu, the message reads \"Camera placed. It is hidden because Show Cameras is off.\"\n\nCameras are named by the naming preset, `{seq}_{shot}_{subject}_{type}` by default: sequence code, shot number, subject and shot type. Change the pattern in **Editor Preferences > Framemark > Naming**, see [Settings Reference](11_settings-reference.md). The lens and the marks it covers show on the viewport label, for example `SH0010  50mm  2>1`.\n\n## Set To Viewport\n\n1. Fly the Level Viewport to the framing you want.\n2. Select the camera.\n3. Press **Set To Viewport** on the Shoot page, or the camera's **Set To Current Viewport** function.\n\nThe camera takes the viewport's position, rotation and field of view in one step. It is not a live link. Moving the viewport again means pressing it again. The same entry is in the right-click menu on a selected stage camera.\n\n**Look Through** (**Ctrl+Shift+P**) pilots the Level Viewport through the selected stage camera, the same as Unreal's Pilot. The component's **Look Through This Camera** function does the same.\n\n## The Shoot Page\n\n![The Shoot page](media/ui_page_shoot.png)\n\n\"Cameras and lights, linking and setups.\"\n\n| Button | Description |\n|---|---|\n| **Set To Viewport** | See above. |\n| **Look Through** | Pilots the viewport through the camera. |\n| **Camera Preset** | Bulk-makes cameras. |\n| **Follow** | Select the children, the target last. They follow the target's position and rotation. |\n| **Look At** | Select the objects, the target last. A camera uses its own look-at tracking. Anything else gets a rotation constraint. |\n| **Unlink** | \"Removes every Framemark link on the selected actors. To stop an actor moving with the stage, use Detach From Stage.\" Removes only the constraints Framemark made. |\n| **New Setup**, **Show All Setups**, **Setups Tab** | See [Marks and Blocking](04_marks-and-blocking.md). |\n\nThe right-click **Link** group has **Follow**, **Look At**, **Position** (\"The other selected actors follow the last selected actor's position only.\") and **Rotation** (\"... rotation only.\"), headed \"Select the target last\". Linking wraps Unreal's own transform constraints. In the Planner, the button that stops a camera tracking a mark is also called **Unlink**.\n\n## Shot Scales\n\n| Scale | Name | Frame |\n|---|---|---|\n| 1 | **Full Close Up** | Top of shoulder. |\n| 2 | **Close** | Mid chest. |\n| 3 | **Medium** | Waist. The default. |\n| 4 | **Medium Full** | Thigh. |\n| 5 | **Full** | The whole subject. |\n\n## Stage Camera Properties\n\nIn the **Stage Camera** category:\n\n| Property | Description |\n|---|---|\n| **Look At Mark** | The Mark Order this camera looks at. Default 1. |\n| **Look From Mark** | The Mark Order this camera shoots over the shoulder of. Default 0, none. |\n| **Shot Scale** | One of the five scales. |\n| **Interior**, **Use Interior Suffix** | Interior or exterior, and whether the name gets an interior suffix. |\n| **Camera Mode** | **Cinematic** or **Game**. |\n| **Cropped Aspect Ratio** | Game mode only. Default 1.7778, range 0.5 to 4. |\n| **Tracking Look At Mark** | Read-only. The mark the camera is tracking. |\n\nThe **Shot** category holds **Shot Description**, **Script / Board Ref**, **Camera Angle**, **Camera Move**, **Audio**, **Subject**, **References**, **Other Fields** and **Show Cone In Plan**.\n\nThe component has editor buttons **Aim At Look At Mark**, **Track Look At Mark**, **Clear Look At**, **Set To Current Viewport**, **Rename From Marks** and **Look Through This Camera**.\n\n### Camera Rows in Framemark Details\n\n| Row | Description |\n|---|---|\n| **Lens Choice** (Cinematic) | The lens list runs **Universal Zoom** first, then the other zooms, then primes from the shortest to the longest. |\n| **Focal Length**, **Aperture** | Standard camera values. |\n| **Manual Focus Distance** | In centimetres. A **Sample Scene Depth** eyedropper picks it from the scene. |\n| **Look At Target** | |\n| **Filmback** | Unreal's filmback presets. |\n| **Horizontal FOV** (Game mode) | The default game field of view is 75 degrees. |\n| **FOV Preset** | **90 degrees (first person)**, **80 degrees (first person, console)**, **70 degrees (third person)**. |\n| **Crop Preset**, **Cropped Aspect Ratio** | Game mode crops. |\n| **Anamorphic**, **Squeeze Factor** | 1.33x, 1.5x or 2x. |\n| **Camera Mode** | Cinematic or Game. |\n| **Screen Width**, **Viewing Distance**, **Match Screen** | The Game-mode field of view calculator. Results: **Screen Matched FOV**, **Vertical FOV**, **Focal Length On Filmback** (all read-only). |\n| **Debug Focus Plane** | Draws the focus plane. |\n\n### Camera Formats\n\nStage camera formats include Super 35 4-perf at 1.85, 2.39 and open gate; Super 35 3-perf; 35mm 4-perf anamorphic 2x; Large format (with 1.5x and 2x anamorphic); 65mm digital (with 1.25x anamorphic); VistaVision 8-perf; IMAX 15/70; Full frame stills (with 1.5x and 2x anamorphic); and Game 16:9. Add your own formats at **Editor Preferences > Framemark > Cameras**. **Apply Format To Cameras** sets all cameras on the stage.\n\n## Camera Preset\n\n**Camera Preset** is the opt-in bulk option. It makes one camera per ordered pair of marks per listed shot scale, so three marks with three scales is eighteen cameras. Framing follows the line of action, a three-quarter angle and short-siding. It skips Prop marks and point-of-view marks. Nothing happens until you press it. Treat every result as a starting point.\n\nIt needs at least one mark and at least one entry in **Preset Shot Scales**. It is also in the stage's Stage Tools row (Place group).\n\n| Stage property (Camera Preset category) | Description |\n|---|---|\n| **Preset Shot Scales** | The scales to make. |\n| **Include Master** | Default on. Adds a master shot. |\n| **Interior Suffix** | Default off. |\n| **Interior** | Default on. |\n\nThe camera name order is not an option: camera names come from the marks.\n\n## First Person and Hybrid\n\nSet the stage's **View Mode** (Playback category) to:\n\n- **Framed**: the default. Marks are framing positions for cameras.\n- **First Person**: marks become blocking, not framing. Tick **Point Of View** (shown as the inverted **Allow Camera Generation**) on the player's mark. It draws a view cone instead of a ghost, and no cameras are generated looking at it. **Build Sequence** makes no Camera Cuts track, so the player keeps their own camera.\n- **Hybrid**: starts on the player's view and cuts to stage cameras where you have placed them. Build Sequence makes a Camera Cuts track if the stage has cameras.\n\n## Place Lights\n\n\n![The Lamp Room in the Level Viewport, with its stage cameras and lights](media/vp_marks_lights.jpg)\n\n1. Choose **Place Light** (key **L**).\n2. Choose the type from the tool's flyout.\n3. Click in the Level Viewport. While you place a light, and on the ghost, it aims at the nearest mark's eye line within 15 m. With no mark in reach it keeps the old aim. Set the light height in the tool's settings.\n\n| Flyout item | Description |\n|---|---|\n| **Spot Light** | \"Place Light drops spot lights: a cone aimed at the floor under the cursor.\" |\n| **Point Light** | \"Place Light drops point lights: light in every direction.\" |\n| **Rect Light** | \"Place Light drops rect lights: a soft panel, like a softbox.\" |\n| Presets | Your light presets, plus Directional. |\n| **Light Rig** | See below. |\n\n**Light Type** can be Spot, Point, Rect, Directional, Preset or Rig. **Preset** uses the preset picked in the Preset list. Presets live in **Editor Preferences > Framemark > Lights**: each has a name, an actor to spawn (any light actor, so a light rig or a light Blueprint works), intensity, colour, reach and cone angle. Spot Rim, Point Fill and Rect Key come ready, and **Default Preset** says which one Place Light uses first. A preset name containing a role word (key, fill, rim, background, hair, kick, ambient, practical, bounce) gives the light that role.\n\nLights are named `lgt_0010`, `lgt_0020`. In a Light name pattern, `{type}` is Spot, Point, Rect or Directional, `{role}` is the role word in the preset's name, and `{subject}` is the character on the mark the light aims at.\n\nIf **Lights** is unticked in the eye menu, the message reads \"Light placed. It is hidden because Show Lights is off.\"\n\n### Light Properties\n\n| Property | Description |\n|---|---|\n| **Look At Mark** | The Mark Order the light aims at. 0 means none. |\n| **Aim Height** | In centimetres. 0 means the mark's eye line. |\n\nFramemark Details shows **Intensity**, **Intensity Units**, **Light Colour**, **Use Temperature** and **Temperature** first, then **Look At Mark** and **Aim Height**, then **Inner Cone Angle**, **Outer Cone Angle**, **Attenuation Radius**, **Source Radius**, **Soft Source Radius** and **Source Length**.\n\n### Light Rig Type\n\nThe **Light Rig** item places a light rig on the nearest mark. Its tooltip reads: \"Place Light drops a light rig on the nearest mark. Move round the character to set where the key comes from; the rig follows whoever stands on the mark.\" Without the bridge it is greyed, never hidden, and the tooltip names the plugin to switch on.\n\n1. Choose **Place Light**, then **Light Rig** in the flyout.\n2. Move the cursor near a mark. If none is near, the message reads \"Move the cursor near a mark to place a rig: it lights the character on that mark.\"\n3. Click. The rig is placed as **Place Light Rig**, as a stage member, tagged `Framemark.Light`.\n\nThe rig follows the actor on the mark. When you cast a different actor on the mark, the rig moves to them. Placing again on a character that already has a rig re-aims its key instead of adding a second. Placing on an empty mark makes a waiting rig at the mark's eye. A cleared mark keeps its rig where it is. The Planner's Light tool places plain lights, not rigs.\n\n![A character before and after a light rig follows her](media/lt_rig_toggle.gif)\n\n## Look of Cameras and Lights\n\nUnder the stage's **Look**, **Cameras and Lights**:\n\n| Property | Description |\n|---|---|\n| **Display** | **Sprite** or **UE Mesh**. |\n| **Size** | Default 40 cm, range 10 to 200. |\n| **Always Face The Camera** | Default on. |\n| **Show Name Label** | Default on. Cameras add lens and coverage, for example `SH0010  50mm  2>1`. |\n| **Show On Top Of Everything** | Default off. |\n\nOnce placed, cameras and lights keep Unreal's own icon. The Framemark sprite shows only on the ghost that follows your cursor while you place one. A light's icon takes the light's colour.\n\n## Known Limitations\n\n- Hiding cameras and lights is per stage and lasts until the editor closes.\n- Camera Preset results are a starting point and need review.\n\n## See Also\n\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Sequences and Bindings](06_sequences.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n- [Companion Plugins](12_integrations.md)\n"}, {"file": "06_sequences.md", "slug": "sequences", "title": "Sequences and Bindings", "md": "# Sequences and Bindings\n\nA stage owns a **Level Sequence**. The Sequence page builds it from the stage, keeps it in step when marks move, and binds actors to it, in the editor and at runtime. You use it to get from blocking to a Sequencer timeline without wiring tracks by hand, and to keep shots continuous.\n\n## Prerequisites\n\n- A stage with marks, and any cameras you want. See [Stages and Stage Assets](03_stages.md).\n\n## Concepts\n\n- **Build Sequence** creates or updates the stage's Level Sequence, named by the Level Sequence pattern (default `LS_<Stage>`). It makes a possessable with a Camera Cuts track for the stage's cameras, and one tagged track per mark. Running it again only adds what is missing. It never edits or overwrites animation you made.\n- First Person stages get no Camera Cuts track. Hybrid stages do, if the stage has cameras.\n- The mark's binding tag and its track's tag are always the same string: the **Binding Tag**, or the **Mark Name** if the tag is empty.\n- One stage can have several sequences. The **Active Sequence** is the one the stage plays and works on.\n- A
