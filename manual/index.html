ne CG**, **Branching Dialogue**. Sets which tools suit the project. |\n\n### Defaults\n\n| Property | Default | Description |\n|---|---|---|\n| **View Mode** | Framed | How new stages show their camera view. |\n| **Layout** | I Frame | Starting mark layout. |\n| **Film Format** | Film 35mm 4 Perf | The starting film format. |\n| **Film Scale** | 1.0 | Scale of the film gate. 0.25 to 5. |\n| **Height Off Floor** | 85 cm | Default camera height. |\n| **Default Mark Count** | 2 | Marks on a new stage. |\n\n### Classes\n\n| Property | Default | Description |\n|---|---|---|\n| **Camera Class** | Empty | Camera actor class to spawn. |\n| **Light Class** | Empty | Light actor class to spawn. |\n\n### Naming\n\n| Property | Default | Description |\n|---|---|---|\n| **Show Code** | Empty | The show code. |\n| **Sequence Name Template** | `LS_{stage}` | Name for a new sequence. |\n| **Camera Name Template** | `{seq}_SH{n}` | Name for a new camera. |\n| **Shot Name Template** | `{seq}_SH{shot}` | Name for a shot. |\n| **Shot Number Step** | 10 | Gap between shot numbers. |\n| **Version Padding** | 3 | Digits in a version number. |\n\n> **Note:** A template left at its default defers to the **Naming** page. A template you change wins over it.\n\n---\n\n## See Also\n\n- [Framemark Overview](index.md)\n- [Framemark Mode Interface](02_interface.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Cameras and Lights](05_cameras-and-lights.md)\n- [Sequences and Bindings](06_sequences.md)\n- [Companion Plugins](12_integrations.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "12_integrations.md", "slug": "integrations", "title": "Companion Plugins", "md": "# Companion Plugins\n\nFramemark works on its own. Seven optional pieces add to it: four companion plugins that bridge to other Unreal plugins (CAT, Odyssey, StylisedLightRig, USD), an articy:draft plugin, ink support and an Unreal MCP connection. This page says what each adds, how to turn it on, and what Framemark greys out without it.\n\n## How Optional Bridges Work\n\nEach bridge is a separate Unreal plugin that depends on both Framemark and the plugin it connects to. When the bridge loads, it registers itself with Framemark. When it is missing, the matching feature is greyed out, and its tooltip says what to turn on.\n\n| Companion | Needs | Adds |\n|---|---|---|\n| **Framemark CAT Bridge** | Cinematic Assembly Tools | Stage links in Cine Assembly metadata |\n| **Framemark Odyssey Bridge** | Odyssey | Layered sketches with a locked stage underlay |\n| **FramemarkSLR** | Light rig plugin | Planner light ring and the Place Light **Rig** type |\n| **Framemark USD Bridge** | Unreal's USD Core | **Export USD** and the USD Import tile |\n| **Framemark Bridge** (articy) | articy:draft 4.2.2 or later | **Apply Changes** and **Undo Last Apply** in articy |\n\n## Prerequisites\n\n- Framemark is installed and enabled. See [Getting Started](01_getting-started.md).\n- The engine plugin each bridge connects to is installed.\n\n> **Note:** The build script builds Framemark plus each bridge. If a bridge's engine plugin is missing, it skips that bridge and logs why. Framemark itself still builds.\n\n## Turn On a Bridge\n\n1. Open **Edit > Plugins**.\n2. Search for the bridge name, such as **Framemark USD Bridge**.\n3. Tick **Enabled**.\n4. Restart the editor when asked.\n\n> **Tip:** If a bridge is not in the list, it was not built. See [Troubleshooting](14_troubleshooting.md).\n\n---\n\n## Framemark CAT Bridge\n\nLinks a stage to Cinematic Assembly Tools (CAT).\n\n**Needs:** Framemark and Cinematic Assembly Tools.\n\n- The bridge stores the stage name in the Cine Assembly metadata key `FramemarkStage`.\n- Finding the stages an assembly names (**FindStagesUsing**) reads that key.\n- Linking writes the key, so the assembly and the stage stay connected.\n\n> **Note:** Without the bridge, those two calls do nothing. Framemark shows no greyed button for CAT: the link just is not made.\n\n---\n\n## Framemark Odyssey Bridge\n\nTurns a Planner sketch into a layered Odyssey document with a locked underlay of the stage plan.\n\n**Needs:** Framemark and Odyssey.\n\n### What You Get\n\n- **Layers > Sketch > New Sketch** opens the sketch in Odyssey.\n- The sketch has a locked underlay of the stage plan, so you draw over the real layout.\n- The New Sketch texture is named `T_Sketch_<stage>` and saved in the stage's Sketches folder.\n- **Refresh Underlay** redraws the underlay after the stage changes.\n\n### Without the Bridge\n\n- **Refresh Underlay** is greyed. Its tooltip reads: \"Needs the Framemark Odyssey Bridge plugin (and Odyssey). Turn it on in Edit > Plugins, then restart.\"\n- **New Sketch** opens the sketch in Unreal's Texture Editor instead.\n\n> **Note:** The underlay shows only while the sketch is open. It is hidden for every save, so your saved texture holds only your drawing.\n\n---\n\n## FramemarkSLR\n\nConnects Framemark to the light rig plugin for shader-based character lighting.\n\n**Needs:** Framemark and the light rig plugin.\n\n\n### Planner Light Ring\n\nEach lit character gets a ring in the Planner.\n\n| Element | What it is |\n|---|---|\n| **Key**, **Fill**, **Rim** | Dots round the character's head |\n| **Broad**, **Short**, **Behind** | Arcs that show the lighting style |\n\n| To do this | Do this |\n|---|---|\n| Move a light | Drag its dot round the head. It snaps to the camera angles. |\n| Change a light's height | **Alt**-drag the dot |\n| Adjust brightness in half stops | Scroll the mouse wheel on the dot |\n| Solo one light | **Alt**-click its dot |\n| Copy a look to another character | Drag the rig chip onto that character |\n| Cancel a drag | Press **Esc** |\n\nThe tool rail gets SLR quick controls while the bridge is on.\n\n### Place Light Rig Type\n\n1. Choose the **Place Light** tool (**L**).\n2. Pick the **Rig** type.\n3. Click near a mark.\n\nThe rig drops on the nearest mark and follows the character. If you recast the mark, the rig stays with the character.\n\n![The same character without a rig (left) and lit by a light rig (right)](media/lt_rig_before_after.jpg)\n\n### Without the Bridge\n\nThe **Rig** type is greyed. Its tooltip reads: \"Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). Turn it on in Edit > Plugins, then restart.\"\n\n---\n\n## Framemark USD Bridge\n\nWrites and reads Universal Scene Description files so a stage can open in Maya, Blender or Houdini.\n\n**Needs:** Framemark and Unreal's USD Core. This plugin is off by default. Enabling it turns on USD Core for you.\n\n### What You Get\n\n- **Export USD** on the **Share** page.\n- The **USD** tile in **Import**.\n\n### Files It Writes\n\n| File | Role |\n|---|---|\n| `<base>.usda` | The file to open in your DCC. Written once. It sublayers the edits layer over the Framemark layer. |\n| `<base>.framemark.usda` | Framemark's own layer. Rewritten on every export. |\n| `<name>_edits.usda` | The artists' layer. Made empty once and never rewritten. |\n\n### What Is in the Stage\n\n- A prim `/<Stage>` with **Marks**, **Cameras** and **Lights** scopes, plus a **Boundary** made of BasisCurves.\n- Every prim carries `framemark:id` and `framemark:<attribute>` values. Keep the `framemark:id` when you edit, or the item comes back as new.\n- Setups are a variant set called `setup`, with an **All** option.\n- Units are centimetres, Z up.\n\n### Without the Bridge\n\n**Export USD** and the USD Import tile are greyed. The tooltip reads: \"Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. Turn it on in Edit > Plugins, then restart.\"\n\n> **Tip:** FBX export does not need this bridge.\n\n---\n\n## articy:draft Plugin\n\nA C# MacroPlugin for articy:draft, called **Framemark Bridge**, version 1.0.0. It applies the change list Framemark writes back into your articy project.\n\n**Needs:** articy:draft 4.2.2 or later.\n\n> **Note:** Importing an `.articyue` export into Framemark needs no plugin. You need the articy plugin only to apply changes back.\n\n### Install\n\n1. Find `ArticyPlugin/Framemark.ArticyBridge_1.0.0.mdk` in the Framemark folder.\n2. In articy:draft, open the **Package Manager**.\n3. Install the `.mdk` file.\n\nA **Framemark** menu appears in articy with two commands.\n\n### Apply Changes\n\n1. In Framemark, edit the imported Screenplay and save. Framemark writes `<export>.framemark-changes.json` next to the export.\n2. In articy, choose **Framemark > Apply Changes** and pick that file.\n3. articy checks every change first. If any object is locked or unclaimed, nothing changes.\n4. Otherwise it applies the edits, adds and cuts.\n5. The file is renamed `.applied.json`, and an undo record `.framemark-changes.undo.json` is written.\n6. A message reads \"Applied: N edited, N added, N cut.\"\n7. Export for Unreal again in articy and re-import into Framemark.\n\n### Undo Last Apply\n\n1. In articy, choose **Framemark > Undo Last Apply**.\n2. It reads the `.framemark-changes.undo.json` file.\n3. Cut lines return with new IDs.\n\n> **Warning:** Undo is refused if the lines were edited since the Apply. **Ctrl+Z** in articy does not undo an Apply.\n\n---\n\n## ink\n\nFramemark imports and writes back to `.ink` stories with no extra plugin.\n\n### Import\n\n1. Choose **Import > Screenplay**.\n2. Pick a `.ink` file.\n3. Each knot becomes a scene.\n\n### Save Back to the File\n\nSaving writes edited, added and cut lines back to the `.ink` file. Framemark keeps a `.bak` copy. It leaves your logic, tags, choices and diverts alone.\n\nIt refuses to save when:\n\n- the file changed on disk since you imported it,\n- the file is read-only,\n- the file is locked, or out of date, in source control.\n\n> **Note:** `INCLUDE` files are not read. A glued line gets a note in Framemark.\n\n---\n\n## Unreal MCP\n\nThe Unreal MCP server lets an MCP client, such as Claude Code, drive the editor. It is optional.\n\n### How It Starts\n\n`Config/DefaultEditorPerProjectUserSettings.ini` starts the MCP server with the editor. The server listens at `http://127.0.0.1:8000/mcp`.\n\n### Connect Claude Desktop\n\n1. Install Node.js. Check with `node -v`.\n2. In Claude, open **Settings > Developer > Edit Config**.\n3. Add this to `mcpServers`:\n\n```json\n\"unreal-mcp\": {\n  \"command\": \"npx\",\n  \"args\": [\"-y\", \"mcp-remote\", \"http://127.0.0.1:8000/mcp\", \"--transport\", \"http-only\"]\n}\n```\n\n4. Quit Claude fully and reopen it.\n5. Open the project in Unreal first, so the server is running.\n\n> **Note:** If Claude reports a connection refused error, the editor is not open yet or the server did not start.\n\n---\n\n## What Greys Out Without Each Companion\n\n| Missing | Greyed | Message |\n|---|---|---|\n| Framemark CAT Bridge | Nothing visible. Stage links are not made. | Needs the Framemark CAT Bridge plugin (and Cinematic Assembly Tools). |\n| Framemark Odyssey Bridge | **Refresh Underlay** | Needs the Framemark Odyssey Bridge plugin (and Odyssey). |\n| FramemarkSLR | Place Light **Rig** type and the Planner light ring | Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). |\n| Framemark USD Bridge | **Export USD**, USD Import tile | Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. |\n| articy plugin | Nothing in Framemark. **Apply Changes** is missing in articy. | |\n| Unreal MCP | Nothing in Framemark | |\n\nEach tooltip ends with \"Turn it on in Edit > Plugins, then restart.\"\n\n---\n\n## See Also\n\n- [Framemark Overview](index.md)\n- [Getting Started](01_getting-started.md)\n- [The Planner](07_planner.md)\n- [Screenplay and Story Map](08_screenplay-and-story-map.md)\n- [Import, Export and Sharing](09_import-export.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "13_shortcuts.md", "slug": "shortcuts", "title": "Keyboard Shortcuts Reference", "md": "# Keyboard Shortcuts Reference\n\nThis page lists every Framemark key and modifier-click, checked against the command bindings in the code. Shortcuts fall into three groups: the Level Viewport (Framemark mode), the Quick Wheel, and the Planner.\n\n## Prerequisites\n\n- **Framemark mode is on** for the viewport shortcuts. With the mode off, **Tab**, **M** and **K** do nothing.\n- The **Planner** window is focused for the Planner shortcuts.\n\n---\n\n## Level Viewport\n\nThese work while Framemark mode is active.\n\n| Key | Command | Notes |\n|---|---|---|\n| **M** | Place Mark | A toggle. It stays on until you press **Esc**. |\n| **P** | Place Prop | A toggle. |\n| **C** | Place Camera | A toggle. |\n| **L** | Place Light | A toggle. |\n| **K** | Key To Mark | Keys the selected actors to their marks. |\n| **O** | Overhead View | Switches the viewport to the top-down view. |\n| **Ctrl+Shift+P** | Look Through | Looks through the selected camera. |\n| **Tab** | Quick Wheel | See below. |\n| **Esc** | End the active tool | Ends a Place tool. Cancels Edit Toolbar mode. Otherwise passes to Unreal's Unselect All. |\n\n> **Note:** Clicks made while **T**, **L**, **S** or **A** is held go the engine's normal way, so Unreal's own viewport shortcuts keep working.\n\n### Quick Wheel\n\nThe Quick Wheel is a radial menu that opens at the cursor.\n\n1. Hover a Level Viewport with nothing selected.\n2. Hold **Tab**.\n3. Flick toward a slice.\n4. Release **Tab** to run it.\n\n- **Tap** instead of holding: the wheel stays open until you click.\n- A second **Tab**, or **Esc**, closes it.\n- It also works in the Planner. **Alt+Tab** is excluded there, so Windows switching still works.\n\n---\n\n## Planner\n\n### Tools\n\n| Key | Tool |\n|---|---|\n| **Q** | Select |\n| **M** | Mark |\n| **C** | Camera |\n| **L** | Light |\n| **P** | Prop |\n| **U** | Measure |\n| **W** | Path (the Move tool) |\n\n### View\n\n| Key | Action |\n|---|---|\n| **F** | Frame all |\n| **O** | Toggle Overhead View |\n| **Space + drag** | Pan |\n| **Middle or right mouse drag** | Pan |\n| **Mouse wheel** | Zoom |\n| **Double-click the compass** | Reset the view |\n\n### Editing\n\n| Key | Action |\n|---|---|\n| **E** | Arm rotate for the next drag |\n| **H** | Hide the selection (Unreal's Hide) |\n| **K** | Open the Key To Mark picker at the cursor |\n| **F2** | Rename the one selected item |\n| **Delete** or **Backspace** | Delete the selection. On a selected boundary point, removes that point. |\n| **Enter** | End a free path |\n| **Esc** | Drop a draft, cancel a drag, then clear the selection one step at a time |\n| **Ctrl+D** | Duplicate |\n| **Ctrl+A** | Select all on the plan |\n| **Ctrl+C** | Copy |\n| **Ctrl+X** | Cut |\n| **Ctrl+V** | Paste at the hovered point |\n| **Ctrl+Z** | Undo |\n| **Ctrl+Shift+Z** or **Ctrl+Y** | Redo |\n| **Ctrl+S** | Save the shown stage's Draft |\n| **Ctrl+Shift+P** | Look Through |\n\n> **Note:** Undo fires only on a fresh press while the Planner is the active window.\n\n### Mouse and Modifiers\n\n| Action | Result |\n|---|---|\n| **Shift**-click | Add to the selection |\n| **Ctrl**-click | Toggle in the selection |\n| Hold **Alt** while placing or dragging | Turns snapping off |\n| Double-click on the boundary curve (Select tool) | Adds a boundary point |\n\n---\n\n## Other Panels\n\n| Where | Key | Action |\n|---|---|---|\n| Setups tab | **F2** | Rename the setup |\n| Setups tab | **Delete** | Delete the setup |\n| Framemark panel | **Shift**-click **Build Sequence** | Opens its dialog even if Don't Ask Again is on |\n| Level Viewport | **Shift**-click a stacked mark | Goes back up the stack |\n\n---\n\n## Changing a Key\n\nThe viewport commands are Unreal commands. Rebind them under **Edit > Editor Preferences > General > Keyboard Shortcuts**, then search for **Framemark**.\n\n> **Warning:** The Planner keys and **Tab** for the Quick Wheel are handled by Framemark itself and cannot be rebound.\n\n---\n\n## See Also\n\n- [Framemark Mode Interface](02_interface.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [The Planner](07_planner.md)\n- [Troubleshooting and Known Limitations](14_troubleshooting.md)\n"}, {"file": "14_troubleshooting.md", "slug": "troubleshooting", "title": "Troubleshooting and Known Limitations", "md": "# Troubleshooting and Known Limitations\n\nThis page lists the problems you are most likely to meet, the exact messages Framemark shows, and what to do about each. It ends with the known limitations. Find your symptom in the tables, or search for the message text.\n\n## Quick Fixes\n\n| Symptom | Cause | Fix |\n|---|---|---|\n| **Tab**, **M** or **K** does nothing | Framemark mode is off | Turn on Framemark mode in the **Modes** panel. |\n| A feature is greyed with \"Needs the ... plugin\" | A companion plugin is off | **Edit > Plugins**, enable the named bridge, restart. See [Companion Plugins](12_integrations.md). |\n| A bridge is not in the Plugins list | It was not built | The build script skips a bridge whose engine plugin is missing, and logs why. Install that engine plugin, then rebuild. |\n| Nothing binds at runtime | The actor is not in the sequence, or the Binding is missing | Open the stage's Level Sequence and check the Binding. See [Sequences and Bindings](06_sequences.md). |\n| Snap To Ground finds no floor | There is no collision under the item | Add a floor with collision, or move the item over one. The message reads \"No floor found underneath.\" |\n| A mark will not drag | Marks are clickable only while their stage is selected, or the mark is locked | Select the stage first. Check the lock. |\n| Camera Preset makes nothing | The stage has no marks, or no shot scale is listed | Add marks and tick at least one shot scale. |\n| Generate leaves an actor out | The actor is already on the stage, or is carried by its Level Sequence | Check the stage's attachments and sequence. |\n| A camera or light has vanished | It is hidden | Hiding is per stage and lasts until the editor closes. Unhide it from the stage. |\n| Export Plan saved but nothing opened | The file saved but no viewer opened it | Open the saved file from the folder shown in the toast. |\n| Right-click says \"Select a Cine Stage first.\" | No stage is selected | Select the stage, then right-click again. |\n| The boundary warning toast appears | You are editing inside a boundary | Turn off **Warn When Editing Inside Boundary** in **Editor Preferences > Framemark > General**. |\n| Key To Mark asks for Sequencer | No sequence is open | Open the stage's sequence with **Open Sequence**, then park the playhead. |\n\n---\n\n## Editor Messages\n\nMessages are grouped by the task that shows them.\n\n### Stage and Marks\n\n| Message | What to do |\n|---|---|\n| Can't link an actor that is attached to the target. Use Detach From Stage first, or pick a different target. | Detach the actor, then link again. |\n| Select one or more actors first. | Select actors in the Outliner or viewport. |\n| Select a stage camera first. | Select a camera that belongs to a stage. |\n| Select two or more objects, the target last. | Select the things to link, then select the target last. |\n| Nothing linked on the selection. Actors attached to the stage move with it: use Detach From Stage. | The selection is attached, not linked. Use **Detach From Stage**. |\n| Select marks, cameras or lights on the stage first. | Select items that belong to the stage. |\n| Nothing was attached. The actors may already be on the stage, or they are in its Level Sequence, which carries them with the stage instead. | No action needed. |\n| Select a mark that has other marks on the same spot. | Select one mark of a stack. |\n| No other mark sits under this one. | The mark is not stacked. |\n| Nothing was moved. It may be locked, or not directly on the stage. | Unlock it, or move it from its own stage. |\n| Those marks are locked. / That mark is locked. | Unlock the mark. |\n| Select exactly one actor to put on a mark. | Select one actor. |\n| Select the actors to key first. | Select the actors, then key. |\n| Select a Cine Stage first. | Select a stage. |\n| Could not make the Stage Asset. / Could not place that Stage Asset here. | Check the destination folder and that the level is writable. |\n| Could not duplicate those marks. | Check the marks are not locked. |\n\n### Key To Mark and Sequence Links\n\n| Message | What to do |\n|---|---|\n| Open the stage's sequence in Sequencer first (Open Sequence), then move the playhead to where the actor should reach the mark. | Do exactly that. |\n| That sequence or track is locked, so no key was added. | Unlock the sequence or track. |\n| Could not add a key. Check the actor can be bound in this sequence. | Check the Binding. |\n| The stage's sequence is locked, so nothing was keyed. | Unlock the sequence. |\n| Nothing keyed. None of this stage's marks have a track with a position at the end of {0}. | Add a mark track with a key at that frame. |\n| Open the master sequence in Sequencer and park the playhead inside a shot first. | For **Match Previous** and **Match Next**. |\n| Open the master sequence in Sequencer first. | For **Check Continuity**. |\n| Nothing matched. None of this shot's marks have a track with a position in {0}. | The shot has no mark keys to match. |\n| No other linked sequence could be loaded to take over, so nothing was removed. | Check the other sequences exist and load. |\n| {0} sequences have their marked frames locked. Their dialogue markers were left alone. | Unlock the marked frames to change them. |\n\n### Sequence Building\n\n| Message | What to do |\n|---|---|\n| Nothing was made. Check the stage has marks and at least one shot scale listed. | Add marks and a shot scale. |\n| No active level viewport to copy from. | Click into a Level Viewport first. |\n| Could not create the Level Sequence asset. Check the Sequence Folder on the stage. | Pick a valid, writable folder. |\n| No mark transform tracks needed to move. | No action needed. |\n\n### Planner\n\n| Message | What to do |\n|---|---|\n| A boundary needs at least 3 points. | Add a third point. |\n| A path needs an end: click a mark or a second point. | Finish the path. |\n| Select a camera first, then pick the mark it should look at. | Select a camera, then the target mark. |\n| No stage to show. Place a stage in the level, or pick one from the scene tabs. | Place a stage or pick a tab. |\n| That is locked. Unlock it to move it. / Those are locked. Unlock them to delete. | Unlock the items. |\n| No {0} preset. Add one in Editor Preferences > Framemark > Lights. | Add the preset on the **Lights** page. |\n| No cameras yet. Press C, then click the plan to place one. Each camera is a shot. | Do exactly that. |\n| The capture needs the editor to be rendering. Nothing was changed. | Bring the editor window to the front and keep it rendering. |\n| The top-down render needs the editor to be rendering, so the plan has no background picture. | Same. |\n| Could not make a render target ... / Could not compress the PNG. | Retry. Check free memory and disk space. |\n| Could not import that picture. Check that the file opens in an image viewer. | Use a PNG or JPG that opens normally. |\n\n### Import and Export\n\n| Message | What to do |\n|---|---|\n| Could not write that file. / Could not read that file. | Check the path and that the file is not open elsewhere. |\n| {0} row(s) need a pick under Mapping. | Pick a target for each row in **Mapping**. |\n| Choose a stage under Select Stage, or tick Create New Stage. | Do one of those. |\n| Could not read that Shot Designer scene. | Check the file is a Shot Designer export. |\n| Could not make the folder {0}. | Check permissions. |\n| Could not write {0}: {1} / Could not read {0}: {1} | Read the reason in {1}. |\n| Could not check out {0}. {1} | Check your source control connection. |\n| {0} is read-only. | Clear the read-only flag or check it out. |\n| Could not write {0}. / Could not open {0}. (USD) | Check the path and that the USD Bridge is on. |\n| {0} has no Framemark stage prim. | The file was not made by Framemark, or the stage prim was removed. |\n\n### Screenplay Import\n\n| Message | What to do |\n|---|---|\n| This is not an articy:draft X export. In articy:draft, export for Unreal and pick the .articyue file. | Re-export from articy. |\n| This articy:draft export has no dialogues. Check the export rule set includes the packages with your dialogues. | Edit the export rule set. |\n| Pick a Fountain (.fountain), Final Draft (.fdx) or plain text (.txt) screenplay, an ink story (.ink) or an articy:draft X export (.articyue). | Pick a supported file. |\n| This scene has no stage yet. Select it and press Generate. | Generate the stage. |\n| No scenes to generate. Pick scenes in the Screenplay view, or tick them in the Generate dialog. | Pick scenes. |\n\n### Write-Back Refusals\n\nFramemark refuses to write back to the source rather than overwrite work.\n\n| Message | What to do |\n|---|---|\n| This screenplay was imported before lines were linked to the file. Re-import it once. | Re-import. |\n| It changed on disk since the last import. Re-import it, then save again. | Re-import, then save. |\n| It is checked out or locked by {0} in {1}. | Wait for the lock to clear. |\n| There is a newer version in {0}. Get latest, re-import, then save again. | Sync, re-import, save. |\n| The file is read-only. | Clear the flag or check out. |\n| {0} is not connected, so its lock on the file can't be checked. | Reconnect source control. |\n| {0} was not written back: {1} | Read the reason. |\n| The export changed since the last import. Re-import it, then save again. (articy) | Re-import. |\n| articy already has the last changes from Framemark. Export for Unreal in articy, re-import, then save again. | Apply, export, re-import. |\n| This screenplay was imported before lines were linked to articy. Re-import it once. | Re-import. |\n\n### Other\n\n| Message | What to do |\n|---|---|\n| Couldn't find {0} in the Framemark plugin folder or the folder above it. | Check the plugin install is complete. |\n| Open ... Editor Preferences are not available right now. | Open **Edit > Editor Preferences** by hand. |\n| Could not rename setup. Choose a name that is not empty and not already used. | Pick a unique name. |\n\n---\n\n## Rendering and Publishing Problems\n\n| Symptom | Cause and fix |\n|---|---|\n| Blender import has no Boundary | Blender's FBX importer does not read curves, so Boundary arrives as an empty. Use USD in Blender. |\n| Write Back On Save refuses | The file changed outside Unreal, or version control has it locked. Re-import, or release the lock. |\n| A render overwrote nothing, and you cannot find it | Renders never overwrite. They go to `Saved/MovieRenders/<sequence>/<date>` with a new version number. |\n| UK broadcast file fails delivery | CS_UK_Broadcast covers the picture. Loudness, MXF wrap and timecode are a step outside Unreal. |\n| Upload to Frame.io, SyncSketch, ShotGrid, ftrack or Kitsu did nothing | Uploads run outside Unreal. Open the `.log` next to the manifest: it says `OK` or `FAILED` per platform. Keys go in environment variables in `publish.json`, such as `\"env:FRAMEIO_TOKEN\"`. |\n| The render hooks do not run | Add `Docs/Samples/Render/framemark_render_hooks.py` under **Project Settings > Plugins > Python > Startup Scripts**, then restart. |\n\nSee [Rendering and Publishing](10_render-and-publish.md).\n\n---\n\n## Known Limitations\n\n- **Marks** are clickable only while their stage is selected.\n- **Ghosting** dims an item. It does not make it see-through.\n- **Hiding cameras and lights** is per stage and lasts until the editor closes.\n- **Shot Designer import** has been checked against one scene only.\n- **Tracked Setups** does not key the camera's rail position.\n- **Imported stages** reconnect actors by exact label only.\n- **Camera and light moves over time**, a stage moved in the DCC, and boundary changes are not brought back by USD or FBX re-import.\n- **FBX** loses the Boundary in Blender.\n- **ink** `INCLUDE` files are not read.\n- **UK broadcast** delivery needs a loudness, MXF and timecode step outside Unreal.\n\n---\n\n## See Also\n\n- [Framemark Overview](index.md)\n- [Getting Started](01_getting-started.md)\n- [Companion Plugins](12_integrations.md)\n- [Keyboard Shortcuts Reference](13_shortcuts.md)\n- [Settings and Naming Reference](11_settings-reference.md)\n"}, {"file": "15_case-study.md", "slug": "case-study", "title": "Case Study: The Lamp Room", "md": "# Case Study: The Lamp Room\n\nThis chapter takes one scene from page to rendered previs with Framemark. You plan it in the **Planner**, stage it, block two characters, shoot twelve shots, build the Level Sequence and export the plan sheet. Every step uses features covered elsewhere in this manual, so each section links to the chapter with the full detail.\n\n![The Lamp Room stage, orbiting the set with the ceiling hidden](media/fm_stage_orbit.gif)\n*The finished `STG_LampRoom` stage: blockout set, three characters on their marks, nine shot cameras and the stage boundary.*\n\nThe scene: a storm hits a lighthouse at night. **Wick**, a kite runner blown off course, climbs in through the lamp room window to look for his torn kite. **Mara**, the keeper's daughter, wakes in her bunk and mends it. Her younger brother **Tam** is lifted by a gust. When their father's footsteps come up the stairs, the three leave on the kite through the window.\n\n## Prerequisites\n\n- Framemark enabled. See [Getting Started with Framemark](01_getting-started.md).\n- The **Manny** and **Quinn** mannequins (in every new Third Person project) or your own characters.\n- A set. The case study uses free Fab assets, listed under [Assets](#assets). Any room with a window works.\n- The shot list files `case-study/lamp_room__Interior.csv` (SH0010 to SH0110) and `case-study/lamp_room__Gallery.csv` (SH0120). One file per stage.\n\n## Assets\n\n| Need | Fab listing | Note |\n|---|---|---|\n| Lighthouse exterior | [Octagonal Timber Lighthouse Tower](https://www.fab.com/listings/0d3fe088-3cb7-4627-af79-b3c0837c5a6c) | Free. The tower for the exterior stage. |\n| Lighthouse exterior, alternative | [Lighthouse Stylized Low-Poly](https://www.fab.com/listings/a45bc324-53a9-4dbb-b60f-ab0613059bbc) | Free. Lighter, stylised. |\n| Interior dressing | [Interiors FREE - Cozy Cartoon Pack](https://www.fab.com/listings/ef194997-eb8c-4fc0-9d11-dad28d00eaa2) | Free. Bunk, chest, chair, shelves. |\n| Interior shell | [Medieval Room Kit](https://www.fab.com/listings/52610433-0210-40e5-884b-abc12cf8901e) | Free. Timber walls and a window. |\n| Practical light | [Old Candle Holder](https://www.fab.com/listings/ece21955-ffb9-4c32-abfe-0f7e8d6a77a6) | Free, Quixel Megascans. |\n\n> **Note:** Check each listing's licence on Fab before you add it to your library.\n\n## The script and the shot list\n\nThe scene has twelve shots over two stages: `STG_LampRoom` (inside) and `STG_Gallery` (the sky outside the window). Units are centimetres. The origin is the centre of the lamp room floor; **+X** is towards the window.\n\n**180 line:** the room's spine runs from the stairs (-X) to the window (+X). In the two-shot (SH0050) the line runs from the ladder top (Mark 4) to Mara's bunk (Mark 3), with the camera on the room side.\n\n| Shot | Sec | Size | Angle | Lens | Description |\n|---|---|---|---|---|---|\n| SH0010 | 10 | Wide | Low | 24 | MASTER. Rain on the glass. Wick crouches on the sill, eases the window open and slips in. Camera pans with him along the right wall. |\n| SH0020 | 8 | Wide | High | 18 | Locked high wide, jump cuts in one framing: Wick under the bunk, behind the oilskins, up the ladder. |\n| SH0030 | 10 | Medium | High | 35 | He finds the kite, its sail ripped. He sinks to the floor. Camera booms up: the first high angle on him. |\n| SH0040 | 5 | Close up | Low | 85 | From his height, Mara sits up in her bunk at the edge of frame. Mara: \"Who's there?\" |\n| SH0050 | 14 | Medium wide | Eye | 35 | Two-shot. Wick springs to the ladder top, the highest point in the room, and introduces himself. Mara stays frame right. |\n| SH0060 | 4 | Insert | Eye | 85 | Ember, Wick's clockwork lantern bird, preens on the lamp rail. |\n| SH0070 | 12 | Medium | Low | 35 | Mara kneels at the window seat and stitches the sail. Wick holds the frame steady. |\n| SH0080 | 6 | Medium | Low | 28 | The kite is whole. Wick jumps onto the window seat, fists on hips, and crows. |\n| SH0090 | 3 | Insert | High | 85 | He holds out his hand. She drops her brass compass into it. |\n| SH0100 | 14 | Medium wide | High | 18 | A gust bursts the window. Tam, woken, tumbles upside down past the lamp. Camera orbits against the spin. |\n| SH0110 | 6 | Close up | Eye | 50 | Footsteps on the stairs. Mara points at the door, looks to Wick. |\n| SH0120 | 20 | Wide | Eye | 24 | `STG_Gallery`. A chain of hands under the kite: Wick, Mara, Tam. Out past the lighthouse beam, left to right. |\n\n> **Note:** The renders in this chapter cover the nine shots on `STG_LampRoom` that hold a character. The two inserts (SH0060, SH0090) need props, and SH0120 needs the `STG_Gallery` stage, so they are not shown.\n\n### Marks\n\n| Mark Order | Name | x, y, z | Note |\n|---|---|---|---|\n| 1 | mrk_Window | 370, 0, 70 | Window seat. Wick's entry, the mending, the exit. |\n| 2 | mrk_Floor | 120, -40, 0 | Centre of the floor. Wick at floor level for the first time. |\n| 3 | mrk_Bunk | 250, 250, 55 | Mara sitting up in her bunk. |\n| 4 | mrk_LadderTop | 250, 110, 110 | Top of the lamp ladder: Wick's perch. |\n| 5 | mrk_Mend | 320, 40, 0 | Mara kneels to mend the sail. |\n| 6 | mrk_Door | -320, -260, 0 | The stair door. |\n| 7 | mrk_Float | 200, 60, 170 | Tam in the gust. |\n| 1 | mrk_Out | 700, 0, 300 | On `STG_Gallery`: just outside the window. Each stage numbers its own marks. |\n\n### Poses\n\nEach beat holds one Control Rig pose on the character. Set the pose on the Mark in the **Marks Table**, see [Marks and Blocking](04_marks-and-blocking.md).\n\n| Beat | Character | Pose |\n|---|---|---|\n| SH0010, on the sill | Wick | Crouch |\n| SH0030, the torn kite | Wick | Sitting on the floor, knees up, face in forearms |\n| SH0040 | Mara | Sitting up, weight back on one hand |\n| SH0050 | Wick | Perched on the ladder top, one hand on the rail |\n| SH0070 | Mara | Kneeling, needle hand raised |\n| SH0080 | Wick | Fists on hips, chest out, head back |\n| SH0090 | Wick | Hand held out, palm up |\n| SH0100 | Tam | Upside down, arms wide |\n| SH0110 | Mara | Arm straight at the door, head turned to Wick |\n| SH0120 | Wick, Mara | Flying chain: lead and middle |\n\n> **Note:** The renders below hold every character in an idle pose, so the framing reads before any posing work.\n\n## 1. Plan the room\n\n![The Planner with the Lamp Room stage](media/fm_planner.png)\n*The Lamp Room in the Planner: the boundary, marks 1 to 7 and every shot camera with its lens.*\n\n1. Open **Window > Framemark > Framemark Planner**.\n2. Draw the room's footprint with the boundary tool and set the window, ladder and bunk as background shapes. See [The Planner](07_planner.md).\n3. Place marks 1 to 7 from the table above.\n4. Drag a path from Mark 1 to Mark 2 along the right wall: Wick's route in SH0010.\n\n## 2. Stage the set\n\n1. Dress the level with the Fab set.\n2. On the **Stage** page, place a stage over the room and name it `STG_LampRoom`. See [Stages and Stage Assets](03_stages.md).\n3. Size the boundary to the walls.\n4. Place a second stage outside the window, `STG_Gallery`, for SH0120.\n\n![The STG_LampRoom stage seen from above the set](media/fm_stage_overview.jpg)\n*`STG_LampRoom` in the Level Viewport. The yellow figures are the mark stand-ins; the orange line is the stage boundary.*\n\n![The Details panel with the stage selected](media/fm_stage_details.png)\n*Select the stage to see its **Stage Tools** row, its Level Sequence and its Stage Asset in the **Details** panel.*\n\n> **Tip:** Save each stage as a Stage Asset. If the set moves, move the stage and the marks, cameras and sequence move with it.\n\n## 3. Block the characters\n\n![The Marks Table for the Lamp Room](media/fm_marks_table.png)\n*Wick on Mark 1, Mara on Mark 3 and Tam on Mark 7 in the **Marks Table**.*\n\n1. On the **Block** page, cast Wick and Mara onto their marks. Tam is a second preview character on Mark 7.\n2. Use **Key To Mark** (**K**) to key each character on the mark for each beat.\n3. Save one **Setup** per beat: `Entry`, `Mend`, `Gust`, `Exit`. See [Marks and Blocking](04_marks-and-blocking.md).\n\n![The four Lamp Room setups](media/fm_setups.png)\n*The four setups, each holding the marks, actors and cameras of one beat.*\n\n## 4. Shoot the shot list\n\n1. On the **Share** page, click **Import**, choose **Shot List** and pick `lamp_room__Interior.csv`.\n2. Set the **Stage** picker to `STG_LampRoom` and check the **Column Mapping** preview.\n3. Click **Import**. Framemark places a Cine Camera Actor per shot with its size and lens. Repeat with `lamp_room__Gallery.csv` on `STG_Gallery`.\n4. For each camera, pilot it in the Level Viewport to frame the shot, then press **Set To Viewport** on the **Shoot** page. See [Cameras and Lights](05_cameras-and-lights.md).\n5. Place the storm light: one cool key through the window and the candle as a warm practical.\n\n![Contact sheet of the nine rendered shots](media/fm_contact_sheet.jpg)\n*The nine framed shots, SH0010 to SH0110, read left to right.*\n\n| | |\n|---|---|\n| ![SH0010, low wide master on the window](media/fm_SH0010.jpg) | ![SH0050, medium wide two-shot](media/fm_SH0050.jpg) |\n| **SH0010**, 24 mm low wide master. The window is the key light. | **SH0050**, 35 mm two-shot. Wick frame left, Mara frame right, camera on the room side of the line. |\n| ![SH0040, close up on Mara](media/fm_SH0040.jpg) | ![SH0100, high medium wide on Tam](media/fm_SH0100.jpg) |\n| **SH0040**, 85 mm close up from Wick's height. | **SH0100**, 18 mm high medium wide on Tam in the gust. |\n\n## 5. Build the sequence\n\n1. On the **Sequence** page, press **Build Sequence**.\n2. In the dialog, keep all twelve shots and press **Build Sequence**. Framemark creates the Level Sequence, the Shots track and the Camera Cuts track, and binds the characters.\n3. Scrub SH0100 and adjust Tam's float on his mark. See [Sequences and Bindings](06_sequences.md).\n\n![Sequencer with the built Camera Cuts track](media/fm_sequencer.png)\n*The built `LS_STG_LampRoom` sequence. The **Camera Cuts** track holds one section per shot; each character and mark has its own binding. This one came from the stage's **Build / Update Sequence** action, which makes the Camera Cuts track only; the **Build Sequence** dialog also adds the Shots track.*\n\n![Scrubbing the built sequence with the viewport locked to Camera Cuts](media/fm_sequencer_playback.gif)\n*Scrub with the viewport locked to Camera Cuts to watch the cut.*\n\n## 6. Share and render\n\n1. In the Planner, use **Export Plan** for a floor plan sheet with every mark, camera and path.\n2. Render the sequence with a Movie Render Graph template. See [Rendering and Publishing](10_render-and-publish.md).\n\n## See Also\n\n- [Getting Started with Framemark](01_getting-started.md)\n- [The Planner](07_planner.md)\n- [Marks and Blocking](04_marks-and-blocking.md)\n- [Import, Export and Sharing](09_import-export.md)\n"}];
const byFile = Object.fromEntries(PAGES.map(p => [p.file, p]));
const navEl = document.getElementById('nav'), doc = document.getElementById('doc'), toc = document.getElementById('toc');
const q = document.getElementById('q'), rail = document.getElementById('rail'), menuBtn = document.getElementById('menuBtn');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idOf = t => t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

PAGES.forEach((p, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${p.slug}"><span class="n">${i === 0 ? '' : String(i).padStart(2,'0')}</span><span>${esc(p.title)}</span></a>`;
  navEl.appendChild(li);
});

function render(slug, anchor){
  const i = Math.max(0, PAGES.findIndex(p => p.slug === slug));
  const p = PAGES[i];
  doc.innerHTML = `<div class="crumb">${i === 0 ? 'Framemark Manual' : 'Chapter ' + String(i).padStart(2,'0')}</div>` + marked.parse(p.md);
  // Cross-page links: 03_stages.md#x -> #stages
  doc.querySelectorAll('a[href]').forEach(a => {
    const m = a.getAttribute('href').match(/^([\w-]+\.md)(#.*)?$/);
    if (m && byFile[m[1]]) a.setAttribute('href', '#' + byFile[m[1]].slug);
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  doc.querySelectorAll('blockquote').forEach(b => {
    const s = (b.textContent || '').trim().toLowerCase();
    if (s.startsWith('tip')) b.classList.add('tip'); else if (s.startsWith('warning')) b.classList.add('warn');
  });
  const heads = [...doc.querySelectorAll('h2')];
  heads.forEach(h => h.id = 'sec-' + idOf(h.textContent));
  toc.innerHTML = heads.map(h => `<a href="#${p.slug}" data-sec="${h.id}">${esc(h.textContent)}</a>`).join('');
  const prev = PAGES[i-1], next = PAGES[i+1];
  doc.insertAdjacentHTML('beforeend', `<nav class="pager" aria-label="Chapter navigation">${prev ? `<a href="#${prev.slug}"><small>Previous</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#${next.slug}"><small>Next</small>${esc(next.title)}</a>` : ''}</nav>`);
  navEl.querySelectorAll('a').forEach((a, k) => k === i ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = (i === 0 ? '' : p.title + ' · ') + 'Framemark Manual';
  window.scrollTo(0, 0);
}
toc.addEventListener('click', e => {
  const a = e.target.closest('a[data-sec]'); if (!a) return;
  e.preventDefault(); document.getElementById(a.dataset.sec)?.scrollIntoView({behavior:'smooth'});
});

function search(term){
  const t = term.trim().toLowerCase();
  if (t.length < 2) { route(); return; }
  const hits = [];
  PAGES.forEach(p => {
    p.md.split('\n').forEach(line => {
      if (hits.length < 60 && line.toLowerCase().includes(t)) {
        const clean = line.replace(/[#*`>|]/g,' ').replace(/\s+/g,' ').trim();
        if (clean) hits.push({p, clean});
      }
    });
  });
  const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  doc.innerHTML = `<div class="crumb">Search</div><h1>${hits.length ? hits.length + (hits.length === 60 ? '+' : '') + ' matches' : 'No matches'} for “${esc(term)}”</h1>` +
    (hits.length ? '<ul class="results">' + hits.map(h => `<li><a href="#${h.p.slug}"><strong>${esc(h.p.title)}</strong></a><br>${esc(h.clean).replace(re, m => `<mark>${m}</mark>`)}</li>`).join('') + '</ul>'
                 : '<p>Try a menu label, such as <strong>Set To Viewport</strong> or <strong>Mark Order</strong>.</p>');
  toc.innerHTML = '';
}
let timer; q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(q.value), 150); });

function route(){ render(location.hash.slice(1) || 'overview'); }
window.addEventListener('hashchange', () => { q.value = ''; rail.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); route(); });
menuBtn.addEventListener('click', () => { const o = rail.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
route();
</script>
