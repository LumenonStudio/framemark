teur** (Planner), vous montez le plateau, vous placez deux personnages, vous tournez douze plans, vous construisez la séquence de niveau et vous exportez la feuille de plan. Chaque étape utilise des fonctions décrites ailleurs dans ce manuel, et chaque section renvoie donc au chapitre qui en donne le détail complet.\n\n![Le plateau de la salle de la lampe, en orbite autour du décor avec le plafond masqué](media/fm_stage_orbit.gif)\n*Le plateau `STG_LampRoom` terminé : décor en volumes simples, trois personnages sur leurs marques, neuf caméras de plan et la limite du plateau.*\n\nLa scène : une tempête s'abat sur un phare, de nuit. **Wick**, un cerf-volantiste emporté loin de sa route, entre par la fenêtre de la salle de la lampe pour chercher son cerf-volant déchiré. **Mara**, la fille du gardien, se réveille dans sa couchette et le raccommode. Son petit frère **Tam** est soulevé par une rafale. Quand les pas de leur père montent l'escalier, les trois s'enfuient sur le cerf-volant par la fenêtre.\n\n## Prérequis\n\n- Framemark activé. Voir [Prise en main de Framemark](01_getting-started.md).\n- Les mannequins **Manny** et **Quinn** (présents dans tout nouveau projet Third Person) ou vos propres personnages.\n- Un décor. L'étude de cas utilise des ressources Fab gratuites, listées sous [Ressources](#assets). Toute pièce dotée d'une fenêtre convient.\n- Les fichiers de liste de plans `case-study/lamp_room__Interior.csv` (SH0010 à SH0110) et `case-study/lamp_room__Gallery.csv` (SH0120). Un fichier par plateau.\n\n## Ressources\n\n| Besoin | Fiche Fab | Remarque |\n|---|---|---|\n| Extérieur du phare | [Octagonal Timber Lighthouse Tower](https://www.fab.com/listings/0d3fe088-3cb7-4627-af79-b3c0837c5a6c) | Gratuit. La tour pour le plateau extérieur. |\n| Extérieur du phare, variante | [Lighthouse Stylized Low-Poly](https://www.fab.com/listings/a45bc324-53a9-4dbb-b60f-ab0613059bbc) | Gratuit. Plus léger, stylisé. |\n| Décoration intérieure | [Interiors FREE - Cozy Cartoon Pack](https://www.fab.com/listings/ef194997-eb8c-4fc0-9d11-dad28d00eaa2) | Gratuit. Couchette, coffre, chaise, étagères. |\n| Enveloppe intérieure | [Medieval Room Kit](https://www.fab.com/listings/52610433-0210-40e5-884b-abc12cf8901e) | Gratuit. Murs en bois et une fenêtre. |\n| Source de lumière visible dans le champ | [Old Candle Holder](https://www.fab.com/listings/ece21955-ffb9-4c32-abfe-0f7e8d6a77a6) | Gratuit, Quixel Megascans. |\n\n> **Remarque :** Vérifiez la licence de chaque fiche sur Fab avant de l'ajouter à votre bibliothèque.\n\n## Le script et la liste de plans\n\nLa scène compte douze plans répartis sur deux plateaux : `STG_LampRoom` (l'intérieur) et `STG_Gallery` (le ciel à l'extérieur de la fenêtre). Les unités sont des centimètres. L'origine est le centre du sol de la salle de la lampe ; **+X** va vers la fenêtre.\n\n**Ligne des 180 degrés :** l'axe de la pièce va de l'escalier (-X) à la fenêtre (+X). Dans le plan à deux (SH0050), la ligne va du haut de l'échelle (marque 4) à la couchette de Mara (marque 3), avec la caméra du côté de la pièce.\n\n| Plan | Sec | Taille | Angle | Objectif | Description |\n|---|---|---|---|---|---|\n| SH0010 | 10 | Large | Contre-plongée | 24 | PLAN MAÎTRE. De la pluie sur la vitre. Wick, accroupi sur le rebord, entrouvre la fenêtre et se glisse à l'intérieur. La caméra panote avec lui le long du mur de droite. |\n| SH0020 | 8 | Large | Plongée | 18 | Large fixe en plongée, avec des faux raccords dans un même cadre : Wick sous la couchette, derrière les cirés, en haut de l'échelle. |\n| SH0030 | 10 | Moyen | Plongée | 35 | Il trouve le cerf-volant, sa voile déchirée. Il s'effondre sur le sol. La caméra monte en grue : le premier angle en plongée sur lui. |\n| SH0040 | 5 | Gros plan | Contre-plongée | 85 | À sa hauteur, Mara se redresse dans sa couchette, au bord du cadre. Mara : \"Who's there?\" (« Qui est là ? ») |\n| SH0050 | 14 | Plan moyen large | À hauteur d'yeux | 35 | Plan à deux. Wick bondit en haut de l'échelle, le point le plus haut de la pièce, et se présente. Mara reste à droite du cadre. |\n| SH0060 | 4 | Insert | À hauteur d'yeux | 85 | Ember, l'oiseau-lanterne mécanique de Wick, se lisse les plumes sur la rampe de la lampe. |\n| SH0070 | 12 | Moyen | Contre-plongée | 35 | Mara s'agenouille sur la banquette de la fenêtre et coud la voile. Wick tient le cadre bien droit. |\n| SH0080 | 6 | Moyen | Contre-plongée | 28 | Le cerf-volant est réparé. Wick saute sur la banquette de la fenêtre, poings sur les hanches, et crie victoire. |\n| SH0090 | 3 | Insert | Plongée | 85 | Il tend la main. Elle y laisse tomber sa boussole en laiton. |\n| SH0100 | 14 | Plan moyen large | Plongée | 18 | Une rafale fait exploser la fenêtre. Tam, réveillé, passe la tête en bas devant la lampe en tourbillonnant. La caméra tourne en orbite à contre-sens de la rotation. |\n| SH0110 | 6 | Gros plan | À hauteur d'yeux | 50 | Des pas dans l'escalier. Mara désigne la porte, puis regarde Wick. |\n| SH0120 | 20 | Large | À hauteur d'yeux | 24 | `STG_Gallery`. Une chaîne de mains sous le cerf-volant : Wick, Mara, Tam. Au-delà du faisceau du phare, de gauche à droite. |\n\n> **Remarque :** Les rendus de ce chapitre couvrent les neuf plans de `STG_LampRoom` qui contiennent un personnage. Les deux inserts (SH0060, SH0090) nécessitent des accessoires et SH0120 nécessite le plateau `STG_Gallery` : ils ne sont donc pas montrés.\n\n### Marques\n\n| Mark Order | Nom | x, y, z | Remarque |\n|---|---|---|---|\n| 1 | mrk_Window | 370, 0, 70 | Banquette de la fenêtre. L'entrée de Wick, le raccommodage, la sortie. |\n| 2 | mrk_Floor | 120, -40, 0 | Centre du sol. Wick au niveau du sol pour la première fois. |\n| 3 | mrk_Bunk | 250, 250, 55 | Mara redressée dans sa couchette. |\n| 4 | mrk_LadderTop | 250, 110, 110 | Haut de l'échelle de la lampe : le perchoir de Wick. |\n| 5 | mrk_Mend | 320, 40, 0 | Mara s'agenouille pour raccommoder la voile. |\n| 6 | mrk_Door | -320, -260, 0 | La porte de l'escalier. |\n| 7 | mrk_Float | 200, 60, 170 | Tam dans la rafale. |\n| 1 | mrk_Out | 700, 0, 300 | Sur `STG_Gallery` : juste à l'extérieur de la fenêtre. Chaque plateau numérote ses propres marques. |\n\n### Poses\n\nChaque temps fort tient une pose Control Rig sur le personnage. Réglez la pose sur la marque dans la **Tableau des marques** (Marks Table), voir [Marques et mise en place](04_marks-and-blocking.md).\n\n| Temps fort | Personnage | Pose |\n|---|---|---|\n| SH0010, sur le rebord | Wick | Accroupi |\n| SH0030, le cerf-volant déchiré | Wick | Assis par terre, genoux relevés, visage dans les avant-bras |\n| SH0040 | Mara | Redressée, le poids en arrière sur une main |\n| SH0050 | Wick | Perché en haut de l'échelle, une main sur la rampe |\n| SH0070 | Mara | À genoux, la main qui tient l'aiguille levée |\n| SH0080 | Wick | Poings sur les hanches, torse bombé, tête en arrière |\n| SH0090 | Wick | Main tendue, paume vers le haut |\n| SH0100 | Tam | Tête en bas, bras écartés |\n| SH0110 | Mara | Bras tendu vers la porte, tête tournée vers Wick |\n| SH0120 | Wick, Mara | Chaîne en vol : en tête et au milieu |\n\n> **Remarque :** Les rendus ci-dessous placent chaque personnage dans une pose de repos, afin que le cadrage soit lisible avant tout travail de pose.\n\n## 1. Planifier la pièce\n\n![Le Planner avec le plateau de la salle de la lampe](media/fm_planner.png)\n*La salle de la lampe dans le Planner : la limite, les marques 1 à 7 et chaque caméra de plan avec son objectif.*\n\n1. Ouvrez **Window > Framemark > Framemark Planner**.\n2. Dessinez l'empreinte de la pièce avec l'outil de limite, et placez la fenêtre, l'échelle et la couchette comme formes d'arrière-plan. Voir [Le Planner](07_planner.md).\n3. Placez les marques 1 à 7 d'après le tableau ci-dessus.\n4. Faites glisser un tracé de la marque 1 à la marque 2 le long du mur de droite : le trajet de Wick dans SH0010.\n\n## 2. Monter le plateau\n\n1. Habillez le niveau avec le décor Fab.\n2. Sur la page **Plateau** (Stage), placez un plateau au-dessus de la pièce et nommez-le `STG_LampRoom`. Voir [Plateaux et Stage Assets](03_stages.md).\n3. Ajustez la limite aux murs.\n4. Placez un second plateau à l'extérieur de la fenêtre, `STG_Gallery`, pour SH0120.\n\n![Le plateau STG_LampRoom vu du dessus du décor](media/fm_stage_overview.jpg)\n*`STG_LampRoom` dans le hublot du niveau. Les silhouettes jaunes sont les doublures des marques ; la ligne orange est la limite du plateau.*\n\n![Le panneau Détails avec le plateau sélectionné](media/fm_stage_details.png)\n*Sélectionnez le plateau pour voir sa ligne **Outils de plateau** (Stage Tools), sa séquence de niveau et son Stage Asset dans le panneau **Détails** (Details).*\n\n> **Astuce :** Enregistrez chaque plateau comme Stage Asset. Si le décor bouge, déplacez le plateau : les marques, les caméras et la séquence le suivent.\n\n## 3. Placer les personnages\n\n![La Table des marques de la salle de la lampe](media/fm_marks_table.png)\n*Wick sur la marque 1, Mara sur la marque 3 et Tam sur la marque 7 dans la **Tableau des marques**.*\n\n1. Sur la page **Block** (Mise en place), affectez Wick et Mara à leurs marques. Tam est un second personnage d'aperçu sur la marque 7.\n2. Utilisez **Clé vers la marque** (Key To Mark, **K**) pour placer une image clé de chaque personnage sur la marque, pour chaque temps fort.\n3. Enregistrez une **Configuration** (Setup) par temps fort : `Entry`, `Mend`, `Gust`, `Exit`. Voir [Marques et mise en place](04_marks-and-blocking.md).\n\n![Les quatre configurations de la salle de la lampe](media/fm_setups.png)\n*Les quatre configurations, chacune contenant les marques, les acteurs et les caméras d'un temps fort.*\n\n## 4. Tourner la liste de plans\n\n1. Sur la page **Share** (Partage), cliquez sur **Importer** (Import), choisissez **Liste des plans** (Shot List) et sélectionnez `lamp_room__Interior.csv`.\n2. Réglez le sélecteur **Plateau** sur `STG_LampRoom` et vérifiez l'aperçu **Association des colonnes** (Column Mapping).\n3. Cliquez sur **Importer**. Framemark place un Acteur de caméra cinématique par plan, avec sa taille et son objectif. Répétez l'opération avec `lamp_room__Gallery.csv` sur `STG_Gallery`.\n4. Pour chaque caméra, pilotez-la dans le hublot du niveau pour cadrer le plan, puis cliquez sur **Régler sur le hublot** (Set To Viewport) sur la page **Shoot** (Tournage). Voir [Caméras et lumières](05_cameras-and-lights.md).\n5. Placez la lumière de l'orage : une lumière principale froide à travers la fenêtre, et la bougie comme source chaude visible dans le champ.\n\n![Planche contact des neuf plans rendus](media/fm_contact_sheet.jpg)\n*Les neuf plans cadrés, SH0010 à SH0110, lus de gauche à droite.*\n\n| | |\n|---|---|\n| ![SH0010, plan maître large en contre-plongée sur la fenêtre](media/fm_SH0010.jpg) | ![SH0050, plan à deux moyen large](media/fm_SH0050.jpg) |\n| **SH0010**, plan maître large en contre-plongée au 24 mm. La fenêtre est la lumière principale. | **SH0050**, plan à deux au 35 mm. Wick à gauche du cadre, Mara à droite, caméra du côté de la pièce par rapport à la ligne. |\n| ![SH0040, gros plan sur Mara](media/fm_SH0040.jpg) | ![SH0100, plan moyen large en plongée sur Tam](media/fm_SH0100.jpg) |\n| **SH0040**, gros plan au 85 mm depuis la hauteur de Wick. | **SH0100**, plan moyen large en plongée au 18 mm sur Tam dans la rafale. |\n\n## 5. Construire la séquence\n\n1. Sur la page **Séquence** (Sequence), cliquez sur **Construire la séquence** (Build Sequence).\n2. Dans la boîte de dialogue, gardez les douze plans et cliquez sur **Construire la séquence**. Framemark crée la séquence de niveau, la piste de plans et la piste **Camera Cuts**, et lie les personnages.\n3. Parcourez SH0100 et ajustez le flottement de Tam sur sa marque. Voir [Séquences et liaisons](06_sequences.md).\n\n![Sequencer avec la piste Camera Cuts construite](media/fm_sequencer.png)\n*La séquence `LS_STG_LampRoom` construite. La piste **Camera Cuts** contient une section par plan ; chaque personnage et chaque marque a sa propre liaison. Celle-ci provient de l'action **Construire / mettre à jour la séquence** (Build / Update Sequence) du plateau, qui ne crée que la piste Camera Cuts ; la boîte de dialogue **Construire la séquence** ajoute aussi la piste de plans.*\n\n![Parcours de la séquence construite avec le hublot verrouillé sur Camera Cuts](media/fm_sequencer_playback.gif)\n*Parcourez la séquence avec le hublot verrouillé sur Camera Cuts pour voir la coupe.*\n\n## 6. Partager et rendre\n\n1. Dans le Planner, utilisez **Exporter le plan** (Export Plan) pour obtenir une feuille de plan au sol avec chaque marque, chaque caméra et chaque tracé.\n2. Rendez la séquence avec un modèle Movie Render Graph. Voir [Rendu et publication](10_render-and-publish.md).\n\n## Voir aussi\n\n- [Prise en main de Framemark](01_getting-started.md)\n- [Le Planner](07_planner.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Import, export et partage](09_import-export.md)\n"}];
const byFile = Object.fromEntries(PAGES.map(p => [p.file, p]));
const navEl = document.getElementById('nav'), doc = document.getElementById('doc'), toc = document.getElementById('toc');
const q = document.getElementById('q'), rail = document.getElementById('rail'), menuBtn = document.getElementById('menuBtn');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idOf = t => t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');

PAGES.forEach((p, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${p.slug}"><span class="n">${i === 0 ? '' : String(i).padStart(2,'0')}</span><span>${esc(p.title)}</span></a>`;
  navEl.appendChild(li);
});

function render(slug, anchor){
  const i = Math.max(0, PAGES.findIndex(p => p.slug === slug));
  const p = PAGES[i];
  doc.innerHTML = `<div class="crumb">${i === 0 ? 'Manuel Framemark' : 'Chapitre ' + String(i).padStart(2,'0') + ''}</div>` + marked.parse(p.md);
  // Cross-page links: 03_stages.md#x -> #stages
  doc.querySelectorAll('a[href]').forEach(a => {
    const m = a.getAttribute('href').match(/^([\w-]+\.md)(#.*)?$/);
    if (m && byFile[m[1]]) a.setAttribute('href', '#' + byFile[m[1]].slug);
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  doc.querySelectorAll('blockquote').forEach(b => {
    const s = (b.textContent || '').trim().toLowerCase();
    if ((s.startsWith('tip') || s.startsWith('astuce'))) b.classList.add('tip'); else if ((s.startsWith('warning') || s.startsWith('avertissement'))) b.classList.add('warn');
  });
  const heads = [...doc.querySelectorAll('h2')];
  heads.forEach(h => h.id = 'sec-' + idOf(h.textContent));
  toc.innerHTML = heads.map(h => `<a href="#${p.slug}" data-sec="${h.id}">${esc(h.textContent)}</a>`).join('');
  const prev = PAGES[i-1], next = PAGES[i+1];
  doc.insertAdjacentHTML('beforeend', `<nav class="pager" aria-label="Chapter navigation">${prev ? `<a href="#${prev.slug}"><small>Précédent</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#${next.slug}"><small>Suivant</small>${esc(next.title)}</a>` : ''}</nav>`);
  navEl.querySelectorAll('a').forEach((a, k) => k === i ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = (i === 0 ? '' : p.title + ' · ') + 'Manuel Framemark';
  window.scrollTo(0, 0);
}
toc.addEventListener('click', e => {
  const a = e.target.closest('a[data-sec]'); if (!a) return;
  e.preventDefault(); document.getElementById(a.dataset.sec)?.scrollIntoView({behavior:'smooth'});
});

function search(term){
  const t = term.trim().toLowerCase();
  if (t.length < 2) { route(); return; }
  const hits = [];
  PAGES.forEach(p => {
    p.md.split('\n').forEach(line => {
      if (hits.length < 60 && line.toLowerCase().includes(t)) {
        const clean = line.replace(/[#*`>|]/g,' ').replace(/\s+/g,' ').trim();
        if (clean) hits.push({p, clean});
      }
    });
  });
  const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  doc.innerHTML = `<div class="crumb">Recherche</div><h1>${hits.length ? hits.length + (hits.length === 60 ? '+' : '') + ' résultats' : 'Aucun résultat'} pour « ${esc(term)} »</h1>` +
    (hits.length ? '<ul class="results">' + hits.map(h => `<li><a href="#${h.p.slug}"><strong>${esc(h.p.title)}</strong></a><br>${esc(h.clean).replace(re, m => `<mark>${m}</mark>`)}</li>`).join('') + '</ul>'
                 : '<p>Essayez un libellé de menu, par exemple <strong>Set To Viewport</strong> ou <strong>Mark Order</strong>.</p>');
  toc.innerHTML = '';
}
let timer; q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(q.value), 150); });

function route(){ render(location.hash.slice(1) || 'overview'); }
window.addEventListener('hashchange', () => { q.value = ''; rail.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); route(); });
menuBtn.addEventListener('click', () => { const o = rail.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
route();
</script>
