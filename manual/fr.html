<script>
const PAGES = [{"file": "index.md", "slug": "overview", "title": "Présentation de Framemark", "md": "# Présentation de Framemark\n\n**Framemark** est un plug-in d'éditeur pour Unreal Engine 5.8 qui apporte les plans au sol, la mise en place et la composition des plans dans l'Éditeur de niveau. Vous placez un seul acteur **plateau** dans un niveau. Le plateau délimite l'aire de jeu par une limite, contient les **marques** où se tient chaque personnage, possède les caméras et les lumières que vous placez, et possède la **séquence de niveau** de la scène. Déplacez le plateau et toute la scène suit.\n\nLes vues de dessus et les plans au sol sont une pratique courante en prise de vues réelles, en images de synthèse et en jeu vidéo, mais ils vivent normalement dans un outil distinct de celui où le plan est réalisé. Framemark les place dans Unreal, à côté de Sequencer, de sorte que le plan au sol et le plan de tournage sont les mêmes données.\n\nFramemark convient aux dialogues cadrés à la troisième personne comme aux scènes à la première personne. Vous choisissez l'un ou l'autre avec **View Mode** (Mode de vue) du plateau.\n\n## Prérequis\n\n- Unreal Engine **5.8**.\n- Le plug-in **Framemark** activé dans **Edit > Plugins > Cinematics**.\n- Plug-ins compagnons facultatifs pour des fonctions supplémentaires. Voir [Plug-ins compagnons](12_integrations.md).\n\n## Concepts clés\n\n| Concept | Description |\n|---|---|\n| **Plateau** (Stage) | L'acteur `Cine Stage`. La racine d'une scène : la limite, les marques, les caméras, les lumières, les accessoires et la séquence de niveau en sont tous des membres, donc déplacer le plateau déplace la scène. |\n| **Stage Asset** (Ressource de plateau) | Un plateau enregistré comme ressource dans le **Content Browser** (Navigateur de contenu). Un plateau placé pointe vers sa Stage Asset et reste synchronisé avec elle, ce qui permet de placer la même scène dans de nombreux niveaux. |\n| **Marque** (Mark) | Une position au sol pour un personnage, avec une orientation. **Ordre des marques** (Mark Order) définit qui est le premier ; la marque 1 est le personnage principal. |\n| **Configuration** (Setup) | Un agencement enregistré de marques, de caméras et de lumières pour un temps fort ou un plan, entre lesquels vous pouvez basculer. |\n| **Planificateur** (Planner) | Un éditeur 2D vu de dessus pour le plateau (**Window > Framemark > Framemark Planner**). À ne pas confondre avec **Vue de dessus** (Overhead View), qui est un basculement vue de dessus du hublot du niveau. |\n| **Scénario** (Screenplay) | Les dialogues et l'action de la scène, importés depuis un fichier ou saisis, reliés aux marques, aux plans et aux séquences. |\n| **Carte de l'histoire** (Story Map) | Une carte des scènes et des branches du Screenplay, organisée par groupe ou par séquence. |\n\n## Le flux de travail Framemark\n\nLe panneau Framemark vous guide dans la scène, dans l'ordre. Chaque page a son propre chapitre.\n\n1. **Plan** : dessinez la scène vue de dessus dans le [Planner](07_planner.md), ou importez un [Screenplay](08_screenplay-and-story-map.md).\n2. **Plateau** : placez et dimensionnez le plateau. Voir [Plateaux et Stage Assets](03_stages.md).\n3. **Block** : placez les marques et distribuez les personnages. Voir [Marques et mise en place](04_marks-and-blocking.md).\n4. **Shoot** : placez les caméras et les lumières. Voir [Caméras et lumières](05_cameras-and-lights.md).\n5. **Séquence** (Sequence) : créez et modifiez la séquence de niveau. Voir [Séquences et liaisons](06_sequences.md).\n6. **Share** : exportez les plans, les feuilles, l'USD et le FBX. Voir [Import, export et partage](09_import-export.md).\n\nChaque bouton du panneau correspond à une seule étape d'annulation.\n\n## Dans cette section\n\n| Page | Contenu |\n|---|---|\n| [Prise en main](01_getting-started.md) | Installation, activation, et votre premier plateau en 60 secondes. |\n| [Interface du mode Framemark](02_interface.md) | Le panneau, Home, les pages, les espaces de travail, la barre d'outils, le menu View, le Quick Wheel et le menu contextuel. |\n| [Plateaux et Stage Assets](03_stages.md) | Placer des plateaux, la limite et les formats de film, les Stage Assets, la Library et le déplacement. |\n| [Marques et mise en place](04_marks-and-blocking.md) | Les marques, Mark Order, les agencements, les configurations, le Marks Table, les trajectoires et Key To Mark. |\n| [Caméras et lumières](05_cameras-and-lights.md) | La page Shoot, Set To Viewport, la première personne et Hybrid, les lumières et les rigs d'éclairage. |\n| [Séquences et liaisons](06_sequences.md) | La page Sequence, les plans, les liaisons, les joueurs multiples et les outils de continuité. |\n| [Le Planner](07_planner.md) | Le Planner 2D, ses outils, sa grammaire de dessin, l'accrochage et les feuilles d'export. |\n| [Scénario et Story Map](08_screenplay-and-story-map.md) | Importer et modifier le Screenplay, les mises à jour de la source, l'écriture en retour et la Story Map. |\n| [Import, export et partage](09_import-export.md) | La page Share, l'import depuis Shot Designer, les allers-retours USD et FBX. |\n| [Rendu et publication](10_render-and-publish.md) | Les modèles Movie Render Graph, l'audio, l'encodage et les envois pour revue. |\n| [Référence des paramètres et de la nomenclature](11_settings-reference.md) | Chaque paramètre, profil et règle de nommage de Framemark. |\n| [Plug-ins compagnons](12_integrations.md) | CAT Bridge, Odyssey Bridge, FramemarkSLR, FramemarkUSD, articy et ink. |\n| [Raccourcis clavier](13_shortcuts.md) | Chaque raccourci de Framemark. |\n| [Dépannage](14_troubleshooting.md) | Problèmes courants, messages et limitations connues. |\n| [Étude de cas : la salle de la lampe](15_case-study.md) | Une scène de bout en bout : plan, plateau, mise en place, tournage, séquence et rendu. |\n"}, {"file": "01_getting-started.md", "slug": "getting-started", "title": "Prise en main de Framemark", "md": "# Prise en main de Framemark\n\nFramemark est un plug-in d'éditeur Unreal Engine 5.8 pour la mise en place des scènes cinématiques. Un seul acteur, le **Cine Stage**, délimite une zone de votre niveau par une limite en pellicule de film, contient les **marques** où se tient chaque personnage, possède les caméras et les lumières que vous placez, et possède la **séquence de niveau** qui joue la scène. Déplacez le plateau et toute la scène suit. Vous l'utilisez pour régler la mise en place d'une scène, composer les plans et construire une timeline Sequencer depuis le même endroit, sans câbler les pistes à la main.\n\nFramemark convient aux dialogues cadrés à la troisième personne comme à la première personne. Une propriété du plateau appelée **View Mode** (Mode de vue : Framed, First Person ou Hybrid) indique laquelle.\n\nCette page explique comment installer le plug-in, l'activer, et placer votre premier plateau, votre première caméra et votre première séquence.\n\n## Prérequis\n\n- Unreal Engine 5.8 et un projet qui l'utilise.\n- Le dossier source du plug-in Framemark, avec ses deux scripts de compilation, `Build_Framemark.bat` et `Install_To_Project.bat`.\n- Facultatif : les plug-ins compagnons **Framemark CAT Bridge**, **Framemark Odyssey Bridge**, **Framemark Light Rig Bridge** et FramemarkUSD. Framemark fonctionne sans eux. Une fonction qui en nécessite un est grisée, et son infobulle nomme le plug-in à activer. Voir [Plug-ins compagnons](12_integrations.md).\n\n## Installation\n\n1. Double-cliquez sur `Build_Framemark.bat`. La compilation prend quelques minutes et écrit son journal dans `BuildLog.txt`. Elle compile Framemark et ses petits plug-ins passerelles. Une passerelle est ignorée, et le journal l'indique, lorsque le plug-in du moteur dont elle a besoin n'est pas installé.\n2. Fermez Unreal Editor.\n3. Faites glisser votre fichier `.uproject` sur `Install_To_Project.bat`. Le script installe tout ce qui a été compilé dans le dossier `Plugins` du projet.\n\n> **Remarque :** Le script d'installation nécessite que l'éditeur soit fermé. Si vous compilez et installez depuis plusieurs sessions en même temps, mettez l'installation en file d'attente au lieu de la lancer à la main, afin qu'elle attende qu'aucun éditeur n'ait le projet ouvert.\n\n## Activer le plug-in\n\n1. Ouvrez le projet.\n2. Choisissez **Edit > Plugins**.\n3. Sous **Cinematics**, cochez **Framemark** s'il n'est pas déjà activé.\n4. Si vous voulez un compagnon, cochez aussi **Framemark CAT Bridge**, **Framemark Odyssey Bridge** ou **Framemark Light Rig Bridge**.\n5. Redémarrez l'éditeur lorsque vous y êtes invité.\n\n## Ouvrir le mode Framemark\n\nFramemark est un mode d'éditeur. Ouvrez le **Mode switcher** (sélecteur de mode) de la barre d'outils principale, à côté de Select, Landscape et Modeling, et choisissez **Framemark**. La boîte à outils du mode ouvre le panneau **Framemark**. Pour quitter le mode, choisissez **Sélectionner** (Select) dans le Mode switcher.\n\nLorsque le mode Framemark est activé, une fine barre d'outils flotte au-dessus du hublot du niveau et les touches Framemark fonctionnent : **Tab** pour le Quick Wheel, **M**, **C**, **L**, **P** et **K** pour les outils de placement et Key To Mark, et **O** pour Overhead View. Lorsque le mode est désactivé, ces touches gardent la signification propre à Unreal. Voir [Référence des raccourcis clavier](13_shortcuts.md).\n\nSi le niveau n'a pas encore de plateau, le panneau affiche la page **Accueil** (Home). Voir [Interface du mode Framemark](02_interface.md).\n\n## Votre premier plateau en 60 secondes\n\n1. Choisissez **Framemark** dans le Mode switcher.\n2. Sur la page Home, appuyez sur **Ajouter un plateau** (Add Stage). Si le niveau a déjà un plateau, ouvrez plutôt la page **Plateau** (Stage) et appuyez sur **Ajouter un plateau** à cet endroit. Le plateau apparaît là où le hublot du niveau regarde, se pose sur le sol et reçoit deux marques : un **Joueur** (Player) et un **PNJ** (NPC), face à face.\n3. Dans la barre d'outils, choisissez **Placer une caméra** (Place Camera), puis cliquez dans le hublot du niveau pour placer une caméra. La caméra vise la ligne de regard de la marque la plus proche au moment où vous la placez. Appuyez sur **Esc** pour arrêter le placement.\n4. Déplacez-vous dans le hublot du niveau jusqu'au cadrage voulu.\n5. Sélectionnez la caméra, ouvrez la page **Shoot** et appuyez sur **Régler sur le hublot** (Set To Viewport). La caméra prend la position, la rotation et le champ de vision du hublot en une seule étape.\n6. Ouvrez la page **Séquence** (Sequence) et appuyez sur **Construire la séquence** (Build Sequence). La première fois, une boîte de dialogue demande le nom de la séquence, le plateau et les plans. Appuyez sur **Construire la séquence** dans la boîte de dialogue. Framemark crée la séquence de niveau et ouvre Sequencer.\n7. Appuyez sur **Tab** dans le hublot du niveau pour ouvrir le Quick Wheel. C'est l'essentiel de l'outil.\n\n![Un plateau terminé dans le hublot du niveau : marques, caméras et limite](media/fm_stage_overview.jpg)\n\nChaque bouton correspond à une seule étape d'annulation.\n\n> **Astuce :** Le Quick Wheel est un anneau des outils de l'espace de travail actuel, placé sous votre curseur. Maintenez **Tab**, glissez vers un outil et relâchez pour le choisir. Ou bien appuyez brièvement sur **Tab** et cliquez sur un outil.\n\n## Sans le mode\n\nVous pouvez effectuer la même boucle à la main depuis l'éditeur ordinaire :\n\n1. Ouvrez **Place Actors > Cinematic > Cine Stage** et faites glisser le plateau dans le niveau. Il se pose sur le sol et reçoit une marque Player et une marque NPC.\n2. Faites un clic droit dans le hublot du niveau et choisissez **Framemark > Place Mark Here** (Placer une marque ici). La marque apparaît là où vous avez cliqué, orientée vers le milieu du plateau. Le même menu contient **Placer une caméra ici** (Place Camera Here) et **Placer une lumière ici** (Place Light Here).\n3. Sélectionnez le plateau et choisissez un **Layout** (Agencement) dans la catégorie **Plateau** du panneau Détails si vous voulez que les marques soient disposées pour vous.\n4. Déplacez-vous jusqu'à un cadrage, puis utilisez **Set To Current Viewport** (Régler sur le hublot actuel) sur le composant Stage Camera de la caméra.\n5. Utilisez la rangée d'icônes **Outils de plateau** (Stage Tools) en haut du panneau Détails du plateau : **Construire la séquence** et **Ouvrir la séquence** (Open Sequence) se trouvent dans son groupe Sequence.\n\n## La suite\n\n| Pour faire ceci | Lisez |\n|---|---|\n| Découvrir le panneau, les pages, les espaces de travail et les menus | [Interface du mode Framemark](02_interface.md) |\n| Placer, dimensionner et enregistrer des plateaux | [Plateaux et Stage Assets](03_stages.md) |\n| Placer et agencer des marques | [Marques et mise en place](04_marks-and-blocking.md) |\n| Composer des plans et les éclairer | [Caméras et lumières](05_cameras-and-lights.md) |\n| Créer et maintenir la séquence de niveau | [Séquences et liaisons](06_sequences.md) |\n| Agencer le plateau vu de dessus | [Le Planner](07_planner.md) |\n\n## Limitations connues\n\n- Une marque n'est cliquable dans le hublot du niveau que lorsque son plateau, ou une marque de celui-ci, est sélectionné. Si une poignée ne répond pas, sélectionnez d'abord le plateau.\n\n## Voir aussi\n\n- [Interface du mode Framemark](02_interface.md)\n- [Plateaux et Stage Assets](03_stages.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Caméras et lumières](05_cameras-and-lights.md)\n- [Séquences et liaisons](06_sequences.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "02_interface.md", "slug": "interface", "title": "Interface du mode Framemark", "md": "# Interface du mode Framemark\n\nLe mode Framemark vous donne un panneau, une barre d'outils et six pages qui suivent l'ordre du travail : planifier le plateau, le placer, régler la mise en place des marques, tourner, créer la séquence et partager. Cette page est la référence de chaque zone de cette interface : l'en-tête du panneau, la page Home, les pages, les espaces de travail, la barre d'outils et Edit Toolbar, le menu View, le Quick Wheel, le menu contextuel et les panneaux Détails.\n\n## Prérequis\n\n- Framemark est activé et le mode **Framemark** est choisi dans le Mode switcher (sélecteur de mode). Voir [Prise en main de Framemark](01_getting-started.md).\n\n## Le panneau\n\n![Le panneau Framemark sur la page Stage](media/ui_framemark_panel.png)\n*Le panneau Framemark : titre et espace de travail, Stage Picker, boutons de pages et outils de la page Stage.*\n\n1. **Titre et menu d'espace de travail.** Le titre du panneau est **Framemark**. La liste déroulante d'espace de travail permet de choisir un espace de travail.\n2. **État de l'espace de travail.** Un petit point accompagné des icônes **Enregistrer** (Save), **Enregistrer sous** (Save As) et **Revert** (Rétablir) apparaît lorsque vous modifiez un espace de travail.\n3. **Bouton œil (View).** Le menu **Afficher dans le hublot** (Show In Viewport).\n4. **Bouton de menu.** Home, Framemark Details, Toolbar Location, Settings et Manage.\n5. **Rangée Stage.** Une étiquette **Plateau** (Stage) et un sélecteur de Stage Asset avec recherche. Son libellé affiche le nom de la Stage Asset, ou **Aucun plateau** (No stage).\n6. **Barre d'outils.** Affichée dans le panneau lorsque la Toolbar Location de l'espace de travail inclut le panneau.\n7. **Onglets de pages.** **Plan, Stage, Block, Shoot, Sequence, Share**, chacun avec une icône. Les icônes rétrécissent uniformément lorsque vous réduisez la largeur du panneau.\n8. **Zone de page.** Les boutons de la page où vous vous trouvez, puis les détails de ce que vous avez sélectionné : un plateau, une marque, une caméra ou une lumière. Si rien n'est sélectionné, elle l'indique.\n\nLes rangées d'outils passent sur une deuxième rangée lorsque le panneau est étroit. Une barre de défilement verticale apparaît si le panneau est mince. Les icônes sont grises jusqu'à ce que vous les survoliez, les pressiez, ou qu'elles soient actives ou cochées.\n\n### Le Stage Picker\n\nLa rangée Stage choisit le **plateau actif** : celui sur lequel les menus et les outils agissent. Son infobulle indique « Active stage: the one menus and tools work on. Pick a stage in this level, or place a Stage Asset that isn't placed yet. » La liste comprend ces parties :\n\n| Partie | Description |\n|---|---|\n| **Dans ce niveau** (In This Level) | Les plateaux placés dans le niveau. Choisir un plateau le rend actif et le sélectionne. S'il n'y en a aucun, la liste indique **Aucun plateau dans ce niveau** (No stages in this level). |\n| **Ressources de plateau absentes de ce niveau** (Stage Assets Not In This Level) | Les Stage Assets du projet qui ne sont pas placées. Chacune a une entrée **Place {name}** qui la place devant la caméra du hublot et la rend active. |\n| **Plus dans la bibliothèque du Planificateur...** (More in the planner's Library...) | Ouvre la Library. Voir [Plateaux et Stage Assets](03_stages.md). |\n| **Toutes les ressources de plateau sont placées** (Every Stage Asset is placed) | Affiché lorsqu'il ne reste rien à placer. |\n\nVous pouvez rechercher par nom, parcourir les dossiers, ou passer aux miniatures. Choisir un plateau correspond à une seule étape d'annulation (**Définir le plateau actif** (Set Active Stage)).\n\n## Le bouton de menu\n\n| Élément | Description |\n|---|---|\n| **Accueil** (Home) | Ouvre la page Home. |\n| **Détails Framemark** (Framemark Details) | Ouvre l'onglet Framemark Details ancrable. |\n| **Emplacement de la barre d'outils** (Toolbar Location) | **Hublot** (Viewport), **Panneau** (Panel), **Les deux** (Both) ou **Aucun** (None), défini par espace de travail. |\n| **Paramètres** (Settings) | Ouvre les Préférences de l'éditeur sur n'importe quelle page Framemark : **Général** (General), **Nommage** (Naming), **Lumières** (Lights), **Caméras** (Cameras), **Séquence** (Sequence), **Générer** (Generate), **Marques** (Marks). Voir [Référence des paramètres et de la nomenclature](11_settings-reference.md). |\n| **Gérer** (Manage) | **Modifier la barre d'outils** (Edit Toolbar), **Définir comme page de démarrage** (Set As Startup Page), **Exporter les espaces de travail** (Export Workspaces), **Importer les espaces de travail** (Import Workspaces). |\n\nChoix de **Emplacement de la barre d'outils** :\n\n- **Hublot** (par défaut) : une fine bande au-dessus du hublot du niveau.\n- **Panneau** : une rangée en haut du panneau.\n- **Les deux**.\n- **Aucun** : aucune barre d'outils. Utilisez le Quick Wheel. Le Planner propose les mêmes quatre choix.\n\n**Définir comme page de démarrage** fait de la page où vous vous trouvez celle sur laquelle l'espace de travail démarre.\n\n## La page Home\n\nHome est la page de démarrage. Elle s'affiche lorsqu'un niveau n'a aucun plateau. Un niveau qui a déjà des plateaux ignore Home et choisit le premier plateau par nom. Pour la retrouver, choisissez **Accueil** dans le bouton de menu. Le **X** en haut à droite (infobulle « Close Home and open the Framemark panel ») la ferme.\n\n1. **Logo et slogan.** **Framemark**, « Floor plans and stages for Sequencer ».\n2. **Clap.** Un clap avec une LED intitulée **Sequence length**, qui affiche la durée de la séquence active, et les rangées **Niveau** (Level), **Plateaux** (Stages), **Séquence** et **Dernier plateau** (Last stage). Les valeurs vides indiquent **Aucun niveau** (No level), **Aucun pour l'instant** (None yet) ou **Aucun**.\n3. **Trois choix.**\n   - **Ajouter un plateau** (Add Stage, principal) : « Places a stage where the viewport is looking. »\n   - **Ouvrir le Planificateur** (Open the Planner).\n   - **Importer un plateau, une liste des plans ou un scénario** (Import a stage, shot list or screenplay).\n4. **Stage Assets in this project.** Une liste des Stage Assets du projet. Cliquer sur l'une la place dans le niveau, ou y mène si elle est déjà placée (« Place this stage in the level, or go to it if it's already placed. »). Le bouton de tri (« Sort the Stage Assets list ») propose **Récents** (Recent, par défaut), **Dans ce niveau** (In this level) et **Nom de A à Z** (Name A to Z).\n5. **Liens vers la documentation.** Des liens qui ouvrent les fichiers du manuel depuis le dossier du plug-in.\n\n## Les pages\n\nLes six pages contiennent toutes les commandes. Les mêmes commandes apparaissent aussi dans la galerie d'Edit Toolbar, le Quick Wheel et le menu contextuel. Les infobulles des pages sont citées ci-dessous.\n\n### Plan\n\n![La page Plan](media/ui_page_plan.png)\n\n« The stage from above. Open the Planner and the Screenplay, switch the viewport to Overhead View. »\n\n| Bouton | Description |\n|---|---|\n| **Planificateur** (Planner) | Ouvre la fenêtre du Planner. Voir [Le Planner](07_planner.md). |\n| **Scénario** (Screenplay) | Ouvre la fenêtre du Screenplay. Voir [Scénario et Story Map](08_screenplay-and-story-map.md). |\n| **Vue de dessus** (Overhead View, touche **O**) | Fait basculer le hublot du niveau actif entre la perspective et une vue orthographique de dessus cadrée sur la limite du plateau. Appuyez de nouveau pour revenir exactement où vous étiez. |\n| **Capturer** (Capture) | Visible uniquement lorsque Overhead View est activée, et activé uniquement lorsqu'une capture est possible. Capture le niveau sous le plateau comme arrière-plan du Planner. Voir [Plateaux et Stage Assets](03_stages.md). |\n\n> **Remarque :** Si vous modifiez vous-même la vue entre deux pressions sur Overhead View, la pression suivante repart de zéro au lieu de rester bloquée en vue de dessus (Top). Un seul état de hublot est mémorisé à la fois.\n\n### Stage\n\n![La page Stage](media/ui_page_stage.png)\n\n« Place the stage, set it on the ground, fit its boundary, select it, and add or attach actors so they move with it. »\n\n| Bouton | Description |\n|---|---|\n| **Ajouter un plateau** | « Adds the 3D stage to the level where the viewport is looking. Marks, cameras and lights live on it. » |\n| **Plaquer au sol** (Snap To Ground) | Pose le plateau sur le sol situé sous lui. |\n| **Ajuster la limite** (Fit Boundary) | Enveloppe la limite autour de chaque marque, caméra et lumière du plateau. |\n| **Choisir un plateau** (Select Stage) | Sélectionne le plateau et tout ce qui lui est attaché. |\n| **Ajouter au plateau** (Add To Stage) | Attache les acteurs sélectionnés en conservant leur transformation dans le monde. |\n| **Attacher les acteurs** (Attach Actors) | Attache chaque acteur assigné pour qu'il se déplace avec le plateau. |\n| **Détacher les acteurs** (Detach Actors) | Les détache en les laissant où ils sont. |\n\n### Block\n\n![La page Block](media/ui_page_block.png)\n\n« Place, arrange and number marks and props. »\n\n| Bouton | Description |\n|---|---|\n| **Renuméroter les marques** (Renumber Marks) | Réordonne Mark Order : les Players d'abord, puis NPC, Companion, Extra, puis les Props, chacun dans son ordre actuel. |\n| **Déplacer la marque vers l'Actor** (Move Mark To Actor) | Déplace la marque de chaque acteur sélectionné là où l'acteur se tient maintenant. |\n| **Avancer d'un plan** (Bring Forward), **Mettre au premier plan** (Bring To Front), **Reculer d'un plan** (Send Backward), **Mettre à l'arrière-plan** (Send To Back) | Changent laquelle de plusieurs marques empilées est au-dessus et reçoit les clics. |\n| **Écarter les marques** (Spread Marks) | « Move marks that share a spot onto a small circle, keeping their facing. Right-click a mark for Row and By Facing. » |\n| **Parcourir les marques empilées** (Cycle Stacked Mark) | « Select the next mark stacked on the same spot. Clicking the stack again does the same, Shift+click goes back up. » |\n| **Tableau des marques** (Marks Table) | Ouvre un tableau de chaque marque du plateau. |\n\n**Appliquer la disposition** (Apply Layout) existe comme commande mais est masqué dans la page, parce que choisir un Layout sur le plateau l'applique immédiatement. **Réappliquer la disposition** (Re-apply Layout) se trouve dans le menu contextuel. **Placer une marque** (Place Mark, touche **M**), **Placer un accessoire** (Place Prop, touche **P**), **Marque depuis l'Actor** (Mark From Actor), **Assigner à une marque** (Assign To Mark), **Clé vers la marque** (Key To Mark, touche **K**) et **Aligner les Actors sur les marques** (Snap Actors To Marks) sont des outils principaux : ils se trouvent dans la barre d'outils et dans le Quick Wheel, et dans la galerie d'Edit Toolbar sous **Principal** (Main). Voir [Marques et mise en place](04_marks-and-blocking.md).\n\n### Shoot\n\n![La page Shoot](media/ui_page_shoot.png)\n\n« Cameras and lights, linking and setups. »\n\n| Bouton | Description |\n|---|---|\n| **Régler sur le hublot** (Set To Viewport) | Copie la position, la rotation et le champ de vision du hublot du niveau vers la caméra sélectionnée. |\n| **Regarder à travers** (Look Through, **Ctrl+Shift+P**) | Pilote le hublot à travers la caméra de plateau sélectionnée. |\n| **Préréglage de caméras** (Camera Preset) | Crée des caméras en masse à partir des marques. |\n| **Suivre** (Follow) | Les autres acteurs sélectionnés suivent la position et la rotation du dernier acteur sélectionné. |\n| **Regarder vers** (Look At) | Les autres acteurs sélectionnés, ou les caméras, regardent le dernier acteur sélectionné. |\n| **Supprimer le lien** (Unlink) | Supprime tous les liens Framemark des acteurs sélectionnés. |\n| **Nouvelle configuration** (New Setup) | Regroupe la sélection actuelle dans une nouvelle configuration. |\n| **Afficher toutes les configurations** (Show All Setups) | Désactive le solo et affiche chaque configuration. |\n| **Onglet Configurations** (Setups Tab) | Ouvre le panneau Setups ancrable. |\n\n**Placer une caméra** (Place Camera, touche **C**) et **Placer une lumière** (Place Light, touche **L**) sont des outils principaux. Voir [Caméras et lumières](05_cameras-and-lights.md).\n\n### Sequence\n\n![La page Sequence](media/ui_page_sequence.png)\n\n« Build the Level Sequence and keep it in step with the stage. »\n\n| Bouton | Description |\n|---|---|\n| **Construire la séquence** (Build Sequence) | Crée ou met à jour la séquence de niveau du plateau. Un Maj+clic, ou le bouton **...** à côté, rouvre la boîte de dialogue. |\n| **Ouvrir la séquence** (Open Sequence) | Ouvre la séquence de niveau du plateau dans Sequencer. |\n| **Synchroniser avec la séquence** (Sync To Sequence) | Déplace dès maintenant les pistes de marques pour qu'elles correspondent à leurs marques. |\n| **Reprendre le précédent** (Match Previous) | Place une clé pour chaque acteur marqué, sur la première image de ce plan, là où il termine le plan précédent. Grisé tant qu'une séquence maître n'est pas ouverte dans Sequencer avec la tête de lecture dans un plan qui en a un avant lui. |\n| **Reprendre le suivant** (Match Next) | Le miroir : la dernière image de ce plan, là où il commence le plan suivant. |\n| **Démarrer depuis...** (Start From...) | Choisit une séquence et place une clé pour chaque acteur marqué sur la première image de la séquence du plateau, là où il termine dans celle que vous avez choisie. |\n| **Vérifier la continuité** (Check Continuity) | Liste les acteurs dont la première image dans un plan saute par rapport à leur position sur la dernière image du plan précédent. Grisé tant qu'une séquence maître comptant au moins deux plans n'est pas ouverte dans Sequencer. |\n| **Séquence active** (Active Sequence) | « Pick which of the stage's Linked Sequences it plays and works on, add a Level Sequence to the stage, or take one off it. » |\n\nVoir [Séquences et liaisons](06_sequences.md).\n\n### Share\n\n![La page Share](media/ui_page_share.png)\n\n« Export and import stages, export the plan. »\n\n| Bouton | Description |\n|---|---|\n| **Exporter le plateau** (Export Stage) | Enregistre le plateau dans un fichier `.framemark.json`. |\n| **Importer** (Import) | « Bring in a Framemark file, a shot list or a screenplay. » |\n| **Exporter le plan** (Export Plan) | Ouvre la boîte de dialogue d'export de la feuille de plan. |\n| **Exporter en USD** (Export USD) | Exporte le plateau en USD. |\n| **Exporter en FBX** (Export FBX) | Exporte le plateau en FBX. |\n\nVoir [Import, export et partage](09_import-export.md).\n\n## Les espaces de travail\n\nUn espace de travail est une barre d'outils, la page sur laquelle vous démarrez, et les fenêtres qu'il ouvre et ancre. Choisir un espace de travail ouvre ses fenêtres et ne ferme jamais celles que vous avez déjà ouvertes.\n\n| Espace de travail | Démarre sur | Ouvre | Barre d'outils |\n|---|---|---|---|\n| **Director** | Plan | Planner, Screenplay | Select, Add Stage, Place Mark, Place Camera, Place Light, Place Prop, Build Sequence, Open PIE |\n| **Layout** | Block | Sequencer, Marks Table | Select, Place Mark, Place Prop, Mark From Actor, Move Mark To Actor, Assign To Mark, Key To Mark, Spread Marks, Renumber Marks, Snap Actors To Marks |\n| **Caméra** (Camera) | Shoot | Sequencer | Select, Place Camera, Set To Viewport, Look Through, Camera Preset, Look At, Follow, Unlink, Build Sequence, Open Sequence |\n| **Lighting** | Shoot | Rien de plus | Select, Place Light, Look At, Follow, Unlink, Look Through, Set To Viewport |\n\nVos propres espaces de travail se trouvent sous **Personnalisé** (Custom) dans le même menu. La première fois que vous ouvrez le mode, vous obtenez un espace de travail appelé Custom pour commencer, qui démarre sur la page Stage. Les outils d'un nouvel espace de travail personnalisé sont Select, Place Mark, Place Prop, Place Camera, Place Light, Mark From Actor, Snap Actors To Marks et Open PIE.\n\n- **Les espaces de travail intégrés ne peuvent pas être écrasés.** Modifiez-en un, puis choisissez **Enregistrer sous** pour conserver votre version.\n- Modifiez quoi que ce soit (ajouter un outil, déplacer la barre d'outils) et le point d'état apparaît. Ses trois icônes sont **Enregistrer** (« keep your changes in this workspace »), **Enregistrer sous** (« keep your changes as a new custom workspace ») et **Revert** (« drop your changes and go back to the saved workspace »). L'infobulle du point indique « This workspace has changes you have not saved. » **Enregistrer** ne concerne que les espaces de travail personnalisés. Choisir un autre espace de travail abandonne les modifications non enregistrées.\n- Survolez un espace de travail personnalisé pour voir un crayon (renommer) et une corbeille (supprimer).\n- Un espace de travail conserve aussi vos paramètres : la taille d'accrochage et les graduations d'accrochage du Planner, les repères, les unités, le thème, la position de la barre d'outils, l'ordre des calques, la résolution du croquis et la disposition des panneaux ; les options de Capture From Level ; les sections masquées de Details ; les colonnes du Marks Table et du Screenplay ; et les options d'Export et d'Import. En modifier un est une modification de l'espace de travail. Les éléments propres à chaque scénario, comme l'ordre des scènes, les scènes fermées et les accessoires ignorés, restent avec le scénario.\n- L'accrochage à la grille intégré diffère : Director 10 cm, Layout 25 cm, Camera 5 cm, Lighting 10 cm.\n- **Exporter les espaces de travail** et **Importer les espaces de travail** (dans **Gérer**) lisent et écrivent un fichier `.framemarkworkspace` que vous pouvez envoyer à votre équipe.\n\n## La barre d'outils et Edit Toolbar\n\nLa barre d'outils porte les outils de votre espace de travail, **Sélectionner** (Select) au début et un bouton **...** à la fin après un séparateur. **...** ouvre Edit Toolbar. Le bouton **More Tools** affiche « the Framemark tools that are not on this toolbar. »\n\n### Edit Toolbar\n\nLa galerie d'Edit Toolbar liste tous les outils, regroupés sous **Principal**, puis un groupe par page, puis **Vue** (View).\n\n1. Cliquez sur **...** à la fin de la barre d'outils, ou choisissez **Manage > Edit Toolbar**.\n2. Cliquez sur un outil pour l'ajouter, ou faites-le glisser sur la barre d'outils. L'indication affiche « Click a tool to add it, or drag it onto the toolbar. Drag toolbar buttons to reorder them, or right-click one for Move Left and Move Right. »\n3. Faites un clic droit sur un bouton de la barre d'outils pour **Supprimer** (Remove, « Take this tool off the toolbar. It stays on its page. »), **Déplacer vers la gauche** (Move Left) ou **Déplacer vers la droite** (Move Right). Un outil de la galerie a **Ajouter à la barre d'outils** (Add To Toolbar).\n4. Appuyez sur **Reset to Workspace** (« undo the changes you made since you pressed Edit Toolbar »), **Annuler** (Cancel), ou **Done** (« finish editing the toolbar »).\n\nPendant la modification, la rangée de la barre d'outils s'affiche dans le panneau pour que vous puissiez faire glisser. Les boutons de réinitialisation, d'annulation et de fin se trouvent sur leur propre rangée sous les outils, de sorte qu'ils ne sont jamais rognés. **Esc** annule et abandonne vos modifications.\n\n**Modifier la barre d'outils** et **Réglages du plateau** (Stage Settings, l'engrenage) sont des outils masqués : ils ont des commandes mais pas de bouton de page.\n\n## Le menu Show In Viewport\n\nLe bouton œil ouvre **Afficher dans le hublot**. Le menu reste ouvert pour que vous puissiez basculer plusieurs cases, et la coche montre toujours l'état réel.\n\n| Élément | Description |\n|---|---|\n| **Marques**, **Étiquettes** (Labels), **Notes**, **Limite** (Boundary), **Accessoires** (Props) | Les indicateurs d'affichage Framemark, les mêmes commutateurs que **Show > Custom** dans le hublot du niveau, appliqués à tous les hublots du niveau à la fois. |\n| **Caméras**, **Lumières** | Masquent ou affichent les caméras et les lumières du plateau dans l'éditeur uniquement. Par plateau, tant que l'éditeur est ouvert, et non enregistré dans le niveau. Une caméra ou une lumière que vous placez plus tard suit ce réglage. |\n\nChaque infobulle indique « Same switch as Show > Custom > Framemark {name} ». Le menu **Show > Custom** du hublot liste **Marques Framemark** (Framemark Marks), **Accessoires Framemark** (Framemark Props), **Limite Framemark** (Framemark Boundary), **Étiquettes Framemark** (Framemark Labels), **Notes Framemark** (Framemark Notes) et **Caméras Framemark** (Framemark Cameras).\n\n> **Astuce :** Si vous placez une caméra ou une lumière et qu'elle n'apparaît pas, vérifiez que **Caméras** ou **Lumières** est coché. Un message l'indique lorsque vous en placez une alors que l'option est désactivée.\n\n## Le Quick Wheel\n\nAppuyez sur **Tab** avec le pointeur au-dessus du hublot du niveau (mode Framemark activé) ou du Planner. Un anneau des outils de l'espace de travail s'ouvre sous votre curseur. Maintenez **Tab**, glissez vers un outil et relâchez, ou appuyez brièvement sur **Tab** et cliquez sur un outil. Il exécute les mêmes commandes que partout ailleurs. Dans le hublot, il fonctionne sans rien de sélectionné. Partout ailleurs, **Tab** garde la signification d'Unreal.\n\n## Le menu contextuel\n\nFaites un clic droit dans le hublot du niveau et choisissez **Framemark**. Faites un clic droit sur une marque et les mêmes entrées s'affichent à plat. Les entrées partagent leurs icônes avec la barre d'outils, sauf celles à cocher (**Orienter selon la marque** (Orient To Mark), **Épingler à la marque** (Pin To Mark)).\n\n| Groupe | Entrées |\n|---|---|\n| Place | **Placer une marque ici** (Place Mark Here), **Placer une caméra ici** (Place Camera Here), **Placer une lumière ici** (Place Light Here), au point exact où vous avez cliqué. |\n| Mark | **Assigner un Actor** (Assign Actor, avec **Selected:**, **Nearby:** et **Effacer**), **Orienter selon la marque**, **Épingler à la marque**. |\n| Actor | **Marque depuis l'Actor**, **Clé vers la marque**, **Déplacer sa marque ici** (Move Its Mark Here), **Assigner à une marque** (avec une zone de recherche, une liste de marques et **Pick In Viewport**), **Ajouter au plateau**. |\n| Edit | **Dupliquer** (Duplicate), **Supprimer** (Delete), **Verrouiller** (Lock) et **Déverrouiller** (Unlock). |\n| Position | **Plaquer au sol**, **Aligner sur un Actor** (Snap To Actor), et **Couleur** (Colour) : pastilles de rôle, **Revenir à la couleur du rôle** (Back To Role Colour) et **Personnalisée...** (Custom...). |\n| Overlapping Marks | **Organiser** (Arrange, **Avancer d'un plan**, **Mettre au premier plan**, **Reculer d'un plan**, **Mettre à l'arrière-plan**), **Écarter les marques** (**Rangée**, **Cercle**, **Selon l'orientation**), **Sélectionner la marque suivante dessous** (Select Next Mark Underneath). |\n| Group | **Déplacer vers un plateau** (Move To Stage), **Ajouter à la configuration** (Add To Setup), **Retirer de la configuration** (Remove From Setup), et **Lier** (Link, **Suivre**, **Regarder vers**, **Position**, **Rotation**, **Supprimer le lien**). |\n| Camera | **Régler sur le hublot**, **Regarder à travers**. |\n| Stage | **Ajuster la limite au plateau** (Fit Boundary To Stage), **Réappliquer la disposition**, **Sélectionner le plateau et ses éléments** (Select Stage + Attached), **Renuméroter les marques**, **Tableau des marques**. |\n\n> **Remarque :** Si le sous-menu Framemark indique « Select a Cine Stage first. », sélectionnez le plateau, un élément qui lui est attaché, ou une caméra dont le composant Stage Camera pointe vers lui, puis faites de nouveau un clic droit.\n\n## Les panneaux Détails\n\nFramemark affiche le plateau, la marque, la caméra ou la lumière sélectionnés à trois endroits.\n\n- **La zone de page du panneau Framemark**, sous les boutons de pages.\n- **Détails Framemark**, un onglet ancrable. Son infobulle indique « Framemark Details: the selected stage, marks, cameras and lights. Dock it anywhere, or float it. » Son état vide indique « Select a stage, mark, camera or light to see its details here. » Il comporte les sections **Plateau**, **Marques**, **Caméras** et **Lumières**. Plusieurs marques sélectionnées se modifient ensemble et affichent **Valeurs multiples** (Multiple Values) là où elles diffèrent. Le menu **Sections** (« tick the sections Framemark Details shows ») contient **Tout afficher** (Show All).\n- **Le panneau Détails ordinaire.** Sélectionner une marque, un accessoire, une caméra ou une lumière n'affiche que ses propres propriétés, pas la section Stage.\n\n### La rangée Stage Tools\n\n![Le panneau Détails avec un plateau sélectionné](media/fm_stage_details.png)\n*La rangée **Outils de plateau** (Stage Tools) en haut du panneau Détails d'un plateau.*\n\nLe panneau Détails ordinaire d'un plateau s'ouvre sur une rangée d'icônes **Outils de plateau**. L'infobulle de chaque icône indique « Label: description ».\n\n| Groupe | Boutons |\n|---|---|\n| Add | **Ajouter une marque** (Add Mark, « Add one mark in front of the stage and select it. »), **Ajouter une caméra** (Add Camera, « Add one camera on the stage and select it. »), **Ajouter une lumière** (Add Light, « Add one light on the stage and select it. »). |\n| Marks | **Renuméroter les marques**, **Aligner les Actors sur les marques**. |\n| Place | **Plaquer au sol**, **Ajuster la limite**, **Préréglage de caméras**. |\n| Sequence | **Construire la séquence**, **Ouvrir la séquence**. |\n| Relocate | **Choisir un plateau**, **Attacher les acteurs**, **Détacher les acteurs**. |\n\n### Ordre des propriétés du plateau\n\nCe sont les catégories du plateau dans l'ordre où le panneau Détails les affiche. Les propriétés sont décrites dans [Plateaux et Stage Assets](03_stages.md) et [Séquences et liaisons](06_sequences.md).\n\n| Catégorie | Propriétés |\n|---|---|\n| **Plateau** | Stage Asset, Layout, Layout Count, Mark Spacing, Flip Line Of Action |\n| **Look** | Marks, Cameras and Lights |\n| **Séquence** | Linked Sequences, Shot Length Seconds, Sequence Folder, Hold Marks In Sequence |\n| **Configurations** (Setups) | Ghost Opacity, Ghost Hidden Setups |\n| **Plan** | Background, Sketch |\n| **Playback** | Sequence Follows Stage, View Mode, Auto Trigger, Play Once, Has Played, Show Guides In Game |\n| **Binding** | Auto Bind Players, Auto Bind Actors By Tag, Snap Bound Actors To Marks, Player End Mark |\n| **Interrupt** | Can Be Interrupted, Interrupt Triggers, Interrupt Sequence |\n| **Préréglage de caméras** | Preset Shot Scales, Include Master, Interior Suffix, Interior |\n\n### Ordre des propriétés d'une marque\n\nLes rangées d'une marque apparaissent dans cet ordre : **Marque** (Mark, Actor, Role, Prop Footprint), **Notes** (Action, Line), **Look** (Show Preview Character, Custom Colour, Preview Character), les rangées **Actor** (Mark Order, Pin To Mark, Orient To Mark, Height Snapping, Sequence Track, Facing Offset, Facing Offset Degrees, Arrange Order, Pivot Height, Snap To Floor At Runtime), puis **Caméra**, puis **Players**. Un accessoire n'affiche que Mark Name, Actor, Prop Footprint, Role, Notes, Look, puis les rangées Actor avec Pin To Mark en premier. Chaque propriété est décrite dans [Marques et mise en place](04_marks-and-blocking.md).\n\n### Rangées des caméras et des lumières\n\nLes caméras affichent Lens Choice, Focal Length, Aperture, Manual Focus Distance, Look At Target et Filmback, avec des rangées propres au mode Game lorsque la caméra est en mode Game. Les lumières affichent d'abord Intensity, Intensity Units, Light Colour, Use Temperature et Temperature, puis Look At Mark et Aim Height, puis les rangées du cône et de la source. Voir [Caméras et lumières](05_cameras-and-lights.md).\n\n## Limitations connues\n\n- Les marques ne sont cliquables dans le hublot du niveau que lorsque leur plateau, ou une marque de celui-ci, est sélectionné.\n- Le masquage des caméras et des lumières dure jusqu'à la fermeture de l'éditeur et n'est pas enregistré avec le niveau.\n\n## Voir aussi\n\n- [Prise en main de Framemark](01_getting-started.md)\n- [Plateaux et Stage Assets](03_stages.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Référence des raccourcis clavier](13_shortcuts.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n"}, {"file": "03_stages.md", "slug": "stages", "title": "Plateaux et Stage Assets", "md": "# Plateaux et Stage Assets\n\nLe **plateau** est l'unique acteur que vous placez pour démarrer une scène. Un acteur Cine Stage délimite la zone par une **limite** en pellicule de film, contient les marques, les caméras et les lumières, et possède la séquence de niveau. Une **Stage Asset** (une Cine Stage Asset, qui est une ressource de données, ou Data Asset) stocke le contenu du plateau dans le projet, de sorte que le même plateau peut être placé dans plusieurs niveaux, modifié dans le Planner et maintenu synchronisé partout. Cette page couvre le placement d'un plateau, la limite et les formats de film, la synchronisation des Stage Assets, Draft, Save et Save As, la Library, le déplacement d'un plateau, Capture From Level et le verrouillage.\n\n## Prérequis\n\n- Framemark est activé et le mode Framemark est activé. Voir [Prise en main de Framemark](01_getting-started.md).\n\n## Concepts\n\n### Ce que contient un plateau\n\n- **Les marques** (composants Stage Mark) : l'endroit où se tient chaque personnage ou accessoire. Voir [Marques et mise en place](04_marks-and-blocking.md).\n- **Les caméras** (Acteurs de caméra cinématique portant un composant Stage Camera) et **les lumières**. Voir [Caméras et lumières](05_cameras-and-lights.md).\n- **Une limite** (le composant Ropes) : la pellicule de film.\n- **Une séquence de niveau**, ou plusieurs. Voir [Séquences et liaisons](06_sequences.md).\n\nLe plateau est l'origine de transformation de la séquence et les caméras lui sont attachées, donc déplacer ou faire pivoter le plateau déplace le plan. La limite, les marques et les étiquettes existent uniquement dans l'éditeur.\n\n### Stage Assets\n\nUne Stage Asset stocke le plateau au format JSON (marques, caméras, lumières, configurations, limite), un numéro de révision, et le nombre de marques, de caméras et de lumières, que l'infobulle du **Content Browser** (Navigateur de contenu) affiche. Elle peut aussi porter un Script, un Scene ID et un Scene Number lorsque le plateau a été créé pour une scène du scénario. Les identités des acteurs sont stockées sous forme de tags afin qu'un rechargement reconnecte les mêmes objets.\n\nLa propriété **Stage Asset** (Ressource de plateau) du plateau indique : « The Stage Asset this placement shows. Edit the stage here and the asset, and every other placement of it, follows. Pick a different asset to swap the whole stage. Editor only. »\n\nPlacer deux fois la même ressource donne deux placements qui restent synchronisés, comme des instances de Blueprint.\n\n### Draft\n\nLorsque vous modifiez un plateau dans le Planner, les modifications vont dans un **Brouillon** (Draft), et non directement dans le niveau. L'indicateur en direct du Planner affiche **Brouillon** et son infobulle indique : « Draft: Planner edits go to the Stage Asset only. Save it (Ctrl+S) and every placement in the level updates, as Blueprint instances do. Click to sync with the level again. »\n\nTant qu'un plateau a un Draft non enregistré, sa modification dans le niveau est bloquée. Le message indique « Draft in Planner: '{name}' has Planner changes not saved yet. Save or discard them in the Planner to edit this stage here. »\n\n| Action | Description |\n|---|---|\n| **Enregistrer** (Save, **Ctrl+S**) | « Save the Stage Asset (Ctrl+S). Every placement in the level updates to it, as one undo step. » |\n| **Enregistrer sous** (Save As) | « The draft becomes a new Stage Asset in its own tab. This stage goes back to its saved state. » La boîte de dialogue **Enregistrer la ressource de plateau sous** (Save Stage Asset As) demande la nouvelle ressource. |\n| **Abandonner le brouillon** (Discard Draft) | Abandonne les modifications du Planner. |\n\nSi vous fermez le Planner avec des modifications non enregistrées, une boîte de dialogue **Brouillon non enregistré** (Unsaved draft) indique que le plateau a des modifications du Planner que le niveau n'a pas encore, avec **Enregistrer et synchroniser** (Save and Sync) et **Abandonner le brouillon**.\n\n> **Remarque :** Si la ressource du plateau est partagée avec une copie, **Make Unique** donne à ce plateau sa propre ressource. Le message indique « This stage now has its own asset, '{name}'. » Les Stage Assets créées pour des plateaux qui n'en avaient pas indiquent « Made {n} Stage Asset(s). Save them with the level. »\n\n## Placer un plateau\n\n1. Ouvrez la page **Plateau** (Stage), ou la page Home.\n2. Appuyez sur **Ajouter un plateau** (Add Stage). Le plateau apparaît là où le hublot du niveau regarde, s'accroche au sol, et reçoit une marque **Joueur** (Player) et une marque **PNJ** (NPC) face à face.\n\nOu, sans le mode : faites glisser **Place Actors > Cinematic > Cine Stage** dans le niveau.\n\nVous pouvez désactiver à la fois l'accrochage au sol et les deux marques de départ dans les Préférences de l'éditeur. **Stage Anchor Location** (Préférences de l'éditeur) indique où se trouve l'ancre sur un nouveau plateau ; l'icône Framemark dans le hublot se place sur ce point. Voir [Référence des paramètres et de la nomenclature](11_settings-reference.md).\n\n### Commandes de la page Stage\n\n| Commande | Description |\n|---|---|\n| **Ajouter un plateau** | « Adds the 3D stage to the level where the viewport is looking. Marks, cameras and lights live on it. » |\n| **Plaquer au sol** (Snap To Ground) | Pose le plateau sur le sol situé sous lui. S'il n'y a rien, le message indique « No floor found underneath. » |\n| **Ajuster la limite** (Fit Boundary) | Enveloppe la limite autour de chaque marque, caméra et lumière du plateau. Les tailles qu'elle crée sont arrondies au centimètre supérieur. Une taille que vous saisissez est conservée telle quelle. |\n| **Choisir un plateau** (Select Stage) | Sélectionne le plateau et tout ce qui lui est attaché. |\n| **Ajouter au plateau** (Add To Stage) | Attache les acteurs sélectionnés en conservant leur transformation dans le monde. |\n| **Attacher les acteurs** (Attach Actors) | Attache chaque acteur assigné. |\n| **Détacher les acteurs** (Detach Actors) | Les détache. |\n\n> **Remarque :** **Plaquer au sol** trouve le sol sur le canal Visibility sous le plateau, en ignorant le plateau et ses propres éléments attachés. Déplacez d'abord le plateau au-dessus d'une vraie collision.\n\n## La limite\n\nLa limite est une spline fermée dessinée comme une bande de vraie pellicule, afin que le reste de l'équipe voie l'emprise de la scène cinématique avant de construire à travers elle. Elle se dessine devant le ciel et le niveau comme n'importe quel autre objet et reste visible depuis les angles bas. Elle existe uniquement dans l'éditeur.\n\n![Un plateau sélectionné : la limite, les marques avec leurs personnages d'aperçu et les caméras du plateau](media/st_boundary.jpg)\n\n### Propriétés de la limite\n\nSélectionnez le plateau et ouvrez son composant Boundary (le composant Ropes, catégorie **SceneBoundary**). Le panneau Framemark Details affiche les mêmes propriétés sous les noms Boundary Shape, Boundary Width, Boundary Depth, Corner Radius, Boundary Radius, Film Format, Film Scale et Height Off Floor.\n\n| Propriété | Description |\n|---|---|\n| **Shape** | **Rounded Rectangle**, **Cercle** (Circle) ou **Personnalisé** (Custom). Faire glisser un point de la spline la passe en Custom. |\n| **Largeur** (Width) | 700 cm par défaut. |\n| **Depth** | 600 cm par défaut. |\n| **Corner Radius** | 150 cm par défaut. Rounded Rectangle uniquement. |\n| **Radius** | 300 cm par défaut. Circle uniquement. |\n| **Centre Offset** | Avancé. Décale le centre de la limite. |\n| **Film Format** | La pellicule dessinée. **35mm 4-perf** par défaut. |\n| **Film Scale** | 1 par défaut, plage de 0,25 à 5. « 1 stands 40 cm tall. » |\n| **Height Off Floor** | 85 cm par défaut. |\n| **Frame Color** | Orange par défaut. |\n| **Base Color**, **Perforation Color**, **Ground Color** | Les autres couleurs de la bande. Les pastilles du sélecteur utilisent les couleurs propres à la bande : un cadre jaune, une base noire et des perforations claires. |\n| **Draw Floor Line** | Activé par défaut. |\n| **Inside Height Tolerance** | 400 cm par défaut. Avancé. À quelle hauteur au-dessus de la limite on est encore considéré comme à l'intérieur. |\n\n### Formats de film\n\n| Libellé | Description |\n|---|---|\n| **35mm 4-perf** | Le format par défaut. |\n| **35mm 3-perf** | |\n| **35mm 8-perf VistaVision** | |\n| **65mm 5-perf** | |\n| **70mm 5-perf print** | |\n| **IMAX 15/70** | |\n\nLes formats utilisent les proportions réelles de la pellicule, si bien que la bande se lit toujours comme du film. Une liste distincte de formats de film de caméra, utilisée pour le Filmback de la caméra, est décrite dans [Caméras et lumières](05_cameras-and-lights.md).\n\n### Comportement de la limite\n\n- **Auto Fit Boundary** (Préférences de l'éditeur, Scene Boundary, activé par défaut) : lorsque vous relâchez un élément du plateau, la limite se réajuste autour du plateau, en grandissant ou en rétrécissant, comme le fait Fit Boundary. Un contour Custom est laissé tel qu'il a été dessiné. Une seule annulation remet les deux en place.\n- Déplacer un acteur qui ne fait pas partie d'un plateau à l'intérieur de la limite de quelqu'un affiche un avertissement une fois par acteur toutes les 30 secondes. Désactivez-le dans **Editor Preferences > Framemark > General > Scene Boundary > Warn When Editing Inside Boundary**.\n\n## Propriétés du plateau\n\nCe sont les propriétés propres au plateau, dans l'ordre où le panneau Détails les affiche. Les propriétés Sequence et Binding sont aussi décrites dans [Séquences et liaisons](06_sequences.md).\n\n![Le panneau Détails avec un plateau sélectionné](media/fm_stage_details.png)\n\n### Stage\n\n| Propriété | Description |\n|---|---|\n| **Stage Asset** | La Stage Asset que ce placement affiche. Éditeur uniquement. |\n| **Layout** | L'agencement des marques. En choisir un l'applique immédiatement. **I - two facing** par défaut. Voir [Marques et mise en place](04_marks-and-blocking.md). |\n| **Layout Count** | 5 par défaut. Affiché uniquement pour les agencements O et U. |\n| **Mark Spacing** | 180 cm par défaut, plage d'interface de 40 à 800. La distance entre la marque 1 et la marque 2. « Around 100 reads as intimate, 300 as formal. » |\n| **Flip Line Of Action** | Désactivé par défaut. Inverse le côté de la ligne d'action où les caméras sont autorisées. |\n\n### Look\n\n| Propriété | Description |\n|---|---|\n| **Marques** (Marks) | La façon dont les marques se dessinent : Style, Asset, Preview Character, Size, Opacity, Height Pin, Colour, One Colour. Voir [Marques et mise en place](04_marks-and-blocking.md). |\n| **Cameras and Lights** | La façon dont les caméras et les lumières se dessinent : Display, Size, Always Face The Camera, Show Name Label, Show On Top Of Everything. Voir [Caméras et lumières](05_cameras-and-lights.md). |\n\nLes nouveaux plateaux copient leur Look de départ depuis la page de paramètres **Marques Framemark** (Framemark Marks).\n\n### Setups\n\n| Propriété | Description |\n|---|---|\n| **Opacité des fantômes** (Ghost Opacity) | 0,25 par défaut, plage de 0 à 1. Le degré d'opacité des configurations fantômes. |\n| **Ghost Hidden Setups** | Activé par défaut. Les configurations masquées s'estompent au lieu de disparaître. |\n\n### Plan\n\n| Propriété | Description |\n|---|---|\n| **Arrière-plan** (Background) | Des calques d'image derrière le plan. Chaque calque a une Texture, un centre, une **Largeur** (2000 cm par défaut), une rotation, une **Opacité** (Opacity) et une case de visibilité. |\n| **Croquis** (Sketch) | Le croquis du Planner. Voir [Le Planner](07_planner.md). |\n\n### Playback\n\n| Propriété | Description |\n|---|---|\n| **Sequence Follows Stage** | Activé par défaut. Le plateau est l'origine de transformation de la séquence. |\n| **View Mode** | **Framed** (par défaut), **First Person** ou **Hybrid**. |\n| **Auto Trigger** | **Manual**, **OnBeginPlay** ou **WhenPlayerEntersBoundary**. |\n| **Play Once** | Désactivé par défaut. |\n| **Has Played** | Lecture seule et avancé. Une propriété de sauvegarde de jeu. |\n| **Show Guides In Game** | Désactivé par défaut. Avancé. |\n\nLe plateau a aussi des dispatchers d'événements, **On Stage Play**, **On Stage Paused**, **On Stage Stopped**, **On Stage Finished** et **On Stage Interrupted**, et des fonctions Blueprint telles que Play Stage, Stop Stage, Interrupt Stage et Reset Has Played.\n\n## Save, Save As et la Library\n\n### Enregistrer une Stage Asset\n\n1. Modifiez le plateau dans le Planner. L'indicateur en direct affiche **Brouillon**.\n2. Appuyez sur **Ctrl+S** ou sur le bouton Save. Chaque placement de la ressource dans le niveau se met à jour, en une seule étape d'annulation.\n3. Pour conserver votre modification comme une nouvelle ressource à la place, choisissez **Enregistrer sous**, nommez la ressource dans **Enregistrer la ressource de plateau sous**, puis confirmez.\n\n### La Library\n\nLa Library est un onglet ancrable, **Bibliothèque** (Library) : « Framemark assets: folders, favourites, quick filters and Used In. » Elle parcourt les Stage Assets et les séquences de niveau par dossier.\n\n| Contrôle | Description |\n|---|---|\n| **Ajouter** (Add) | « Make a new Stage Asset or Level Sequence in this folder. » |\n| **Importer** (Import) | « Import files into this folder, as the Content Browser's Import does. » |\n| Zone de recherche | Indication « Find a stage, scene or folder ». |\n| **Dans ce niveau** (In this level) | « Only stages placed in this level. » |\n| **Tous les scénarios** (All screenplays) | Un filtre par scénario : « Only stages made for one screenplay. » |\n| Précédent et Suivant | « Back to the previous folder. » et « Forward to the next folder. » |\n| **Aller à** (Go to) | « Select it in the level, frame it and open Framemark. » |\n| **Placer** (Place) | « Place it in front of the viewport camera. » |\n| **Utilisé dans** (Used In) | Affiche où la ressource sélectionnée est utilisée. |\n| **Ouvrir dans le Planificateur** (Open in Planner) | « Open the selected Stage Asset's plan. » |\n| **Afficher dans le navigateur de contenu** (Show in Content Browser) | « Find the selected asset in the Content Browser. » |\n\nChaque rangée affiche le nom du plateau et la scène, une ligne de comptage telle que « {n} marks, {n} cameras, {n} lights », et s'il est placé : « Placed here x{n} » ou « Not in this level ».\n\n> **Remarque :** La disposition de la Library est en cours de refonte et va changer.\n\n## Déplacer un plateau\n\nAvec **Sequence Follows Stage** activé, déplacer ou faire pivoter le plateau déplace les caméras avec lui, car elles lui sont attachées. Les données de la séquence ne changent pas, seul l'endroit où elle se joue change.\n\nLes acteurs ne sont pas attachés au plateau par défaut. L'Actor d'une marque est une simple référence. Utilisez ces commandes :\n\n1. **Choisir un plateau** saisit le plateau et tout ce qui lui est attaché, prêt à être déplacé ou copié d'un bloc.\n2. **Ajouter au plateau** attache les acteurs sélectionnés en conservant leur transformation dans le monde.\n3. **Attacher les acteurs** attache chaque acteur assigné pour qu'il se déplace avec le plateau.\n4. **Détacher les acteurs** laisse les acteurs où ils sont.\n5. **Aligner les Actors sur les marques** (Snap Actors To Marks) remet dès maintenant chaque acteur assigné sur sa marque, sans toucher à l'attachement.\n\nLes entrées de clic droit **Déplacer vers un plateau** (Move To Stage) et **Lier** (Link) déplacent aussi des marques entre plateaux. Si un acteur est attaché à la cible, **Lier** indique « Can't link an actor that is attached to the target. Use Detach From Stage first, or pick a different target. »\n\n## Capture From Level\n\n**Capturer depuis le niveau** (Capture From Level) réalise une capture de dessus du niveau situé sous le plateau et la définit comme **Arrière-plan** à la bonne échelle. Elle se trouve sur la page Plan sous le nom **Capturer** (Capture) lorsque Overhead View est activée, et sous forme d'onglet ancrable **Capturer** (« Capture From Level: a top-down capture of the level under the stage, set as the Background at the right scale. »).\n\n1. Placez le plateau dans le niveau. La capture nécessite un plateau placé. Sinon, les raisons indiquent « There is no stage to capture. Pick a stage first. » ou « The stage is not placed in the level. Place it in the level to capture it. »\n2. Activez **Vue de dessus** (Overhead View) sur la page Plan, ou ouvrez l'onglet Capture.\n3. Appuyez sur **Capturer** (ou **Capturer depuis le niveau**).\n\nLa capture correspond à une seule étape d'annulation. Si elle ne peut pas s'exécuter, rien n'est modifié, et le message en donne la raison, par exemple « The capture needs the editor to be rendering. Nothing was changed. »\n\n## Lock\n\n**Verrouiller** (Lock) garde la sélection là où elle est, dans le hublot et dans le Planner. Son infobulle indique « Lock: keeps the selection where it is, here and in the viewport. Locked marks keep their colour with a dashed ring and a padlock. Locked cameras and lights cannot be moved. » L'entrée **Verrouiller** du clic droit indique « A locked mark or actor can't be moved or deleted from here until you unlock it. » Une marque verrouillée ne peut pas être glissée, recevoir un acteur ni être supprimée. Les messages indiquent « Those marks are locked. » et « That mark is locked. » Les configurations peuvent aussi verrouiller leurs membres. Voir [Marques et mise en place](04_marks-and-blocking.md).\n\n## Limitations connues\n\n- Le masquage des caméras et des lumières est propre à chaque plateau, dure jusqu'à la fermeture de l'éditeur et n'est pas enregistré.\n- Les plateaux importés ne reconnectent les acteurs que par correspondance exacte des étiquettes.\n\n## Voir aussi\n\n- [Interface du mode Framemark](02_interface.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Le Planner](07_planner.md)\n- [Import, export et partage](09_import-export.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n"}, {"file": "04_marks-and-blocking.md", "slug": "marks-and-blocking", "title": "Marques et mise en place", "md": "# Marques et mise en place\n\nUne **marque** est un emplacement sur le plateau où se tient un personnage ou un accessoire. Les marques donnent à chaque acteur une place et une orientation, donnent à la séquence de niveau une piste par marque, et indiquent aux caméras quels personnages elles couvrent. La mise en place consiste à placer, nommer, ordonner et organiser les marques jusqu'à ce que la scène soit lisible. Cette page traite du placement des marques et des accessoires, de **Ordre des marques** (Mark Order), des noms, des **Layouts** (Dispositions), de l'orientation, des piles, des configurations, de la **Tableau des marques** (Marks Table), de **Clé vers la marque** (Key To Mark), de l'affectation des acteurs aux marques et des personnages d'aperçu.\n\n## Prérequis\n\n- Un plateau dans le niveau. Voir [Plateaux et Stage Assets](03_stages.md).\n- Le mode Framemark activé. Les marques ne sont cliquables dans le hublot du niveau que lorsque leur plateau, ou une marque de ce plateau, est sélectionné.\n\n## Concepts\n\n- **Ordre des marques** est le numéro de la marque (1, 2, 3...). Il sert à ordonner, nommer et retrouver les marques, et les caméras désignent les marques par ce numéro. Il n'y a pas de limite supérieure. La marque 1 est le rôle principal.\n- **Rôle** (Role) indique qui ou quoi se tient sur la marque : **Joueur** (Player), **PNJ** (NPC), **Compagnon** (Companion), **Accessoire** (Prop), **Figurant** (Extra), **Ennemi** (Enemy) ou **Transport**. Le rôle détermine la couleur de la marque.\n- **Actor** (Acteur) est l'acteur du niveau qui se tient sur la marque. L'acteur d'une marque est une simple référence, pas un attachement.\n- Une marque s'affiche sous la forme d'un anneau collé au sol, d'une flèche d'orientation et de son numéro.\n\n## Placer des marques et des accessoires\n\n**Placer une marque** (Place Mark, touche **M**) et **Placer un accessoire** (Place Prop, touche **P**) sont des outils de placement par clic. Cliquez pour placer, continuez à cliquer, et appuyez sur **Esc** pour arrêter. Un fantôme (anneau et flèche d'orientation) suit votre curseur avant le clic. Tant qu'un outil est actif, ses réglages s'affichent dans un petit panneau. Pour les marques, ce sont **Face Stage Centre** (Orienter vers le centre du plateau), **Snap To Floor** (Accrocher au sol) et **Auto Number** (Numérotation auto).\n\n- La première marque d'un plateau vide est un **Joueur**. Toutes les suivantes sont des **PNJ**. Les accessoires ont toujours le rôle **Accessoire**.\n- Une marque **Accessoire** ou **Transport** s'affiche sous la forme d'un rectangle d'emprise au sol avec une flèche d'orientation, pas d'un corps fantôme. Les accessoires sont verts dans le **Planificateur** (Planner) et dans le hublot.\n- Faites un clic droit dans le hublot et choisissez **Framemark > Place Mark Here** pour placer la marque à l'endroit exact où vous avez cliqué.\n- Le bouton **Ajouter une marque** (Add Mark) de la ligne **Outils de plateau** (Stage Tools) du plateau ajoute une marque devant le plateau et la sélectionne.\n\n**Marque depuis l'Actor** (Mark From Actor) nécessite que des acteurs soient sélectionnés. Il crée une marque sous les pieds de chaque acteur sélectionné, orientée comme l'acteur, avec l'acteur affecté. Si l'acteur a déjà une marque sur ce plateau, c'est cette marque qui est déplacée. **Déplacer la marque vers l'Actor** (Move Mark To Actor) déplace la marque existante de chaque acteur sélectionné à l'endroit où l'acteur se tient maintenant. La commande du clic droit **Déplacer sa marque ici** (Move Its Mark Here) fait la même chose, et si l'acteur n'a pas encore de marque, elle affiche « Cet Actor n'a pas encore de marque sur ce plateau. »\n\nPour déplacer une marque à la main, sélectionnez le plateau (ou n'importe laquelle de ses marques), cliquez sur la poignée en anneau de la marque, puis faites glisser avec le gizmo de déplacement ou de rotation. Position et lacet (yaw) uniquement. Une marque verrouillée ne réagit pas.\n\n## Mark Order et noms\n\nLes nouvelles marques sont nommées `Mark_0010`, `Mark_0020`, et ainsi de suite, selon le motif Mark de Naming. Un nom que vous saisissez est conservé. Voir [Référence des paramètres et de la nomenclature](11_settings-reference.md).\n\n**Renuméroter les marques** (Renumber Marks) réordonne **Ordre des marques** : les **Joueur** d'abord, puis les **PNJ**, **Compagnon** et **Figurant**, puis les **Accessoire**, chacun dans son ordre actuel. Une marque qui porte encore un nom par défaut reçoit le nom par défaut de son nouveau numéro. Un nom que vous avez saisi reste en place.\n\n## Layouts\n\nChoisissez un **Layout** (Disposition) sur le plateau et les marques se disposent aussitôt, espacées selon **Mark Spacing** (Espacement des marques). C'est une seule étape d'annulation. Les marques manquantes sont ajoutées. Les marques au-delà du nombre prévu restent où elles sont, et un message les nomme.\n\n| Libellé du Layout | Marques | Disposition |\n|---|---|---|\n| **Freeform (leave as is)** | n'importe | Ne fait rien. |\n| **I - two facing** | 2 | La valeur par défaut. Face à face. |\n| **Reverse I - two back to back** | 2 | Dos à dos. |\n| **Split I - two shoulder to shoulder** | 2 | Épaule contre épaule, tournées vers l'extérieur. |\n| **A - three turned in** | 3 | Tournées vers l'intérieur, les unes vers les autres. |\n| **L - three in an L** | 3 | La marque 1 mène, une devant, une au coin. |\n| **T - two talk, one observes** | 3 | Les marques 1 et 2 parlent, la marque 3 observe. |\n| **Split T - two against one** | 3 | Les marques 2 et 3 face à la marque 1. |\n| **V - three facing out** | 3 | Toutes tournées vers l'extérieur, dialogue par-dessus l'épaule. |\n| **O - ring** | Layout Count | Un anneau tourné vers le milieu. |\n| **U - arc, open to camera** | Layout Count | Un arc dont un côté reste ouvert pour la caméra. |\n\n**Layout Count** (5 par défaut, 4 au minimum) n'apparaît que pour O et U. **Mark Spacing** est la distance en centimètres entre la marque 1 et la marque 2. Elle détermine l'espacement et la proximité apparente des plans.\n\n**Réappliquer la disposition** (Re-apply Layout) (clic droit, groupe **Plateau** (Stage)) remet les marques dans la forme après que vous les avez déplacées. La commande **Appliquer la disposition** (Apply Layout) existe mais est masquée sur la page, car le choix d'un **Layout** l'applique.\n\n## Orientation\n\n- **Orienter selon la marque** (Orient To Mark) fait prendre à l'acteur l'orientation de la marque (lacet uniquement). La flèche d'orientation est pleine lorsque l'option est activée, et creuse avec une tige en pointillés lorsqu'elle est désactivée.\n- **Facing Offset** (Décalage d'orientation) vaut **Auto** ou **Manual** (Manuel). Avec **Manual**, **Facing Offset Degrees** (Décalage d'orientation en degrés) détourne le personnage de la direction de la marque.\n- **Face Stage Centre** dans les réglages de **Placer une marque** oriente les nouvelles marques vers le milieu du plateau.\n- **Flip Line Of Action** (Inverser la ligne d'action) sur le plateau inverse le côté de la ligne où les caméras sont autorisées.\n\n## Piles : des marques au même endroit\n\nLes marques au même endroit affichent un compteur tel que **x3**, et celle du dessus porte le numéro.\n\n| Commande | Description |\n|---|---|\n| **Avancer d'un plan** (Bring Forward) | « Fait monter les marques sélectionnées d'un cran. » |\n| **Mettre au premier plan** (Bring To Front) | « Dessine les marques sélectionnées par-dessus, et les clics les sélectionnent en premier. » |\n| **Reculer d'un plan** (Send Backward) | « Fait descendre les marques sélectionnées d'un cran. » |\n| **Mettre à l'arrière-plan** (Send To Back) | « Dessine les marques sélectionnées sous les autres. » |\n| **Écarter les marques** (Spread Marks) | \"Move marks that share a spot onto a small circle, keeping their facing.\" (déplace les marques qui partagent un emplacement sur un petit cercle, en gardant leur orientation.) |\n| **Parcourir les marques empilées** (Cycle Stacked Mark) | « Sélectionne la marque suivante empilée au même endroit. Cliquer de nouveau sur la pile fait pareil, Maj+clic revient en arrière. » |\n\nFaites un clic droit sur **Écarter les marques** pour obtenir **Rangée** (Row, Ligne) (« Aligne les marques sur la largeur du plateau, dans l'ordre des numéros. Annuler les remet en place. »), **Cercle** (Circle) (\"Puts the marks on a small circle round the spot.\" (place les marques sur un petit cercle autour de l'emplacement)) et **Selon l'orientation** (By Facing) (\"Pushes each mark out the way it faces.\" (pousse chaque marque dans la direction où elle est orientée)). Le titre du clic droit pour les commandes d'organisation est « Quand les marques se chevauchent », et pour l'écartement c'est « Écarter la pile ». **Sélectionner la marque suivante dessous** (Select Next Mark Underneath) est la forme du clic droit de **Parcourir les marques empilées**.\n\n**Ordre d'empilement** (Arrange Order, une propriété de marque) détermine quelle marque est dessinée au-dessus. Un nombre plus élevé est dessiné au-dessus. Ce n'est pas **Ordre des marques**.\n\n## Propriétés des marques\n\nElles sont présentées dans l'ordre où le panneau Détails les affiche.\n\n### Mark\n\n| Propriété | Description |\n|---|---|\n| **Mark Name** (Nom de la marque) | \"Mark 1\" par défaut. |\n| **Actor** | L'acteur qui se tient sur la marque. |\n| **Rôle** | Player, NPC, Companion, Prop, Extra, Enemy ou Transport. |\n| **Prop Footprint** (Emprise de l'accessoire) | 60 par 60 cm par défaut. **Accessoire** et **Transport** uniquement. |\n\n### Notes\n\n| Propriété | Description |\n|---|---|\n| **Action** | Ce qui se passe sur cette marque. |\n| **Réplique** (Line) | La réplique de dialogue dite sur cette marque. Plusieurs lignes possibles. |\n\nLes notes s'affichent dans le panneau lorsque la marque est sélectionnée, et dans le hublot lorsque **Notes** est coché dans le menu en forme d'œil.\n\n### Look\n\n| Propriété | Description |\n|---|---|\n| **Show Preview Character** (Afficher le personnage d'aperçu) | Activé par défaut. Affiche un personnage sur la marque pour juger les tailles et les espacements. L'affectation d'un acteur le désactive. |\n| **Custom Colour** (Couleur personnalisée) | Cochez pour remplacer la couleur du rôle. |\n| **Couleur** (Colour) | La couleur propre de la marque. Une couleur personnalisée l'emporte sur la couleur du rôle. |\n| **Preview Character** (Personnage d'aperçu) | Avancé. Le personnage d'aperçu propre à cette marque. Il l'emporte sur celui du plateau. |\n\n![Les marques dans le hublot du niveau : une marque vide affiche un personnage d'aperçu jaune, une marque attribuée affiche son acteur](media/vp_marks_lights.jpg)\n\n### Actor\n\n| Propriété | Description |\n|---|---|\n| **Ordre des marques** | Le numéro de la marque. Minimum 1. |\n| **Épingler à la marque** (Pin To Mark) | Activé par défaut. « Garde la piste de l'acteur épinglée à la marque pendant toute la séquence. » |\n| **Orienter selon la marque** | Activé par défaut. « L'acteur se tourne dans le sens indiqué par la marque. » |\n| **Accrochage en hauteur** (Height Snapping) | **Snap To Floor** pose l'acteur sur le sol sous la marque. **Keep Mark Height** (Conserver la hauteur de la marque) le laisse à la hauteur propre de la marque, pour les emplacements surélevés. |\n| **Piste de séquence** (Sequence Track) | « La piste de la séquence du plateau qui suit cette marque. » |\n| **Facing Offset**, **Facing Offset Degrees** | Voir Orientation. |\n| **Ordre d'empilement** | Avancé. |\n| **Pivot Height** (Hauteur du pivot) | Avancé. |\n| **Snap To Floor At Runtime** (Accrocher au sol à l'exécution) | Avancé. |\n\n### Camera\n\n| Propriété | Description |\n|---|---|\n| **Autoriser la génération de caméras** (Allow Camera Generation) | Activé par défaut. Décochez pour une marque de point de vue, qui affiche un cône de vision au lieu d'un fantôme et ne reçoit aucune caméra générée qui la regarde. Verrouillé sur activé quand le type de projet est First Person Game. |\n| **Default Camera** (Caméra par défaut), **Close Camera** (Caméra rapprochée), **Wide Camera** (Caméra large) | Avancé. |\n\n### Players\n\n| Propriété | Description |\n|---|---|\n| **Player Index** (Index du joueur) | -1 par défaut. Une marque **Joueur** laissée à -1 compte comme le joueur 0. |\n| **Binding Tag** (Tag de liaison) | Avancé. Le tag auquel se lie une piste de séquence. S'il est vide, **Mark Name** est utilisé. |\n\nUn accessoire affiche Mark Name, Actor, Prop Footprint, Role, Notes, Look, puis les lignes Actor. Players et Camera sont masqués.\n\n## Couleurs des rôles\n\nLa couleur dépend du rôle, la même dans le hublot, dans le plan et dans l'export. Les valeurs par défaut suivent les couleurs du dépouillement de scénario : Player rouge, Companion vert, NPC jaune, Enemy orange, Prop violet, Transport rose, Extra gris foncé. Modifiez-les dans **Editor Preferences > Plugins > Framemark Marks > Role Colours**. La **Custom Colour** d'une marque l'emporte.\n\nDans le hublot, le survol éclaircit l'anneau et affiche le nom. Une marque sélectionnée a un anneau intérieur blanc, des poignées bleues et une étiquette de hauteur. Une marque verrouillée garde sa couleur, avec un anneau en pointillés et un cadenas sur une plaque sombre. La hauteur ne s'affiche que lorsque la marque est au-dessus du sol, par exemple \"0.25 m above floor\" (0,25 m au-dessus du sol).\n\n## Aspect des marques et personnages d'aperçu\n\nSur le plateau, sous **Look** (Aspect), **Marques** (Marks) :\n\n| Propriété | Description |\n|---|---|\n| **Style** | **Ring** (Anneau), **Decal**, **Mesh** (Maillage) ou **Personnalisé** (Custom). |\n| **Asset** (Ressource) | La ressource Decal ou Mesh. |\n| **Preview Character** | Pour **Personnalisé** : affiche ce personnage sur chaque marque. Le **Preview Character** propre à une marque l'emporte. |\n| **Taille** (Size) | Rayon de l'anneau, 35 cm par défaut, plage de 15 à 80. |\n| **Opacité** (Opacity) | 1 par défaut, plage de 0.1 à 1. |\n| **Height Pin** (Épingle de hauteur) | **Always** (Toujours), **Selected** (Sélectionné) ou **Désactivé** (Off). |\n| **Couleur** | **By Role** (Par rôle) ou **One** (Un seul). |\n| **One Colour** (Une couleur) | La couleur utilisée quand **Couleur** vaut **One**. |\n\nDans le **Planificateur**, **Planner Mark Look** (**Ring**, **Shoulders** (Épaules) ou **Personnalisé**) détermine ce que dessine une marque de personnage. Voir [Le Planner](07_planner.md).\n\n## Affecter des acteurs aux marques\n\n| Commande | Description |\n|---|---|\n| **Assigner à une marque** (Assign To Mark) | Ouvre une liste de marques avec un champ de recherche, « Rechercher des marques ». Choisissez une marque pour y placer l'acteur sélectionné. **Pick In Viewport** (Choisir dans le hublot) : \"click a mark in the viewport and this actor goes on it. Clicking anywhere else cancels.\" (cliquez sur une marque dans le hublot et cet acteur y est placé ; un clic ailleurs annule), se termine par \"Put {actor} on Mark {n}.\" (Place {actor} sur la marque {n}.) |\n| Clic droit **Assigner un Actor** (Assign Actor) | **Selected: {name}** place l'acteur sélectionné sur cette marque. **Nearby: {name}** place sur la marque l'acteur qui se tient près d'elle. **Effacer** (Clear) retire l'acteur. |\n| **Aligner les Actors sur les marques** (Snap Actors To Marks) | Remet tout de suite chaque acteur affecté sur sa marque. |\n\nSi vous affectez un acteur à une marque qui a une piste de transformation dans la séquence du plateau, l'acteur reste là où la séquence le place. Le message indique que vous pouvez utiliser **Clé vers la marque**, ou activer **Key When Assigning Sequenced Actor** (Poser une clé à l'assignation d'un acteur séquencé) dans Editor Preferences.\n\nÀ l'exécution, trois voies lient un acteur à une marque : l'**Actor** de la marque ; un **Actor Tag** (Tag d'acteur) correspondant au tag de liaison de la marque (avec **Auto Bind Actors By Tag** (Liaison auto des acteurs par tag) activé) ; et le pawn d'un joueur local associé par **Player Index** (avec **Auto Bind Players** (Liaison auto des joueurs) activé). Voir [Séquences et liaisons](06_sequences.md).\n\n## Key To Mark\n\nUn acteur qui se déplace d'une marque à l'autre a besoin d'images clés. La séquence est la séquence de niveau du plateau.\n\n1. Appuyez sur **Ouvrir la séquence** (Open Sequence) sur la page **Séquence** (Sequence).\n2. Placez la tête de lecture de Sequencer à l'instant où l'acteur doit arriver.\n3. Faites un clic droit sur l'acteur dans le hublot du niveau et choisissez **Framemark > Key To Mark**, ou appuyez sur **K**, puis choisissez la marque.\n\nUne image clé de transformation est ajoutée à cet instant, plaçant l'acteur sur la marque. **Orienter selon la marque** et **Accrochage en hauteur** sont respectés. Si l'acteur n'a pas encore de piste de transformation, elle est créée. C'est une seule étape d'annulation. Recommencez à un autre instant pour la marque suivante.\n\nSi l'action ne peut pas s'exécuter, le message en donne la raison : « Choisissez une marque sur un plateau pour y caler. », « Sélectionnez un acteur à caler sur la marque. », « Arrêtez Lecture dans l'éditeur avant de caler des acteurs sur des marques. », ou « Ouvrez d'abord la séquence du plateau dans Sequencer (Ouvrir la séquence), puis placez la tête de lecture là où l'acteur doit atteindre la marque. » (Ouvrez d'abord la séquence du plateau dans Sequencer (Open Seque
