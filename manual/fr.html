. Choisissez le fichier `*.framemark-changes.json`. Le plug-in le vérifie.\n3. Confirmez. Le plug-in écrit les changements, enregistre `.undo.json` et `.applied.json`, et supprime l'original.\n4. Exportez à nouveau pour Unreal et réimportez dans Framemark.\n\nPour annuler une application, choisissez **Framemark > Undo Last Apply**.\n\n> **Avertissement :** **Ctrl+Z** dans articy:draft n'annule pas un Apply. Utilisez **Undo Last Apply**.\n\n## Story Map\n\nLa **Carte de l'histoire** dessine un scénario à embranchements (ink ou articy) sous forme d'organigramme. Affichez-la depuis **Panels > Story Map**.\n\n- Une boîte par scène, de gauche à droite.\n- Les fils entre les boîtes portent les mots des choix, **GO TO** et next.\n- Une règle indique les numéros de scène de chaque colonne.\n- Des points sous une boîte montrent les locuteurs, dans les couleurs de rôle de Cast.\n- Les notes apparaissent au-dessus d'une boîte (« Notes: {0} »). Cliquez sur **Enregistrer les notes** (Save Notes) pour conserver une modification.\n- Les fils vers l'arrière sont estompés et pointillés.\n- Un GO TO sans cible aboutit à une boîte **Sorties** (Exits) en pointillés.\n- Le commutateur d'en-tête **Par scène** (By Scene) / **Par séquence** (By Sequence) change ce que représente une boîte. Il est conservé par scénario.\n\n| Action | Résultat |\n|---|---|\n| Cliquer sur une boîte | Sélectionne la scène et s'y place. |\n| Double-cliquer sur une boîte | Ouvre la séquence. |\n\n> **Remarque :** La Story Map est en lecture seule pour l'histoire. Modifiez l'histoire dans le Screenplay, ink ou articy.\n\n### Menus contextuels\n\n| Emplacement | Commandes |\n|---|---|\n| Boîte de scène | **Ouvrir le plateau**, **Ouvrir la séquence**, **Générer**, **Changer de plateau**, **Changer de séquence**, **Afficher dans le scénario** (Show in Screenplay), **Modifier les notes** (Edit Notes), **Ouvrir la source** (Open Source, « Open it in articy », ou le fichier ink), **Copier le nom de la scène** (Copy Scene Name) |\n| Espace vide | **Tout cadrer** (Frame All), **Cadrer la sélection** (Frame Selection), **Afficher les scènes omises** (Show Omitted Scenes), **Afficher les bulles de commentaire** (Show Comment Bubbles), **Réduire tous les groupes** (Collapse All Groups), **Développer tous les groupes** (Expand All Groups), **Nouveau groupe** (New Group) |\n| Fil | **Aller à la scène cible** (Go To Target Scene), **Afficher la ligne de choix dans le scénario** (Show Choice Line in Screenplay) |\n\n### Groupes\n\nRegroupez des scènes pour garder une grande histoire lisible.\n\n| Commande | Description |\n|---|---|\n| **Nouveau groupe à partir de la sélection** (New Group From Selection) | Regroupe les boîtes sélectionnées. |\n| **Ajouter au groupe** (Add To Group), **Retirer du groupe** (Remove From Group) | Modifient les membres d'un groupe. |\n| **Renommer**, **Modifier le commentaire** (Edit Comment) | Étiquettent le groupe. |\n| **Développer** (Expand) / **Réduire** (Collapse) | Affichent ou masquent les membres. |\n| **Entrer dans le groupe** (Drill In) | Ouvre le groupe en taille réelle. Un fil d'Ariane permet de revenir. |\n| **Dissocier** (Ungroup) | Supprime le groupe, conserve les scènes. |\n\nUn groupe de groupes est un acte. Un seul niveau. Les groupes sont enregistrés avec le scénario.\n\n## Limitations connues\n\n- Il n'y a ni surveillance de fichier en direct ni lien Inkpot : le réimport est proposé quand vous recliquez, et la réécriture a lieu à l'enregistrement.\n- Les noms de clés articy pour le locuteur et le texte n'ont pas été vérifiés sur toutes les versions d'export.\n\n## Voir aussi\n\n- [Le Planner](07_planner.md)\n- [Séquences et liaisons](06_sequences.md)\n- [Import, export et partage](09_import-export.md)\n- [Plug-ins compagnons](12_integrations.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n"}, {"file": "09_import-export.md", "slug": "import-export", "title": "Import, export et partage", "md": "# Import, export et partage\n\nLa page **Share** (Partager) du mode Framemark fait entrer et sortir votre travail d'Unreal. Vous enregistrez un plateau entier dans un fichier, vous importez une liste de plans, un scénario ou une scène Shot Designer, vous exportez une feuille de plan, et vous envoyez un plateau vers Maya, Houdini ou Blender en USD ou en FBX. Quand l'autre outil modifie le fichier, vous le réimportez et vous relisez les changements avant qu'ils soient appliqués.\n\n## Prérequis\n\n- Le plug-in Framemark est activé.\n- Pour l'USD : le plug-in facultatif **Framemark USD Bridge** (catégorie **Cinematics**, désactivé par défaut, nécessite USDCore). Activez-le dans **Edit > Plugins** et redémarrez l'éditeur.\n- Pour le FBX : rien de plus.\n\n## La page Share\n\n![La page Share du panneau Framemark](media/ui_page_share.png)\n\n| Bouton | Description |\n|---|---|\n| **Exporter le plateau** (Export Stage) | « Enregistre tout le plateau dans un fichier : marques, notes, configurations, limite, caméras et lumières. » |\n| **Importer** (Import) | « Importe un fichier Framemark, une liste des plans ou un scénario. » |\n| **Exporter le plan** (Export Plan) | Enregistre un plan vu de dessus sous forme d'image, de dessin vectoriel ou de document. Voir [Le Planner](07_planner.md#export-plan). |\n| **Exporter en USD** (Export USD) | Écrit le plateau en USD. Nécessite le Framemark USD Bridge. |\n| **Exporter en FBX** (Export FBX) | Écrit le plateau en FBX. |\n\n## Export Stage et import d'un fichier Framemark\n\n1. Sélectionnez le plateau.\n2. Sur la page **Share**, cliquez sur **Exporter le plateau**.\n3. Choisissez un nom. Le fichier est enregistré sous la forme `<label>.framemark.json` (filtre « Framemark (*.framemark.json) »).\n4. Vous voyez « Exported '{0}'. ».\n\nPour le rapatrier, utilisez **Importer** et choisissez la tuile **Fichier Framemark** (Framemark File). Il revient sous la forme d'un nouveau plateau. Un fichier enregistré par une version plus récente donne « That file was saved by a newer version of Framemark. » (Ce fichier a été enregistré par une version plus récente de Framemark.)\n\nQuand un plateau est importé, une invite demande « Where should '{0}' go? » (Où placer « {0} » ?) avec **Emplacement d'origine** (Original Location), **Dans le hublot** (At Viewport) ou **Annuler** (Cancel). Les références d'acteurs se reconnectent par correspondance exacte du label : « {0} actor reference(s) reconnected. »\n\n## Le panneau Import\n\nCliquez sur **Importer** pour ouvrir le panneau Import. Choisissez une tuile dans **Source**.\n\n| Tuile | Sous-titre | Remarques |\n|---|---|---|\n| **Fichier Framemark** | `.framemark.json` | « Un plateau enregistré avec Exporter le plateau. Il revient sous forme de nouveau plateau. » |\n| **Liste des plans** (Shot List) | CSV, StudioBinder | Voir [Listes de plans](#shot-lists). |\n| **Scénario** (Screenplay) | Fountain, Final Draft, texte, ink, articy | Voir [Scénario et Story Map](08_screenplay-and-story-map.md). |\n| **Shot Designer** | Scène `.hcw` ou export CSV | Voir [Shot Designer](#shot-designer). |\n| **USD** | Houdini, Maya, pipeline | Nécessite le Framemark USD Bridge. |\n| **FBX** | Maya, Blender, MotionBuilder | |\n\nLe panneau comporte ces zones : **Source**, **Fichier** (File, **Parcourir**, ou « Paste a path or press Browse », collez un chemin ou appuyez sur Browse), **Association des colonnes** (Column Mapping), **Association** (Mapping), **Options du scénario** (Screenplay Options), **Aperçu** (Preview), et les boutons **Importer** et **Annuler**. Seules les zones qui conviennent à la source choisie sont affichées.\n\nChaque import est une étape d'annulation.\n\n## Listes de plans\n\nUne liste de plans au format CSV devient des caméras sur un plateau.\n\n1. Sur la page **Share**, cliquez sur **Importer** et choisissez **Liste des plans**.\n2. Cliquez sur **Parcourir** (Browse) et choisissez le CSV.\n3. Utilisez le sélecteur **Plateau** (Stage) pour choisir où vont les caméras.\n4. Dans **Association des colonnes**, associez chaque colonne à un champ (ou acceptez la détection automatique).\n5. Vérifiez la **Aperçu**.\n6. Cliquez sur **Importer**.\n\nL'analyseur accepte les séparateurs virgule, point-virgule ou tabulation, les guillemets et une marque d'ordre des octets. Il lit jusqu'à 50000 lignes.\n\n### Champs de correspondance\n\n| Champ | Description |\n|---|---|\n| **Numéro de plan** (Shot Number) | Correspond à une caméra existante ou en crée une nouvelle. |\n| **Réf. scénario / storyboard** (Script / Board Ref) | Référence de page ou de storyboard. |\n| **Scène** (Scene) | Nom de la scène. |\n| **Description** | Ce qui se passe dans le plan. |\n| **Taille de plan** (Shot Size) | Le terme de taille définit l'échelle du plan et l'objectif. |\n| **Angle de caméra** (Camera Angle) | Des termes comme High Angle définissent la hauteur et l'inclinaison de la caméra. |\n| **Mouvement de caméra** (Camera Move) | Le mouvement. |\n| **Audio** | Note audio. |\n| **Sujet** (Subject) | Le sujet. |\n| **Intérieur / Extérieur** (Interior / Exterior) | Type de lieu. |\n| **Focale** (Focal Length) | Remplace l'objectif. |\n| **Champ personnalisé** (Custom Field) | Une colonne libre. |\n| **Ignorer** (Skip) | Ignore la colonne. |\n\n**Auto-detect** associe la première colonne correspondante à chaque champ. Si aucune colonne n'est associée à **Numéro de plan**, vous voyez « No column is set to Shot Number, so rows are numbered 1, 2, 3 in order. » (Aucune colonne n'est associée à Shot Number, les lignes sont donc numérotées 1, 2, 3 dans l'ordre.)\n\n### Préréglages\n\nPréréglages intégrés : « StudioBinder » et « Shot Designer ». Créez les vôtres avec **Enregistrer sous** (Save As), **Enregistrer** (Save) et **Supprimer le préréglage** (Delete Preset). Les préréglages utilisateur sont propres à chaque utilisateur et fonctionnent dans tous les projets.\n\n### Aperçu et résultat\n\nUn numéro de plan correspondant met à jour sa caméra (SH0010 est le plan 1 avec un pas de 10). Un nouveau numéro ajoute une caméra. L'aperçu marque chaque ligne **Ajouter** (Add), **Mettre à jour** (Update), **Ignorer** ou **Aucun changement** (No Change), et résume : « {0} to add, {1} to update, {2} unchanged{3} ».\n\nUne fois terminé : « Imported the shot list: {0} cameras added, {1} updated. »\n\n## Shot Designer\n\nImportez une scène Shot Designer (`.hcw`) ou son export CSV.\n\n1. Choisissez la tuile **Shot Designer** et sélectionnez le fichier.\n2. Choisissez **Créer un nouveau plateau** (Create New Stage, activé par défaut) ou **Choisir un plateau** (Select Stage).\n3. Réglez **Échelle** (Scale), en cm par unité Shot Designer.\n4. Dans **Association**, définissez comment chaque objet Shot Designer devient une marque ou un accessoire.\n5. Choisissez **Configurations avec suivi** (Tracked Setups) ou **Configurations fixes** (Locked-Off Setups).\n6. Vérifiez l'aperçu (zoom, **Ajuster** (Fit)).\n7. Cliquez sur **Importer**.\n\n| Option | Description |\n|---|---|\n| Lignes **Association** | Chaque objet prend **Par défaut** (Default), **Choisir** (Pick One), **Nouveau : {0}** (New: {0}) ou **Aucun** (None). Noms de rôle : **Joueur** (Player), **PNJ** (NPC), **Compagnon** (Companion), **Figurant** (Extra), **Accessoire** (Prop), **Ennemi** (Enemy), **Transport**. |\n| **Configurations avec suivi** | Les caméras circulent sur le Camera Rig Rail depuis le début du rail. |\n| **Configurations fixes** | Les caméras restent fixes. |\n\nLes marques sont nommées `mrk_{subject}_010`. Une fois terminé : « Shot Designer scene imported: {0} marks, {1} props, {2} cameras, {3} moves, {4} pictures. »\n\nUn CSV Shot Designer passe par l'outil de correspondance des listes de plans, avec son propre préréglage.\n\n> **Remarque :** **Configurations avec suivi** place la caméra sur le rail mais ne crée pas d'images clés pour sa position le long du rail.\n\n## Export USD et FBX\n\nL'export envoie le plateau vers d'autres outils. Sélectionnez le plateau et cliquez sur **Exporter en USD** ou **Exporter en FBX**.\n\n### Où va le fichier\n\n| Réglage (Editor Preferences, Pipeline) | Description |\n|---|---|\n| **Export Folder** (`PipelineFolder`) | `<Project>/Pipeline` par défaut. |\n| **Export File Name** (`PipelineFileName`) | `{stage}` par défaut. Jetons : `{show}`, `{seq}`, `{stage}`. |\n| **When The File Exists** (`PipelineVersioning`) | **New Version** : `<name>_v001`, jusqu'à `_v999`. **Overwrite** : `<name>`, l'ancien fichier étant conservé en `.bak`. |\n| **Write Back On Save** (`bPipelineWriteBackOnSave`) | Activé par défaut. Enregistrer le plateau réécrit vos modifications. |\n\n### Ce qui est écrit\n\n| Export | Fichiers |\n|---|---|\n| USD | `<name>[_vNNN].usda` (ouvrez celui-ci), `<name>[_vNNN].framemark.usda` (réécrit à chaque export), `<name>_edits.usda` (sans suffixe de version ; Framemark ne l'écrit jamais) |\n| FBX | `<name>[_vNNN].fbx` |\n| Les deux | `<file>.framemark-sync.json`, le fichier de synchronisation |\n\nEn cas de succès, vous voyez « Exported {0}. Edit in {1}, Framemark never writes it. ». Placez vos modifications dans `_edits.usda`, pas dans les autres fichiers.\n\n> **Remarque :** Avec le réglage par défaut **New Version**, le fichier USD est `<name>_v001.usda`. Vous n'obtenez le simple `<name>.usda` qu'avec **Overwrite**.\n\n### Problèmes d'export\n\n| Message | Solution |\n|---|---|\n| « {0} is checked out by {1}. » | Demandez à cette personne de l'archiver (check in). |\n| « {0} is out of date. Get the latest first. » | Synchronisez depuis le contrôle de version. |\n| « {0} is read-only. » | Rendez-le modifiable ou faites un check out. |\n| « {0} changed outside Unreal since the last sync, so it was not written. Re-import it first. » | Réimportez, puis exportez à nouveau. |\n\n## Réimporter depuis un fichier\n\nQuand le fichier exporté change en dehors d'Unreal, recliquez dans Framemark. L'invite **Fichier du pipeline modifié** (Pipeline File Changed) indique « Re-import it? You see the changes before anything is applied. » (Le réimporter ? Vous voyez les changements avant que quoi que ce soit soit appliqué.) Elle utilise le même réglage **Fichier source modifié** (Source File Changed) que le Screenplay, avec **Réimporter** (Re-import), **Ignorer** (Ignore) et « Don't ask again ».\n\nLa fenêtre **Réimporter depuis le fichier** (Re-import From File) liste chaque changement.\n\n1. Lisez chaque ligne. Le type est **Modifié** (Changed), **Conflit** (Conflict), **Ajouté** (Added) ou **Supprimé** (Removed).\n2. Décochez toute ligne que vous ne voulez pas (« Apply this change », appliquer ce changement).\n3. Pour un **Conflit**, choisissez **Prendre le fichier** (Take File, « Use the file's change and replace what is in Unreal. », utiliser le changement du fichier et remplacer ce qui est dans Unreal) ou **Garder Unreal** (Keep Unreal). La ligne affiche « In the file: » et « In Unreal: ».\n4. Cliquez sur **Appliquer** (Apply, « Apply the ticked changes to the stage. », appliquer au plateau les changements cochés) ou **Annuler**.\n\nLe résultat s'affiche ainsi : « {0}: {1} changes applied to {2}. »\n\nPour savoir ce qu'un outil DCC doit ou ne doit pas modifier dans l'USD, consultez `PIPELINE.md` dans le dossier du plug-in.\n\n## Exemples\n\nLe plug-in installe des fichiers d'exemple sous `Plugins/Framemark/Docs/Samples/` (dans le dépôt source : `Samples/`) :\n\n- `Doorway_Standoff.usda`\n- `Doorway_Standoff.framemark.usda`\n- `Doorway_Standoff_edits.usda`\n- `Doorway_Standoff.fbx`\n\nOuvrez `Doorway_Standoff.usda` dans Maya, Houdini ou Blender pour voir la disposition.\n\n## Limitations connues\n\n- Les allers-retours avec Maya et Houdini n'ont pas été vérifiés de bout en bout.\n- Une seule scène Shot Designer a été testée.\n\n## Voir aussi\n\n- [Le Planner](07_planner.md)\n- [Scénario et Story Map](08_screenplay-and-story-map.md)\n- [Rendu et publication](10_render-and-publish.md)\n- [Plug-ins compagnons](12_integrations.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "10_render-and-publish.md", "slug": "render-and-publish", "title": "Rendu et publication", "md": "# Rendu et publication\n\nFramemark fournit un script qui construit six modèles **Movie Render Graph** pour les sorties courantes d'un plan de prévisualisation : rushes, images fixes, master final, master path tracé, remise VFX et fichier de diffusion britannique. Un second script, le hook de rendu, s'exécute à la fin d'un rendu, écrit un manifeste de ce qui a été produit et peut envoyer la vidéo vers une plateforme de revue.\n\n## Prérequis\n\n- Movie Render Graph et le Python Editor Script Plugin sont activés.\n- Une séquence de niveau à rendre (voir [Séquences et liaisons](06_sequences.md)).\n- Pour les envois : un Python 3 avec la bibliothèque cliente de votre plateforme de revue (voir [Outil d'envoi pour revue](#review-uploader)).\n\n## Modèles de rendu\n\nLe script `Samples/Render/framemark_render_templates.py` construit les graphes.\n\n1. Choisissez **Tools > Execute Python Script** (Outils > Exécuter un script Python).\n2. Sélectionnez `framemark_render_templates.py`.\n3. Ouvrez le navigateur de contenu dans `/Game/Cinematics/Render/Templates`.\n\nLe script supprime et reconstruit uniquement les graphes dont le nom commence par `CS_`. Vos propres graphes ne sont pas touchés. À la fin, le journal indique « RESULT n of 6 templates evaluate ».\n\nLes six graphes partagent ces paramètres de sortie :\n\n- Dossier de sortie : `{project_dir}/Saved/MovieRenders/{sequence_name}/{date}`\n- **Overwrite existing output** (Écraser la sortie existante) : désactivé\n- Numéros d'image complétés sur 4 chiffres\n\n### Les six modèles\n\n| Modèle | Taille et cadence | Sortie | Qualité |\n|---|---|---|---|\n| **CS_Dailies** | 1080p (FHD), 24 fps | MP4 avec audio, incrustation activée sur l'encodeur | Échantillons temporels : 1 |\n| **CS_Stills** | FHD | Séquence PNG | Échantillons spatiaux : 8, anticrénelage : aucun, préchauffage : 32 |\n| **CS_Final_Master** | 4K UHD | ProRes 4444 XQ (vidéo sans audio) plus un nœud Audio Output (WAV) | Échantillons temporels : 16, préchauffage : 120, flou de mouvement émulé, anticrénelage : aucun, CVars finales |\n| **CS_Final_PathTraced** | 4K | EXR (ZIP) plus WAV | Path Tracer avec débruiteur et flou de mouvement de référence, échantillons temporels : 64, préchauffage : 120 |\n| **CS_VFX_Turnover** | 4K | EXR multicouche (ZIP), plus une référence ProRes 422 HQ avec audio | Échantillons temporels : 16, courbe de tonalité désactivée |\n| **CS_UK_Broadcast** | FHD, 25 fps | ProRes 422 HQ avec audio, plus WAV | Échantillons temporels : 16, préchauffage : 120 |\n\n### CVars finales\n\nLes graphes de qualité finale définissent :\n\n- `r.MotionBlurQuality 4`\n- `r.MotionBlurSeparable 1`\n- `r.DepthOfFieldQuality 4`\n- `r.BloomQuality 5`\n- `r.Tonemapper.Quality 5`\n\nIls définissent aussi les Global Game Overrides : désactiver les LOD, désactiver le streaming de textures et vider le streaming de l'herbe.\n\n### Utiliser un modèle\n\n1. Ouvrez **Window > Cinematics > Movie Render Queue**.\n2. Cliquez sur **Render (Local)** ou **Render (Remote)** sur une nouvelle tâche et choisissez la séquence de niveau.\n3. Choisissez le graphe dans `/Game/Cinematics/Render/Templates`.\n4. Cliquez sur **Render**.\n\nPour changer la résolution ou la fréquence d'images, dupliquez un modèle et modifiez la copie. Les modèles ne les exposent pas comme variables de graphe.\n\n> **Remarque :** **CS_UK_Broadcast** vous donne les formats d'image et de son. La livraison pour la diffusion britannique exige aussi une sonie de -23 LUFS, un conteneur MXF, un timecode démarrant à 10:00:00:00 et une mire, ce qu'Unreal ne produit pas. Faites-le dans votre outil de finition.\n\n> **Remarque :** Aucun modèle ne porte le nom d'un studio. Aucun des studios vérifiés ne publie de spécification de remise.\n\n## Hook de rendu\n\nLe hook de rendu publie un manifeste à la fin d'un rendu.\n\n1. Ouvrez **Edit > Project Settings > Plugins > Python**.\n2. Ajoutez `framemark_render_hooks.py` à **Startup Scripts** (Scripts de démarrage).\n3. Redémarrez Unreal.\n4. Ouvrez votre Movie Render Graph.\n5. Ajoutez un nœud **Execute Script**.\n6. Réglez **Editor-Only Script** sur `FramemarkPublish`.\n\n`FramemarkPublish` est une sous-classe de `MovieGraphScriptBase`. Sa méthode `on_job_finished` écrit `framemark_publish_<YYYYMMDD_HHMMSS>.json` à côté du premier fichier de sortie. Le manifeste enregistre la tâche, la séquence, le graphe, la réussite, l'heure de création et les calques.\n\nUn rendu échoué n'est pas publié. Un échec dans le hook ne fait jamais échouer le rendu.\n\n### Envoi après le rendu\n\nSi `~/.framemark/publish.json` existe, le hook lance un processus Python détaché qui exécute l'outil d'envoi. Il utilise la clé `python` de ce fichier, sinon le Python 3 fourni avec le moteur. Le journal est écrit dans `<manifest>.log`.\n\n## Outil d'envoi pour revue\n\n`framemark_publish.py` envoie la vidéo rendue vers des plateformes de revue.\n\n```\npython framemark_publish.py <manifest.json> [--dry-run]\npython framemark_publish.py --self-test\n```\n\n- `--dry-run` consigne ce qui serait envoyé sans rien envoyer.\n- `--self-test` vérifie le script sans aucun accès réseau.\n- Seuls les fichiers `.mov` et `.mp4` sont envoyés.\n- Chaque envoi a 3 tentatives, avec des attentes de 5 et 10 secondes. L'échec d'une plateforme n'arrête pas les autres.\n- Le journal marque chaque étape **OK**, **RETRY**, **FAILED** ou **WOULD** et se termine par « RESULT n published, m failed ».\n- Toute valeur de configuration peut être `\"env:NAME\"` pour lire une variable d'environnement.\n\n### Cibles de publish.json\n\n| Cible | Clés | Nécessite |\n|---|---|---|\n| `frameio` | `account_id`, `folder_id`, `token`, ou `client_id` et `client_secret` pour le serveur à serveur d'Adobe | |\n| `syncsketch` | `user`, `api_key`, `review_id`, `host` facultatif | |\n| `shotgrid` | `site`, `script_name`, `api_key`, `project_id`, `entity_type`, `entity_id` | `shotgun_api3` |\n| `ftrack` | `server`, `api_user`, `api_key`, `task_id`, `asset_type` | `ftrack-python-api` |\n| `kitsu` | `host`, `email`, `password`, `task_id`, `task_status_id` | `gazu` |\n\nFrame.io accepte un `token` hérité ou la paire serveur à serveur d'Adobe.\n\n> **Avertissement :** Seul Kitsu a été testé avec un envoi réel (8 novembre). Frame.io, SyncSketch, ShotGrid et ftrack n'ont été vérifiés qu'en simulation et avec l'auto-test.\n\n## Limitations connues\n\n- Les étapes Wwise audio et ffmpeg (muxage, sonie, MXF, timecode) ne sont pas construites.\n- Deadline ne fait pas partie de Framemark : utilisez l'outil de soumission AWS Deadline Cloud pour Unreal.\n- L'incrustation de **CS_Dailies** est réglée sur l'encodeur uniquement. Le script n'ajoute pas de nœud Burn-In, donc vérifiez la sortie avant de vous y fier.\n\n## Voir aussi\n\n- [Séquences et liaisons](06_sequences.md)\n- [Import, export et partage](09_import-export.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "11_settings-reference.md", "slug": "settings-reference", "title": "Référence des paramètres et de la nomenclature", "md": "# Référence des paramètres et de la nomenclature\n\nFramemark conserve ses options à l'échelle du projet dans **Editor Preferences** (Préférences de l'éditeur), ses valeurs par défaut par projet dans une ressource de données **Profile** et les valeurs par défaut de la boîte de dialogue Generate dans un objet de paramètres Generate. Cette page liste chaque propriété, sa valeur par défaut et son rôle. Utilisez-la quand vous devez changer la façon dont Framemark nomme les choses, l'endroit où il les enregistre ou son comportement pendant que vous travaillez.\n\n## Où se trouvent les paramètres\n\n| Où | Chemin de menu | Stocké dans |\n|---|---|---|\n| General, Naming, Lights, Cameras, Sequence, Generate | **Edit > Editor Preferences > Framemark** | Vos paramètres utilisateur par projet (`EditorPerProjectUserSettings`), donc ils ne sont pas partagés par le contrôle de source |\n| Marks | **Edit > Editor Preferences > Plugins > Framemark Marks** | Les mêmes paramètres utilisateur par projet |\n| Profile | Une ressource de données **Framemark Profile** dans le navigateur de contenu | La ressource elle-même, donc vous pouvez la partager |\n\n> **Remarque :** La page Marks se trouve sous **Plugins**, pas sous **Framemark**. Les six autres pages partagent une même section.\n\n> **Astuce :** Utilisez la zone de recherche en haut d'Editor Preferences. Tapez le nom d'une propriété des tableaux ci-dessous pour y accéder directement.\n\n## Prérequis\n\n- Le plug-in Framemark est activé (**Edit > Plugins**) et l'éditeur a été redémarré.\n- Pour le Profile, une ressource de type **Framemark Profile** existe. Créez-en une avec **Add > Miscellaneous > Data Asset** dans le navigateur de contenu et choisissez **Framemark Profile**, puis assignez-la dans **Active Profile** (voir plus bas).\n\n---\n\n## Page General\n\nLa page General contient les options de comportement. Chaque titre ci-dessous est une catégorie de la page.\n\n### Viewport\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Show Labels** (Afficher les libellés) | On | Dessine le nom de chaque marque, caméra et lumière dans le hublot du niveau. |\n| **Label Draw Distance** (Distance d'affichage des libellés) | 6000 cm | Distance maximale à la caméra du hublot à laquelle les libellés sont encore dessinés. Minimum 500. Modifiable uniquement si **Show Labels** est activé. |\n\n### Scene Boundary\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Warn When Editing Inside Boundary** (Avertir lors d'une modification dans la limite) | On | Affiche une notification d'avertissement quand vous modifiez un élément situé à l'intérieur de la limite d'un plateau. |\n| **Auto Fit Boundary** (Ajuster automatiquement la limite) | On | Redimensionne la limite pour englober le contenu du plateau quand vous l'ajoutez ou le déplacez. |\n\n### Placement\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Add Default Marks On Place** (Ajouter les marques par défaut au placement) | On | Un plateau nouvellement placé démarre avec ses marques par défaut. |\n| **Snap To Ground On Place** (Aimanter au sol au placement) | On | Pose un élément placé sur le sol situé en dessous. |\n| **Stage Anchor Location** (Point d'ancrage du plateau) | Centre | Quel point d'un nouveau plateau se place à l'endroit où vous cliquez. Options : **Centre**, **Front Centre**, **Back Centre**, **Front Left**, **Front Right**. |\n\n### Sequence\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Auto Sync Marks To Sequence** (Synchroniser automatiquement les marques avec la séquence) | On | Garde la séquence de niveau d'un plateau à jour quand ses marques changent. |\n| **Key To Mark Interpolation** (Interpolation de Key To Mark) | Stepped | L'interpolation des images clés créées par Key To Mark. Options : **Stepped**, **Linear**, **Cubic**. |\n| **Key Sequence Start On First Key** (Démarrer la séquence à la première image clé) | On | Fait démarrer la plage de lecture de la séquence à la première image clé que vous créez. |\n| **Key When Assigning Sequenced Actor** (Placer une image clé à l'assignation d'un acteur séquencé) | On | Place une image clé sur un acteur vers sa marque dès que vous l'assignez. |\n| **Keys Follow Marks** (Les images clés suivent les marques) | On | Déplace les images clés quand vous déplacez la marque pour laquelle elles ont été créées. |\n| **Keys Out Of Date On Open** (Images clés périmées à l'ouverture) | Ask | Ce qui se passe à l'ouverture d'un plateau dont les images clés ne correspondent plus à ses marques. Options : **Ask**, **Update**, **Leave**. Modifiable uniquement si **Keys Follow Marks** est activé. |\n\n### Marks\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Drop To Mark Assigns** (Déposer sur une marque assigne) | On | Déposer un acteur sur une marque l'assigne à cette marque. |\n| **Drop To Mark Radius** (Rayon de dépôt sur une marque) | 60 cm | Distance maximale entre un acteur déposé et une marque pour que le dépôt compte. Minimum 10, curseur jusqu'à 200. |\n\n### Moves\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Walk Speed** (Vitesse de marche) | 140 cm/s | Vitesse utilisée pour un déplacement à la marche entre des marques. Minimum 10. |\n| **Run Speed** (Vitesse de course) | 400 cm/s | Vitesse utilisée pour un déplacement à la course entre des marques. Minimum 10. |\n\n### Screenplay\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Source File Changed** (Fichier source modifié) | Ask | Ce que fait Framemark quand un fichier Screenplay importé change sur le disque. Options : **Ask**, **Re-import**, **Ignore**. |\n\n### Pipeline\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Export Folder** (Dossier d'export) | Vide | Où vont les exports USD et FBX. Vide utilise le dossier `Pipeline` du projet. |\n| **Export File Name** (Nom du fichier d'export) | `{stage}` | Le modèle de nom de fichier. Jetons : `{show}`, `{seq}`, `{stage}`. |\n| **When The File Exists** (Quand le fichier existe) | New Version | **New Version** écrit le numéro de version suivant. **Overwrite** remplace le fichier et conserve l'ancien en `.bak`. |\n| **Write Back On Save** (Réécrire à l'enregistrement) | On | Enregistrer un plateau réécrit sa couche USD ou son FBX lié. Il refuse si le fichier a changé en dehors d'Unreal ou s'il est verrouillé dans le contrôle de source. |\n\n### Planner\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Planner Grid Size** (Taille de la grille du Planner) | 50 cm | Espacement de la grille sur lequel le Planner s'accroche. Minimum 5, curseur jusqu'à 500. |\n\n### Profile\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Active Profile** (Profil actif) | Vide | La ressource Framemark Profile à utiliser. Vide signifie les valeurs par défaut intégrées. |\n| **Default Project Type** (Type de projet par défaut) | Third Person Game | Le type de projet utilisé quand aucun profil n'est défini. Options : **Third Person Game**, **First Person Game**, **Offline CG**, **Branching Dialogue**. |\n\n### Overhead\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Plan Layer Colours** (Couleurs des calques du plan) | Huit lignes intégrées | Une liste de paires nom de calque et couleur pour le panneau Layers. Les valeurs par défaut figurent ci-dessous. |\n\n| Calque | Couleur par défaut |\n|---|---|\n| Background | `#8a8a8a` |\n| Boundary | `#f5c518` |\n| Set | `#a08a6a` |\n| Images | `#d09a5a` |\n| Marks | `#e05064` |\n| Cameras | `#6ec1ff` |\n| Lights | `#ffd36b` |\n| Sketch | `#b48cf0` |\n\n---\n\n## Page Naming\n\nFramemark construit chaque nom à partir d'un **modèle** (pattern) : du texte contenant des `{tokens}`. Choisissez un **Preset** pour commencer, puis ajustez chaque règle.\n\n### Naming\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Preset** (Préréglage) | Custom | Charge un jeu complet de règles. Voir [Préréglages](#presets). Modifier une règle la fait repasser en **Custom**. |\n| **Master Scope** (Portée du master) | Project | Ce que couvre une séquence master. Options : **Project**, **Level**, **Sequence**. |\n| **Shot Sub Sequence Pattern** (Modèle de sous-séquence de plan) | `{type}_{shot}-01` | Nom d'une sous-séquence créée pour un plan. |\n| **Sequence Sub Sequence Pattern** (Modèle de sous-séquence de séquence) | `{type}_{seq}-01` | Nom d'une sous-séquence créée pour une séquence. |\n\n### Rules\n\nIl y a 11 règles. Chacune a les mêmes six champs.\n\n| Champ | Description |\n|---|---|\n| **Pattern** (Modèle) | Le modèle de nom. |\n| **Separator** (Séparateur) | Relie les parties. **As Written**, **Underscore**, **Hyphen**, **Dot**, **None**. |\n| **Case** (Casse) | **As Typed**, **Lower**, **Upper**. |\n| **Padding** (Remplissage) | Nombre de chiffres d'un compteur. 0 à 8. |\n| **Step** (Pas) | De combien le compteur augmente à chaque fois. Minimum 1. |\n| **Preview** (Aperçu) | Lecture seule. Montre un exemple de nom à partir du modèle actuel. |\n\nValeurs par défaut du préréglage **Framemark** :\n\n| Règle | Modèle | Remplissage | Pas | Casse |\n|---|---|---|---|---|\n| Stage | `STG_{location}_{variant}_v{v}` | 0 | 1 | As typed |\n| Mark | `mrk_{subject}_{n}` | 3 | 10 | Lower |\n| Camera | `{seq}_{shot}_{subject}_{type}` | 4 | 10 | As typed |\n| Light | `lgt_{type}_{subject}_{role}_{n}` | 2 | 1 | Lower |\n| Prop | `prp_{name}_{n}` | 2 | 1 | Lower |\n| Level Sequence | `LS_{seq}` | 0 | 10 | As typed |\n| Shot | `LS_{seq}_{shot}_v{v}` | 4 | 10 | As typed |\n| Master (Project) | `LS_{project}_Master` | 0 | 1 | As typed |\n| Master (Level) | `LS_{level}_Master` | 0 | 1 | As typed |\n| Master (Sequence) | `LS_{seq}_Master` | 0 | 1 | As typed |\n| Other Stage Element | `{type}_{desc}_{n}` | 2 | 1 | Lower |\n\n### Tokens\n\n| Jeton | Signification |\n|---|---|\n| `{show}` `{ep}` `{seq}` | Codes de série, d'épisode et de séquence de la catégorie **Codes** |\n| `{shot}` | Numéro de plan |\n| `{mark}` | Numéro de Mark Order |\n| `{role}` | Le rôle d'une marque ou d'une lumière, par exemple Key |\n| `{from}` `{at}` | Source et cible d'un déplacement |\n| `{scale}` | Échelle de plan, par exemple MS |\n| `{type}` | Type d'élément, par exemple camera ou spot |\n| `{lens}` | Longueur focale |\n| `{v}` | Numéro de version |\n| `{stage}` | Nom du plateau |\n| `{n}` | Compteur courant, rempli et incrémenté selon la règle |\n| `{name}` | Le nom propre de l'élément |\n| `{subject}` | L'acteur ou le personnage placé sur l'élément. Toujours en minuscules. |\n| `{desc}` | Une courte description |\n| `{location}` `{variant}` | Lieu et variante d'un plateau |\n| `{project}` `{level}` | Noms du projet et du niveau |\n| `{cine_dir}` | Le dossier Cinematics |\n\n- **Largeur :** ajoutez deux-points et un nombre pour compléter un jeton, par exemple `{shot:4}`.\n- **Jetons vides :** un jeton sans valeur est supprimé, ainsi que le séparateur qui le précède.\n- **Caractères autorisés :** un nom terminé ne conserve que `a-z A-Z 0-9 . _ -`. Tout le reste devient `_`.\n\n### Presets\n\n| Préréglage | Style |\n|---|---|\n| **Custom** | Vos propres modifications. |\n| **Framemark** | Les valeurs par défaut ci-dessus. |\n| **Unreal (linear content)** | Le style d'Epic pour le contenu linéaire : `Stage_{n}`, `Mark_{name}_{n}`, `{seq}_SH{n}`, `Light_{n}`, `Prop_{name}_{n}`, `LS_{stage}_{seq:3}_{shot:4}`. Remplissage 4, pas 10. |\n| **VFX (SEQ_SHOT_task_v001)** | Minuscules. Level Sequence `{seq:3}_{shot:4}_{stage}_previs_v{v}`, plan `{seq}_sh{shot}_previs_v{v}`, masters `{project}_master_v{v}`. |\n| **Netflix plate** | Style `SHOW_EP_SEQ_SHOT` : caméra `{show}_{ep}_{seq}_{n}`, plan `{show}_{ep}_{seq}_{shot}`, Level Sequence `{show}_{ep}_{seq}_{stage}_v{v}`. Casse telle que saisie. |\n| **Blender Studio** | Minuscules. Traits d'union entre les éléments, tirets bas à l'intérieur : `set-{stage}`, `{seq}-sh{n}`, `{seq:3}_{shot:4}-{stage}-previs-v{v}`. |\n\n### Schema Buttons\n\n| Bouton | Ce qu'il fait |\n|---|---|\n| **Export Schema** (Exporter le schéma) | Enregistre toute la configuration de nomenclature, dossiers compris, dans un fichier `.framemarknaming`. |\n| **Import Schema** (Importer le schéma) | Charge un fichier `.framemarknaming`. |\n| **Reset To Defaults** (Rétablir les valeurs par défaut) | Restaure le préréglage Framemark et les dossiers par défaut. |\n\n> **Astuce :** Partagez un fichier `.framemarknaming` avec votre équipe pour que tout le monde nomme les choses de la même façon.\n\n### Folders\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Cinematics Folder** (Dossier Cinematics) | `/Game/Cinematics` | Le dossier racine. Disponible sous la forme `{cine_dir}`. |\n\nChaque type de dossier a un modèle. Jetons de dossier : `{cine_dir}`, `{project}`, `{level}`, `{seq}`, `{shot}`, `{stage}`, `{location}`, `{variant}`.\n\n| Dossier | Modèle par défaut |\n|---|---|\n| Master | `{cine_dir}/{project}/Master` |\n| Scripts | `{cine_dir}/{project}/Scripts` |\n| Stages | `{cine_dir}/{project}/Stages/{stage}` |\n| Sequences | `{cine_dir}/{project}/Sequences/{seq}` |\n| Shots | `{cine_dir}/{project}/Sequences/{seq}/Shots/{seq}_{shot}` |\n| Edits | `{cine_dir}/{project}/Sequences/{seq}/Edits` |\n| Image Refs | `{cine_dir}/{project}/Refs` |\n| Sketches | `{cine_dir}/{project}/Sketches` |\n\n### Codes\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Show Code** (Code de la série) | Vide | Renseigne `{show}`. |\n| **Episode Code** (Code de l'épisode) | Vide | Renseigne `{ep}`. |\n| **Sequence Code** (Code de la séquence) | Vide | Renseigne `{seq}` quand rien d'autre ne le définit. |\n\n> **Remarque :** Les anciens modèles par défaut des versions précédentes sont mis à niveau vers les valeurs par défaut actuelles au chargement. Les modèles que vous avez modifiés ne sont pas touchés.\n\n---\n\n## Page Lights\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Presets** (Préréglages) | Trois préréglages intégrés | La liste des préréglages de lumière proposés par Place Light. |\n| **Default Preset** (Préréglage par défaut) | Spot Rim | Le préréglage utilisé quand aucun n'est choisi. |\n| **Reset To Built-In Presets** (Rétablir les préréglages intégrés) | Bouton | Restaure les trois préréglages ci-dessous. Vos propres préréglages sont supprimés. |\n\nChaque préréglage a ces champs. Les valeurs par défaut indiquées sont celles d'une nouvelle ligne.\n\n| Champ | Par défaut | Description |\n|---|---|---|\n| **Name** (Nom) | | Le libellé affiché dans l'outil. |\n| **Light Class** (Classe de lumière) | Vide | L'acteur lumière à créer. Vide utilise le projecteur propre à l'outil. |\n| **Intensity** (Intensité) | 50 | En candelas. |\n| **Colour** (Couleur) | White | Couleur de la lumière. |\n| **Attenuation Radius** (Rayon d'atténuation) | 1000 cm | Jusqu'où porte la lumière. |\n| **Outer Cone Angle** (Angle du cône extérieur) | 38 degrés | Projecteurs uniquement. |\n\nPréréglages intégrés :\n\n| Préréglage | Classe | Intensité | Couleur (R, V, B) | Rayon | Cône |\n|---|---|---|---|---|---|\n| Spot Rim | Projecteur de l'outil | 150 | 1, 0.9, 0.75 | 1500 | 38 |\n| Point Fill | Lumière ponctuelle | 20 | 0.7, 0.82, 1 | 1000 | s.o. |\n| Rect Key | Lumière rectangulaire | 25 | 1, 0.96, 0.9 | 800 | s.o. |\n\n---\n\n## Page Cameras\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **User Formats** (Formats utilisateur) | Liste vide | Vos propres formats de film, ajoutés à la liste intégrée. |\n| **User Lenses** (Objectifs utilisateur) | Liste vide | Vos propres objectifs, ajoutés à la liste intégrée. |\n\nChamps d'un format utilisateur :\n\n| Champ | Par défaut | Description |\n|---|---|---|\n| **Format Name** (Nom du format) | | Le libellé affiché dans les menus. |\n| **Sensor Width** (Largeur du capteur) | 24.89 mm | Largeur de la fenêtre. |\n| **Sensor Height** (Hauteur du capteur) | 18.66 mm | Hauteur de la fenêtre. |\n| **Squeeze** (Désanamorphose) | 1 | Facteur de compression anamorphique, de 1 à 2. |\n| **Crop Aspect** (Format de recadrage) | 0 | Recadre la fenêtre à ce format d'image. 0 conserve toute la fenêtre. |\n\nChamps d'un objectif utilisateur :\n\n| Champ | Par défaut | Description |\n|---|---|---|\n| **Lens Name** (Nom de l'objectif) | | Le libellé affiché dans les menus. |\n| **Focal Length** (Longueur focale) | 35 mm | La longueur focale de l'objectif. |\n\n---\n\n## Page Sequence\n\nQuatre options définissent ce avec quoi démarre une nouvelle séquence de niveau. Chacune a une case à cocher et une valeur. La valeur ne s'applique que si sa case est cochée. Les quatre cases sont décochées par défaut, donc les valeurs par défaut d'Unreal s'appliquent.\n\n| Option | Valeur par défaut | Description |\n|---|---|---|\n| **Frame Rate** | 24 fps | Fréquence d'images d'affichage. |\n| **Clock Rate** (Fréquence d'horloge) | 24000 | Résolution des ticks. |\n| **Length** (Durée) | 10 s | Durée de lecture. Minimum 0.1, curseur jusqu'à 600. |\n| **Name** | `LS_{stage}` | Nom d'une nouvelle séquence. |\n\n---\n\n## Page Generate\n\nCe sont les valeurs par défaut des boîtes de dialogue **Generate** et **Build Sequence**.\n\n### Sequence\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Name** (Nom) | Vide | Nom de la séquence. |\n| **Suffix** (Suffixe) | Vide | Ajouté à la fin du nom. |\n| **Base Path** (Chemin de base) | Vide | Dossier de contenu pour le résultat. |\n| **Seq Code** (Code de séquence) | Vide | Code de séquence, comme dans `{seq}`. |\n| **Abbreviation** (Abréviation) | Vide | Forme courte utilisée dans les noms de plans. |\n| **Number Of Shots** (Nombre de plans) | 1 | Combien de plans créer. 0 à 100. |\n| **Sequence To Duplicate** (Séquence à dupliquer) | None | Copie cette séquence au lieu d'en créer une vierge. Non enregistré. |\n| **Sub Sequence Names** (Noms des sous-séquences) | Vide | Noms des sous-séquences à créer. |\n| **Instance Sub Sequences** (Instancier les sous-séquences) | Off | Réutilise les sous-séquences au lieu de les copier. |\n\n### Timeline\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Start Time** (Heure de début) | 0 s | Où démarre le premier plan. |\n| **Duration** (Durée) | 5 s | Durée de chaque plan. |\n\n### Shots\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Shot Directory** (Dossier des plans) | Vide | Dossier de contenu pour les ressources des plans. |\n| **Shot Prefix** (Préfixe des plans) | Vide | Ajouté à chaque nom de plan. |\n| **First Shot Number** (Numéro du premier plan) | 10 | Numéro du premier plan. |\n| **Shot Increment** (Incrément des plans) | 10 | Écart entre les numéros de plans. |\n| **Shot Digits** (Chiffres des plans) | 4 | Nombre de chiffres d'un numéro de plan. |\n| **Take (Version) Digits** (Chiffres des prises (versions)) | 3 | Nombre de chiffres d'un numéro de prise. |\n\n### Track Settings\n\nUne liste de pistes à ajouter, avec une case **Create** pour chacune. Toutes les cases sont décochées par défaut.\n\n| Liste | Entrées par défaut |\n|---|---|\n| **Per Shot** (Par plan) | ANM, FX, LGT, EDL |\n| **Per Sequence** (Par séquence) | FX, LGT |\n\n### Populate\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Characters** (Personnages) | On | Ajoute les personnages du plateau comme liaisons. |\n| **Props** (Accessoires) | On | Ajoute les accessoires du plateau comme liaisons. |\n\n### Screenplay\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Stages** (Plateaux) | One Per Location | Crée un plateau par lieu, ou **One Per Scene** (un par scène). |\n| **Seq Code Start** (Début des codes de séquence) | 10 | Premier code de séquence. |\n| **Seq Code Increment** (Incrément des codes de séquence) | 10 | Écart entre les codes de séquence. |\n| **Abbreviation From Slugline** (Abréviation depuis l'en-tête de scène) | On | Prend l'abréviation de la séquence dans l'en-tête de scène. |\n\n### Dialogs\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Don't Ask Again: Build Sequence** (Ne plus demander : Build Sequence) | On | Ignore la boîte de dialogue Build Sequence et utilise ces valeurs. Cliquez avec **Shift** sur **Build Sequence** pour l'ouvrir malgré tout. |\n| **Don't Ask Again: Generate From Screenplay** (Ne plus demander : Generate From Screenplay) | On | Ignore la boîte de dialogue Generate. |\n\nDeux indicateurs cachés, `bBuildSequenceDialogSeen` et `bGenerateDialogSeen`, enregistrent si vous avez déjà vu chaque boîte de dialogue une fois. Vous ne pouvez pas les modifier.\n\n---\n\n## Page Marks\n\nOuvrez **Edit > Editor Preferences > Plugins > Framemark Marks**.\n\n> **Remarque :** **Size**, **Opacity**, **Height Pin**, **Colour** et **Custom Mark** ne sont que des valeurs de départ pour le **Look > Marks** d'un nouveau plateau. Ensuite, chaque plateau a les siennes. **Pin Thickness**, **Handle Colour** et **Conform To Ground** s'appliquent partout.\n\n### Look\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Ring Radius** (Rayon de l'anneau) | 35 cm | Taille de l'anneau d'une marque. 15 à 80. |\n| **Pin Thickness** (Épaisseur de la tige) | 1.5 | Épaisseur de la ligne de la tige de hauteur. 0.5 à 6. |\n| **Handle Colour** (Couleur de la poignée) | Bleu (0, 112, 224) | Couleur de la poignée sélectionnée. |\n| **Mark Opacity** (Opacité des marques) | 1 | 0.1 à 1. |\n| **Height Pin** (Tige de hauteur) | Always | Quand la tige de hauteur s'affiche : **Always**, **Selected**, **Off**. |\n| **Colour** (Couleur) | By Role | **By Role** utilise les Role Colours. **One** utilise une seule couleur. |\n| **One Colour** (Couleur unique) | Orange (0.913, 0.479, 0.014) | La couleur utilisée quand **Colour** est sur **One**. |\n| **Conform To Ground** (Épouser le sol) | On | Courbe l'anneau d'une marque pour suivre un sol irrégulier. |\n| **Planner Mark Look** (Aspect des marques dans le Planner) | Ring | Comment les marques sont dessinées dans le Planner : **Ring**, **Shoulders**, **Custom**. |\n\n### Custom Look\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Custom Mark** (Marque personnalisée) | Vide | Un maillage ou un matériau à utiliser comme marque. |\n| **Preview Character** (Personnage d'aperçu) | Vide | Un personnage affiché debout sur les marques non assignées. |\n| **Show Preview Character When Unassigned** (Afficher le personnage d'aperçu quand non assignée) | On | Affiche le personnage d'aperçu sur les marques sans acteur. |\n\n### Role Colours\n\n| Rôle | Couleur (R, V, B) |\n|---|---|\n| Player | 1, 0.08, 0.06 |\n| Companion | 0.2, 0.75, 0.35 |\n| NPC | 1, 0.82, 0 |\n| Enemy | 1, 0.42, 0 |\n| Prop | 0.55, 0.3, 1 |\n| Transport | 1, 0.3, 0.65 |\n| Extra | 0.35, 0.37, 0.4 |\n\n---\n\n## Ressource Framemark Profile\n\nUn **Framemark Profile** est une ressource de données qui porte les valeurs par défaut d'un projet. Assignez-la dans **General > Profile > Active Profile**. Elle n'a pas de fichier `.ini`, donc elle voyage avec le projet.\n\n### Project\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Project Type** (Type de projet) | Third Person Game | **Third Person Game**, **First Person Game**, **Offline CG**, **Branching Dialogue**. Détermine quels outils conviennent au projet. |\n\n### Defaults\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **View Mode** (Mode de vue) | Framed | Comment les nouveaux plateaux affichent leur vue de caméra. |\n| **Layout** (Disposition) | I Frame | Disposition de départ des marques. |\n| **Film Format** (Format de film) | Film 35mm 4 Perf | Le format de film de départ. |\n| **Film Scale** (Échelle du film) | 1.0 | Échelle de la fenêtre de film. 0.25 à 5. |\n| **Height Off Floor** (Hauteur au-dessus du sol) | 85 cm | Hauteur de caméra par défaut. |\n| **Default Mark Count** (Nombre de marques par défaut) | 2 | Marques sur un nouveau plateau. |\n\n### Classes\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Camera Class** (Classe de caméra) | Vide | Classe d'acteur caméra à créer. |\n| **Light Class** | Vide | Classe d'acteur lumière à créer. |\n\n### Naming\n\n| Propriété | Par défaut | Description |\n|---|---|---|\n| **Show Code** | Vide | Le code de la série. |\n| **Sequence Name Template** (Modèle de nom de séquence) | `LS_{stage}` | Nom d'une nouvelle séquence. |\n| **Camera Name Template** (Modèle de nom de caméra) | `{seq}_SH{n}` | Nom d'une nouvelle caméra. |\n| **Shot Name Template** (Modèle de nom de plan) | `{seq}_SH{shot}` | Nom d'un plan. |\n| **Shot Number Step** (Pas des numéros de plans) | 10 | Écart entre les numéros de plans. |\n| **Version Padding** (Remplissage des versions) | 3 | Nombre de chiffres d'un numéro de version. |\n\n> **Remarque :** Un modèle laissé à sa valeur par défaut s'en remet à la page **Naming**. Un modèle que vous modifiez l'emporte sur elle.\n\n---\n\n## Voir aussi\n\n- [Présentation de Framemark](index.md)\n- [Interface du mode Framemark](02_interface.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Caméras et lumières](05_cameras-and-lights.md)\n- [Séquences et liaisons](06_sequences.md)\n- [Plug-ins compagnons](12_integrations.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "12_integrations.md", "slug": "integrations", "title": "Plug-ins compagnons", "md": "# Plug-ins compagnons\n\nFramemark fonctionne seul. Sept éléments facultatifs viennent s'y ajouter : quatre plug-ins compagnons qui font le pont avec d'autres plug-ins Unreal (CAT, Odyssey, StylisedLightRig, USD), un plug-in articy:draft, la prise en charge d'ink et une connexion Unreal MCP. Cette page indique ce que chacun apporte, comment l'activer et ce que Framemark grise en son absence.\n\n## Fonctionnement des ponts facultatifs\n\nChaque pont est un plug-in Unreal distinct qui dépend à la fois de Framemark et du plug-in auquel il se connecte. Quand le pont se charge, il s'enregistre auprès de Framemark. Quand il manque, la fonctionnalité correspondante est grisée, et son infobulle indique ce qu'il faut activer.\n\n| Compagnon | Nécessite | Apporte |\n|---|---|---|\n| **Framemark CAT Bridge** | Cinematic Assembly Tools | Liens de plateau dans les métadonnées Cine Assembly |\n| **Framemark Odyssey Bridge** | Odyssey | Croquis en calques avec un fond de plateau verrouillé |\n| **FramemarkSLR** | Light rig plugin | Anneau de lumière du Planner et type **Rig** de Place Light |\n| **Framemark USD Bridge** | USD Core d'Unreal | **Exporter en USD** (Export USD) et la tuile USD d'Import |\n| **Framemark Bridge** (articy) | articy:draft 4.2.2 ou ultérieur | **Apply Changes** et **Undo Last Apply** dans articy |\n\n## Prérequis\n\n- Framemark est installé et activé. Voir [Prise en main](01_getting-started.md).\n- Le plug-in du moteur auquel chaque pont se connecte est installé.\n\n> **Remarque :** Le script de compilation compile Framemark plus chaque pont. Si le plug-in du moteur d'un pont manque, il ignore ce pont et consigne la raison. Framemark lui-même se compile quand même.\n\n## Activer un pont\n\n1. Ouvrez **Edit > Plugins** (Édition > Plug-ins).\n2. Recherchez le nom du pont, par exemple **Framemark USD Bridge**.\n3. Cochez **Enabled** (Activé).\n4. Redémarrez l'éditeur quand il vous le demande.\n\n> **Astuce :** Si un pont ne figure pas dans la liste, il n'a pas été compilé. Voir [Dépannage](14_troubleshooting.md).\n\n---\n\n## Framemark CAT Bridge\n\nRelie un plateau à Cinematic Assembly Tools (CAT).\n\n**Nécessite :** Framemark et Cinematic Assembly Tools.\n\n- Le pont stocke le nom du plateau dans la clé de métadonnées Cine Assembly `FramemarkStage`.\n- La recherche des plateaux qu'un assemblage nomme (**FindStagesUsing**) lit cette clé.\n- La liaison écrit la clé, de sorte que l'assemblage et le plateau restent connectés.\n\n> **Remarque :** Sans le pont, ces deux appels ne font rien. Framemark n'affiche aucun bouton grisé pour CAT : le lien n'est tout simplement pas créé.\n\n---\n\n## Framemark Odyssey Bridge\n\nTransforme un croquis du Planner en document Odyssey en calques, avec un fond verrouillé du plan du plateau.\n\n**Nécessite :** Framemark et Odyssey.\n\n### Ce que vous obtenez\n\n- **Layers > Sketch > New Sketch** (Calques > Croquis > Nouveau croquis) ouvre le croquis dans Odyssey.\n- Le croquis a un fond verrouillé du plan du plateau, ce qui vous permet de dessiner sur la disposition réelle.\n- La texture de New Sketch se nomme `T_Sketch_<stage>` et est enregistrée dans le dossier Sketches du plateau.\n- **Actualiser le fond** (Refresh Underlay) redessine le fond après une modification du plateau.\n\n### Sans le pont\n\n- **Actualiser le fond** est grisé. Son infobulle indique : « Needs the Framemark Odyssey Bridge plugin (and Odyssey). Turn it on in Edit > Plugins, then restart. »\n- **Nouveau croquis** (New Sketch) ouvre à la place le croquis dans l'éditeur de textures d'Unreal.\n\n> **Remarque :** Le fond n'apparaît que tant que le croquis est ouvert. Il est masqué à chaque enregistrement, donc votre texture enregistrée ne contient que votre dessin.\n\n---\n\n## FramemarkSLR\n\nConnecte Framemark au plug-in de rig d'éclairage pour l'éclairage de personnages par shader.\n\n**Nécessite :** Framemark et le plug-in de rig d'éclairage.\n\n### Anneau de lumière du Planner\n\nChaque personnage éclairé reçoit un anneau dans le Planner.\n\n| Élément | Ce que c'est |\n|---|---|\n| **Key**, **Fill**, **Rim** | Des points autour de la tête du personnage |\n| **Broad**, **Short**, **Behind** | Des arcs qui montrent le style d'éclairage |\n\n| Pour faire ceci | Faites cela |\n|---|---|\n| Déplacer une lumière | Faites glisser son point autour de la tête. Il s'accroche aux angles de la caméra. |\n| Changer la hauteur d'une lumière | Faites glisser le point avec **Alt** |\n| Ajuster la luminosité par demi-diaphragmes | Faites défiler la molette de la souris sur le point |\n| Isoler une lumière | Cliquez sur son point avec **Alt** |\n| Copier un éclairage vers un autre personnage | Faites glisser la pastille du rig sur ce personnage |\n| Annuler un glissement | Appuyez sur **Esc** |\n\nLa barre d'outils reçoit des commandes rapides SLR tant que le pont est activé.\n\n### Type Rig de Place Light\n\n1. Choisissez l'outil **Placer une lumière** (Place Light, **L**).\n2. Sélectionnez le type **Rig**.\n3. Cliquez près d'une marque.\n\nLe rig se place sur la marque la plus proche et suit le personnage. Si vous changez la distribution de la marque, le rig reste avec le personnage.\n\n![Le même personnage sans rig (à gauche) et éclairé par un rig d'éclairage (à droite)](media/lt_rig_before_after.jpg)\n\n### Sans le pont\n\nLe type **Rig** est grisé. Son infobulle indique : « Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). Turn it on in Edit > Plugins, then restart. »\n\n---\n\n## Framemark USD Bridge\n\nÉcrit et lit des fichiers Universal Scene Description afin qu'un plateau puisse s'ouvrir dans Maya, Blender ou Houdini.\n\n**Nécessite :** Framemark et USD Core d'Unreal. Ce plug-in est désactivé par défaut. L'activer active USD Core pour vous.\n\n### Ce que vous obtenez\n\n- **Exporter en USD** sur la page **Share**.\n- La tuile **USD** dans **Importer** (Import).\n\n### Fichiers écrits\n\n| Fichier | Rôle |\n|---|---|\n| `<base>.usda` | Le fichier à ouvrir dans votre DCC. Écrit une seule fois. Il superpose en sous-couches la couche de modifications au-dessus de la couche Framemark. |\n| `<base>.framemark.usda` | La couche propre à Framemark. Réécrite à chaque export. |\n| `<name>_edits.usda` | La couche des artistes. Créée vide une seule fois et jamais réécrite. |\n\n### Contenu du plateau\n\n- Un prim `/<Stage>` avec des portées **Marques** (Marks), **Caméras** (Cameras) et **Lumières** (Lights), plus une **Limite** (Boundary) faite de BasisCurves.\n- Chaque prim porte des valeurs `framemark:id` et `framemark:<attribute>`. Conservez le `framemark:id` quand vous modifiez, sinon l'élément revient comme nouveau.\n- Les configurations sont un variant set nommé `setup`, avec une option **All**.\n- Les unités sont des centimètres, Z vers le haut.\n\n### Sans le pont\n\n**Exporter en USD** et la tuile USD d'Import sont grisés. L'infobulle indique : « Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. Turn it on in Edit > Plugins, then restart. »\n\n> **Astuce :** L'export FBX n'a pas besoin de ce pont.\n\n---\n\n## Plug-in articy:draft\n\nUn MacroPlugin C# pour articy:draft, nommé **Framemark Bridge**, version 1.0.0. Il applique dans votre projet articy la liste de modifications que Framemark écrit.\n\n**Nécessite :** articy:draft 4.2.2 ou ultérieur.\n\n> **Remarque :** L'import d'un export `.articyue` dans Framemark ne nécessite aucun plug-in. Vous n'avez besoin du plug-in articy que pour réappliquer les modifications.\n\n### Installation\n\n1. Trouvez `ArticyPlugin/Framemark.ArticyBridge_1.0.0.mdk` dans le dossier Framemark.\n2. Dans articy:draft, ouvrez le **Package Manager**.\n3. Installez le fichier `.mdk`.\n\nUn menu **Framemark** apparaît dans articy avec deux commandes.\n\n### Apply Changes\n\n1. Dans Framemark, modifiez le Screenplay importé et enregistrez. Framemark écrit `<export>.framemark-changes.json` à côté de l'export.\n2. Dans articy, choisissez **Framemark > Apply Changes** et sélectionnez ce fichier.\n3. articy vérifie d'abord chaque modification. Si un objet est verrouillé ou non réclamé, rien ne change.\n4. Sinon, il applique les modifications, les ajouts et les coupes.\n5. Le fichier est renommé `.applied.json`, et un enregistrement d'annulation `.framemark-changes.undo.json` est écrit.\n6. Un message indique « Applied: N edited, N added, N cut. »\n7. Exportez de nouveau pour Unreal dans articy et réimportez dans Framemark.\n\n### Undo Last Apply\n\n1. Dans articy, choisissez **Framemark > Undo Last Apply**.\n2. Il lit le fichier `.framemark-changes.undo.json`.\n3. Les répliques coupées reviennent avec de nouveaux identifiants.\n\n> **Avertissement :** L'annulation est refusée si les répliques ont été modifiées depuis l'Apply. **Ctrl+Z** dans articy n'annule pas un Apply.\n\n---\n\n## ink\n\nFramemark importe et réécrit les histoires `.ink` sans plug-in supplémentaire.\n\n### Import\n\n1. Choisissez **Import > Screenplay**.\n2. Sélectionnez un fichier `.ink`.\n3. Chaque nœud (knot) devient une scène.\n\n### Réenregistrer dans le fichier\n\nL'enregistrement réécrit dans le fichier `.ink` les répliques modifiées, ajoutées et coupées. Framemark conserve une copie `.bak`. Il ne touche ni à votre logique, ni aux balises, ni aux choix, ni aux diverts.\n\nIl refuse d'enregistrer quand :\n\n- le fichier a changé sur le disque depuis votre import,\n- le fichier est en lecture seule,\n- le fichier est verrouillé, ou périmé, dans le contrôle de source.\n\n> **Remarque :** Les fichiers `INCLUDE` ne sont pas lus. Une réplique collée (glued) reçoit une note dans Framemark.\n\n---\n\n## Unreal MCP\n\nLe serveur Unreal MCP permet à un client MCP, tel que Claude Code, de piloter l'éditeur. Il est facultatif.\n\n### Comment il démarre\n\n`Config/DefaultEditorPerProjectUserSettings.ini` démarre le serveur MCP avec l'éditeur. Le serveur écoute à l'adresse `http://127.0.0.1:8000/mcp`.\n\n### Connecter Claude Desktop\n\n1. Installez Node.js. Vérifiez avec `node -v`.\n2. Dans Claude, ouvrez **Settings > Developer > Edit Config**.\n3. Ajoutez ceci à `mcpServers` :\n\n```json\n\"unreal-mcp\": {\n  \"command\": \"npx\",\n  \"args\": [\"-y\", \"mcp-remote\", \"http://127.0.0.1:8000/mcp\", \"--transport\", \"http-only\"]\n}\n```\n\n4. Quittez complètement Claude et rouvrez-le.\n5. Ouvrez d'abord le projet dans Unreal, afin que le serveur soit en cours d'exécution.\n\n> **Remarque :** Si Claude signale une erreur de connexion refusée, l'éditeur n'est pas encore ouvert ou le serveur n'a pas démarré.\n\n---\n\n## Ce qui est grisé sans chaque compagnon\n\n| Manquant | Grisé | Message |\n|---|---|---|\n| Framemark CAT Bridge | Rien de visible. Les liens de plateau ne sont pas créés. | Needs the Framemark CAT Bridge plugin (and Cinematic Assembly Tools). |\n| Framemark Odyssey Bridge | **Actualiser le fond** | Needs the Framemark Odyssey Bridge plugin (and Odyssey). |\n| FramemarkSLR | Type **Rig** de Place Light et anneau de lumière du Planner | Needs the Framemark Light Rig Bridge plugin (and the light rig plugin). |\n| Framemark USD Bridge | **Exporter en USD**, tuile USD d'Import | Needs the Framemark USD Bridge plugin, which turns on Unreal's USD Core. |\n| Plug-in articy | Rien dans Framemark. **Apply Changes** est absent dans articy. | |\n| Unreal MCP | Rien dans Framemark | |\n\nChaque infobulle se termine par « Turn it on in Edit > Plugins, then restart. »\n\n---\n\n## Voir aussi\n\n- [Présentation de Framemark](index.md)\n- [Prise en main](01_getting-started.md)\n- [Le Planner](07_planner.md)\n- [Scénario et Story Map](08_screenplay-and-story-map.md)\n- [Import, export et partage](09_import-export.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "13_shortcuts.md", "slug": "shortcuts", "title": "Référence des raccourcis clavier", "md": "# Référence des raccourcis clavier\n\nCette page liste chaque touche et chaque clic avec modificateur de Framemark, vérifiés d'après les liaisons de commandes du code. Les raccourcis se répartissent en trois groupes : le hublot du niveau (mode Framemark), la Quick Wheel et le Planner.\n\n## Prérequis\n\n- **Le mode Framemark est activé** pour les raccourcis du hublot. Avec le mode désactivé, **Tab**, **M** et **K** ne font rien.\n- La fenêtre **Planificateur** (Planner) a le focus pour les raccourcis du Planner.\n\n---\n\n## Hublot du niveau\n\nCes raccourcis fonctionnent tant que le mode Framemark est actif.\n\n| Touche | Commande | Remarques |\n|---|---|---|\n| **M** | Place Mark | Une bascule. Elle reste active jusqu'à ce que vous appuyiez sur **Esc**. |\n| **P** | Place Prop | Une bascule. |\n| **C** | Place Camera | Une bascule. |\n| **L** | Place Light | Une bascule. |\n| **K** | Key To Mark | Place des images clés sur les acteurs sélectionnés vers leurs marques. |\n| **O** | Overhead View | Passe le hublot en vue de dessus. |\n| **Ctrl+Shift+P** | Look Through | Regarde à travers la caméra sélectionnée. |\n| **Tab** | Quick Wheel | Voir ci-dessous. |\n| **Esc** | Terminer l'outil actif | Termine un outil Place. Annule le mode Edit Toolbar. Sinon, passe à Unselect All d'Unreal. |\n\n> **Remarque :** Les clics effectués pendant que **T**, **L**, **S** ou **A** est maintenue suivent le comportement normal du moteur, donc les raccourcis de hublot propres à Unreal continuent de fonctionner.\n\n### Quick Wheel\n\nLa Quick Wheel est un menu radial qui s'ouvre au niveau du curseur.\n\n1. Survolez un hublot du niveau sans rien sélectionner.\n2. Maintenez **Tab**.\n3. Dirigez le curseur d'un geste vers une part.\n4. Relâchez **Tab** pour l'exécuter.\n\n- **Appuyez brièvement** au lieu de maintenir : la roue reste ouverte jusqu'à ce que vous cliquiez.\n- Un second **Tab**, ou **Esc**, la ferme.\n- Elle fonctionne aussi dans le Planner. **Alt+Tab** y est exclu, donc le changement de fenêtre de Windows continue de fonctionner.\n\n---\n\n## Planner\n\n### Outils\n\n| Touche | Outil |\n|---|---|\n| **Q** | Select |\n| **M** | Mark |\n| **C** | Camera |\n| **L** | Light |\n| **P** | Prop |\n| **U** | Measure |\n| **W** | Path (l'outil de déplacement) |\n\n### Vue\n\n| Touche | Action |\n|---|---|\n| **F** | Cadrer tout |\n| **O** | Basculer la vue de dessus (Overhead View) |\n| **Space + glisser** | Panoramique |\n| **Glisser avec le bouton central ou droit de la souris** | Panoramique |\n| **Molette de la souris** | Zoom |\n| **Double-clic sur la boussole** | Réinitialiser la vue |\n\n### Édition\n\n| Touche | Action |\n|---|---|\n| **E** | Armer la rotation pour le prochain glissement |\n| **H** | Masquer la sélection (Hide d'Unreal) |\n| **K** | Ouvrir le sélecteur Key To Mark au niveau du curseur |\n| **F2** | Renommer l'élément sélectionné (un seul) |\n| **Supprimer** (Delete) ou **Backspace** | Supprimer la sélection. Sur un point de limite sélectionné, supprime ce point. |\n| **Enter** | Terminer un tracé libre |\n| **Esc** | Abandonner un brouillon, annuler un glissement, puis effacer la sélection étape par étape |\n| **Ctrl+D** | Dupliquer |\n| **Ctrl+A** | Tout sélectionner sur le plan |\n| **Ctrl+C** | Copier |\n| **Ctrl+X** | Couper |\n| **Ctrl+V** | Coller au point survolé |\n| **Ctrl+Z** | Annuler |\n| **Ctrl+Shift+Z** ou **Ctrl+Y** | Rétablir |\n| **Ctrl+S** | Enregistrer le Draft du plateau affiché |\n| **Ctrl+Shift+P** | Look Through |\n\n> **Remarque :** L'annulation ne se déclenche que sur un nouvel appui, lorsque le Planner est la fenêtre active.\n\n### Souris et modificateurs\n\n| Action | Résultat |\n|---|---|\n| Clic avec **Shift** | Ajouter à la sélection |\n| Clic avec **Ctrl** | Inverser dans la sélection |\n| Maintenir **Alt** pendant un placement ou un glissement | Désactive l'accrochage |\n| Double-clic sur la courbe de limite (outil Select) | Ajoute un point de limite |\n\n---\n\n## Autres panneaux\n\n| Où | Touche | Action |\n|---|---|---|\n| Onglet Setups | **F2** | Renommer la configuration |\n| Onglet Setups | **Supprimer** | Supprimer la configuration |\n| Panneau Framemark | Clic avec **Shift** sur **Construire la séquence** (Build Sequence) | Ouvre sa boîte de dialogue même si Don't Ask Again est activé |\n| Hublot du niveau | Clic avec **Shift** sur une marque empilée | Remonte dans la pile |\n\n---\n\n## Changer une touche\n\nLes commandes du hublot sont des commandes Unreal. Reliez-les à d'autres touches sous **Edit > Editor Preferences > General > Keyboard Shortcuts**, puis recherchez **Framemark**.\n\n> **Avertissement :** Les touches du Planner et **Tab** pour la Quick Wheel sont gérées par Framemark lui-même et ne peuvent pas être reliées à d'autres touches.\n\n---\n\n## Voir aussi\n\n- [Interface du mode Framemark](02_interface.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Le Planner](07_planner.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "14_troubleshooting.md", "slug": "troubleshooting", "title": "Dépannage et limitations connues", "md": "# Dépannage et limitations connues\n\nCette page liste les problèmes que vous rencontrerez le plus probablement, les messages exacts que Framemark affiche et ce qu'il faut faire pour chacun. Elle se termine par les limitations connues. Trouvez votre symptôme dans les tableaux, ou recherchez le texte du message. Les messages de l'éditeur sont cités tels que Framemark les affiche, en anglais.\n\n## Corrections rapides\n\n| Symptôme | Cause | Correction |\n|---|---|---|\n| **Tab**, **M** ou **K** ne fait rien | Le mode Framemark est désactivé | Activez le mode Framemark dans le panneau **Modes**. |\n| Une fonctionnalité est grisée avec « Needs the ... plugin » | Un plug-in compagnon est désactivé | **Edit > Plugins** (Édition > Plug-ins), activez le pont indiqué, redémarrez. Voir [Plug-ins compagnons](12_integrations.md). |\n| Un pont ne figure pas dans la liste des plug-ins | Il n'a pas été compilé | Le script de compilation ignore un pont dont le plug-in du moteur manque, et consigne la raison. Installez ce plug-in du moteur, puis recompilez. |\n| Rien ne se lie à l'exécution | L'acteur n'est pas dans la séquence, ou la liaison (Binding) est absente | Ouvrez la séquence de niveau du plateau et vérifiez la liaison (Binding). Voir [Séquences et liaisons](06_sequences.md). |\n| Snap To Ground ne trouve pas de sol | Il n'y a pas de collision sous l'élément | Ajoutez un sol avec collision, ou déplacez l'élément au-dessus d'un sol. Le message indique « No floor found underneath. » |\n| Une marque ne se laisse pas glisser | Les marques ne sont cliquables que lorsque leur plateau est sélectionné, ou la marque est verrouillée | Sélectionnez d'abord le plateau. Vérifiez le verrou. |\n| Camera Preset ne crée rien | Le plateau n'a pas de marques, ou aucune échelle de plan n'est listée | Ajoutez des marques et cochez au moins une échelle de plan. |\n| Generate oublie un acteur | L'acteur est déjà sur le plateau, ou il est porté par sa séquence de niveau | Vérifiez les attachements et la séquence du plateau. |\n| Une caméra ou une lumière a disparu | Elle est masquée | Le masquage est propre à chaque plateau et dure jusqu'à la fermeture de l'éditeur. Réaffichez-la depuis le plateau. |\n| Export Plan a enregistré mais rien ne s'est ouvert | Le fichier est enregistré mais aucun lecteur ne l'a ouvert | Ouvrez le fichier enregistré depuis le dossier indiqué dans la notification. |\n| Le clic droit indique « Select a Cine Stage first. » | Aucun plateau n'est sélectionné | Sélectionnez le plateau, puis faites de nouveau un clic droit. |\n| La notification d'avertissement de limite apparaît | Vous modifiez à l'intérieur d'une limite | Désactivez **Warn When Editing Inside Boundary** dans **Editor Preferences > Framemark > General**. |\n| Key To Mark demande Sequencer | Aucune séquence n'est ouverte | Ouvrez la séquence du plateau avec **Ouvrir la séquence** (Open Sequence), puis placez la tête de lecture. |\n\n---\n\n## Messages de l'éditeur\n\nLes messages sont regroupés par tâche.\n\n### Plateau et marques\n\n| Message | Que faire |\n|---|---|\n| Can't link an actor that is attached to the target. Use Detach From Stage first, or pick a different target. | Détachez l'acteur, puis recréez le lien. |\n| Select one or more actors first. | Sélectionnez des acteurs dans l'Organiseur ou dans le hublot. |\n| Select a stage camera first. | Sélectionnez une caméra qui appartient à un plateau. |\n| Select two or more objects, the target last. | Sélectionnez les éléments à lier, puis sélectionnez la cible en dernier. |\n| Nothing linked on the selection. Actors attached to the stage move with it: use Detach From Stage. | La sélection est attachée, pas liée. Utilisez **Détacher du plateau** (Detach From Stage). |\n| Select marks, cameras or lights on the stage first. | Sélectionnez des éléments qui appartiennent au plateau. |\n| Nothing was attached. The actors may already be on the stage, or they are in its Level Sequence, which carries them with the stage instead. | Aucune action nécessaire. |\n| Select a mark that has other marks on the same spot. | Sélectionnez une marque d'une pile. |\n| No other mark sits under this one. | La marque n'est pas empilée. |\n| Nothing was moved. It may be locked, or not directly on the stage. | Déverrouillez-la, ou déplacez-la depuis son propre plateau. |\n| Those marks are locked. / That mark is locked. | Déverrouillez la marque. |\n| Select exactly one actor to put on a mark. | Sélectionnez un seul acteur. |\n| Select the actors to key first. | Sélectionnez les acteurs, puis placez les images clés. |\n| Select a Cine Stage first. | Sélectionnez un plateau. |\n| Could not make the Stage Asset. / Could not place that Stage Asset here. | Vérifiez le dossier de destination et que le niveau est accessible en écriture. |\n| Could not duplicate those marks. | Vérifiez que les marques ne sont pas verrouillées. |\n\n### Key To Mark et liens de séquence\n\n| Message | Que faire |\n|---|---|\n| Open the stage's sequence in Sequencer first (Open Sequence), then move the playhead to where the actor should reach the mark. | Faites exactement cela. |\n| That sequence or track is locked, so no key was added. | Déverrouillez la séquence ou la piste. |\n| Could not add a key. Check the actor can be bound in this sequence. | Vérifiez la liaison (Binding). |\n| The stage's sequence is locked, so nothing was keyed. | Déverrouillez la séquence. |\n| Nothing keyed. None of this stage's marks have a track with a position at the end of {0}. | Ajoutez une piste de marque avec une image clé à cette image. |\n| Open the master sequence in Sequencer and park the playhead inside a shot first. | Pour **Reprendre le précédent** (Match Previous) et **Reprendre le suivant** (Match Next). |\n| Open the master sequence in Sequencer first. | Pour **Vérifier la continuité** (Check Continuity). |\n| Nothing matched. None of this shot's marks have a track with a position in {0}. | Le plan n'a pas d'images clés de marque à faire correspondre. |\n| No other linked sequence could be loaded to take over, so nothing was removed. | Vérifiez que les autres séquences existent et se chargent. |\n| {0} sequences have their marked frames locked. Their dialogue markers were left alone. | Déverrouillez les images marquées pour les modifier. |\n\n### Construction de séquence\n\n| Message | Que faire |\n|---|---|\n| Nothing was made. Check the stage has marks and at least one shot scale listed. | Ajoutez des marques et une échelle de plan. |\n| No active level viewport to copy from. | Cliquez d'abord dans un hublot du niveau. |\n| Could not create the Level Sequence asset. Check the Sequence Folder on the stage. | Choisissez un dossier valide, accessible en écriture. |\n| No mark transform tracks needed to move. | Aucune action nécessaire. |\n\n### Planner\n\n| Message | Que faire |\n|---|---|\n| A boundary needs at least 3 points. | Ajoutez un troisième point. |\n| A path needs an end: click a mark or a second point. | Terminez le tracé. |\n| Select a camera first, then pick the mark it should look at. | Sélectionnez une caméra, puis la marque cible. |\n| No stage to show. Place a stage in the level, or pick one from the scene tabs. | Placez un plateau ou choisissez un onglet. |\n| That is locked. Unlock it to move it. / Those are locked. Unlock them to delete. | Déverrouillez les éléments. |\n| No {0} preset. Add one in Editor Preferences > Framemark > Lights. | Ajoutez le préréglage sur la page **Lumières** (Lights). |\n| No cameras yet. Press C, then click the plan to place one. Each camera is a shot. | Faites exactement cela. |\n| The capture needs the editor to be rendering. Nothing was changed. | Amenez la fenêtre de l'éditeur au premier plan et laissez-la effectuer le rendu. |\n| The top-down render needs the editor to be rendering, so the plan has no background picture. | Idem. |\n| Could not make a render target ... / Could not compress the PNG. | Réessayez. Vérifiez la mémoire disponible et l'espace disque. |\n| Could not import that picture. Check that the file opens in an image viewer. | Utilisez un PNG ou un JPG qui s'ouvre normalement. |\n\n### Import et export\n\n| Message | Que faire |\n|---|---|\n| Could not write that file. / Could not read that file. | Vérifiez le chemin et que le fichier n'est pas ouvert ailleurs. |\n| {0} row(s) need a pick under Mapping. | Choisissez une cible pour chaque ligne dans **Association** (Mapping). |\n| Choose a stage under Select Stage, or tick Create New Stage. | Faites l'un ou l'autre. |\n| Could not read that Shot Designer scene. | Vérifiez que le fichier est un export Shot Designer. |\n| Could not make the folder {0}. | Vérifiez les permissions. |\n| Could not write {0}: {1} / Could not read {0}: {1} | Lisez la raison dans {1}. |\n| Could not check out {0}. {1} | Vérifiez votre connexion au contrôle de source. |\n| {0} is read-only. | Retirez l'attribut lecture seule ou extrayez le fichier (check out). |\n| Could not write {0}. / Could not open {0}. (USD) | Vérifiez le chemin et que le USD Bridge est activé. |\n| {0} has no Framemark stage prim. | Le fichier n'a pas été créé par Framemark, ou le prim de plateau a été supprimé. |\n\n### Import de Screenplay\n\n| Message | Que faire |\n|---|---|\n| This is not an articy:draft X export. In articy:draft, export for Unreal and pick the .articyue file. | Réexportez depuis articy. |\n| This articy:draft export has no dialogues. Check the export rule set includes the packages with your dialogues. | Modifiez le jeu de règles d'export. |\n| Pick a Fountain (.fountain), Final Draft (.fdx) or plain text (.txt) screenplay, an ink story (.ink) or an articy:draft X export (.articyue). | Choisissez un fichier pris en charge. |\n| This scene has no stage yet. Select it and press Generate. | Générez le plateau. |\n| No scenes to generate. Pick scenes in the Screenplay view, or tick them in the Generate dialog. | Choisissez des scènes. |\n\n### Refus de réécriture\n\nFramemark refuse de réécrire dans la source plutôt que d'écraser du travail.\n\n| Message | Que faire |\n|---|---|\n| This screenplay was imported before lines were linked to the file. Re-import it once. | Réimportez. |\n| It changed on disk since the last import. Re-import it, then save again. | Réimportez, puis enregistrez. |\n| It is checked out or locked by {0} in {1}. | Attendez que le verrou soit levé. |\n| There is a newer version in {0}. Get latest, re-import, then save again. | Synchronisez, réimportez, enregistrez. |\n| The file is read-only. | Retirez l'attribut ou extrayez le fichier (check out). |\n| {0} is not connected, so its lock on the file can't be checked. | Reconnectez le contrôle de source. |\n| {0} was not written back: {1} | Lisez la raison. |\n| The export changed since the last import. Re-import it, then save again. (articy) | Réimportez. |\n| articy already has the last changes from Framemark. Export for Unreal in articy, re-import, then save again. | Appliquez, exportez, réimportez. |\n| This screenplay was imported before lines were linked to articy. Re-import it once. | Réimportez. |\n\n### Autres\n\n| Message | Que faire |\n|---|---|\n| Couldn't find {0} in the Framemark plugin folder or the folder above it. | Vérifiez que l'installation du plug-in est complète. |\n| Open ... Editor Preferences are not available right now. | Ouvrez **Edit > Editor Preferences** à la main. |\n| Could not rename setup. Choose a name that is not empty and not already used. | Choisissez un nom unique. |\n\n---\n\n## Problèmes de rendu et de publication\n\n| Symptôme | Cause et correction |\n|---|---|\n| L'import Blender n'a pas de Boundary | L'importeur FBX de Blender ne lit pas les courbes, donc Boundary arrive comme un empty. Utilisez USD dans Blender. |\n| Write Back On Save refuse | Le fichier a changé en dehors d'Unreal, ou le contrôle de version l'a verrouillé. Réimportez, ou libérez le verrou. |\n| Un rendu n'a rien écrasé, et vous ne le retrouvez pas | Les rendus n'écrasent jamais. Ils vont dans `Saved/MovieRenders/<sequence>/<date>` avec un nouveau numéro de version. |\n| Le fichier de diffusion britannique échoue à la livraison | CS_UK_Broadcast couvre l'image. La sonie, le conteneur MXF et le timecode sont une étape en dehors d'Unreal. |\n| L'envoi vers Frame.io, SyncSketch, ShotGrid, ftrack ou Kitsu n'a rien fait | Les envois s'exécutent en dehors d'Unreal. Ouvrez le `.log` à côté du manifeste : il indique `OK` ou `FAILED` pour chaque plateforme. Les clés vont dans des variables d'environnement dans `publish.json`, par exemple `\"env:FRAMEIO_TOKEN\"`. |\n| Les hooks de rendu ne s'exécutent pas | Ajoutez `Docs/Samples/Render/framemark_render_hooks.py` sous **Project Settings > Plugins > Python > Startup Scripts**, puis redémarrez. |\n\nVoir [Rendu et publication](10_render-and-publish.md).\n\n---\n\n## Limitations connues\n\n- Les **marques** ne sont cliquables que lorsque leur plateau est sélectionné.\n- Le **Ghosting** atténue un élément. Il ne le rend pas transparent.\n- **Masquer les caméras et les lumières** est propre à chaque plateau et dure jusqu'à la fermeture de l'éditeur.\n- L'**import Shot Designer** n'a été vérifié que sur une seule scène.\n- **Configurations avec suivi** (Tracked Setups) ne place pas d'images clés sur la position de la caméra sur son rail.\n- Les **plateaux importés** ne reconnectent les acteurs que par libellé exact.\n- Les **mouvements de caméra et de lumière dans le temps**, un plateau déplacé dans le DCC et les modifications de limite ne sont pas récupérés par la réimportation USD ou FBX.\n- **FBX** perd la Boundary dans Blender.\n- Les fichiers `INCLUDE` d'**ink** ne sont pas lus.\n- La livraison pour la **diffusion britannique** exige une étape de sonie, de MXF et de timecode en dehors d'Unreal.\n\n---\n\n## Voir aussi\n\n- [Présentation de Framemark](index.md)\n- [Prise en main](01_getting-started.md)\n- [Plug-ins compagnons](12_integrations.md)\n- [Référence des raccourcis clavier](13_shortcuts.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n"}, {"file": "15_case-study.md", "slug": "case-study", "title": "Étude de cas : la salle de la lampe", "md": "# Étude de cas : la salle de la lampe\n\nCe chapitre suit une scène de la page jusqu'à la prévisualisation rendue avec Framemark. Vous la planifiez dans le **Planifica
