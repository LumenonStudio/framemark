nce), puis placez la tête de lecture à l'endroit où l'acteur doit atteindre la marque.)\n\n**Les images clés suivent leur marque.** Si vous déplacez une marque plus tard, les images clés créées sur elle se déplacent avec elle, dans la même étape d'annulation. Une image clé que vous avez modifiée à la main cesse de suivre. Une séquence qui était fermée au moment du déplacement de la marque pose la question à son ouverture : **Clés obsolètes** (Keys Out Of Date), \"{n} keys in {sequence} were keyed to marks that have moved since. Update them to follow the marks?\" ({n} images clés de {sequence} ont été posées sur des marques qui ont bougé depuis. Les mettre à jour pour qu'elles suivent les marques ?) avec **Mettre à jour** (Update), **Laisser** (Leave) et **Ne plus demander** (Don't ask again). Désactivez le suivi avec **Keys Follow Marks** (Editor Preferences, Sequence). La réponse est enregistrée dans **Keys Out Of Date On Open** (Clés obsolètes à l'ouverture).\n\n## Configurations\n\n![L'onglet Setups avec quatre configurations](media/fm_setups.png)\n*L'onglet **Configurations** (Setups) pour la Lamp Room : chaque configuration liste ses marques, ses acteurs et ses caméras, avec des commutateurs de visibilité et de verrouillage.*\n\nUne configuration est un groupe nommé de marques, de caméras et de lumières que vous affichez, estompez, isolez ou verrouillez ensemble.\n\n1. Sélectionnez des marques, des caméras ou des lumières sur le plateau.\n2. Appuyez sur **Nouvelle configuration** (New Setup) (« Crée une configuration à partir des marques, caméras et lumières sélectionnées. Chaque nouvelle configuration reçoit sa propre couleur. »), ou faites un clic droit et choisissez **Group > Add To Setup**.\n\nSi rien n'est sélectionné : « Sélectionnez d'abord des marques, caméras ou lumières sur le plateau. »\n\n**Onglet Configurations** (Setups Tab) ouvre un panneau ancrable avec une ligne par configuration :\n\n| Contrôle | Description |\n|---|---|\n| Œil | « Afficher ou masquer cette configuration. Alt+clic pour afficher uniquement celle-ci ; Alt+clic de nouveau pour tout afficher. » |\n| Verrou | \"Lock or unlock this setup.\" (Verrouille ou déverrouille cette configuration.) Les marques verrouillées ne peuvent pas être cliquées ni déplacées ; les acteurs membres verrouillés voient aussi leur position verrouillée. |\n| Pastille | \"Click to change this setup's colour.\" (Cliquez pour changer la couleur de cette configuration.) |\n| Nom | « Appuyez sur F2 ou utilisez le menu contextuel pour renommer ». (Appuyez sur F2 ou utilisez le menu du clic droit pour renommer.) |\n| Compteur | \"{n} marks, {n} actors\". |\n| Œil d'en-tête | **Tout afficher** (Show All) : \"turns off solo and shows every setup.\" (désactive l'isolement et affiche toutes les configurations.) |\n| **Nouvelle configuration**, **Supprimer** (Delete) | **Supprimer** : « Supprime les configurations sélectionnées. Leurs marques et acteurs restent sur le plateau. » |\n| Recherche | « Rechercher des configurations, marques et acteurs ». (Recherche dans les configurations, les marques et les acteurs.) |\n| Case **Ghost** (Fantôme) | \"hidden setups stay in the viewport as faint ghosts instead of disappearing.\" (les configurations masquées restent dans le hublot sous forme de fantômes pâles au lieu de disparaître.) |\n| **Opacité des fantômes** (Ghost Opacity) | « Opacité des configurations fantômes. 0 est invisible, 1 est opaque. » |\n\nDouble-cliquez sur une ligne pour sélectionner tout le contenu de la configuration. Faites glisser des membres d'une configuration à l'autre : maintenez **Ctrl** pour copier. Le clic droit propose **Isoler la configuration** (Solo Setup), **Renommer la configuration** (Rename Setup), **Retirer de la configuration** (Remove From Setup), **Copier vers la configuration** (Copy To Setup), **Déplacer vers la configuration** (Move To Setup) et **Supprimer la configuration** (Delete Setup). Seuls les éléments rattachés à ce plateau peuvent rejoindre une configuration. Sans plateau : « Sélectionnez un plateau pour voir ses configurations. » Sans configuration : « Aucune configuration pour l'instant. Sélectionnez des marques et appuyez sur Nouvelle configuration. »\n\nUne configuration conserve son nom, sa couleur, son état visible et verrouillé, ses marques, ses membres et ses notes. **Afficher toutes les configurations** (Show All Setups) (page **Shoot** (Tournage)) annule l'isolement.\n\n> **Remarque :** L'estompage atténue une marque, il ne la rend pas transparente. Les acteurs membres qui ne sont pas des marques ne peuvent pas être atténués, ils sont donc entièrement masqués lorsque leur configuration n'est pas affichée.\n\n## La Marks Table\n\n![La Marks Table d'un plateau de sept marques](media/fm_marks_table.png)\n*La **Tableau des marques** : Mark Order, nom, rôle, acteur, commutateurs de fixation et d'orientation et Height Snapping, une ligne par marque.*\n\n**Tableau des marques** ouvre un tableau de toutes les marques du plateau pour les modifier ensemble.\n\n| Colonne | Description |\n|---|---|\n| **Ordre des marques** | « L'ordre de la marque sur le plateau : le numéro de son badge et dans l'éventail. Cliquez pour le modifier. » |\n| **Nom** (Name) | « Le nom de la marque. Cliquez pour le renommer. » |\n| **Rôle** | « Qui ou quoi se tient sur la marque. » |\n| **Actor** | « L'acteur du niveau qui se tient sur la marque. » |\n| **Épingler à la marque** | Épingle la piste de l'acteur à la marque. |\n| **Orienter selon la marque** | L'acteur se tourne dans la direction qu'indique la marque. |\n| **Accrochage en hauteur** | Snap To Floor ou Keep Mark Height. |\n| **Piste de séquence** | La piste qui suit cette marque. |\n| **Configurations** | « Les configurations dont cette marque fait partie. » |\n| **Action** | « Ce qui se passe sur cette marque. » |\n| **Réplique** | « La réplique dite sur cette marque. » |\n| **Ordre d'empilement** | « Quelle marque s'affiche au-dessus quand des marques sont empilées au même endroit. Un nombre plus élevé s'affiche au-dessus. Ce n'est pas l'ordre des marques. » (Quelle marque est dessinée au-dessus quand des marques sont empilées au même endroit. Un nombre plus élevé est dessiné au-dessus. Ce n'est pas **Ordre des marques**.) |\n\nChaque modification est une seule étape d'annulation, par exemple **Définir l'ordre des marques** (Set Mark Order) ou **Renommer la marque** (Rename Mark). Les colonnes font partie de l'espace de travail.\n\n## Trajets\n\nLes marches, courses, virages et trajets de caméra sont dessinés dans le **Planificateur** et stockés sur le plateau sous forme de **Moves** (Déplacements). Chaque déplacement a un type (Walk, Run, Turn ou Camera), un Mark Order de départ (From) et d'arrivée (To), des points, une durée, un temps de début et une note. Voir [Le Planner](07_planner.md).\n\n## Verrouiller, dupliquer et supprimer\n\nLe clic droit **Dupliquer** (Duplicate) copie les marques (« Dupliquer les marques »). **Supprimer** les supprime et ignore les marques verrouillées : \"{n} mark(s) deleted, {n} locked mark(s) left.\" ({n} marque(s) supprimée(s), {n} marque(s) verrouillée(s) conservée(s).) **Verrouiller** (Lock) et **Déverrouiller** (Unlock) sont dans le même groupe.\n\n## Limitations connues\n\n- Une marque n'est cliquable dans le hublot que lorsque son plateau, ou une marque de ce plateau, est sélectionné.\n- Une marque ne se déplace pas si sa configuration est verrouillée.\n\n## Voir aussi\n\n- [Plateaux et Stage Assets](03_stages.md)\n- [Caméras et lumières](05_cameras-and-lights.md)\n- [Séquences et liaisons](06_sequences.md)\n- [Le Planner](07_planner.md)\n- [Référence des raccourcis clavier](13_shortcuts.md)\n"}, {"file": "05_cameras-and-lights.md", "slug": "cameras-and-lights", "title": "Caméras et lumières", "md": "# Caméras et lumières\n\nLes caméras Framemark sont des Acteurs de caméra cinématique (Cine Camera Actor) qui portent un composant **Stage Camera** (Caméra du plateau). Le composant enregistre quelles marques le plan couvre, l'échelle de plan et la description du plan. Les lumières sont des lumières Unreal ordinaires, ou un rig de lumières, rattachées au plateau et dirigées vers des marques. Rien n'est généré tant que vous ne le demandez pas : vous placez les caméras et les lumières une par une. Cette page traite de la page **Shoot** (Tournage), de **Régler sur le hublot** (Set To Viewport), des échelles de plan, de **Préréglage de caméras** (Camera Preset), des liaisons, de la première personne et du mode Hybrid, des formats de caméra, des lumières et du type **Rig d'éclairage** (Light Rig).\n\n## Prérequis\n\n- Un plateau avec au moins une marque. Voir [Marques et mise en place](04_marks-and-blocking.md).\n- Pour le type **Rig d'éclairage** : le plug-in **Framemark Light Rig Bridge** (Pont Framemark pour rig d'éclairage) et le plug-in de rig d'éclairage.\n\n## Placer une caméra\n\n1. Choisissez **Placer une caméra** (Place Camera, touche **C**) dans la barre d'outils.\n2. Cliquez dans le hublot du niveau. La caméra vise la ligne des yeux de la marque la plus proche au moment où vous la placez. Réglez la hauteur de la caméra dans les réglages de l'outil.\n3. Continuez à cliquer pour en placer d'autres. Appuyez sur **Esc** pour arrêter.\n\nVous pouvez aussi faire un clic droit et choisir **Framemark > Place Camera Here**. Le bouton **Ajouter une caméra** (Add Camera) du plateau ajoute une caméra sur le plateau et la sélectionne. Si **Caméras** (Cameras) est décoché dans le menu en forme d'œil, le message indique « Caméra placée. Elle est masquée car Afficher les caméras est désactivé. »\n\nLes caméras sont nommées selon le préréglage de nommage, `{seq}_{shot}_{subject}_{type}` par défaut : code de séquence, numéro de plan, sujet et type de plan. Modifiez le motif dans **Editor Preferences > Framemark > Naming**, voir [Référence des paramètres](11_settings-reference.md). L'objectif et les marques qu'il couvre s'affichent sur l'étiquette du hublot, par exemple `SH0010  50mm  2>1`.\n\n## Set To Viewport\n\n1. Déplacez le hublot du niveau jusqu'au cadrage voulu.\n2. Sélectionnez la caméra.\n3. Appuyez sur **Régler sur le hublot** sur la page **Shoot**, ou utilisez la fonction **Set To Current Viewport** (Régler sur le hublot actuel) de la caméra.\n\nLa caméra prend la position, la rotation et le champ de vision du hublot en une seule étape. Ce n'est pas un lien dynamique. Si vous déplacez de nouveau le hublot, il faut appuyer de nouveau sur le bouton. La même entrée se trouve dans le menu du clic droit d'une caméra de plateau sélectionnée.\n\n**Regarder à travers** (Look Through, **Ctrl+Shift+P**) pilote le hublot du niveau à travers la caméra de plateau sélectionnée, comme la fonction Pilot d'Unreal. La fonction **Look Through This Camera** (Regarder à travers cette caméra) du composant fait la même chose.\n\n## La page Shoot\n\n![La page Shoot](media/ui_page_shoot.png)\n\n\"Cameras and lights, linking and setups.\" (Caméras et lumières, liaisons et configurations.)\n\n| Bouton | Description |\n|---|---|\n| **Régler sur le hublot** | Voir ci-dessus. |\n| **Regarder à travers** | Pilote le hublot à travers la caméra. |\n| **Préréglage de caméras** | Crée des caméras en masse. |\n| **Suivre** (Follow) | Sélectionnez les enfants, la cible en dernier. Ils suivent la position et la rotation de la cible. |\n| **Regarder vers** (Look At, Viser) | Sélectionnez les objets, la cible en dernier. Une caméra utilise son propre suivi de visée. Tout le reste reçoit une contrainte de rotation. |\n| **Supprimer le lien** (Unlink, Délier) | « Supprime tous les liens Framemark des Actors sélectionnés. Pour qu'un Actor cesse de suivre le plateau, utilisez Détacher du plateau. » Ne supprime que les contraintes créées par Framemark. |\n| **Nouvelle configuration** (New Setup), **Afficher toutes les configurations** (Show All Setups), **Onglet Configurations** (Setups Tab) | Voir [Marques et mise en place](04_marks-and-blocking.md). |\n\nLe groupe **Lier** (Link) du clic droit contient **Suivre**, **Regarder vers**, **Position** (« Les autres Actors sélectionnés suivent uniquement la position du dernier Actor sélectionné. ») et **Rotation** (\"... rotation only.\" (la même chose pour la rotation uniquement)), sous le titre « Sélectionnez la cible en dernier ». Les liaisons reposent sur les contraintes de transformation propres à Unreal. Dans le **Planificateur** (Planner), le bouton qui arrête le suivi d'une marque par une caméra s'appelle aussi **Supprimer le lien**.\n\n## Échelles de plan\n\n| Échelle | Nom | Cadrage |\n|---|---|---|\n| 1 | **Full Close Up** (Très gros plan) | Haut de l'épaule. |\n| 2 | **Fermer** (Close, Gros plan) | Milieu de la poitrine. |\n| 3 | **Medium** (Plan moyen) | Taille. La valeur par défaut. |\n| 4 | **Medium Full** (Plan américain) | Cuisse. |\n| 5 | **Full** (Plan en pied) | Le sujet entier. |\n\n## Propriétés de Stage Camera\n\nDans la catégorie **Stage Camera** :\n\n| Propriété | Description |\n|---|---|\n| **Regarder la marque** (Look At Mark) | Le Mark Order que cette caméra regarde. 1 par défaut. |\n| **Look From Mark** (Regarder depuis la marque) | Le Mark Order par-dessus l'épaule duquel cette caméra filme. 0 par défaut, c'est-à-dire aucun. |\n| **Shot Scale** (Échelle de plan) | L'une des cinq échelles. |\n| **Intérieur** (Interior), **Use Interior Suffix** (Utiliser le suffixe intérieur) | Intérieur ou extérieur, et si le nom reçoit un suffixe d'intérieur. |\n| **Camera Mode** (Mode caméra) | **Cinématique** (Cinematic) ou **Game** (Jeu). |\n| **Cropped Aspect Ratio** (Rapport d'aspect recadré) | Mode Game uniquement. 1.7778 par défaut, plage de 0.5 à 4. |\n| **Tracking Look At Mark** (Suivi de la marque visée) | Lecture seule. La marque que la caméra suit. |\n\nLa catégorie **Plan** (Shot) contient **Shot Description** (Description du plan), **Réf. scénario / storyboard** (Script / Board Ref), **Angle de caméra** (Camera Angle), **Mouvement de caméra** (Camera Move), **Audio**, **Sujet** (Subject), **Références** (References), **Other Fields** (Autres champs) et **Show Cone In Plan** (Afficher le cône dans le plan).\n\nLe composant possède les boutons d'éditeur **Aim At Look At Mark** (Viser la marque visée), **Track Look At Mark** (Suivre la marque visée), **Effacer le point visé** (Clear Look At), **Set To Current Viewport**, **Rename From Marks** (Renommer d'après les marques) et **Look Through This Camera**.\n\n### Lignes de caméra dans Framemark Details\n\n| Ligne | Description |\n|---|---|\n| **Lens Choice** (Cinematic) | La liste des objectifs commence par **Universal Zoom** (Zoom universel), puis les autres zooms, puis les focales fixes de la plus courte à la plus longue. |\n| **Focale** (Focal Length), **Aperture** (Ouverture) | Valeurs de caméra standard. |\n| **Manual Focus Distance** (Distance de mise au point manuelle) | En centimètres. Une pipette **Sample Scene Depth** (Échantillonner la profondeur de la scène) la prélève dans la scène. |\n| **Look At Target** (Cible visée) | |\n| **Filmback** | Les préréglages de filmback d'Unreal. |\n| **Horizontal FOV** (mode Game) | Le champ de vision par défaut du jeu est de 75 degrés. |\n| **FOV Preset** (Préréglage de FOV) | **90 degrés (première personne)** (90 degrees (first person)), **80 degrés (première personne, console)** (80 degrees (first person, console)), **70 degrés (troisième personne)** (70 degrees (third person)). |\n| **Crop Preset** (Préréglage de recadrage), **Cropped Aspect Ratio** | Recadrages du mode Game. |\n| **Anamorphic** (Anamorphique), **Squeeze Factor** (Facteur de compression) | 1.33x, 1.5x ou 2x. |\n| **Camera Mode** | Cinematic ou Game. |\n| **Screen Width** (Largeur d'écran), **Viewing Distance** (Distance de visionnage), **Match Screen** (Adapter à l'écran) | Le calculateur de champ de vision du mode Game. Résultats : **Screen Matched FOV** (FOV adapté à l'écran), **Vertical FOV** (FOV vertical), **Focal Length On Filmback** (tous en lecture seule). |\n| **Debug Focus Plane** (Plan de mise au point de débogage) | Dessine le plan de mise au point. |\n\n### Formats de caméra\n\nLes formats de caméra de plateau comprennent Super 35 4-perf en 1.85, 2.39 et open gate ; Super 35 3-perf ; 35mm 4-perf anamorphique 2x ; grand format (avec anamorphique 1.5x et 2x) ; 65mm numérique (avec anamorphique 1.25x) ; VistaVision 8-perf ; IMAX 15/70 ; photo plein format (avec anamorphique 1.5x et 2x) ; et Game 16:9. Ajoutez vos propres formats dans **Editor Preferences > Framemark > Cameras**. **Appliquer le format aux caméras** (Apply Format To Cameras) règle toutes les caméras du plateau.\n\n## Camera Preset\n\n**Préréglage de caméras** est l'option de création en masse, à activer volontairement. Elle crée une caméra par paire ordonnée de marques et par échelle de plan listée, donc trois marques avec trois échelles donnent dix-huit caméras. Le cadrage suit la ligne d'action, un angle de trois quarts et le short-siding. Elle ignore les marques **Accessoire** (Prop) et les marques de point de vue. Rien ne se passe tant que vous n'appuyez pas dessus. Considérez chaque résultat comme un point de départ.\n\nElle nécessite au moins une marque et au moins une entrée dans **Preset Shot Scales** (Échelles de plan prédéfinies). Elle se trouve aussi dans la ligne **Outils de plateau** (Stage Tools) du plateau (groupe **Placer** (Place)).\n\n| Propriété du plateau (catégorie Camera Preset) | Description |\n|---|---|\n| **Preset Shot Scales** | Les échelles à créer. |\n| **Include Master** (Inclure le plan d'ensemble) | Activé par défaut. Ajoute un plan d'ensemble (master). |\n| **Interior Suffix** (Suffixe intérieur) | Désactivé par défaut. |\n| **Intérieur** | Activé par défaut. |\n\nL'ordre des éléments du nom de caméra n'est pas une option : les noms des caméras viennent des marques.\n\n## Première personne et Hybrid\n\nRéglez **View Mode** (Mode d'affichage) du plateau (catégorie **Playback** (Lecture)) sur :\n\n- **Framed** (Cadré) : la valeur par défaut. Les marques sont des positions de cadrage pour les caméras.\n- **First Person** (Première personne) : les marques deviennent de la mise en place, pas du cadrage. Cochez **Point Of View** (affiché comme l'inverse de **Autoriser la génération de caméras** (Allow Camera Generation)) sur la marque du joueur. Elle affiche un cône de vision au lieu d'un fantôme, et aucune caméra générée ne la regarde. **Construire la séquence** (Build Sequence) ne crée aucune piste Camera Cuts, le joueur garde donc sa propre caméra.\n- **Hybrid** (Hybride) : démarre sur la vue du joueur et passe aux caméras du plateau là où vous en avez placé. **Construire la séquence** crée une piste Camera Cuts si le plateau a des caméras.\n\n## Placer des lumières\n\n![La salle de la lampe dans le hublot du niveau, avec les caméras et les lumières du plateau](media/vp_marks_lights.jpg)\n\n1. Choisissez **Placer une lumière** (Place Light, touche **L**).\n2. Choisissez le type dans le menu déroulant de l'outil.\n3. Cliquez dans le hublot du niveau. Pendant que vous placez une lumière, et sur le fantôme, elle vise la ligne des yeux de la marque la plus proche dans un rayon de 15 m. Sans marque à portée, elle garde sa visée précédente. Réglez la hauteur de la lumière dans les réglages de l'outil.\n\n| Élément du menu déroulant | Description |\n|---|---|\n| **Projecteur** (Spot Light) | « Placer une lumière dépose des projecteurs : un cône dirigé vers le sol sous le curseur. » |\n| **Lumière ponctuelle** (Point Light) | « Placer une lumière dépose des lumières ponctuelles : de la lumière dans toutes les directions. » |\n| **Lumière rectangulaire** (Rect Light) | « Placer une lumière dépose des lumières rectangulaires : un panneau doux, comme une boîte à lumière. » |\n| Préréglages | Vos préréglages de lumière, plus Directional. |\n| **Rig d'éclairage** | Voir ci-dessous. |\n\n**Light Type** (Type de lumière) peut être Spot, Point, Rect, Directional, Preset ou Rig. **Préréglage** (Preset) utilise le préréglage choisi dans la liste Preset. Les préréglages se trouvent dans **Editor Preferences > Framemark > Lights** : chacun a un nom, un acteur à faire apparaître (n'importe quel acteur lumière, donc un rig de lumières ou un Blueprint de lumière fonctionne), une intensité, une couleur, une portée et un angle de cône. Spot Rim, Point Fill et Rect Key sont fournis, et **Default Preset** (Préréglage par défaut) indique celui que Place Light utilise en premier. Un nom de préréglage contenant un mot de rôle (key, fill, rim, background, hair, kick, ambient, practical, bounce) donne ce rôle à la lumière.\n\nLes lumières sont nommées `lgt_0010`, `lgt_0020`. Dans un motif de nom de lumière, `{type}` vaut Spot, Point, Rect ou Directional, `{role}` est le mot de rôle du nom du préréglage, et `{subject}` est le personnage sur la marque que la lumière vise.\n\nSi **Lumières** (Lights) est décoché dans le menu en forme d'œil, le message indique « Lumière placée. Elle est masquée car Afficher les lumières est désactivé. »\n\n### Propriétés des lumières\n\n| Propriété | Description |\n|---|---|\n| **Regarder la marque** | Le Mark Order que la lumière vise. 0 signifie aucun. |\n| **Aim Height** (Hauteur de visée) | En centimètres. 0 signifie la ligne des yeux de la marque. |\n\nFramemark Details affiche d'abord **Intensity** (Intensité), **Intensity Units** (Unités d'intensité), **Light Colour** (Couleur de la lumière), **Use Temperature** (Utiliser la température) et **Temperature** (Température), puis **Regarder la marque** et **Aim Height**, puis **Inner Cone Angle** (Angle du cône intérieur), **Outer Cone Angle** (Angle du cône extérieur), **Attenuation Radius** (Rayon d'atténuation), **Source Radius** (Rayon de la source), **Soft Source Radius** (Rayon de source adouci) et **Source Length** (Longueur de la source).\n\n### Type Light Rig\n\nL'élément **Rig d'éclairage** place un rig de lumières sur la marque la plus proche. Son info-bulle indique : « Placer une lumière dépose un rig d'éclairage sur la marque la plus proche. Tournez autour du personnage pour définir d'où vient la lumière principale ; le rig suit celui qui se tient sur la marque. » Sans le bridge, il est grisé, jamais masqué, et l'info-bulle nomme le plug-in à activer.\n\n1. Choisissez **Placer une lumière**, puis **Rig d'éclairage** dans le menu déroulant.\n2. Approchez le curseur d'une marque. Si aucune n'est proche, le message indique « Approchez le curseur d'une marque pour placer un rig : il éclaire le personnage sur cette marque. »\n3. Cliquez. Le rig est placé sous le nom **Placer un rig d'éclairage** (Place Light Rig), comme membre du plateau, avec le tag `Framemark.Light`.\n\nLe rig suit l'acteur qui se tient sur la marque. Quand vous affectez un autre acteur à la marque, le rig se déplace vers lui. Si vous placez de nouveau sur un personnage qui a déjà un rig, la lumière principale est réorientée au lieu d'en ajouter un second. Placer sur une marque vide crée un rig en attente à hauteur des yeux de la marque. Une marque vidée garde son rig là où il est. L'outil Light du **Planificateur** place des lumières simples, pas des rigs.\n\n![Un personnage avant et après qu'un rig d'éclairage le suit](media/lt_rig_toggle.gif)\n\n## Aspect des caméras et des lumières\n\nSous **Look** (Aspect) du plateau, **Cameras and Lights** (Caméras et lumières) :\n\n| Propriété | Description |\n|---|---|\n| **Display** (Affichage) | **Sprite** ou **UE Mesh** (Maillage UE). |\n| **Taille** (Size) | 40 cm par défaut, plage de 10 à 200. |\n| **Always Face The Camera** (Toujours face à la caméra) | Activé par défaut. |\n| **Show Name Label** (Afficher l'étiquette de nom) | Activé par défaut. Les caméras ajoutent l'objectif et la couverture, par exemple `SH0010  50mm  2>1`. |\n| **Show On Top Of Everything** (Afficher par-dessus tout) | Désactivé par défaut. |\n\nUne fois placées, les caméras et les lumières gardent l'icône propre à Unreal. Le sprite Framemark n'apparaît que sur le fantôme qui suit votre curseur pendant le placement. L'icône d'une lumière prend la couleur de la lumière.\n\n## Limitations connues\n\n- Le masquage des caméras et des lumières se fait par plateau et dure jusqu'à la fermeture de l'éditeur.\n- Les résultats de Camera Preset sont un point de départ et doivent être revus.\n\n## Voir aussi\n\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Séquences et liaisons](06_sequences.md)\n- [Référence des paramètres et de la nomenclature](11_settings-reference.md)\n- [Plug-ins compagnons](12_integrations.md)\n"}, {"file": "06_sequences.md", "slug": "sequences", "title": "Séquences et liaisons", "md": "# Séquences et liaisons\n\nUn plateau possède une **séquence de niveau** (Level Sequence). La page **Séquence** (Sequence) la construit à partir du plateau, la tient à jour quand les marques bougent, et lui lie les acteurs, dans l'éditeur et à l'exécution. Vous l'utilisez pour passer de la mise en place à une timeline Sequencer sans câbler les pistes à la main, et pour garder les plans continus.\n\n## Prérequis\n\n- Un plateau avec des marques, et les caméras que vous voulez. Voir [Plateaux et Stage Assets](03_stages.md).\n\n## Concepts\n\n- **Construire la séquence** (Build Sequence) crée ou met à jour la séquence de niveau du plateau, nommée selon le motif Level Sequence (`LS_<Stage>` par défaut). Elle crée un possessable avec une piste Camera Cuts pour les caméras du plateau, et une piste taguée par marque. Si vous la relancez, elle n'ajoute que ce qui manque. Elle ne modifie ni n'écrase jamais l'animation que vous avez faite.\n- Les plateaux **First Person** n'ont pas de piste Camera Cuts. Les plateaux **Hybrid** en ont une, si le plateau a des caméras.\n- Le tag de liaison de la marque et le tag de sa piste sont toujours la même chaîne : le **Binding Tag**, ou le **Mark Name** si le tag est vide.\n- Un plateau peut avoir plusieurs séquences. L'**Séquence active** (Active Sequence) est celle que le plateau joue et sur laquelle il travaille.\n- Un plateau qui partage une séquence avec une copie obtient la sienne quand vous construisez : « This stage shared a sequence with a copy, so it now has its own. »\n\n## La page Sequence\n\n![La page Sequence](media/ui_page_sequence.png)\n\n« Build the Level Sequence and keep it in step with the stage. » (Construisez la séquence de niveau et gardez-la synchronisée avec le plateau.)\n\n| Bouton | Description |\n|---|---|\n| **Construire la séquence** | Crée ou met à jour la séquence de niveau. Le premier clic ouvre la boîte de dialogue. Ensuite, un clic réutilise vos choix. **Maj+clic**, ou le bouton **...** à côté, rouvre la boîte de dialogue. |\n| **Ouvrir la séquence** (Open Sequence) | Ouvre la séquence de niveau dans Sequencer. |\n| **Synchroniser avec la séquence** (Sync To Sequence) | Déplace les pistes de marques pour qu'elles correspondent à leurs marques, à la demande. |\n| **Reprendre le précédent** (Match Previous), **Reprendre le suivant** (Match Next), **Démarrer depuis...** (Start From...), **Vérifier la continuité** (Check Continuity) | Les outils de continuité. Voir ci-dessous. |\n| **Séquence active** | Change, ajoute ou retire les séquences du plateau. |\n\nLes outils de déplacement (Select Stage, Add To Stage, Attach Actors, Detach Actors) se trouvent sur la page **Plateau** (Stage). Voir [Plateaux et Stage Assets](03_stages.md).\n\n## Construire une séquence\n\n![Sequencer avec une séquence construite : un plan par caméra du plateau sur la piste Camera Cuts](media/fm_sequencer.png)\n\n1. Sélectionnez le plateau, ou rendez-le actif dans le panneau.\n2. Ouvrez la page **Séquence** et appuyez sur **Construire la séquence**.\n3. Dans la boîte de dialogue **Construire la séquence**, vérifiez la ligne **Plateau** (« The stage to build the sequence for. » : le plateau pour lequel construire la séquence), le nom et le dossier de la séquence, et les plans. La boîte de dialogue s'ouvre déjà remplie avec les noms et dossiers de Framemark. La ligne d'aperçu indique « Creates {name} » ou « Creates {name} with {n} shots, the first {length} » ou, pour une séquence existante, « Updates {name}. Name, folder and shots are for a new sequence. »\n4. Si vous le souhaitez, réglez **Commencer depuis** (Start From, « Each marked actor starts where it ends in this sequence: a stepped key at the start of the new one. » : chaque acteur marqué commence là où il termine dans cette séquence, avec une image clé constante au début de la nouvelle). **Aucun** (None, « Leave the marks where they are. » : laisser les marques où elles sont) est la valeur par défaut.\n5. Appuyez sur **Construire la séquence** dans la boîte de dialogue (« Create the stage's sequence with these settings, or add what is new to it. Your own edits are kept. » : crée la séquence du plateau avec ces réglages, ou y ajoute ce qui est nouveau ; vos propres modifications sont conservées).\n\nSequencer s'ouvre avec la séquence. Le message de résultat indique « Created {name}: {n} camera track(s), {n} mark track(s). », « Updated {name}: added ... » ou « {name} is already up to date. »\n\nCochez **Ne plus demander** (Don't ask again) pour que la boîte de dialogue cesse de s'ouvrir : « Ticked: from now on a click runs with these settings. Shift-click or the ... button opens this dialog again. Change it later in Editor Preferences > Framemark > Generate. » La boîte de dialogue fonctionne comme Add Level Sequence with Shots d'Unreal. Si la ressource ne peut pas être créée : « Could not create the Level Sequence asset. Check the Sequence Folder on the stage. »\n\n### Populate\n\n**Populate** est activé par défaut (cases **Characters** et **Accessoires** (Props) dans les réglages Generate). **Construire la séquence** et **Générer** (Generate) ajoutent à la séquence les personnages et accessoires liés de la scène. Un acteur déjà présent dans le niveau est ajouté comme **Possessable**. Un acteur qui n'y est pas est ajouté comme **Spawnable** à partir de son Blueprint lié. Les personnages et accessoires sans lien sont laissés de côté. Le message indique « Populate: {n} characters and props added to the sequence. » Dans la séquence, un personnage se tient sur sa propre marque, pas à la racine du plateau.\n\n### Track Settings\n\nSous-séquences vides facultatives, toutes désactivées par défaut, réglées dans la boîte de dialogue ou dans **Editor Preferences > Framemark > Generate > Track Settings** :\n\n- **Per shot** : ANM, FX, LGT, EDL. Chaque plan reçoit une piste comme `SH_ANM` contenant une séquence comme `ANM_SH069x00-01`.\n- **Per sequence** : FX, LGT. Pistes `SQ_FX` et `SQ_LGT`, contenant `LGT_SQ030-01`.\n\nModifiez les noms de types si votre studio en utilise d'autres. Les noms suivent les motifs **Shot Sub Sequence** et **Sequence Sub Sequence** de Naming. Voir [Référence des paramètres et de la nomenclature](11_settings-reference.md).\n\n### Generate From Screenplay\n\nLa fenêtre **Scénario** (Screenplay) a un bouton **Générer** et un bouton **...**. La boîte de dialogue **Générer à partir du scénario** (Generate From Screenplay) ajoute la ligne **Scénario**, **Scènes à inclure** (Scenes to include), et trois cases : **Créer des plateaux** (Create Stages, « Make a stage for each scene that has none. » : crée un plateau pour chaque scène qui n'en a pas), **Créer des séquences** (Create Sequences, « Make a Level Sequence for each scene that has none, named with its sequence code. » : crée une séquence de niveau pour chaque scène qui n'en a pas, nommée avec son code de séquence) et **Lier l'existant** (Link Existing, « Use a stage or sequence already there for the scene instead of making a second one. » : utilise un plateau ou une séquence déjà présent pour la scène au lieu d'en créer un second). **Générer** crée ou lie le plateau et la séquence de chaque scène cochée, avec ses personnages sur des marques et ses répliques sous forme de marqueurs de dialogue. Les plateaux sont **One Per Location** (la valeur par défaut) ou **One Per Scene**. Un nouveau plateau est nommé d'après l'abréviation du lieu, donc « tiny paris restaurant » donne `STG_TPR_A_v001`. Les plateaux que vous avez déjà ne sont pas renommés. Voir [Scénario et Story Map](08_screenplay-and-story-map.md).\n\n## Propriétés de séquence sur le plateau\n\n| Propriété | Description |\n|---|---|\n| **Linked Sequences** | Les séquences de niveau du plateau. La première est la séquence active. |\n| **Shot Length Seconds** | 4 par défaut, plage de l'interface de 0.5 à 30. |\n| **Sequence Folder** | L'endroit où les nouvelles séquences sont créées. |\n| **Hold Marks In Sequence** | Activé par défaut. Avancé. |\n| **Sequence Follows Stage** | Activé par défaut. Le plateau est l'origine de transformation de la séquence. |\n\n## Séquences multiples\n\n**Séquence active** liste les séquences du plateau. Choisissez-en une pour l'activer (« Active sequence: {name}. »). Il propose aussi **Ajouter une séquence** (Add Sequence) et **Retirer la séquence** (Remove Sequence). L'ajout indique « Added {name} to {stage}. It is the active sequence now; the others stay linked. » Le retrait indique « Removed {name} from {stage}. The sequence itself is kept. » Dans la fenêtre **Scénario**, **Changer de séquence** (Change Sequence) liste, change et retire les mêmes séquences.\n\n## Garder la séquence synchronisée\n\nAvec **Auto Sync Marks To Sequence** activé (par défaut, Editor Preferences), le déplacement d'une marque à la main, le choix d'un **Layout**, l'annulation ou le rétablissement déplacent la piste d'acteur de cette marque pour qu'elle corresponde, au prochain tick de l'éditeur. L'animation par images clés suit la marque : les images clés existantes se décalent du même delta. Plusieurs marques déplacées en une seule action sont regroupées. Cela ne se déclenche jamais pendant un PIE ni pendant une annulation ou un rétablissement.\n\n**Synchroniser avec la séquence** fait la même chose manuellement. Il indique « Moved {n} mark track(s) to match their marks. » Si un autre plateau partage la séquence, rien n'est déplacé.\n\n## Plans et lien avec le plateau\n\nQuand un plan ou la séquence est ouvert dans Sequencer, un bouton **Plateau** affiche « Stage: {name} » (« The stage that plays this sequence. Select it, frame it, or match actors between shots. » : le plateau qui joue cette séquence ; sélectionnez-le, cadrez-le, ou faites correspondre les acteurs d'un plan à l'autre). Son menu a pour titre « Stage for this sequence » avec **Select {stage}**, **Cadrer le plateau** (Frame Stage), **Synchroniser les marques avec la séquence** (Sync Marks To Sequence), et **Autres plateaux ici** (Other stages here) pour les plateaux qui jouent cette séquence ou l'un de ses plans. S'il n'y en a aucun : « No stage uses this sequence ». Choisissez un plateau et utilisez **Construire la séquence** pour le lier.\n\n## Outils de continuité\n\nOuvrez la séquence maître dans Sequencer et placez la tête de lecture à l'intérieur d'un plan.\n\n| Commande | Description |\n|---|---|\n| **Reprendre le précédent** | « Key every marked actor on the first frame of this shot where it ends the previous shot. » : crée une image clé pour chaque acteur marqué sur la première image de ce plan, là où il termine le plan précédent. Grisé tant qu'une séquence maître n'est pas ouverte avec la tête de lecture dans un plan qui en a un avant lui. |\n| **Reprendre le suivant** | Crée une image clé pour chaque acteur marqué sur la dernière image de ce plan, là où il commence le plan suivant. |\n| **Faire correspondre les acteurs au plan...** (Match Actors To Shot...) | Choisissez n'importe quel autre plan. Un plan situé avant celui-ci est mis en correspondance sur sa dernière image, un plan situé après sur sa première. |\n| **Démarrer depuis...** | Choisissez une séquence. Chaque acteur marqué reçoit une image clé constante sur la première image de la séquence du plateau, là où il termine dans celle que vous avez choisie. |\n| **Vérifier la continuité** | Liste les acteurs dont la première image dans un plan saute par rapport à leur position sur la dernière image du plan précédent. Grisé tant qu'une séquence maître avec au moins deux plans n'est pas ouverte. |\n\nMessages : « Matched {n} actor(s) to the last frame of {shot}, keyed on the first frame of this shot: {names}. » et « Left alone {n} with no matching track or position in that shot ». Si des plans utilisent la même séquence : « Those two shots use the same sequence, so there is nothing to match. » L'annulation s'appelle **Faire correspondre les acteurs au plan** (Match Actors To Shot). **Commencer depuis** indique « Started {n} actor(s) where they end in {sequence}, stepped keys on the first frame: {names}. » Les séquences verrouillées sont laissées intactes.\n\n## Liaisons\n\nTrois façons pour un acteur de piloter la piste d'une marque :\n\n1. **Actor** sur la marque : pour tout acteur placé dans le niveau.\n2. **Actor Tag** : avec **Auto Bind Actors By Tag** activé, un acteur dont le tag correspond au tag de liaison de la marque est lié automatiquement. Les NPC générés sont pris en charge de cette façon.\n3. **Players** : avec **Auto Bind Players** activé, les pawns des joueurs locaux correspondent aux marques par **Player Index** (0, 1, 2, 3). Une marque **Joueur** (Player) à -1 compte comme le joueur 0, donc le mode solo ne demande aucune configuration.\n\n| Propriété de liaison | Description |\n|---|---|\n| **Auto Bind Players** | Activé par défaut. |\n| **Auto Bind Actors By Tag** | Activé par défaut. |\n| **Snap Bound Actors To Marks** | Activé par défaut. |\n| **Player End Mark** | La marque (un nom) sur laquelle un joueur termine. |\n\nLes fonctions Blueprint **Bind Actor To Mark** (Mark Name, Actor, Snap To Mark) et **Bind Player To Mark** (Player Index, Snap To Mark) lient depuis le code.\n\n### Joueurs multiples\n\nDonnez à chaque marque **Joueur** son propre **Player Index**. Le plateau lie le pawn de chaque joueur local à la marque qui porte cet index. Pour le joueur 0, il se rabat sur la première marque **Joueur**.\n\n![Balayage d'une séquence construite, le hublot verrouillé sur Camera Cuts](media/fm_sequencer_playback.gif)\n\n### Lecture et interruptions\n\n| Propriété | Description |\n|---|---|\n| **Auto Trigger** | Manual, OnBeginPlay ou WhenPlayerEntersBoundary. |\n| **Play Once** | Désactivé par défaut. |\n| **Can Be Interrupted** | Désactivé par défaut. |\n| **Interrupt Triggers** | Des acteurs avec des événements de chevauchement. |\n| **Interrupt Sequence** | « Optional sequence to play after an interrupt. » : séquence facultative à jouer après une interruption. |\n\nLes fonctions Blueprint **Play Stage**, **Stop Stage**, **Interrupt Stage** et **Reset Has Played** contrôlent la lecture.\n\n## Déplacer\n\nAvec **Sequence Follows Stage** activé, déplacez ou faites pivoter le plateau et les caméras bougent avec lui. Les données de la séquence elles-mêmes ne changent pas. Les acteurs ne sont pas attachés par défaut. Utilisez **Attacher les acteurs** (Attach Actors), **Détacher les acteurs** (Detach Actors), **Ajouter au plateau** (Add To Stage), **Choisir un plateau** (Select Stage) et **Aligner les Actors sur les marques** (Snap Actors To Marks) de la page **Plateau**. Voir [Plateaux et Stage Assets](03_stages.md).\n\n## Key To Mark\n\nVoir [Marques et mise en place](04_marks-and-blocking.md). **Clé vers la marque** (Key To Mark) se trouve dans le menu du clic droit et sur la touche K. Le menu de liaison propre à Sequencer n'a pas d'entrée distincte.\n\n## Limitations connues\n\n- L'import Shot Designer n'a été vérifié que sur une seule scène pour l'instant.\n- Les images clés créées avant le 13 octobre ne suivent pas leurs marques.\n\n## Voir aussi\n\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Caméras et lumières](05_cameras-and-lights.md)\n- [Scénario et Story Map](08_screenplay-and-story-map.md)\n- [Rendu et publication](10_render-and-publish.md)\n- [Dépannage et limitations connues](14_troubleshooting.md)\n"}, {"file": "07_planner.md", "slug": "planner", "title": "Le Planner", "md": "# Le Planner\n\nLe **Planificateur** (Planner) est une fenêtre ancrable qui montre votre plateau vu de dessus. Vous y placez des marques, des caméras, des lumières et des accessoires, vous tracez des déplacements et des mouvements de caméra, vous cadrez des plans et vous décrivez ce qui se passe dans chaque plan, sans quitter un dessin plat et lisible. Tout ce que vous faites dans le Planner modifie le même Stage Asset que celui du hublot du niveau, donc le plan et la scène 3D restent synchronisés.\n\nOuvrez-le depuis **Window > Framemark > Framemark Planner**. Son onglet s'appelle **Planificateur**.\n\n> **Remarque :** **Vue de dessus** (Overhead View) et le **Planificateur** sont deux choses différentes. **Vue de dessus** bascule le hublot du niveau lui-même sur une caméra vue de dessus. Le **Planificateur** est une fenêtre distincte, avec son propre canevas, ses outils, ses panneaux et ses étapes d'annulation. Vous pouvez utiliser l'un, l'autre, ou les deux en même temps.\n\n## Prérequis\n\n- Le plug-in Framemark est activé (voir [Prise en main](01_getting-started.md)).\n- Un niveau est ouvert. Il n'est pas nécessaire d'avoir un plateau dans le niveau : le Planner peut créer un **New Stage** (Nouveau plateau) qui n'existe que sous forme de Stage Asset tant que vous ne l'avez pas placé.\n- Facultatif : le plug-in compagnon **Framemark Light Rig Bridge** et le plug-in de rig d'éclairage, pour l'anneau de lumière (voir [Anneau de lumière](#light-ring)).\n\n## Overhead View et le Planner\n\n| | Overhead View | Planner |\n|---|---|---|\n| Ce que c'est | Un basculement du hublot | Une fenêtre avec son propre canevas |\n| Commande | **Vue de dessus** (touche **O**) | **Window > Framemark > Framemark Planner** |\n| Infobulle | « Bascule le hublot entre une vue de dessus et la vue 3D normale. » | « Le plateau vu de dessus. Placez des marques, des caméras et des lumières, orientez les plans et écrivez ce qui se passe dans chacun. » |\n| Affiche | Le vrai niveau vu de dessus, cadré sur la limite du plateau | Un plan dessiné : limite, image d'arrière-plan, marques, trajets, caméras, lumières, accessoires, croquis |\n| Appuyer à nouveau | Rétablit le hublot que vous aviez avant | Sans objet |\n\nUtilisez **Vue de dessus** quand vous voulez la vraie géométrie et l'éclairage du niveau sous vos marques. Utilisez le **Planificateur** quand vous voulez un dessin net, un panneau Shots, des calques, l'accrochage, des repères et la feuille d'export.\n\n## La fenêtre Planner\n\n![Le Planner avec le plateau Lamp Room](media/fm_planner.png)\n*Le **Planificateur** sur `STG_LampRoom` : rail d'outils, canevas du plan avec limite, marques et cônes de caméra, panneaux Layers, Details et Library.*\n\nLa fenêtre comprend une barre supérieure, un rail d'outils, le plan et un ensemble de panneaux ancrables.\n\n1. Barre supérieure : onglets de plateau, **New Stage**, sélecteur de plateau, aimant d'accrochage, bascule **Synchronisé avec le niveau** (Synced With Level) / **Brouillon** (Draft), **Roue rapide** (Quick Wheel), **Paramètres** (Settings).\n2. Rail d'outils : les outils de dessin (voir [Outils](#tools)).\n3. Plan : le canevas.\n4. Panneaux : **Plan**, **Plans** (Shots), **Calques** (Layers), **Détails** (Details), **Bibliothèque** (Library), **Scénario** (Screenplay), plus un onglet **Capturer** (Capture).\n5. Barre d'état : position du curseur, accrochage, unités et rotation.\n\n### Menu Panels\n\nChaque panneau peut être affiché ou masqué depuis le menu **Panneaux** (Panels, aussi sous **Paramètres**).\n\n| Panneau | Contenu |\n|---|---|\n| **Plan** | « Le plateau vu de dessus : le rail d'outils et le plan. » |\n| **Plans** | « Une carte par caméra. Cliquez sur une carte pour sélectionner sa caméra, saisissez ce qui se passe dans le plan, déposez-y des images de référence. » |\n| **Calques** | La liste des calques (voir [Calques](#layers)). |\n| **Détails** | Propriétés de la sélection, de l'image d'arrière-plan et du croquis. |\n| **Bibliothèque** | « Ressources Framemark : dossiers, favoris, filtres rapides et Utilisé dans. » |\n| **Scénario** | « La scène liée à ce plateau. » Voir [Scénario et Story Map](08_screenplay-and-story-map.md). La page a la même largeur que la fenêtre **Scénario**. |\n| **Capturer** | « Capturer depuis le niveau : une capture du niveau en vue de dessus sous le plateau, définie comme Arrière-plan à la bonne échelle. » |\n\n### Onglets de plateau\n\nChaque Stage Asset ouvert a son onglet. Un onglet qui contient un brouillon affiche \" *\" après son nom.\n\nFaites un clic droit sur un onglet pour obtenir :\n\n- **Fermer** (Close)\n- **Fermer les autres** (Close Others)\n- **Fermer à droite** (Close To The Right)\n- **Renommer** (Rename)\n- **Accéder à la ressource** (Browse To Asset)\n- **Ouvrir dans le niveau** (Open In Level)\n\n**New Stage** crée un Stage Asset sans le placer. Le message affiché est « Made Stage Asset {0} in {1}. It is not in the level until you place it. » (Stage Asset {0} créé dans {1}. Il n'est pas dans le niveau tant que vous ne le placez pas.) Utilisez la liste déroulante « Pick a stage » (Choisir un plateau) pour passer à un autre plateau.\n\n### Synced With Level et Draft\n\nPar défaut, le Planner est **Synchronisé avec le niveau** : déplacer une marque sur le plan la déplace dans le niveau.\n\nDésactivez la synchronisation pour travailler dans un **Brouillon**. Les modifications ne touchent alors que la copie du Planner, et l'étiquette du hublot indique « Draft in Planner » (Brouillon dans le Planner).\n\n| Action | Résultat |\n|---|---|\n| **Enregistrer** (Save) (**Ctrl+S**) | \"Every placement in the level updates to it, as one undo step.\" (Chaque placement dans le niveau est mis à jour, en une seule étape d'annulation.) |\n| **Enregistrer sous** (Save As) | Crée un nouveau Stage Asset dans son propre onglet. |\n| Réactiver la synchronisation avec un brouillon | Une invite propose **Enregistrer et synchroniser** (Save and Sync), **Abandonner le brouillon** (Discard Draft) ou **Annuler** (Cancel). |\n\n> **Astuce :** Utilisez un Draft pour essayer trois idées de mise en place sans toucher au niveau. Faites **Enregistrer sous** pour chacune, puis gardez celle qui vous plaît.\n\n## Outils\n\nChoisissez un outil dans le rail, ou appuyez sur sa touche. Chaque modification est une étape d'annulation.\n\n| Outil | Touche | Fonction |\n|---|---|---|\n| **Sélectionner** (Select) | **Q** | Cliquez, tracez un cadre, **Ctrl** ou **Shift** pour ajouter. Faites glisser pour déplacer. Appuyez sur **E** et faites glisser pour tourner. |\n| **Pan** (Panoramique) | **Space** (maintenue) | Faites glisser pour faire un panoramique. Le bouton central ou droit fait aussi un panoramique. La molette zoome. |\n| **Marque** (Mark) | **M** | Cliquez pour placer. Cliquez et faites glisser pour définir l'orientation. |\n| **Caméra** (Camera) | **C** | \"A camera is a shot.\" (Une caméra est un plan.) Cliquez pour placer. |\n| **Clair** (Light) | **L** | Ouvre un menu : **Spot**, **Point**, **Rect**. **Directional** est disponible depuis la liste de changement de type. |\n| **Accessoire** (Prop) | **P** | Placer un accessoire. |\n| **Path** | **W** | Tracer une marche, une course, un virage ou un mouvement de caméra. |\n| **Measure** (Mesurer) | **U** | Mesurer une distance sur le plan. |\n| **Croquis** (Sketch) | aucune | Lance un **Nouveau croquis** (New Sketch), ou ouvre le croquis existant (dans Odyssey s'il est installé). |\n\nSi un type de lumière n'a pas de préréglage, le Planner indique « No {0} preset. Add one in Editor Preferences > Framemark > Lights. » (Aucun préréglage {0}. Ajoutez-en un dans Editor Preferences > Framemark > Lights.)\n\nLe rail suit les outils de l'espace de travail. Les outils qui ne placent rien exécutent la commande de mode correspondante, et la **Roue rapide** s'ouvre sur le plan.\n\n> **Remarque :** Quand un personnage éclairé ou un rig est sélectionné, une bande verticale de commandes de l'anneau de lumière apparaît sous un séparateur sur le rail. Voir [Anneau de lumière](#light-ring).\n\n### Menu du clic droit\n\nFaites un clic droit sur le plan pour afficher le menu Framemark partagé, avec les mêmes sections que le menu Framemark du hublot du niveau : **Placer une marque ici** (Place Mark Here), **Placer une caméra ici** (Place Camera Here), **Placer une lumière ici** (Place Light Here), Mark, Actor, Edit, Position, Colour, Overlapping Marks, Group, Camera et Stage. Voir [Interface du mode Framemark](02_interface.md).\n\nUn clic droit sur un trajet ajoute les commandes de trajet (voir [Trajets](#paths)).\n\n## Sélectionner, déplacer et tourner\n\n1. Choisissez **Sélectionner** (**Q**).\n2. Cliquez sur un élément, ou tracez un cadre autour de plusieurs éléments. Maintenez **Ctrl** ou **Shift** pour ajouter à la sélection.\n3. Faites glisser pour déplacer.\n4. Appuyez sur **E**, puis faites glisser pour tourner.\n\nQuand vous sélectionnez plusieurs éléments, la barre indique « {0} selected » ({0} sélectionnés) et propose **Nouvelle configuration** (New Setup).\n\nLes éléments verrouillés ne peuvent pas être supprimés : « Those are locked. Unlock them to delete. » (Ils sont verrouillés. Déverrouillez-les pour les supprimer.)\n\n## Barres de sélection\n\nUne barre apparaît au-dessus du plan pour l'élément sélectionné.\n\n### Marque\n\n**Rôle** (Role), **Couleur** (Colour), **Mettre au premier plan** (Bring To Front), **Mettre à l'arrière-plan** (Send To Back), **Spread**, **Verrouiller** (Lock), **Dupliquer** (Duplicate), **Supprimer** (Delete).\n\n### Caméra\n\n| Commande | Description |\n|---|---|\n| **Objectif** (Lens) | La longueur focale, affichée sous la forme « {0} mm ». |\n| **Cone** | Active ou désactive le cône de champ de vision sur le plan. |\n| **Regarder la marque...** (Look At Mark...) | Oriente la caméra vers une marque. |\n| **Supprimer le lien** (Unlink) | Rompt la liaison Look At. |\n| **Regarder à travers** (Look Through) | Pilote la caméra dans le hublot du niveau (**Ctrl+Shift+P**). |\n| **Régler sur le hublot** (Set To Viewport) | Règle la caméra sur la vue actuelle du hublot. |\n| Indicateur Mark Order | Indique la place de cette caméra dans le Mark Order. |\n\nLa poignée de mise au point de la caméra est de couleur ambre sur le plan, avec une bande de profondeur de champ douce tracée jusqu'à 100 m. À côté de **Manual Focus Distance** dans **Détails**, la pipette **Sample Scene Depth** vous permet de « Pick a spot in front of the camera. » (Choisir un point devant la caméra.) Appuyez sur **Esc** pour annuler.\n\n### Lumière\n\n- Changez le type entre **Ponctuelle** (Point), **Projecteur** (Spot), **Rectangulaire** (Rect) et **Directionnelle** (Directional). Le changement conserve la position, la couleur, l'intensité et les configurations.\n- Réglez l'intensité dans l'unité qui convient à la lumière : cd, lm, EV, nits ou lux.\n- Définissez un **Gobo** : un matériau Light Function, ou une texture source sur les lumières rectangulaires.\n- Appliquez des préréglages de lumière.\n\n## Trajets\n\nUn trajet enregistre un mouvement. Choisissez l'outil **Path** (**W**), cliquez pour ajouter des points, puis appuyez sur **Enter** ou double-cliquez pour terminer un trajet libre. **Esc** l'abandonne.\n\n### Types de trajet\n\n| Type | Description |\n|---|---|\n| **Marche** (Walk) | Un personnage marche sur ce trajet. |\n| **Course** (Run) | Un personnage court sur ce trajet. |\n| **Rotation** (Turn) | \"Turns in place on its mark...\" (Tourne sur place sur sa marque...) |\n| **Caméra** | Un mouvement de caméra : en pointillés, avec des liaisons de travelling, à hauteur d'objectif. |\n\nLes trajets prennent la couleur de leur marque. Dans le plan exporté, une marche est une ligne en pointillés avec un chevron ouvert, une course est faite de longs tirets épais avec une double pointe pleine, et un virage est un arc fin en pointillés.\n\n> **Remarque :** L'infobulle intégrée de **Marche** la décrit comme « A solid line with one arrow. » (Une ligne continue avec une flèche.) Le résultat dessiné est une ligne en pointillés avec un chevron ouvert, ce que montre l'export.\n\n### Modifier un trajet\n\nL'indication du Planner indique : « Drag the squares to reshape, the round handles to curve. Drop an end on a mark to pin it. Double-click adds a point, Delete removes the picked point or the path. » (Faites glisser les carrés pour remodeler, les poignées rondes pour courber. Déposez une extrémité sur une marque pour l'épingler. Un double-clic ajoute un point, Delete supprime le point choisi ou le trajet.)\n\n- Un trajet garde au moins 2 points.\n- Faites un clic droit sur un trajet pour obtenir **Ajouter un point ici** (Add Point Here), **Supprimer le point** (Remove Point), **Supprimer le trajet** (Delete Path), les choix de **Type** (Kind, **Marche**, **Course**, **Rotation**, **Caméra**), et les options de sol **Sol** (Floor), **Éviter les collisions** (Avoid Collision) et **Mettre au niveau du sol** (Level To Floor).\n- **Éviter les collisions** fait contourner au trajet la géométrie du niveau. **Mettre au niveau du sol** pose le trajet sur le sol.\n\n### Virage sur place\n\nSur des marques empilées au même endroit, le menu **Turn To / Turn From** crée un virage : une marque qui tourne de sa propre orientation vers la suivante.\n\n## Limite\n\nLa limite est le contour du plateau. Une limite a besoin d'au moins 3 points.\n\n- Faites glisser la bande pour la déplacer.\n- Faites glisser les points carrés pour la redimensionner.\n- Faites glisser les poignées rondes pour courber un bord. La forme devient **Personnalisé** (Custom).\n- Double-cliquez pour ajouter un point.\n- Appuyez sur **Supprimer** pour supprimer le point sélectionné.\n\nUtilisez **Ajuster la limite** (Fit Boundary, **To Stage**) et **Définir la taille de la limite** (Set Boundary Size) / **Shape** pour la définir numériquement. Voir [Plateaux et Stage Assets](03_stages.md).\n\n## Image d'arrière-plan et croquis\n\nSélectionnez l'arrière-plan dans **Calques** ou **Détails**.\n\n| Commande | Description |\n|---|---|\n| **Définir l'arrière-plan...** (Set Background...) | Choisir une image. |\n| **Capturer depuis le niveau** (Capture From Level) | Réalise une capture du niveau vue de dessus. Options : **View Mode**, **Afficher** (Show), **Organiseur** (Outliner), **Sous-niveaux** (Sublevels), **Masquer au-dessus de** (Hide above), **Resolution**, recadrage, **Valider** (Commit). |\n| **Modifier l'arrière-plan** (Edit Background) | Modifier le placement de l'image. |\n| **Mettre l'arrière-plan à l'échelle** (Scale Background) | Cliquez sur deux points, puis saisissez la « Real distance between the two points » (distance réelle entre les deux points) et choisissez **Appliquer** (Apply) ou **Annuler**. |\n| **Effacer l'arrière-plan** (Clear Background) | Supprime l'image. La ressource de texture est conservée. |\n| **Placer sur le plateau** (Place On Stage) | Place l'image sur le plateau. |\n\nPropriétés de l'image : **Visible**, **Opacité** (Opacity), **Largeur** (Width), **Rotation**, **Outil Échelle** (Scale tool).\n\nLe croquis propose **Modifier** (Edit), **Nouveau croquis** et **Actualiser le fond** (Refresh Underlay). Réglez **Résolution du croquis** (Sketch Resolution) sous **Paramètres** (« {0} px »). Les valeurs élevées sont lentes, et 8192 est lent sur certaines machines.\n\n## Calques\n\nLe panneau **Calques** liste : **Arrière-plan** (Background), **Limite** (Boundary), **Définir** (Set), **Images**, **Marques** (Marks), **Caméras** (Cameras), **Lumières** (Lights), **Croquis**, et les accessoires (Props).\n\n- L'œil masque un calque sur le plan uniquement. Il ne masque rien dans le niveau.\n- Cliquez sur un œil avec **Alt** pour n'afficher que ce calque.\n- Le cadenas empêche la sélection sur ce calque. **Arrière-plan** est verrouillé au départ.\n- Faites glisser la poignée pour réordonner. **Réinitialiser l'ordre** (Reset Order) rétablit l'ordre par défaut.\n\nFaites un clic droit sur une ligne pour obtenir **Tout afficher** (Show All), **Afficher uniquement** (Show Only), **Verrouiller** / **Déverrouiller** (Unlock), **Tout sélectionner dans le calque** (Select All In Layer), **Renommer** (les calques intégrés gardent leur nom) et **Couleur...** (Colour...). Les couleurs des calques sont enregistrées dans Editor Preferences (`PlanLayerColours`, catégorie **Overhead**).\n\n## Panneau Shots\n\nLe panneau **Plans** contient une carte par caméra.\n\n- Cliquez sur une carte pour sélectionner sa caméra.\n- Saisissez ce qui se passe dans le plan dans la description (« What happens in this shot », Ce qui se passe dans ce plan).\n- Ajoutez des images de référence en les déposant sur la carte. Supprimez-les, ou épinglez-en une.\n- Cliquez sur une image pour ouvrir la fenêtre d'image agrandie : molette pour zoomer, un curseur, et un clic sur le % pour revenir à 100 %.\n\n## Accrochage, grille et repères\n\nL'aimant d'accrochage affiche « Grid snap size: {0} » (Taille d'accrochage à la grille : {0}). Maintenez **Alt** dans le plan pour déplacer librement.\n\n| Réglage | Emplacement | Description |\n|---|---|---|\n| **Aimanter à** (Snap To) | **Paramètres** | **Aimanter à la grille** (Snap to Grid), **Aimanter aux guides** (Snap to Guides), **Guides intelligents** (Smart Guides). |\n| **Guides** | **Paramètres** | **Afficher les guides** (Show Guides), **Verrouiller les guides** (Lock Guides), **Effacer les guides** (Clear Guides). |\n| **Taille de la grille** (Grid Size) | **Paramètres** | **Désactivé** (Off) ou « {0} cm ». |\n| `PlannerGridSizeCm` | Editor Preferences, **Planificateur** | 50 cm par défaut. Plage de 5 à 500 dans le curseur. Les lignes principales sont tracées toutes les dix. |\n\nPour créer un repère, faites glisser depuis le bord supérieur ou gauche du plan. Faites glisser un repère hors du plan pour le supprimer. Une ligne rose signale une correspondance avec un repère intelligent. Les repères appartiennent à l'espace de travail.\n\nPendant le déplacement, **Shift** verrouille le mouvement sur un axe (horizontal, vertical ou 45 degrés). **Alt** ignore l'accrochage et les repères intelligents.\n\n## Menu Settings\n\n| Élément | Options |\n|---|---|\n| **Thème** (Theme) | **Sombre** (Dark), **Clair** |\n| **Unités** (Units) | **Mètres** (Metres), **Pieds** (Feet) |\n| **Emplacement de la barre d'outils** (Toolbar Location) | **Plan** (le rail est à côté du plan), **Aucun** (None) |\n| **Panneaux** | Afficher ou masquer chaque panneau |\n| **Vue** (View) | **Réinitialiser la rotation** (Reset Rotation) |\n| **Résolution du croquis** | « {0} px » |\n| **Aimanter à**, **Guides**, **Taille de la grille** | Voir ci-dessus |\n\nSon infobulle indique « Planner settings: theme, units, toolbar location, panels and view rotation » (Paramètres du Planner : thème, unités, emplacement de la barre d'outils, panneaux et rotation de la vue).\n\n### Planner Mark Look\n\nDans Editor Preferences, **Planner Mark Look** (catégorie **Look**) définit l'aspect des marques : **Ring** (par défaut), **Shoulders** ou **Personnalisé**. L'export du plan dessine le même aspect.\n\n## Commandes de la vue\n\n| Action | Entrée |\n|---|---|\n| Zoom | Molette de la souris |\n| Panoramique | Maintenez **Space** et faites glisser, ou faites glisser avec le bouton central ou droit |\n| Faire pivoter la vue | **Alt** + glisser avec le bouton droit ou central |\n| Réinitialiser la vue | Double-cliquez sur la boussole |\n| Réinitialiser la rotation | **Settings > View > Reset Rotation** |\n| Tout cadrer | **F** |\n\nLa barre d'état indique « Cursor off the plan » (Curseur hors du plan) quand le pointeur est à l'extérieur, puis « Snap {0} », « Units {0} » et la rotation de 0 à 360.\n\n## Touches sur le plan\n\n| Touche | Action |\n|---|---|\n| **Esc** | Abandonner le brouillon, revenir à **Sélectionner**, ou désélectionner |\n| **Enter** | Terminer un trajet libre |\n| **Ctrl+Z**, **Ctrl+Shift+Z**, **Ctrl+Y** | Annuler et rétablir (uniquement dans la fenêtre active) |\n| **Ctrl+D** | Dupliquer |\n| **Ctrl+A** | Tout sélectionner |\n| **Ctrl+C**, **Ctrl+X**, **Ctrl+V** | Copier, couper, coller (le collage va au curseur quand il est sur le plan) |\n| **Ctrl+Shift+P** | Look Through |\n| **Tab** | Quick Wheel |\n| **Supprimer**, **BackSpace** | Supprimer la sélection, ou supprimer le point de la limite si la limite est sélectionnée |\n| **F** | Tout cadrer |\n| **F2** | Renommer l'élément sélectionné (un seul) |\n| **E** | Armer la rotation |\n| **K** | Sélecteur Key To Mark |\n| **O** | Bascule Overhead View |\n| **Q**, **M**, **C**, **L**, **P**, **U**, **W** | Outils |\n\nVoir [Référence des raccourcis clavier](13_shortcuts.md) pour tous les raccourcis de Framemark.\n\n## Export Plan\n\nUtilisez **Exporter le plan** (Export Plan) pour enregistrer un dessin du plateau vu de dessus à l'intention d'un réalisateur, d'un producteur ou d'un imprimeur. Vous le trouverez sur la page **Share**, ou dans le Planner.\n\nLa boîte de dialogue s'intitule « Export Plan: {0} ».\n\n1. Choisissez un **Format**.\n2. Choisissez **Style**, **Taille** (Size) et l'orientation.\n3. Renseignez le **Cartouche** (Title Block).\n4. Cochez les éléments à inclure dans **Inclure** (Include).\n5. Choisissez un **Arrière-plan**.\n6. Cochez **Ouvrir le fichier à la fin** (Open file when done) si vous voulez ouvrir le fichier.\n7. Cliquez sur **Exporter** (Export), choisissez un nom et un emplacement, puis enregistrez.\n\n| Section | Options |\n|---|---|\n| **Format** | **Image** : « Fichier image à la taille choisie. » (PNG). **Dessin vectoriel** (Vector drawing) : « Fichier vectoriel. Net à toutes les tailles, s'ouvre dans Illustrator, Figma ou Miro. » (SVG). **Document** : « Fichier vectoriel d'une page, à imprimer ou à envoyer. Le texte est dessiné en formes, donc le rendu est identique sur tous les ordinateurs. » (PDF) |\n| **Style** | **Sombre**, **Clair** |\n| **Taille** | **A4**, **A3**, **1920 x 1080**, **3840 x 2160**, **Personnalisé** (400 à 8192 px), et **Paysage** (Landscape) / **Portrait** |\n| **Cartouche** | **Scène** (Scene, indication « For example Scene 12 Setup 2 », par exemple Scene 12 Setup 2 ; pré-rempli à partir du scénario), **Auteur** (Author) |\n| **Inclure** | **Grille** (Grid), **Légende** (Legend), **Limite**, **Marques**, **Accessoires** (Props), **Caméras**, **Champ de vision de la caméra** (Camera field of view), **Lumières**, **Notes**, **Axe d'action** (Line of action), **Couleurs des configurations** (Setup colours) |\n| **Arrière-plan** | Un rendu du niveau vu de dessus, avec **Hauteur de coupe (cm)** (Cut Height (cm)) de 50 à 5000 |\n| Pied de page | **Ouvrir le fichier à la fin**, **Exporter** (« Choisissez un nom et un emplacement de fichier, puis enregistrez le plan. », Choisissez un nom de fichier et un emplacement, puis enregistrez le plan.), **Annuler** |\n\nLe nom de fichier par défaut suit le modèle de nommage Stage avec `{type}` défini sur `plan`. L'extension est `png`, `svg` ou `pdf`. Vos choix sont conservés d'un export à l'autre.\n\nLa **Légende** ne liste que ce qui figure sur le plan : marques, accessoires, caméras, lumières, limite, trajets, ligne d'action et configurations. Un disque boussole indique l'avant du plateau.\n\nSi aucun des éléments **Limite**, **Marques**, **Accessoires**, **Caméras** ou **Lumières** n'est coché, **Limite** est activé pour vous.\n\n| Message | Signification |\n|---|---|\n| « Exported plan for '{0}'. » | Succès. |\n| « The plan was saved to {0}, but no program could open it. » | Le fichier existe, mais votre système n'a aucun programme pour l'ouvrir. |\n| « The top-down render needs the editor to be rendering, so the plan has no background picture. » | Désactivez l'arrière-plan ou amenez l'éditeur au premier plan. |\n| « That page size is too small for the elements chosen. » | Choisissez une taille plus grande ou cochez moins d'éléments. |\n\n> **Remarque :** L'infobulle de la commande indique « Save a top-down plan of the stage as an image or SVG ». La boîte de dialogue exporte aussi un **Document** PDF.\n\n## Anneau de lumière\n\nQuand le plug-in **Framemark Light Rig Bridge** et le plug-in de rig d'éclairage sont chargés, le Planner affiche les trois lumières de chaque rig sur un anneau autour de la tête du personnage que le rig suit. Sans bridge chargé, le Planner reste inchangé.\n\n- Les points **Key**, **Fill** et **Rim** sont dessinés dans leurs propres couleurs.\n- Les arcs libellés **Broad**, **Short** et **Behind** sont mesurés à partir de la **shot camera** : la caméra choisie dans le Planner, sinon la caméra de plateau la plus proche qui vise le personnage. Sans caméra, l'anneau s'affiche sans arcs.\n- Un rig appartient à un seul personnage. Un rig est basé sur le personnage, pas sur une marque.\n\n| Action | Entrée |\n|---|---|\n| Déplacer une lumière autour de la tête | Faites glisser un point. Il s'accroche aux angles de la caméra (des losanges bleus marquent les points d'accrochage). |\n| Changer la hauteur | **Alt** + glisser. Une petite jauge de profil s'affiche. |\n| Changer la luminosité | Molette de la souris sur un point. Un demi-diaphragme par cran. |\n| Isoler une lumière | **Alt** + clic. C'est une vue de l'éditeur, jamais enregistrée ni annulable. |\n| Remettre la lumière en place | **Esc** |\n| Copier l'éclairage vers un autre personnage | Faites glisser la pastille du rig (trois points colorés) sur l'autre personnage. Le glissement affiche « Copy look to {0} ». L'étape d'annulation est « Copy Look: {0} to {1} ». |\n\nLa bande verticale du rail est la barre d'outils rapide SLR. Elle ne s'affiche que lorsqu'un personnage éclairé ou un rig est sélectionné.\n\n> **Remarque :** Le type **Rig** de **Placer une lumière** (Place Light) ne fonctionne que depuis le hublot. L'outil **Clair** du Planner place des lumières simples. Voir [Caméras et lumières](05_cameras-and-lights.md).\n\n## Voir aussi\n\n- [Interface du mode Framemark](02_interface.md)\n- [Plateaux et Stage Assets](03_stages.md)\n- [Marques et mise en place](04_marks-and-blocking.md)\n- [Caméras et lumières](05_cameras-and-lights.md)\n- [Scénario et Story Map](08_screenplay-and-story-map.md)\n- [Import, export et partage](09_import-export.md)\n- [Référence des raccourcis clavier](13_shortcuts.md)\n"}, {"file": "08_screenplay-and-story-map.md", "slug": "screenplay-and-story-map", "title": "Scénario et Story Map", "md": "# Scénario et Story Map\n\nLa fenêtre **Scénario** (Screenplay) affiche votre script sous forme de page, à côté de vos plateaux. Vous importez un fichier Fountain, Final Draft, texte, ink ou articy, vous liez chaque scène à un plateau et à une séquence de niveau, vous relisez les révisions, et vous modifiez les notes de scène, la distribution et les accessoires. La **Carte de l'histoire** (Story Map) dessine les histoires à embranchements (ink et articy) sous forme de boîtes et de fils. Framemark peut aussi réécrire vos modifications dans la source ink ou articy.\n\nOuvrez la fenêtre depuis **Window > Framemark > Framemark Screenplay**. Son infobulle indique « The screenplay as a page: scenes, revisions and changes to review. Click a scene to select its stage. » (Le scénario sous forme de page : scènes, révisions et changements à relire. Cliquez sur une scène pour sélectionner son plateau.)\n\n## Prérequis\n\n- Le plug-in Framemark est activé.\n- Un fichier de scénario de l'un de ces types : `*.fountain`, `*.spmd`, `*.fdx`, `*.txt`, `*.ink`, `*.articyue`.\n- Pour la réécriture articy : articy:draft X avec le plug-in **Framemark Bridge** installé (voir [Apply Changes dans articy:draft](#apply-changes-in-articydraft)).\n\n## Importer un scénario\n\n1. Ouvrez **Window > Framemark > Framemark Screenplay**.\n2. Cliquez sur **Importer** (Import). La boîte de dialogue d'import s'ouvre sur la source **Scénario**.\n3. Cliquez sur **Parcourir** (Browse) et choisissez votre fichier, ou collez un chemin.\n4. Réglez les **Options du scénario** (Screenplay Options, ci-dessous).\n5. Vérifiez la **Aperçu** (Preview).\n6. Cliquez sur **Importer**. Une seule étape d'annulation remet tout en place.\n\nVous pouvez aussi choisir un scénario déjà présent dans le projet avec le sélecteur **Scénario** : « The script to work from. Search, pick, browse to it, or clear it to None. » (Le script avec lequel travailler. Recherchez-le, choisissez-le, parcourez jusqu'à lui, ou effacez-le pour obtenir None.)\n\n### Options du scénario\n\n| Option | Description |\n|---|---|\n| **Créer des plateaux** (Create Stages) | Crée un plateau pour chaque nouvelle scène. |\n| **Personnages en marques** (Characters To Marks) | Crée une marque pour chaque personnage de la scène. Nécessite **Créer des plateaux** ou **Lier l'existant** (Link Existing). |\n| **Lier l'existant** | Lie les scènes à des plateaux qui existent déjà. |\n| **Créer des séquences** (Create Sequences) | Crée une séquence de niveau pour chaque scène. |\n| **Marqueurs de dialogue** (Dialogue Markers) | Ajoute des marqueurs de dialogue minutés à chaque séquence. Nécessite **Créer des séquences** ou **Lier l'existant**. |\n| **Rythme %** (Pace %) | Règle la vitesse de lecture. 100 % correspond à 150 mots par minute, plus des pauses pour (beat) et (pause), et une page d'action par minute. |\n| **Suivre les modifications** (Track Changes) | Compare avec l'import précédent et marque les changements à relire. |\n\nSi l'import créait plus de 24 nouvelles scènes, on vous demande : « Make a stage for every one now? » (Créer un plateau pour chacune maintenant ?)\n\nLes ressources de scénario sont créées par défaut sous `/Game/Framemark/Scripts`.\n\n### Formats pris en charge\n\n| Format | Remarques |\n|---|---|\n| Fountain (`.fountain`, `.spmd`) | La page de titre, les en-têtes de scène (forcés avec `.`, `INT`, `EXT`, `EST`, `I/E`, numéros tels que `#12A#`), les répliques de personnage (`@`), les transitions, le texte centré et les sauts de page sont lus. Les sections et les synopsis sont ignorés. Les éléments de mise en page comme (MORE) et CONTINUED sont supprimés. Les marques d'emphase sont retirées. |\n| Final Draft (`.fdx`) | Lit l'élément FinalDraft. Un fichier qui n'en contient pas génère une erreur. |\n| Texte brut (`.txt`) | Lu comme du Fountain. |\n| ink (`.ink`) | Voir [ink](#ink). |\n| articy (`.articyue`) | Voir [articy](#articy). |\n\n### ink\n\n| Source ink | Devient |\n|---|---|\n| `=== knot ===` | Une scène |\n| `= stitch` | Une ligne **Plan** (Shot) |\n| `Name: line` | Personnage plus dialogue |\n| `* [text]` ou `+ text` | `CHOICE: text TO KNOT` |\n| `-> knot` | `GO TO KNOT` |\n| `-> END`, `-> DONE` | `END` |\n| Balises `# title:` et `# author:` | La page de titre |\n\nIgnorés : les lignes `~`, `VAR`, `CONST`, `LIST`, `INCLUDE`, `EXTERNAL`, les fonctions et les lignes `{`. La logique en ligne `{logic|alt}` est supprimée. Les fichiers nommés par `INCLUDE` ne sont pas suivis.\n\n### articy\n\nFramemark lit directement l'export `.articyue`.\n\n- Chaque **Dialogue** devient une scène.\n- Un **DialogueFragment** donne le Speaker comme personnage, les StageDirections comme didascalie, et le Text comme dialogue.\n- Deux connexions ou plus sortant d'un fragment deviennent `CHOICE: <MenuText>`.\n- Un **Jump** donne `GO TO NAME`.\n- Un Dialogue situé dans un Document est ignoré quand le Flow en contient un du même nom.\n- Le texte localisé utilise la langue de l'éditeur, sinon la première langue listée.\n\n## Lire la fenêtre Screenplay\n\n![La fenêtre Screenplay : les panneaux Scenes, Scene et Cast à côté de la page, avec les couleurs de révision sur les lignes modifiées](media/sp_screenplay.png)\n\n1. En-tête : le sélecteur **Scénario**, **Importer**, **Afficher les modifications** (Show Changes), **Tout accepter** (Accept All), **Tout rejeter** (Reject All), **Réimporter** (Re-import), la roue des réglages, **Ouvrir** (Open, l'onglet complet), la recherche et le zoom de page.\n2. Panneaux : **Scènes** (Scenes), **Scène** (Scene), **Distribution** (Cast), **Accessoires** (Props), **Niveaux** (Levels), **Page**, **Carte de l'histoire**. Affichez ou masquez chacun depuis la roue.\n3. La page : le script sous forme de pages mises en forme.\n\n| Commande de l'en-tête | Description |\n|---|---|\n| Recherche | « Rechercher dans le scénario », avec « {0} of {1} » et les correspondances **Previous** / **Suivant** (Next). |\n| Zoom de page | **Ctrl** + molette. Cliquez sur le % pour revenir à 100 %. |\n| **Réimporter** | Affiché quand « The file on disk is newer. » (Le fichier sur le disque est plus récent.) |\n\n### Feuille Scenes\n\n| Colonne | Description |\n|---|---|\n| **Scène** | Le numéro de scène. |\n| **En-tête** (Heading) | La ligne de décor (slugline). |\n| **Longueur** (Length) | « {0} pages, about {1} », compté en huitièmes. |\n| **Plateau** (Stage) | Le plateau lié. |\n| **Séquence** (Sequence) | La séquence de niveau liée. |\n| **Notes** | Vos notes pour la scène. |\n\nLes scènes omises affichent « OMITTED ».\n\nUtilisez la roue pour afficher ou masquer des colonnes, et **Réinitialiser les colonnes** (Reset Columns) pour les rétablir. Faites un clic droit sur l'en-tête d'une colonne pour filtrer : **Tout sélectionner** (Select All), **Effacer** (Clear), **OK**, **Annuler** (Cancel), **Trier de A à Z** (Sort A to Z), **Trier de Z à A** (Sort Z to A), **Filtrer par valeurs** (Filter By Values), **Effacer ce filtre** (Clear This Filter).\n\nCliquez sur une scène pour sélectionner son plateau dans le niveau.\n\n### Panneau Scene\n\n| Bouton | Description |\n|---|---|\n| **Ouvrir le plateau** (Open Stage) | Ouvre le plateau lié. |\n| **Ouvrir la séquence** (Open Sequence) | Ouvre la séquence de niveau liée. |\n| **Générer** (Generate) | Crée le plateau et la séquence de cette scène. Cliquez avec Shift, ou utilisez le bouton « ... », pour ouvrir la boîte de dialogue des options de Generate. |\n| **Changer de plateau** (Change Stage) | Lie un autre plateau. |\n| **Changer de séquence** (Change Sequence) | Lie une autre séquence de niveau. |\n\nLes scènes non liées affichent une icône d'avertissement : « No stage yet » (Pas encore de plateau) ou « No Level Sequence yet » (Pas encore de séquence de niveau).\n\n### Feuille Cast\n\nColonnes : **Nom** (Name), **Rôle** (Role), **Scènes**, **Lié** (Linked).\n\n- **Link Selected Actor** lie l'acteur du niveau sélectionné au membre de la distribution. **Effacer** supprime la liaison.\n- Renommer un membre de la distribution renomme ses marques.\n- **Ajouter au plateau** (Add To Stage) ajoute le personnage au plateau.\n- **Rôle** définit la couleur utilisée pour le personnage sur la Story Map.\n\n### Feuille Props\n\nLes accessoires trouvés dans le script apparaissent estompés, comme suggestions. Cliquez sur **Ajouter** (Add) pour en accepter un ou sur **Ignorer** (Ignore) pour l'écarter. Autres commandes : **Ajouter un accessoire** (Add Prop, « Prop name, then Enter », nom de l'accessoire, puis Entrée), **Renommer** (Rename), **Supprimer** (Remove).\n\n### Feuille Levels\n\nListe les niveaux utilisés par les plateaux. **Ouvrir la carte** (Open Map) en ouvre un. L'arborescence montre le niveau, le plateau, la scène et l'entrée.\n\n### Modifier la page\n\nFaites un clic droit sur la page.\n\n| Menu | Commande |\n|---|---|\n| **Corriger le découpage** (Fix The Split) | **Fusionner avec la scène suivante** (Merge With Next Scene), **Fusionner avec la scène précédente** (Merge Into Previous Scene) |\n| **Mots sélectionnés** (Selected Words) | **Ajouter aux accessoires** (Add To Props), **Ajouter à la distribution** (Add To Cast) |\n| **Ce paragraphe** (This Paragraph) | **Démarrer une nouvelle scène ici** (Start New Scene Here, numérote la scène avec une lettre, par exemple 12A), **Changer en** (Change To) un autre type de paragraphe |\n\nChacune est une étape d'annulation. Les noms des étapes sont : Change Scene Stage, Unlink Scene Stage, Change Scene Sequence, Unlink Scene Sequence, Renumber Scene, Change Scene Heading, Edit Scene Notes, Set Cast Role, Merge Scenes, Start New Scene Here, Change Paragraph Type.\n\n## Generate à partir du scénario\n\nUtilisez **Générer** pour créer des plateaux et des séquences pour les scènes après l'import.\n\n1. Sélectionnez les scènes dans la feuille **Scènes**.\n2. Cliquez sur **Générer**. La boîte de dialogue « Generate From Screenplay » s'ouvre.\n3. Sous « Scenes to include » (Scènes à inclure), choisissez les scènes.\n4. Cochez **Créer des plateaux**, **Créer des séquences** et **Lier l'existant** selon les besoins.\n5. Cliquez sur le bouton de confirmation.\n\nCochez « Don't ask again » (Ne plus demander) pour ignorer la boîte de dialogue. Les plateaux sont espacés de 2500 cm les uns des autres sur une rangée. Les marqueurs de dialogue sont minutés d'après les mots.\n\n| Réglage (Editor Preferences, **Scénario**) | Description |\n|---|---|\n| **Plateaux** (Stages) | Un plateau par **Location** ou un par **Scène**. |\n| **Seq Code Start** | Premier code de séquence. 10 par défaut. |\n| **Seq Code Increment** | Pas entre les codes. 10 par défaut. |\n| **Abbreviation From Slugline** | Construit le nom court à partir de la slugline. |\n\n## Révisions et Track Changes\n\nAvec **Suivre les modifications** activé, un nouvel import est comparé au brouillon précédent. Le premier import est étiqueté « White draft ». Ensuite, vous voyez « {0}, {1} to review ».\n\n- **Afficher les modifications** met en évidence les changements sur la page.\n- **Tout accepter** et **Tout rejeter** règlent tous les changements d'un coup.\n- Une invite propose **Examiner** (Review), **Tout conserver** (Keep All) ou **Toujours conserver** (Always keep).\n\nS'il n'y a rien à comparer, vous voyez « There is no earlier draft to compare with. Import this one with Track Changes off first. » (Il n'y a pas de brouillon antérieur à comparer. Importez d'abord celui-ci avec Track Changes désactivé.)\n\n## Rester synchronisé avec le fichier source\n\nIl n'y a pas de surveillance en arrière-plan. Framemark vérifie le fichier quand vous recliquez dans le Screenplay et, s'il a changé, demande ce qu'il faut faire. C'est le réglage **Fichier source modifié** (Source File Changed, Editor Preferences > Framemark > **Scénario**).\n\n| Valeur | Comportement |\n|---|---|\n| **Ask** | Affiche « Re-import it? The changes come in as a revision to review. » (Le réimporter ? Les changements arrivent sous forme de révision à relire.) avec une case « Don't ask again ». |\n| **Réimporter** | Réimporte immédiatement. |\n| **Ignorer** | Ne fait rien. Le bouton **Réimporter** reste affiché. |\n\n### Réécriture vers ink\n\nQuand vous enregistrez, Framemark écrit les lignes modifiées, ajoutées et supprimées dans le fichier `.ink` et conserve l'ancien fichier en `.bak`.\n\n- Les choix, les diverts, les en-têtes et les lignes de scène ne sont **pas** écrits. Le message le précise.\n- L'opération est refusée quand le fichier a changé depuis l'import, quand le contrôle de version le verrouille ou qu'il n'est pas à jour, ou quand il est en lecture seule.\n- Une note de glue (`<>`) apparaît quand de nouvelles lignes suivent une ligne collée.\n\n### Réécriture vers articy\n\nFramemark écrit `<export>.framemark-changes.json` à côté du `.articyue`. Une fois que vous l'avez appliqué, le fichier est renommé `.framemark-changes.applied.json`.\n\n- L'opération est refusée si l'export a changé depuis l'import, ou si articy a déjà les derniers changements.\n- La liste des changements couvre le texte, le locuteur, les lignes ajoutées et les lignes supprimées.\n\n#### Apply Changes dans articy:draft\n\nLe plug-in **Framemark Bridge** (Framemark.ArticyBridge 1.0.0, nécessite articy:draft 4.2.2 ou ultérieur) ajoute un menu **Framemark** dans articy:draft.\n\n1. Dans articy:draft, choisissez **Framemark > Apply Changes**.\n2
